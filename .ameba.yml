# The framework's own code follows the rule set generated applications use
# (templates/application/.ameba.yml, ADR 0017). The differences below are
# the framework's, each with its reason. Run it with `scripts/check lint`.
Version: "1.7.0"

Globs:
  - "src/**/*.cr"
  - "spec/**/*.cr"
  - "scripts/**/*.cr"

Excluded:
  - "lib"
  # Fixture data: some is invalid on purpose, and checks assert exact
  # file:line:col positions inside it. The fixture programs directly in
  # spec/fixtures are real code and are linted.
  - "spec/fixtures/*/**/*"

Caramel/ServiceNoun:
  Enabled: true

Caramel/Dump:
  Enabled: true

# The framework keeps Ameba's default limit of 12; the methods that exceed it,
# dispatch tables, parsers, validation and process-lifecycle code, say why
# inline. Applications use 10. Crystal under scripts/, the checks and the
# release tool, is exempt: its branches are scenario steps and assertions.
Metrics/CyclomaticComplexity:
  MaxComplexity: 12
  Excluded:
    - "scripts/**/*.cr"

Documentation/Admonition:
  Enabled: true

# Specs and checks assert presence with `not_nil!`; framework code does not.
Lint/NotNil:
  Excluded:
    - "spec/**/*.cr"
    - "scripts/**/*.cr"

# Ameba's defaults, plus the support files each product keeps under
# spec/<product>/support, which specs require rather than run.
Lint/SpecFilename:
  IgnoredPaths:
    - "spec/support/**"
    - "spec/**/support/**"
    - "spec/fixtures/**"
    - "spec/data/**"
    - "spec/**/spec_helper.cr"

# A line holds at most 100 characters (ADR 0021). The formatter never breaks
# a line, so this rule does. No file is exempt.
Layout/LineLength:
  Enabled: true
  MaxLength: 100
