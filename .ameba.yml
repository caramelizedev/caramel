# The framework's own code follows the rule set generated applications use
# (templates/application/.ameba.yml, ADR 0017). The differences below are
# the framework's, each with its reason. Run it with `scripts/check lint`.
Version: "1.7.0"

Globs:
  - "src/**/*.cr"
  - "spec/**/*.cr"
  - "scripts/**/*.cr"

Excluded:
  - "lib"
  # Fixture data: some is invalid on purpose, and checks assert exact
  # file:line:col positions inside it. The fixture programs directly in
  # spec/fixtures are real code and are linted.
  - "spec/fixtures/*/**/*"

Caramel/ServiceNoun:
  Enabled: true

# The framework keeps Ameba's default limit of 12; the methods that exceed it,
# dispatch tables, parsers, validation and process-lifecycle code, say why
# inline. Applications use 10. Crystal under scripts/, the checks and the
# release tool, is exempt: its branches are scenario steps and assertions.
Metrics/CyclomaticComplexity:
  MaxComplexity: 12
  Excluded:
    - "scripts/**/*.cr"

Documentation/Admonition:
  Enabled: true

# Specs and checks assert presence with `not_nil!`; framework code does not.
Lint/NotNil:
  Excluded:
    - "spec/**/*.cr"
    - "scripts/**/*.cr"

# Ameba's defaults, plus the support files each product keeps under
# spec/<product>/support, which specs require rather than run.
Lint/SpecFilename:
  IgnoredPaths:
    - "spec/support/**"
    - "spec/**/support/**"
    - "spec/fixtures/**"
    - "spec/data/**"
    - "spec/**/spec_helper.cr"

# A line holds at most 100 characters (ADR 0021). The formatter never breaks
# a line, so this rule does. The files listed predate the rule: each leaves
# the list in the change that rewrites its long lines, and none joins it.
Layout/LineLength:
  Enabled: true
  MaxLength: 100
  Excluded:
    - "scripts/checks/route_compilation.cr"
    - "spec/caramel/action_spec.cr"
    - "spec/caramel/request_contract_spec.cr"
    - "spec/caramel/request_input_spec.cr"
    - "spec/caramel/router_spec.cr"
    - "spec/caramel/streaming_spec.cr"
    - "spec/cold_brew/configuration_spec.cr"
    - "spec/corretto/client_spec.cr"
    - "spec/frappe/commands_spec.cr"
    - "spec/frappe/corretto_runner_spec.cr"
    - "spec/frappe/dev_files_spec.cr"
    - "spec/frappe/dev_gateway_spec.cr"
    - "spec/frappe/new_project_spec.cr"
    - "spec/frappe/resource_generator_spec.cr"
    - "spec/integration/cold_brew_spec.cr"
    - "src/caramel/action.cr"
    - "src/caramel/application.cr"
    - "src/caramel/cold_brew.cr"
    - "src/caramel/cold_brew/queue.cr"
    - "src/caramel/command_line.cr"
    - "src/caramel/contracts/request_contract.cr"
    - "src/caramel/corretto.cr"
    - "src/caramel/corretto/client.cr"
    - "src/caramel/http/request_context.cr"
    - "src/caramel/http/request_input.cr"
    - "src/caramel/http/router.cr"
    - "src/frappe/cli.cr"
    - "src/frappe/commands.cr"
    - "src/frappe/corretto_runner.cr"
    - "src/frappe/dev_files.cr"
    - "src/frappe/dev_gateway.cr"
    - "src/frappe/new_project.cr"
    - "src/frappe/resource_generator.cr"
