# Caramel's rule set, run by `frappe lint`
# and by ameba-ls in the editor. ADR 0017 gives the reason for each choice.
# Every other Ameba 1.7.0 rule keeps its default.
Version: "1.7.0"

Globs:
  - "src/**/*.cr"
  - "config/**/*.cr"
  - "app/**/*.cr"
  - "db/**/*.cr"
  - "spec/**/*.cr"

Excluded:
  - "lib"
  - ".caramel"

# §2.1: subjects act on objects; no service nouns.
Caramel/ServiceNoun:
  Enabled: true

# §2.5: an action is a single thought, not a junk drawer.
Metrics/CyclomaticComplexity:
  MaxComplexity: 10

# No placeholders in shipped code.
Documentation/Admonition:
  Enabled: true

# Views are Blueprint classes, where `p` is the paragraph element, not the
# debug print (ADR 0018).
Lint/DebugCalls:
  Excluded:
    - "app/views/**/*.cr"
