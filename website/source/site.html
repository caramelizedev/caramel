<template id="c-home">
<div class="c-home">
  <section class="c-hero">
    <div class="c-hero-copy">
      <p class="c-kicker">A web framework for Crystal</p>
      <h1>A little structure.<br><span>A lot of possibility.</span></h1>
      <p class="c-hero-lede">PostgreSQL, typed HTML, and a clear place for every change. Six rules do most of the work — the compiler and the test suite keep you to them.</p>
      <div class="c-actions"><button class="c-primary cursor-interaction" data-page="learn">Start building</button><a class="c-ghost" href="#c-home-rules">Read the six rules</a></div>
    </div>
    <aside class="c-way" aria-labelledby="c-way-title">
      <header><h2 id="c-way-title">The Caramel way</h2><span>house rules</span></header>
      <ol><li><span>01</span>Every change has one place.</li><li><span>02</span>Every input is declared.</li><li><span>03</span>Every write goes through a changeset.</li><li><span>04</span>Everything is escaped unless your code built it.</li><li><span>05</span>Every job is safe to run twice.</li><li><span>06</span>Every change is proven.</li></ol>
    </aside>
  </section>
  <section class="c-band" id="c-home-rules">
    <div class="c-band-inner">
      <div class="c-band-head"><p class="c-kicker">Six rules</p><h2>Short enough to remember.<br>Strict enough to rely on.</h2></div>
      <div class="c-rules-grid">
        <article><span class="c-kicker">01 · Structure</span><h3>Every change has one place.</h3><p>Routes in <code>config/routes.cr</code>, actions in <code>app/actions/</code>, views in <code>app/views/</code>. Your application’s files are the extension point — name a gap in the public API instead of patching the framework.</p></article>
        <article><span class="c-kicker">02 · Contracts</span><h3>Every input is declared.</h3><p>Each field is typed and bounded in the action’s contract. Undeclared fields are errors, except in a GET or HEAD query, and a route parameter without a contract field stops the build, not the request.</p></article>
        <article><span class="c-kicker">03 · SugarORM</span><h3>Every write goes through a changeset.</h3><p>Validations and unique constraints live on the changeset, so the rules hold for every caller. Schema first, then a migration you derive and review.</p></article>
        <article><span class="c-kicker">04 · Blueprint</span><h3>Everything is escaped unless your code built it.</h3><p>Views are typed Crystal classes that escape text and attributes by default. Reach for htmx fragments before client state, and islands only for widgets that need their own.</p></article>
        <article><span class="c-kicker">05 · Cold Brew</span><h3>Every job is safe to run twice.</h3><p>Jobs run at least once. Enqueue in the same transaction as the write, pass ids rather than records, and give each outside call a stable identifier the receiving service can deduplicate.</p></article>
        <article><span class="c-kicker">06 · Corretto</span><h3>Every change is proven.</h3><p>Request specs run against real PostgreSQL and assert what users observe: HTML, rows, statuses, headers. No mocking library — Corretto refuses to compile beside one.</p></article>
      </div>
    </div>
  </section>
  <section class="c-practice">
    <div class="c-practice-copy">
      <p class="c-kicker">In practice</p>
      <h2>One action.<br>Four rules at work.</h2>
      <p>Creating a book reads like a short sentence: take the declared input, write it through a changeset, queue the follow-up in the same transaction, answer with the record or its errors.</p>
      <p class="c-aside">And then <code>frappe corretto</code> proves it — rule 06.</p>
    </div>
    <figure class="c-rulecode">
      <div class="c-rulecode-head"><span>app/actions/books/create.cr · excerpt</span><span>Crystal</span></div>
      <div class="c-rulecode-body"><div class="c-margin" aria-hidden="true">02
03


05


04
</div><pre><code class="language-crystal">def handle(contract : Contract)
  changes = App::Book::Changeset.new(title: contract.title, isbn: contract.isbn)
  SugarORM::Repo.transaction do
    SugarORM::Repo.insert(changes)
    App::SendReceipt.enqueue(book_id: changes.record.id) if changes.saved?
  end
  return render_errors(changes.errors) unless changes.saved?
  {record: changes.record}
end</code></pre></div>
      <figcaption>Margin numbers mark the rule each line keeps. The record renders through an escaping Blueprint view.</figcaption>
    </figure>
  </section>
  <section class="c-band">
    <div class="c-band-inner">
      <div class="c-band-head"><p class="c-kicker">Project map</p><h2>Start with your intention.</h2><p>Say what you want to change. Caramel already knows where it goes, and how to check it.</p></div>
      <table class="c-intent">
        <thead><tr><th>I want to…</th><th>It goes in</th><th>Check it with</th></tr></thead>
        <tbody>
          <tr><td>Add an endpoint</td><td><code>config/routes.cr</code> and an action in <code>app/actions/</code> with its contract</td><td><code>frappe routes</code></td></tr>
          <tr><td>Render a page</td><td>A Blueprint view in <code>app/views/</code> — typed inputs, escaped output</td><td><code>frappe check</code></td></tr>
          <tr><td>Store new data</td><td>The SugarORM schema first, then a migration you derive and review</td><td><code>frappe db diff</code></td></tr>
          <tr><td>Do work later</td><td>A Cold Brew job, enqueued beside the write it follows</td><td><code>frappe corretto</code></td></tr>
          <tr><td>Speak another language</td><td>Translation catalogs — <code>t.</code> messages with named placeholders</td><td><code>frappe translations</code></td></tr>
          <tr><td>Keep the code honest</td><td>Descriptive names, short blocks, small actions — the verb on the model, not a service</td><td><code>frappe lint</code></td></tr>
        </tbody>
      </table>
    </div>
  </section>
  <section class="c-layers">
    <div class="c-layers-copy">
      <p class="c-kicker">Layer by layer</p>
      <h2>Seven layers.<br>One job each.</h2>
      <p>From the HTML your users see down to the services on your machine, every part of Caramel does one thing — and all of it stands on PostgreSQL.</p>
    </div>
    <ol class="c-layer-stack" aria-label="Caramel layers, top to bottom">
      <li><strong>Blueprint</strong><span>HTML written in typed Crystal</span></li>
      <li><strong>SugarORM</strong><span>Schemas, changesets and queries</span></li>
      <li><strong>Cold Brew</strong><span>Background work, backed by PostgreSQL</span></li>
      <li><strong>Corretto</strong><span>Application tests with real data</span></li>
      <li><strong>Crema</strong><span>Logs, metrics and traces</span></li>
      <li><strong>Frappé</strong><span>Your developer command line</span></li>
      <li><strong>Latte</strong><span>Local services and named HTTPS</span></li>
    </ol>
  </section>

    <aside class="c-gives"><p class="c-kicker">Every recipe gives you</p><ol><li>Where the change goes</li><li>Steps, each with what to expect</li><li>A Prove it block that passes</li></ol></aside>

<script>
const escapeText = text => String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const note = (title, body, label) => `<div class="c-note">${label ? `<small>${label}</small> ` : ''}${title ? `<strong>${title}</strong>` : ''}<p>${body}</p></div>`;
const next = (page, label) => `<div class="c-next"><button class="cursor-interaction" data-page="${page}">${label} →</button></div>`;
const CONTRACT = ['Release', 'Needs', 'You will have', 'Covers', 'Status', 'Proved by'];
const contract = rows => {
  for (const [label] of rows) if (!CONTRACT.includes(label)) throw new Error(`Contract label ${label} is not one of ${CONTRACT.join(', ')}`);
  return `<table class="c-contract"><thead><tr><th>Contract</th><th>Value</th></tr></thead><tbody>${rows.map(([label, value]) => `<tr><th scope="row">${label}</th><td>${value}</td></tr>`).join('')}</tbody></table>`;
};
const limits = (page, rows) => `<h2 id="c-${page}-limits">Limits at a glance</h2><table class="c-limits"><thead><tr><th>Limit</th><th>Value</th></tr></thead><tbody>${rows.map(([limit, value]) => `<tr><td>${limit}</td><td>${value}</td></tr>`).join('')}</tbody></table>`;
const rules = rows => `<table class="c-rules"><thead><tr><th>Condition</th><th>Outcome</th></tr></thead><tbody>${rows.map(([condition, outcome, tone]) => `<tr><td>${condition}</td><td${tone === 'ok' ? ' class="c-ok"' : ''}>${outcome}</td></tr>`).join('')}</tbody></table>`;
const lookup = (columns, rows) => `<table class="c-map"><thead><tr>${columns.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
const expect = html => `<p class="c-expect"><strong>Expect:</strong> ${html}</p>`;
const passing = html => `<p class="c-passing"><strong>Passing:</strong> ${html}</p>`;
const steps = items => `<ol class="c-steps">${items.map(([title, html]) => `<li><strong>${title}</strong>${html}</li>`).join('')}</ol>`;
const choices = items => `<ul class="c-choices">${items.map(([title, html]) => `<li><strong>${title}</strong> ${html}</li>`).join('')}</ul>`;
const kicker = text => `<p class="c-kicker">${text}</p>`;
const prove = (id, title, html) => `<div class="c-prove">${kicker('Prove it')}<h2 id="${id}">${title}</h2>${html}</div>`;
const STAGES = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];
const guideMap = (page, stages) => {
  const sections = stages.reduce((count, [, links]) => count + links.length, 0);
  return `<div class="c-guidemap"><h2 id="c-${page}-map">The guide in ${STAGES[stages.length]} stages</h2>${kicker(`${sections} sections · read in order the first time`)}<ul>${stages.map(([stage, links], i) => `<li><strong>${i + 1} · ${stage}</strong><ul>${links.map(([id, label]) => `<li><a href="#${id}">${label}</a></li>`).join('')}</ul></li>`).join('')}</ul></div>`;
};
const snippet = (name,code,language='crystal') => `<div class="c-snippet"><header>${escapeText(name)}</header><pre><code class="language-${language}">${escapeText(code)}</code></pre></div>`;
const heading = (section,title,lede) => `<div class="c-eyebrow">${section}</div><h1>${title}</h1><p class="c-lede">${lede}</p>`;
const tags = status => `<div class="c-tagrow"><span class="c-tag c-draft">${status || 'Draft recipe'}</span><span class="c-tag">Target: 0.15.0</span><span class="c-tag">Not yet recipe-tested</span></div>`;
const files = rows => `<div class="c-files">${rows.map(([file,why])=>`<div class="c-file"><code>${file}</code><small>${why}</small></div>`).join('')}</div>`;
const pages = {
  learn: () => heading('Learn / The Bookshelf path','Start with something real.','Install Caramel 0.15.0, create a bookshelf, and check the generated feature with real application tests.')+
    contract([['Needs', 'Apple Silicon macOS with Apple Command Line Tools'], ['You will have', 'A <code>bookshelf</code> application with a generated Book resource, checked by request specs'], ['Status', 'Not yet validated as a complete recipe'], ['Proved by', '<code>frappe check</code> · <code>frappe corretto</code> · <code>frappe lint</code>']])+
    note('Before you start','The source installation targets Apple Silicon macOS. Install Apple Command Line Tools first; development dependencies use its C compiler and archiver. Caramel supplies its own pinned Crystal 1.21.1, PostgreSQL, Caddy, and CoreDNS.')+
    '<h2 id="c-learn-setup">01 · Install the release</h2><p>Start from the release tag so new applications depend on the published Caramel shard. Add <code>~/.local/bin</code> to your shell’s PATH if it is not already there.</p>'+snippet('Terminal · first installation','git clone --branch v0.15.0 https://github.com/caramelizedev/caramel.git caramel\ncd caramel\nscripts/install-toolchain\nscripts/build-release\nbin/frappe installations register\nfrappe services start','bash')+
    expect('<code>bin/frappe installations register</code> prints <code>Registered Caramel 0.15.0: </code> and the checkout path, and <code>frappe</code> and <code>latte</code> in <code>~/.local/bin</code> then run this release. <code>frappe services start</code> lists <code>postgres</code>, <code>dns</code> and <code>proxy</code>, each <code>running</code>.')+
    '<p>Configure the local resolver and ports once per machine.</p>'+snippet('Terminal · one-time local HTTPS setup','scripts/install-local-integration prepare /private/tmp/caramel-integration-bundle && sudo scripts/install-local-integration apply /private/tmp/caramel-integration-bundle\nlatte trust install','bash')+
    expect('<code>prepare</code> builds the integration bundle as you. <code>apply</code> asks for administrator privileges and installs only a bundle that the user who ran <code>sudo</code> prepared. <code>latte trust install</code> trusts Latte’s local certificate authority in your login keychain.')+
    '<p>The current release guide lists the supported APIs and development requirements.</p><button class="c-secondary cursor-interaction" data-page="releases">Read the current release guide →</button>'+
    '<h2 id="c-learn-create">02 · Create your bookshelf</h2>'+snippet('Terminal · after machine setup','frappe new bookshelf\ncd bookshelf','bash')+
    expect('Prints <code>Created bookshelf. Installing locked dependencies…</code>, installs dependencies, configures the local site and applies the starter migrations, then prints <code>bookshelf is configured at https://bookshelf.caramel</code>.')+
    snippet('Terminal · inside bookshelf','frappe make resource Book title:string author:string\nfrappe migrate','bash')+
    expect('Prints <code>Generated PATH</code> for each file it writes (application-owned models, changesets, actions, Blueprint views and request specs), then <code>Run frappe migrate to apply the new schema. Use frappe routes to see the generated URLs.</code> <code>frappe migrate</code> applies the Book migration and prints <code>Applied N migrations.</code>, then <code>The database matches the declared schema.</code>')+
    snippet('Terminal · inside bookshelf','frappe dev','bash')+
    expect('Builds the application, serves it at <code>https://bookshelf.caramel</code> and opens the browser when the first build is ready. Ctrl-C stops it.')+
    '<h2 id="c-learn-check">03 · Check the book routes</h2>'+snippet('Terminal · inside bookshelf','frappe routes books','bash')+
    expect('Lists the book routes with their contracts, such as <code>GET /books/:id App::Books::Show id:Int64(min=1)</code>.')+
    prove('c-learn-prove','Prove the bookshelf works',snippet('Terminal · inside bookshelf','frappe check\nfrappe corretto\nfrappe lint','bash')+passing('<code>frappe check</code> prints <code>✓ Type check passed</code>, <code>frappe corretto</code> passes the generated request specs and ends with <code>Corretto: N of N workers passed</code>, and <code>frappe lint</code> exits 0. Corretto uses isolated test databases, so your development records stay separate.')+note('','Run these checks in your application; this learning path is not yet validated as a complete recipe.','Draft'))+
    next('map','See where everything lives'),
  map: () => heading('Guides / Project structure','A place for every change.','Start with your intention. Caramel’s conventions give it a home, and its tools help you check the result.')+
    contract([['Covers', 'Endpoints, stored data, pages, background jobs, languages and the domain model'], ['You will have', 'The files that own each kind of change, and the commands that check it'], ['Proved by', '<code>frappe check</code> · <code>frappe corretto</code>']])+
    '<h2 id="c-map-task">Find the file for a change</h2>'+lookup(['I want to…', 'It goes in', 'Check it with'], [
      ['<strong>Add or change an endpoint</strong> Declare the route, then its typed contract and behavior. Keep the response and failure cases in a request spec.', '<code>config/routes.cr</code> <code>app/actions/</code>', '<code>frappe routes</code> · <code>frappe check</code> · <code>frappe corretto</code>'],
      ['<strong>Change the data your application stores</strong> Describe the stored shape and write rules, derive the migration, and review it before applying it.', '<code>app/models/</code> <code>app/changesets/</code> <code>db/migrations/</code>', '<code>frappe db diff</code> · <code>frappe migrate</code> · <code>frappe corretto</code>'],
      ['<strong>Change what the browser renders</strong> Use Blueprint classes for typed HTML, <code>have_html</code> for rendered requirements, and browser checks for client behavior.', '<code>app/views/</code> <code>app/assets/</code> <code>spec/requests/</code>', '<code>frappe check</code> · <code>have_html</code> · browser inspection'],
      ['<strong>Move work into a background job</strong> Define the job payload and behavior. Enqueue within the intended transaction and test the observable result.', '<code>app/jobs/</code> <code>spec/</code>', 'Corretto session · <code>drain_queue!</code> · database assertion'],
      ['<strong>Translate the application</strong> Enable locales with <code>frappe make locale</code>, define typed messages, and check translated pages, errors, and language selection.', '<code>app/locales/</code> <code>config/application.cr</code> <code>app/views/</code> <code>spec/requests/</code>', '<code>frappe translations</code> · <code>frappe check</code> · <code>frappe corretto</code>'],
      ['<strong>Model the domain in SweetTalk</strong> Start with <code>frappe make domain</code>, then declare contexts, values and aggregates, and run their commands from actions. The skill gives agents the rules, each linked to the SweetTalk guide.', '<code>app/domain/</code> <code>spec/domain/</code> <code>.claude/skills/sweettalk/SKILL.md</code>', '<code>frappe check</code> · <code>frappe db diff</code> · <code>frappe corretto</code>'],
    ])+
    '<h2 id="c-map-components">Meet the framework</h2>'+lookup(['Component', 'What it does'], [['<strong>Frappé</strong>', 'Your developer command line'], ['<strong>Latte</strong>', 'Local services and named HTTPS'], ['<strong>SugarORM</strong>', 'Schemas, changesets, and queries'], ['<strong>Blueprint views</strong>', 'HTML written in typed Crystal'], ['<strong>Cold Brew</strong>', 'PostgreSQL-backed background work'], ['<strong>Corretto</strong>', 'Application tests with real data']])+
    note('Application code is the extension point','Keep changes in your application’s files. When the public API does not support a task, identify the gap before changing framework internals.')+
    prove('c-map-prove','Check the change you made', snippet('Terminal · inside your application','frappe check\nfrappe corretto','bash')+passing('<code>frappe check</code> prints <code>✓ Type check passed</code> and <code>frappe corretto</code> ends with <code>Corretto: N of N workers passed</code>.'))+
    next('agents','The short guide for agents'),
  crud: () => heading('Cookbook / Data and forms','Create a resource.','Generate a book catalog, then make the model, actions, views, and request specs your own.')+tags()+
    contract([['Needs','A configured application'],['You will have','A Book model, changeset, actions, views and request spec'],['Proved by','<code>frappe corretto spec/requests/books_spec.cr</code>']])+
    '<h2 id="c-crud-files">Where the change goes</h2>'+files([['app/models/book.cr','The stored shape'],['app/changesets/book.cr','Rules for writes'],['app/actions/books/','Request handling'],['app/views/books/','Browser presentation'],['spec/requests/books_spec.cr','Behavior checks']])+
    '<h2 id="c-crud-before">Decide before you generate</h2><p>Two choices change what the generator writes. Make them first.</p>'+choices([['A multi-tenant application','The resource belongs to the tenant unless you pass <code>--central</code>. <button class="c-secondary cursor-interaction" data-page="tenancy">Set up multi-tenancy →</button>'],['A translated application','Run <code>frappe make locale CODE</code> before resource generation. Frappé then adds typed message calls and default catalog entries. <button class="c-secondary cursor-interaction" data-page="i18n">Set up internationalization →</button>']])+
    '<h2 id="c-crud-build">Generate the feature</h2><p>Run inside a configured application. Review the generated files and migration before applying it.</p>'+steps([['Generate the resource',snippet('Terminal · inside the application','frappe make resource Book title:string author:string','bash')+expect('Prints a <code>Generated PATH</code> line for each file: the five files above, and a migration. Review both before applying anything.')],['Apply the reviewed migration',snippet('Terminal · inside the application','frappe migrate','bash')+expect('Applies the reviewed migration and prints <code>Applied N migrations.</code>')]])+
    '<h2 id="c-crud-options">Choose the generated surface</h2>'+lookup(['Pass','To get'],[['<code>original_url:string:url</code>','URL validation, a URL input, and valid request-spec samples'],['<code>--only=create,show</code>','A smaller resource; create and show are required, and edit needs new and update'],['<code>:server</code>','A field the action sets'],['<code>:unique</code>','A unique index and constraint checks']])+
    prove('c-crud-check','Prove the behavior',snippet('Terminal · inside the application','frappe check\nfrappe corretto spec/requests/books_spec.cr','bash')+passing('The generated request spec exercises create, read, update, delete, and rejection of invalid requests.')+'<p>Extend it with your own validation rule and an example that fails that rule.</p>')+
    note('Written for 0.15.0, not yet run end to end.','The recipe keeps its Draft label until it has been run from a new application to a passing spec.','Draft')+next('json','Return the same data as JSON'),
  json: () => heading('Cookbook / Requests and responses','Read and write JSON.','Use a generated Book resource for browser HTML, JSON responses, and typed JSON input through the same action contracts.')+tags()+
    contract([['Needs','A generated Book resource, as in <button class="c-secondary cursor-interaction" data-page="crud">Create a resource</button>'],['You will have','HTML and JSON answers from the same actions, typed JSON input, CSRF-protected browser writes, and checks for each failure status'],['Proved by','<code>frappe corretto spec/requests/books_spec.cr</code>']])+
    '<h2 id="c-json-files">Where the change goes</h2>'+files([['app/actions/books/','ETag and If-Match handling'],['spec/requests/books_spec.cr','JSON request examples']])+
    '<h2 id="c-json-response">Ask for a JSON response</h2><p>A generated action returns records from <code>handle</code> and supplies HTML through <code>render</code>. A client sending <code>Accept: application/json</code> receives the action result as JSON.</p>'+snippet('spec/requests/books_spec.cr · inside an example','Corretto.session do |client, db|\n  response = client.get("/books",\n    headers: {"Accept" => "application/json"})\n  response.should have_status(200)\n  JSON.parse(response.body)["records"].as_a.should be_empty\nend')+
    '<p>This example assumes an empty spec database. Add a persisted-book case to verify the returned fields.</p>'+
    '<p>When <code>handle</code> sets <code>self.etag = book.lock_version</code>, a successful JSON answer carries <code>ETag: "3"</code>. Answer 412 when <code>if_match?(version)</code> is false.</p>'+
    rules([['No <code>If-Match</code> header','<code>if_match?(version)</code> is true','ok'],['<code>If-Match</code> names that version or <code>*</code>','<code>if_match?(version)</code> is true','ok'],['Weak tag such as <code>W/"3"</code>','never matches']])+
    '<h2 id="c-json-input">Bind a JSON object to the contract</h2><p>The default request policy reads <code>Content-Type: application/json</code>. Use a top-level object.</p>'+lookup(['JSON value','Binds to'],[['string','A String or Time field'],['number','An Int32, Int64 or Float64 field'],['boolean','A Bool field'],['null','Absent'],['array','An <code>Array</code> field'],['any other array, or an object','No field'],['duplicate member','An error']])+snippet('spec/requests/books_spec.cr · inside an example','Corretto.session do |client, db|\n  book = {title: "Dune", author: "Frank Herbert"}\n  accept = {"Accept" => "application/json"}\n  created = client.post("/books", json: book, headers: accept)\n  created.should have_status(201)\n  JSON.parse(created.body)["record"]["title"].as_s.should eq("Dune")\nend')+
    '<h2 id="c-json-csrf">Keep browser writes protected</h2><p>Same-origin browser fetch requests send the page’s CSRF token as <code>X-CSRF-Token</code>. Corretto adds the origin, cookie, and CSRF header automatically; override a header to test rejection.</p>'+rules([['A JSON member named <code>_csrf</code>','does not supply the token','ok'],['A JSON member named <code>_method</code>','does not override the HTTP method','ok'],['A forged <code>X-CSRF-Token</code> header','answers 403']])+snippet('Corretto · inside a session','forged = {"Accept" => "application/json", "X-CSRF-Token" => "forged"}\nclient.post("/books", json: book, headers: forged).should have_status(403)')+
    '<h2 id="c-json-errors">Check the failure cases</h2><p>When i18n is enabled, contract and changeset error messages use the request’s locale; the JSON <code>errors</code> object keeps the same shape. Assert localized messages with an explicit language in your request specs.</p>'+rules([['Malformed JSON','answers 400'],['A valid JSON value that is not an object','answers 422'],['Wrong field types','answers 422; JSON clients receive an errors object'],['Contract or changeset errors','answers 422; JSON clients receive an errors object'],['Unsupported media type, including <code>application/*+json</code>, under the default policy','answers 415'],['<code>If-Match</code> names an old version','answers 412'],['An update finds the record changed','answers 409']])+
    '<p>An action can use raw ingress when it needs a different JSON format.</p>'+

  islands: () => heading('Cookbook / Views','Mount a third-party component.','Wrap a headless JavaScript library in a Caramel island. The worked example is a11y-dialog 8.1.5 as a navigation dialog: vendor its file, mount it with props the server renders, clean up after it, survive history navigation and refresh a region beside it.')+tags()+
    contract([['Needs','Locales enabled with <code>frappe make locale en</code>, because the view reads its text through <code>t.</code>'],['You will have','An a11y-dialog 8.1.5 navigation dialog mounted as an island, with a region beside it that refreshes from a server event'],['Proved by','<code>frappe corretto spec/requests/guide_spec.cr</code>, then the nine browser checks under “Test it”']])+
    '<h2 id="c-island-files">Where the change goes</h2>'+files([['app/assets/vendor/a11y-dialog-8.1.5.min.js','Vendored library'],['app/views/layouts/application.cr','Loads scripts once'],['app/views/guide/show.cr','Fallback and mount point'],['app/views/activity/show.cr','Refreshed region'],['app/assets/javascript/app.js','Island adapter'],['app/assets/stylesheets/app.css','Dialog appearance'],['app/actions/guide/show.cr','Passes links to the view'],['app/actions/activity/show.cr','Answers region refresh'],['app/actions/activity/stream.cr','Event stream'],['app/locales/en.cr','Navigation text keys'],['config/routes.cr','Central routes'],['spec/requests/guide_spec.cr','Server-side checks']])+
    '<h2 id="c-island-assets">Vendor the library and load it once</h2><p>Frappé publishes every file under <code>app/assets/</code> at <code>/assets/</code>. Copy the library’s minified bundle there under a versioned name, so nothing is fetched from a CDN at run time. The view below reads its text through <code>t.</code>, so enable locales first with <code>frappe make locale en</code>.</p>'+
    steps([['Vendor the bundle',snippet('Terminal','npm pack a11y-dialog@8.1.5 --ignore-scripts\ntar xzf a11y-dialog-8.1.5.tgz package/dist/a11y-dialog.min.js\ncp package/dist/a11y-dialog.min.js app/assets/vendor/a11y-dialog-8.1.5.min.js\nrm -r package a11y-dialog-8.1.5.tgz','bash')+expect('The bundle sits at <code>app/assets/vendor/a11y-dialog-8.1.5.min.js</code>, and Frappé publishes it as <code>/assets/a11y-dialog-8.1.5.min.js</code>.')],['Load it before app.js','<p>The bundle is a UMD file that defines <code>window.A11yDialog</code> in a browser, so the adapter below uses that name. Load it in the shared layout, before <code>app.js</code>: deferred scripts run in order, so the global exists when the adapter file runs.</p>'+
    snippet('app/views/layouts/application.cr · the head','          script src: "/assets/htmx-4.0.0.min.js", defer: true\n          script src: "/assets/caramel-islands.js", defer: true\n          script src: "/assets/a11y-dialog-8.1.5.min.js", defer: true\n          script src: "/assets/app.js", defer: true')]])+
    '<p>The default Content-Security-Policy is <code>default-src \'self\'; script-src \'self\'; style-src \'self\'; img-src \'self\' data:; …</code>, quoted from the security reference. Keep the dialog’s appearance in <code>app/assets/stylesheets/app.css</code> and toggle classes or the library’s <code>aria-hidden</code> attribute instead of writing <code>style</code> attributes.</p>'+
    rules([['Script file from your own origin','allowed','ok'],['Inline script','refused by the default Content-Security-Policy'],['Inline style, or a <code>style</code> attribute','refused by the default Content-Security-Policy'],['A script tag written by one page’s view under boosted navigation, which does not run a new page’s <code>&lt;head&gt;</code> again','never loads']])+
    '<button class="c-secondary cursor-interaction" data-page="security">Read the security reference →</button>'+
    '<h2 id="c-island-mount">Write the fallback, then the mount point</h2><p>The view writes the navigation as plain links, which work with JavaScript off, then the island. Resolve every localized string in the view and pass it as a prop; the browser code never looks up a catalog.</p>'+
    snippet('app/views/guide/show.cr','module App::Views::Guide\n  class Show < App::ApplicationView\n    def initialize(@links : Array(NamedTuple(label: String, href: String)))\n    end\n\n    private def blueprint\n      h1 { "Guide" }\n      nav class: "fallback", aria_label: t.nav.title do\n        ul do\n          @links.each { |link| li { a(href: link[:href]) { link[:label] } } }\n        end\n      end\n      island "NavigatorDialog", {\n        title:  t.nav.title,\n        open:   t.nav.open,\n        close:  t.nav.close,\n        links:  @links,\n        region: "activity",\n      }\n      section id: "activity", "hx-get": "/activity", "hx-trigger": "activity",\n        "hx-sync": "this:queue last" do\n        render App::Views::Activity::Show.new(Time.utc)\n      end\n    end\n  end\nend')+
    snippet('config/routes.cr · the central routes','    get "/guide", App::Guide::Show\n    get "/activity", App::Activity::Show\n    get "/activity/stream", App::Activity::Stream')+
    snippet('app/views/activity/show.cr','module App::Views::Activity\n  class Show < App::ApplicationView\n    def initialize(@at : Time)\n    end\n\n    private def blueprint\n      h2 { t.nav.activity }\n      p { "Updated #{@at.to_s("%H:%M:%S")} UTC" }\n    end\n  end\nend')+
    '<p>The island writes no children of its own, so the adapter hides the fallback once it has mounted. The library toggles <code>aria-hidden</code> on the dialog container and leaves its appearance to you, so the stylesheet must hide a closed dialog, and a <code>:has</code> rule hides the fallback links next to a mounted island. Stylesheet:</p>'+
    snippet('app/assets/stylesheets/app.css · appended','.dialog-container {\n  position: fixed;\n  inset: 0;\n  z-index: 10;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n.dialog-container[aria-hidden="true"] {\n  display: none;\n}\n.dialog-overlay {\n  position: fixed;\n  inset: 0;\n  background: rgb(0 0 0 / 0.4);\n}\n.dialog-content {\n  position: relative;\n  z-index: 1;\n  padding: 1.5rem;\n  background: #faf8f3;\n  border-radius: 0.5rem;\n}\nnav.fallback:has(+ caramel-island[data-island-state="mounted"]) {\n  display: none;\n}','markdown')+
    '<p>The island contract is set out in the views guide and in <a href="https://github.com/caramelizedev/caramel/blob/main/docs/decisions/0005-island-props-helper.md" target="_blank" rel="noopener noreferrer">ADR 0005 ↗</a>.</p>'+
    rules([['The island has mounted','the element gets <code>data-island-state="mounted"</code> and the <code>:has</code> rule hides the fallback links','ok'],['The script fails','the state is <code>error</code> and the fallback links stay'],['A mount returns <code>{update, unmount}</code> and a morph changes the props','calls <code>update(props)</code>'],['A mount returns a function or nothing and a morph changes the props','unmounts, then mounts again'],['The element is removed','calls <code>unmount</code>'],['A mount throws','sets <code>data-island-state="error"</code> and dispatches a bubbling <code>caramel:island-error</code> event']])+
    '<button class="c-secondary cursor-interaction" data-page="views">Read the views reference →</button>'+
    snippet('app/actions/guide/show.cr','module App::Guide\n  struct Show < App::ApplicationAction\n    contract do\n    end\n\n    def handle(contract : Contract)\n      links = [\n        {label: t.nav.home, href: "/"},\n        {label: t.nav.health, href: "/health"},\n      ]\n      page "Guide", Views::Guide::Show.new(links)\n    end\n  end\nend')+
    snippet('app/locales/en.cr · the keys the view reads','  nav: {\n    title:    "Browse & search",\n    open:     "Open the navigation",\n    close:    "Close",\n    home:     "Home",\n    health:   "Health",\n    activity: "Recent activity",\n  },')+
    '<h2 id="c-island-adapter">Adapt the library to the island lifecycle</h2><p>The adapter builds the dialog’s DOM itself. It never writes a <code>data-a11y-dialog</code> attribute, so the library’s own start-up scan, which instantiates every element that has one, finds nothing to take over; the adapter calls <code>new A11yDialog(container)</code> exactly once. The links are created by script, so it calls <code>htmx.process</code> on them to keep them boosted.</p>'+
    snippet('app/assets/javascript/app.js','CaramelIslands.define(\'NavigatorDialog\', (element, props) => {\n  const container = document.createElement(\'div\');\n  container.id = \'navigator-dialog\';\n  container.className = \'dialog-container\';\n  container.setAttribute(\'aria-labelledby\', \'navigator-dialog-title\');\n  container.setAttribute(\'aria-hidden\', \'true\');\n\n  const overlay = document.createElement(\'div\');\n  overlay.className = \'dialog-overlay\';\n  overlay.setAttribute(\'data-a11y-dialog-hide\', \'\');\n\n  const content = document.createElement(\'div\');\n  content.className = \'dialog-content\';\n  const title = document.createElement(\'h2\');\n  title.id = \'navigator-dialog-title\';\n  const list = document.createElement(\'ul\');\n  const close = document.createElement(\'button\');\n  close.type = \'button\';\n  close.setAttribute(\'data-a11y-dialog-hide\', \'navigator-dialog\');\n  content.append(title, list, close);\n  container.append(overlay, content);\n\n  const opener = document.createElement(\'button\');\n  opener.type = \'button\';\n  opener.setAttribute(\'data-a11y-dialog-show\', \'navigator-dialog\');\n\n  element.replaceChildren(opener, container);\n  const dialog = new A11yDialog(container);\n\n  function render(next) {\n    opener.textContent = next.open;\n    title.textContent = next.title;\n    close.textContent = next.close;\n    list.replaceChildren(...next.links.map((link) => {\n      const item = document.createElement(\'li\');\n      const anchor = document.createElement(\'a\');\n      anchor.href = link.href;\n      anchor.textContent = link.label;\n      item.append(anchor);\n      return item;\n    }));\n    htmx.process(list);\n  }\n  render(props);\n\n  const onShortcut = (event) => {\n    if (event.altKey && event.code === \'KeyM\') dialog.show();\n  };\n  document.addEventListener(\'keydown\', onShortcut);\n\n  // htmx:after:settle fires on the element that received the swap and bubbles.\n  const closeOnSwap = (event) => {\n    if (event.target.contains(element)) dialog.hide();\n  };\n  document.addEventListener(\'htmx:after:settle\', closeOnSwap);\n\n  const region = document.getElementById(props.region);\n  const refresh = () => {\n    if (region) region.dispatchEvent(new CustomEvent(\'activity\'));\n  };\n  const source = new EventSource(\'/activity/stream\');\n  source.addEventListener(\'open\', refresh);\n  source.addEventListener(\'activity\', refresh);\n\n  return {\n    update(next) {\n      render(next);\n    },\n    unmount() {\n      source.close();\n      document.removeEventListener(\'htmx:after:settle\', closeOnSwap);\n      document.removeEventListener(\'keydown\', onShortcut);\n      dialog.destroy();\n      element.replaceChildren();\n    },\n  };\n});','javascript')+
    '<p>Return <code>{update, unmount}</code>.</p>'+
    lookup(['Call','What it does'],[['<code>update(props)</code>','Relabels the dialog and rebuilds the links, then processes them again, so the server stays the source of the text'],['<code>unmount</code>, job 1: <code>destroy()</code>','Hides the dialog, removes the library’s document-level click listener and replaces the dialog node with a clone'],['<code>unmount</code>, job 2: remove other document listeners','Removes each listener the adapter added, here the keyboard shortcut and the swap handler, or each visit leaves another behind'],['<code>unmount</code>, job 3: <code>source.close()</code>','Closes the event stream']])+
    '<h2 id="c-island-history">Keep it correct across navigation</h2><p>htmx 4 names its events <code>htmx:phase:action</code>, for example <code>htmx:before:swap</code> and <code>htmx:after:settle</code>; see the <a href="https://four.htmx.org/docs/htmx-events-guide" target="_blank" rel="noopener noreferrer">htmx events guide ↗</a>. The detail differs by event, so read the version you ship:</p>'+
    lookup(['Event','What it carries'],[['<code>htmx:before:init</code>, <code>htmx:after:init</code>','The element lifecycle'],['<code>htmx:before:history:restore</code>','History'],['<code>htmx:after:swap</code>','<code>ctx</code>, in the vendored htmx 4.0.0'],['<code>htmx:after:settle</code>','Only <code>task</code>, <code>newContent</code> and <code>settleTasks</code>; htmx dispatches it on the element that received the swap, and it bubbles to <code>document</code>']])+
    '<p>A document-wide handler that closes the dialog on a swap must first check that the swap’s target contains the island. The adapter does it in <code>closeOnSwap</code>: it listens for <code>htmx:after:settle</code> on <code>document</code> and closes only when <code>event.target</code>, the swapped element, contains the island. The island itself survives a navigation swap into <code>#content</code>, so this is what closes a dialog after one of its links is followed.</p>'+
    rules([['Back or Forward restores the page by swapping the body','the island element leaves and a new one arrives; the island lifecycle calls <code>unmount</code>, then <code>mount</code>, so no htmx listener is needed for cleanup'],['A swap whose target contains the island, such as a navigation swap into <code>#content</code>','<code>closeOnSwap</code> closes the dialog'],['A swap into another region, such as the activity region below','leaves an open dialog alone','ok']])+
    '<h2 id="c-island-updates">Refresh a region from a server event</h2><p>A region beside the island, outside its skip-children subtree, can follow a server event. The adapter opens an <code>EventSource</code> to a stream action and closes it in <code>unmount</code>. On each event it dispatches an <code>activity</code> event on the region; the region fetches itself with <code>hx-trigger="activity"</code> and <code>hx-sync="this:queue last"</code>, so a burst of events leaves one request in flight and one queued. A stream action sends events from <code>Caramel::ColdBrew.subscribe</code> through <code>Caramel::SSE.write</code>; see the Cold Brew and actions references, and publish with <code>Caramel::ColdBrew.publish("activity", "changed")</code> from the code that changes the data.</p><button class="c-secondary cursor-interaction" data-page="coldbrew">Read the Cold Brew reference →</button><button class="c-secondary cursor-interaction" data-page="actions">Read the actions reference →</button>'+
    snippet('app/actions/activity/stream.cr','module App::Activity\n  struct Stream < App::ApplicationAction\n    contract do\n    end\n\n    def handle(contract : Contract)\n      stream "text/event-stream" do |io|\n        Caramel::ColdBrew.subscribe("activity") do |updates|\n          # Subscribed: now send the headers, so the browser\'s open event follows.\n          io << ": open\\n\\n"\n          io.flush\n          loop { Caramel::SSE.write(io, event: "activity", data: updates.receive) }\n        end\n      end\n    end\n  end\nend')+
    snippet('app/actions/activity/show.cr','module App::Activity\n  struct Show < App::ApplicationAction\n    contract do\n    end\n\n    def handle(contract : Contract)\n      morph "#activity", with: Views::Activity::Show.new(Time.utc)\n    end\n  end\nend')+
    '<p>The server-sent stream drops events while a client is disconnected, and a browser reconnects by itself. The stream action therefore subscribes first, then writes and flushes a comment line before it blocks: a response sends its headers with its first write, so without that frame the browser’s <code>open</code> event would wait for the next real event. The adapter asks the region to fetch on every <code>open</code>, the first one included: that covers events published between rendering the page and subscribing, and a reconnect loads a fresh snapshot instead of trusting the events it missed. The cost is one extra request per mount.</p>'+
    '<h2 id="c-island-tests">Test it</h2><p>A Corretto request spec proves what the server owes the browser: the mount point, its escaped props and the fallback links.</p>'+
    snippet('spec/requests/guide_spec.cr','require "../spec_helper"\n\ndescribe "Guide" do\n  it "writes the island, its escaped props and the fallback links" do\n    Corretto.session do |client|\n      page = client.get("/guide")\n      page.should have_status(200)\n      page.body.should contain(%(<caramel-island component="NavigatorDialog"))\n      page.body.should contain("Browse &amp; search")\n      page.body.should contain(%(<a href="/health">Health</a>))\n      page.body.should contain(%(<a href="/">Home</a>))\n    end\n  end\n\n  it "answers the region\'s refresh with a partial for #activity" do\n    Corretto.session do |client|\n      client.get("/activity").body.should contain("Recent activity")\n    end\n  end\nend')+
    '<p>Library behaviour needs a browser. Before you ship, check each of these by hand:</p><ul class="c-status-list"><li>Focus moves into the dialog on open and returns to the opener on close.</li><li>Tab and Shift-Tab wrap inside the dialog.</li><li>Escape closes the dialog.</li><li>If the dialog holds a native <code>&lt;select&gt;</code>, its open picker closes alone on the first Escape and the dialog stays.</li><li>Repeated visits to the page keep exactly one dialog.</li><li>Back and Forward with the dialog open leave one working dialog.</li><li>Removing the island through a morph unmounts it and closes the event stream.</li><li>No <code>caramel:island-error</code> event and no console error appears.</li><li>The fallback links work with JavaScript off.</li></ul>'+
    note('The library owns focus; the island owns its DOM','Let the library manage focus, <code>aria-hidden</code> and the Escape key; do not reimplement them. Everything the adapter creates or listens to, the adapter removes in <code>unmount</code>.')+
    prove('c-island-prove','Prove the island',snippet('Terminal · inside the application','frappe corretto spec/requests/guide_spec.cr','bash')+passing('Both examples pass: the page writes the island, its escaped props and the fallback links, and the region’s refresh answers with the activity partial. Check the nine browser points above by hand; a request spec cannot show library behaviour.'))+
    note('Written for 0.15.0, not yet run end to end.','The commands are the release’s own. The recipe keeps its Draft label until it has been run from a new application to a passing spec.','Draft')+
    next('views','Read the views reference'),
  jobs: () => heading('Cookbook / Background work','Give a task its own time.','Enqueue typed jobs with your data, inspect their status, and run Cold Brew workers with or without a web server.')+tags()+
    contract([['Needs','An application whose migrations are applied (<code>work</code> refuses pending migrations)'],['You will have','Jobs enqueued in the business transaction, readable status, retry and failure hooks, and workers that run without HTTP'],['Proved by','<code>frappe corretto</code>, draining due jobs with <code>drain_queue!</code>']])+
    '<h2 id="c-job-files">Where the change goes</h2>'+files([['app/jobs/','Typed job classes'],['app/actions/','Enqueueing action'],['bin/bookshelf','Worker-only process'],['spec/','Drain and status checks']])+
    '<h2 id="c-job-transaction">Enqueue in the business transaction</h2><p>A job extends <code>Caramel::ColdBrew::Job</code>, declares typed payload fields with <code>param</code>, and implements <code>perform</code>.</p>'+rules([['The transaction commits','the queue row commits with the business write','ok'],['The transaction rolls back','the queue row rolls back with it']])+'<p>Call <code>enqueue</code> inside <code>SugarORM::Repo.transaction</code>. Keep payloads small and choose a retry rule for the work. <button class="c-secondary cursor-interaction" data-page="coldbrew">Read the Cold Brew reference →</button></p>'+

    snippet('app/actions/sessions/login.cr',`require "crypto/bcrypt/password"
require "digest/sha256"

module App::Sessions
  struct Login < App::ApplicationAction
    # A valid bcrypt digest that no password matches. An unknown or inactive
    # email is checked against it, so every attempt costs one bcrypt comparison.
    DUMMY_DIGEST = "$2a$11$gAYJo.vJfIwsu1p8HuehU.GEPrMMm4NrGSBZIZiDHdZVg.JHmm5wi"

    contract do
      field email : String
      field password : String
    end

    def handle(contract : Contract)
      user = User.query.where(email: contract.email, active: true).first
      # bcrypt reads at most 71 bytes: verify raises for 72 or more, which would
      # answer 500 only for an existing email. Treat those as a wrong password.
      too_long = contract.password.bytesize >= 72
      digest = user ? user.password_digest : DUMMY_DIGEST
      matches = Crypto::Bcrypt::Password.new(digest).verify(too_long ? "" : contract.password)
      unless user && matches && !too_long
        self.status = 422
        return nil
      end
      # A cookie that still holds a session token must not leave its row open.
      current_session.try &.update!(revoked_at: Time.utc)
      session.clear
      token = Random::Secure.urlsafe_base64(32)
      UserSession.create!(
        user_id: user.id,
        token_digest: Digest::SHA256.hexdigest(token),
        expires_at: Time.utc + 14.days)
      session["session_token"] = token
      true
    end

    def render(result)
      return page "Sign in", Views::Sessions::New.new(csrf_token, true) unless result
      redirect_to "/"
    end
  end
end`)+

    snippet('app/actions/application_action.cr',`require "digest/sha256"

module App
  abstract struct ApplicationAction < Caramel::Action
    include App::Paths

    @session_loaded = false
    @current_session : UserSession? = nil
    @user_loaded = false
    @current_user : User? = nil
    @membership_loaded = false
    @current_membership : Membership? = nil

    def layout(page : Caramel::Page) : String
      Views::Layouts::Application.new(page, csrf_token, signed_in: !current_user.nil?).to_s
    end

    def title_for(page : Caramel::Page) : String
      "#{page.title} · #{App::TITLE}"
    end

    def current_session : UserSession?
      unless @session_loaded
        @session_loaded = true
        if token = session["session_token"]?
          @current_session = UserSession.query.where(
            token_digest: Digest::SHA256.hexdigest(token),
            revoked_at: nil,
            expires_at: Time.utc..
          ).first
        end
      end
      @current_session
    end

    def current_user : User?
      unless @user_loaded
        @user_loaded = true
        if user_session = current_session
          @current_user = User.query.where(id: user_session.user_id, active: true).first
        end
      end
      @current_user
    end

    def current_membership : Membership?
      unless @membership_loaded
        @membership_loaded = true
        if user = current_user
          @current_membership = Membership.query
            .where(user_id: user.id, account_id: tenant.id).first
        end
      end
      @current_membership
    end
  end
end`)+

    snippet('spec/requests/sessions_spec.cr',`require "../spec_helper"
require "crypto/bcrypt/password"

def user(db, active = true) : App::User
  digest = Crypto::Bcrypt::Password.create("secret", cost: 4).to_s
  App::User.create!(db, email: "ann@example.com", password_digest: digest, active: active)
end

def member(db, account : App::Account, active = true) : App::User
  user = user(db, active)
  App::Membership.create!(db, user_id: user.id, account_id: account.id)
  user
end

def log_in(client, password = "secret")
  client.post("/login", params: {"email" => "ann@example.com", "password" => password})
end

describe "Revocable sessions" do
  it "signs a member in and out" do
    Corretto.session do |client, db|
      acme = account(db, "acme")
      member(db, acme)
      log_in(client).should redirect_to("/")
      client.get("/acme").should have_status(200)
      client.post("/logout").should redirect_to("/login")
      client.get("/acme").should have_status(401)
    end
  end

  it "refuses a wrong password" do
    Corretto.session do |client, db|
      member(db, account(db, "acme"))
      log_in(client, "wrong").should have_status(422)
      client.get("/acme").should have_status(401)
    end
  end

  it "answers a password of 72 bytes or more like a wrong one" do
    Corretto.session do |client, db|
      member(db, account(db, "acme"))
      wrong = log_in(client, "wrong")
      long = log_in(client, "a" * 72)
      long.should have_status(422)
      long.body.should eq(wrong.body)
      client.get("/acme").should have_status(401)
    end
  end

  it "does not accept sign_in alone" do
    Corretto.session do |client, db|
      user = member(db, account(db, "acme"))
      client.sign_in(user)
      client.get("/acme").should have_status(401)
    end
  end

  it "refuses an expired session" do
    Corretto.session do |client, db|
      member(db, account(db, "acme"))
      log_in(client)
      client.get("/acme").should have_status(200)
      App::UserSession.query.first!.update!(db, expires_at: Time.utc - 1.minute)
      client.get("/acme").should have_status(401)
    end
  end

  it "refuses a deactivated user" do
    Corretto.session do |client, db|
      user = member(db, account(db, "acme"))
      log_in(client)
      user.update!(db, active: false)
      client.get("/acme").should have_status(401)
    end
  end

  it "refuses a user whose membership was deleted" do
    Corretto.session do |client, db|
      member(db, account(db, "acme"))
      log_in(client)
      client.get("/acme").should have_status(200)
      App::Membership.query.first!.delete(db)
      client.get("/acme").should have_status(401)
    end
  end

  it "refuses a replayed cookie after logout" do
    Corretto.session do |client, db|
      member(db, account(db, "acme"))
      log_in(client)
      cookie = client.cookies[Caramel::Session::COOKIE_NAME]
      client.post("/logout")
      client.cookies[Caramel::Session::COOKIE_NAME] = cookie
      client.get("/acme").should have_status(401)
    end
  end

  it "revokes the earlier session when a signed-in browser logs in again" do

  i18n: () => heading('Guides / Internationalization','Speak your users’ language.','Add typed translations, choose a language for each request, and localize numbers, dates, and validation messages in Caramel 0.15.0.')+
    contract([['Release','0.15.0'],['Needs','An application whose <code>config/application.cr</code> <code>frappe make locale</code> can wire'],['You will have','Typed messages, a language for each request, and localized numbers, dates and validation messages'],['Proved by','<code>frappe check</code> · <code>frappe translations</code> · <code>frappe corretto</code>']])+

    kicker('Stage 1 · Start')+
    "<h2 id=\"c-i18n-enable\">Enable translations</h2><p>Internationalization is opt-in. Inside your application, add a locale before generating the resources you want translated. A plain application does not compile the i18n implementation.</p>"+
    snippet("Terminal · inside your application","frappe make locale fr\nfrappe check","bash")+
    expect('Creates <code>app/locales/en.cr</code> and <code>app/locales/fr.cr</code> and wires <code>config/application.cr</code>, printing a <code>Generated</code> line for each file.')+
    "<p>New resource generation then writes <code>t.</code> calls and adds messages to the default catalog. Existing resource views keep their text until you replace it with message calls.</p><p>The configuration requires <code>caramel/i18n</code> after <code>caramel</code>, loads the locale files, then calls <code>Caramel.locales default: \"en\"</code> once, before loading views. If your configuration has been customized, follow the generator’s instructions to add that wiring by hand.</p>"+
    kicker('Stage 2 · Write')+
    "<h2 id=\"c-i18n-catalogs\">Write Crystal catalogs</h2><p>Catalogs are Crystal named tuples. Add the groups below to the generated catalogs, keeping their existing <code>common</code> and resource messages. Each file has one <code>Caramel.locale</code> declaration; these excerpts show only the added groups. Set <code>caramel.language</code> to the language’s own display name.</p>"+
    snippet("app/locales/en.cr · catalog excerpt","Caramel.locale \"en\", {\n  home: {greeting: \"Hello, %{name}!\"},\n  library: {\n    count: {\"=0\": \"No books\", one: \"%{count} book\", other: \"%{count} books\"},\n  },\n}","crystal")+
    snippet("app/locales/fr.cr · catalog excerpt","Caramel.locale \"fr\", {\n  caramel: {\n    language: \"Français\",\n    number: {separator: \",\", delimiter: \" \"},\n    time: {formats: {date: \"%d/%m/%Y\"}},\n    errors: {blank: \"ne peut pas être vide\"},\n    pages: {not_found: \"Page introuvable\"},\n  },\n  home: {greeting: \"Bonjour, %{name} !\"},\n  library: {\n    count: {\n      \"=0\": \"Aucun livre\",\n      one: \"%{count} livre\",\n      many: \"%{count} de livres\",\n      other: \"%{count} livres\",\n    },\n  },\n}","crystal")+
    "<p>The default locale defines application keys and their placeholders. Other locales may omit keys and use the default text. Use lowercase identifiers for keys.</p>"+
    "<h2 id=\"c-i18n-messages\">Call typed messages</h2><p>Views and actions expose <code>t</code>, <code>locale</code>, and <code>l</code>, including inside <code>markup</code>. A message’s placeholders become named arguments. A plural takes its whole-number count first.</p>"+
    snippet("Inside a view’s blueprint","h1 { t.home.greeting(name: \"Ann\") }\np { t.library.count(3) }\np { l(1234.5, 2) }\np { l(Time.utc(2026, 10, 2), :date) }","crystal")+
    "<p>In French, these calls produce <code>Bonjour, Ann !</code>, <code>3 livres</code>, <code>1 234,50</code>, and <code>02/10/2026</code>.</p><p>Plurals follow CLDR cardinal rules for whole numbers. English requires <code>one</code> and <code>other</code>; French also requires <code>many</code>. Optional exact forms such as <code>\"=0\"</code> take priority, and <code>%{count}</code> uses its number separators.</p>"+
    kicker('Stage 3 · Choose')+
    "<h2 id=\"c-i18n-language\">Choose the request language</h2><p>A valid <code>?locale=</code> switch on GET or HEAD changes the remembered language. Otherwise, selection follows this order:</p><ol><li>A non-default locale prefix, when enabled.</li><li>The remembered locale cookie.</li><li>The best supported <code>Accept-Language</code> match.</li><li>The application’s default locale.</li></ol><p>Locale codes include <code>fr</code>, <code>pt-BR</code>, and <code>zh-Hant</code>. To enable language prefixes, change the existing configuration call:</p>"+
    snippet("config/application.cr · replace the existing locales call","Caramel.locales default: \"en\", prefix: true","crystal")+
    "<p>With this setting, <code>/fr/books</code> routes to <code>/books</code> in French. The default locale stays unprefixed; <code>/en/books</code> does not select English. Prefixes use lowercase codes, such as <code>/pt-br/books</code>. Generated resource path helpers already include the request locale’s prefix. Use <code>localize_path(\"/account\")</code> for a manually written application path.</p><p>Routed responses identify their language with <code>Content-Language</code>. Responses selected without a prefix also vary by <code>Accept-Language</code> and <code>Cookie</code>. A language-switch request returns a 303 redirect, or a 200 response with <code>HX-Redirect</code> for htmx, and remembers the choice in a secure cookie. Unknown switch values are ignored.</p>"+
    "<h2 id=\"c-i18n-switcher\">Add a language switcher</h2><p>Use each locale’s own name and let <code>switch_locale_path</code> preserve the current page and query. Reload the full page when switching so the layout and all visible text use the selected language.</p>"+
    snippet("Inside a view’s blueprint","nav(aria_label: \"Language\") do\n  Caramel::Locale.each do |language|\n    a(href: switch_locale_path(language), hx_boost: \"false\") { language.name }\n  end\nend","crystal")+
    "<p>The layout’s <code>html</code> element should use <code>lang: Caramel.language</code>; generated applications already do. Add <code>dir: locale.dir</code> when supporting right-to-left languages, and check your styles in both directions.</p>"+
    kicker('Stage 4 · Localize')+
    "<h2 id=\"c-i18n-formats\">Format numbers and dates</h2><p><code>l(number, decimals)</code> uses <code>caramel.number.separator</code> and <code>delimiter</code>. <code>l(time, :date)</code> chooses a named time pattern; built-in names include <code>:date</code>, <code>:time</code>, <code>:datetime</code>, and <code>:short_date</code>. The default catalog can add more named formats.</p><p>Supply translated month and day names under <code>caramel.time</code> when your patterns use them. Formatting data falls back from the selected locale to the default locale, then to English. A time keeps its own location; formatting does not convert timezones.</p>"+
    "<h2 id=\"c-i18n-errors\">Translate errors and keep text safe</h2><p>The reserved <code>caramel.errors</code> keys translate contract and changeset messages. <code>caramel.pages</code> includes <code>check_request</code>, <code>not_found</code>, and <code>expired_form</code>. The French catalog above translates blank validation errors and the router’s 404 body. Missing framework messages fall back through the default catalog to English.</p><p>Errors are translated when they are created. JSON keeps its <code>errors</code> object with arrays of messages per field, using the request’s locale. Framework wording is available through <code>Caramel::Wording</code> and <code>SugarORM::Wording</code>, including <code>Caramel::Wording.expired_form</code>.</p><p>Keep catalog messages as text. Views escape normal placeholder values. For a message containing a link or other markup, pass a <code>markup { … }</code> result as the placeholder: only that trusted HTML is emitted as markup, while catalog text and other values remain escaped.</p>"+
    "<h2 id=\"c-i18n-jobs\">Carry language into background work</h2><p>A request’s locale belongs to its fiber and is restored afterward. Spawned fibers and Cold Brew jobs start in the default locale. Give a translated job a <code>param locale : String</code>, enqueue it with the request’s <code>Caramel.language</code>, and wrap the work that creates messages or errors in an explicit locale scope.</p>"+
    snippet("Inside a job’s perform method · locale is the payload field","target = Caramel::Locale.parse?(locale) || Caramel::Locale.default\nCaramel::I18n.with(target) do\n  messages = Caramel::Messages.new(target)\n  greeting = messages.home.greeting(name: \"Ann\")\n  # Use greeting in the job’s output.\nend","crystal")+
    kicker('Stage 5 · Look up')+
    "<h2 id=\"c-i18n-reference\">Look up catalog keys</h2><p>The reserved <code>caramel</code> section takes only these keys. A locale that leaves one out uses the default locale’s, then English.</p>"+
    lookup(['Key','Meaning'],[['<code>language</code>','The language’s own name, such as Français'],['<code>number.separator</code>, <code>number.delimiter</code>','One character each; English uses . and ,'],['<code>time.months</code>, <code>time.abbr_months</code>','12 names, January first'],['<code>time.days</code>, <code>time.abbr_days</code>','7 names, Sunday first'],['<code>time.am</code>, <code>time.pm</code>','The text for %p'],['<code>time.formats.NAME</code>','A pattern; date, time, datetime and short_date are built in']])+
    "<p>A pattern uses only <code>%Y %m %-m %d %-d %H %-H %I %-I %M %S %p %B %b %A %a %%</code>. <code>%I</code> is the 12-hour clock, and <code>%-</code> drops the leading zero.</p><p>The <code>errors</code> and <code>pages</code> keys translate Caramel’s own messages:</p>"+
    lookup(['Key','English text'],[['<code>errors.required</code>','is required'],['<code>errors.must_be_file</code>','must be a file'],['<code>errors.json_type</code>','must be a JSON %{type}'],['<code>errors.invalid_value</code>','must be a valid %{type}'],['<code>errors.at_least</code>','must be at least %{min}'],['<code>errors.at_least_characters</code>','must be at least %{min} characters'],['<code>errors.at_most</code>','must be at most %{max}'],['<code>errors.at_most_characters</code>','must be at most %{max} characters'],['<code>errors.at_least_items</code>','must have at least %{min} item(s)'],['<code>errors.at_most_items</code>','must have at most %{max} item(s)'],['<code>errors.duplicate_item</code>','repeats an earlier item'],['<code>errors.duplicate_field</code>','Duplicate field: %{name}'],['<code>errors.unknown_field</code>','Unknown field: %{name}'],['<code>errors.expected_json_object</code>','Expected a JSON object'],['<code>errors.url</code>','must be an absolute http or https URL'],['<code>errors.blank</code>',"can't be blank"],['<code>errors.greater_than</code>','must be greater than %{than}'],['<code>errors.less_than</code>','must be less than %{than}'],['<code>errors.too_short</code>','should be at least %{min} character(s)'],['<code>errors.too_long</code>','should be at most %{max} character(s)'],['<code>errors.invalid_format</code>','has invalid format'],['<code>errors.invalid</code>','is invalid'],['<code>errors.taken</code>','has already been taken'],['<code>errors.record_gone</code>','Record no longer exists'],['<code>errors.record_stale</code>','Record changed since you loaded it'],['<code>pages.check_request</code>','Check your request'],['<code>pages.not_found</code>','Not found'],['<code>pages.expired_form</code>','This form has expired or came from another site. Reload the page and try again.']])+
    "<p>Plural rules are built in for <code>af am ar as ast az be bg bn bs ca cs cy da de el en es et eu fa fi fo fr fy ga gl gu he hi hr hu id is it ja ka kk km kn ko ky lb lo lt lv mk ml mn mr ms my nb ne nl nn no pl pt pt-PT ro ru sk sl so sq sr sv sw ta te th tr uk ur uz vi yue zh zu</code>. A tag with a region or script uses its language’s rules, so <code>pt-BR</code> uses <code>pt</code>’s. For any other language, name one with the same rules: <code>Caramel.locale \"eo\", {…}, plural: \"en\"</code>. <code>locale.dir</code> is <code>rtl</code> for <code>ar he fa ur ps sd ug yi dv ckb</code>.</p>"+
    kicker('Stage 6 · Limits')+
    "<h2 id=\"c-i18n-refusals\">What does not compile</h2><p>Each mistake below stops the build at the line that causes it.</p>"+
    rules([['A misspelled message name or a missing argument in a <code>t.</code> call','fails compilation'],['Crystal string interpolation in catalog text instead of <code>%{name}</code> placeholders','fails compilation'],['A key that is not a lowercase identifier, a reserved word, or a malformed catalog','fails compilation'],['A non-default locale that defines an application key the default locale lacks','fails compilation'],['A non-default locale that changes a message’s placeholders or kind','fails compilation'],['A locale that omits a required plural category','fails compilation'],['A framework <code>errors</code> or <code>pages</code> key that changes the placeholders of its English text','fails compilation'],['A time pattern that uses a directive outside the listed set, or malformed <code>caramel.time</code> or <code>caramel.number</code> data','fails compilation'],['A non-default locale that adds a time format name','fails compilation'],['A language without built-in plural rules and no <code>plural:</code>','fails compilation']])+
    "<h2 id=\"c-i18n-limits\">Not covered yet</h2><p>Caramel supports typed text messages, whole-number plurals, number and time formatting, and request-local language selection. These are not implemented:</p><ul><li>Select and gender messages.</li><li>Currency formatting.</li><li>Relative time formatting.</li><li>Translated URL segments.</li><li>Database-backed catalogs.</li><li>Automatic job locale propagation.</li><li>An unused-key report.</li></ul><p><a href=\"https://github.com/caramelizedev/caramel/blob/v0.15.0/docs/decisions/0024-internationalization.md\" target=\"_blank\" rel=\"noopener noreferrer\">Read the internationalization design and API details ↗</a></p>"+
    prove('c-i18n-check','Check translations and requests',
      "<p>Use the completeness report alongside the compiler and request specs. <code>frappe translations</code> prints <code>MISSING code key file</code> and exits 1 while translations are missing. It includes framework wording and formatting data, so a newly generated locale has more to fill in than application text. Missing keys can still compile and fall back intentionally.</p>"+
      "<p>Use a fresh Corretto session to test browser language negotiation without a remembered locale. With a Book resource and a layout using <code>Caramel.language</code>:</p>"+
      snippet("spec/requests/books_spec.cr · inside an example","Corretto.session do |client, db|\n  response = client.get(\"/books\",\n    headers: {\"Accept-Language\" => \"fr\"})\n  response.should have_header(\"Content-Language\", \"fr\")\n  response.should have_html { html(lang: \"fr\") }\nend","crystal")+
      "<p>Also assert translated text, fallback behavior, validation messages in HTML and JSON, switch redirects, and form submissions under a locale prefix.</p>"+
      snippet("Terminal · application checks","frappe check\nfrappe translations\nfrappe corretto","bash")+

    next('testing','Test the HTML your app returns'),
