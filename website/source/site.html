    '<h2 id="c-sweettalk-ddd">Find the Domain-Driven Design patterns</h2><p>21 of the 25 patterns below have a SweetTalk word. The table names the word and the section that states its rules. A pattern SweetTalk lacks says so.</p>'+
    '<table class="c-map"><thead><tr><th>Pattern</th><th>In SweetTalk</th><th>Rules</th></tr></thead><tbody>'+
    '<tr><td>Bounded context</td><td><code>context</code>, a module with its own vocabulary.</td><td><a href="#c-sweettalk-contexts">Draw the contexts</a></td></tr>'+
    '<tr><td>Ubiquitous language</td><td><code>means:</code> on every noun, and <code>SweetTalk.glossary</code>, which lists each with its kind and context.</td><td><a href="#c-sweettalk-meaning">Give every noun a meaning</a></td></tr>'+
    '<tr><td>Entity</td><td><code>entity</code>, which lives inside one aggregate and is saved with it.</td><td><a href="#c-sweettalk-aggregates">Declare aggregates and entities</a></td></tr>'+
    '<tr><td>Value object</td><td><code>value</code>: a number or a string with its bounds, or a value with parts, stored one column per part (<code>&lt;attribute&gt;_&lt;part&gt;</code>).</td><td><a href="#c-sweettalk-values">Name the values</a>, <a href="#c-sweettalk-richer-values">values with parts</a></td></tr>'+
    '<tr><td>Aggregate</td><td><code>aggregate</code>, a root with an id that only its commands change. Its entities reach the database only through it: a context that names <code>Rows</code> does not compile.</td><td><a href="#c-sweettalk-aggregates">Declare aggregates and entities</a>, <a href="#c-sweettalk-commands">commands</a></td></tr>'+
    '<tr><td>Repository</td><td>The aggregate’s own <code>create</code>, <code>find</code>, <code>find?</code> and <code>all</code>, and the queries <code>finds</code> and <code>counts</code> declare: filtered by attributes, states and specifications, sorted with <code>order:</code>, limited with <code>first:</code>, or narrowed by a block that never names <code>Rows</code> and always returns aggregates.</td><td><a href="#c-sweettalk-queries">Find, count and retire aggregates</a></td></tr>'+
    '<tr><td>Factory</td><td><code>factory</code>.</td><td><a href="#c-sweettalk-factories">Make aggregates with factories</a></td></tr>'+
    '<tr><td>Domain service</td><td><code>service</code>, which changes at most one aggregate.</td><td><a href="#c-sweettalk-services">Name operations with services</a></td></tr>'+
    '<tr><td>Domain event</td><td><code>event</code> and <code>emit</code>. Each event records who acted and what caused it.</td><td><a href="#c-sweettalk-events">Follow events with policies</a>, <a href="#c-sweettalk-metadata">Record who acted</a></td></tr>'+
    '<tr><td>Event handler (policy)</td><td><code>whenever</code>, run as a Cold Brew job.</td><td><a href="#c-sweettalk-events">Follow events with policies</a></td></tr>'+
    '<tr><td>Side-effect-free function</td><td><code>the</code>, a derived value computed on every read, and plain Crystal methods in an aggregate’s or an entity’s body.</td><td><a href="#c-sweettalk-lifecycle">Guard the lifecycle and the invariants</a></td></tr>'+
    '<tr><td>Specification</td><td><code>specification</code>, a rule stated once in <code>where:</code> and read both in Crystal, as a predicate such as <code>order.astray?</code>, and in PostgreSQL, by <code>satisfying:</code>.</td><td><a href="#c-sweettalk-specifications">Name rules with specifications</a></td></tr>'+
    '<tr><td>Lifecycle (state machine)</td><td><code>moves</code>, checked in Crystal and held in PostgreSQL by a <code>CHECK</code> constraint on the state column. A PostgreSQL enum type is not used, because <code>ALTER TYPE</code> cannot drop a value.</td><td><a href="#c-sweettalk-lifecycle">Guard the lifecycle and the invariants</a></td></tr>'+
    '<tr><td>Process manager or saga</td><td><code>process</code>, with <code>deadline</code> and <code>compensate</code>.</td><td><a href="#c-sweettalk-processes">Run processes</a></td></tr>'+
    '<tr><td>Read model</td><td><code>projection</code>, queried with <code>finds</code> and <code>counts</code>.</td><td><a href="#c-sweettalk-projections">Keep read models</a></td></tr>'+
    '<tr><td>Transactional outbox</td><td>Built in: a command enqueues its policies’, projections’ and processes’ jobs in its own transaction, and publishes its notification with <code>pg_notify</code>, which PostgreSQL delivers when that transaction commits.</td><td><a href="#c-sweettalk-events">Follow events with policies</a></td></tr>'+
    '<tr><td>Conformist</td><td><code>follows:</code>, which adopts another context’s types as they are.</td><td><a href="#c-sweettalk-contexts">Draw the contexts</a></td></tr>'+
    '<tr><td>Anticorruption layer</td><td><code>border Other</code>, which translates another context’s events, values and ids into this one’s. Code in it may also read <code>Other::</code> directly, or call <code>Other.price_of</code>, which draws a dependency edge. <code>border Cards, outside: "…"</code> is the border with a system outside the program, the only code that may name <code>Caramel::Outbound</code> or <code>HTTP::Client</code>, a check on the code as written.</td><td><a href="#c-sweettalk-contexts">Draw the contexts</a>, <a href="#c-sweettalk-outside">Translate outside systems at a border</a></td></tr>'+
    '<tr><td>Open-host service</td><td>The services a context lists in <code>publishes</code>: in one binary, a set of calls other contexts may make.</td><td><a href="#c-sweettalk-published">Publish a language</a></td></tr>'+
    '<tr><td>Published language</td><td><code>publishes</code>, the types and services other contexts may name; any other name of the context does not compile outside it.</td><td><a href="#c-sweettalk-published">Publish a language</a></td></tr>'+
    '<tr><td>Shared kernel</td><td><span data-planned="none">Not planned.</span> <code>central: true</code> is tenancy, not a shared kernel.</td><td><a href="#c-sweettalk-tenancy">Share a domain between tenants</a></td></tr>'+
    '<tr><td>Partnership</td><td><span data-planned="none">Not planned.</span> Two contexts may react to each other’s events, but their dependency edges may not form a cycle.</td><td><a href="#c-sweettalk-contexts">Draw the contexts</a></td></tr>'+
    '<tr><td>Customer/supplier</td><td><span data-planned="none">Not planned.</span> A supplier’s promise to its customers is what it <code>publishes</code>.</td><td><a href="#c-sweettalk-published">Publish a language</a></td></tr>'+
    '<tr><td>Distillation (core, supporting and generic subdomains)</td><td><code>subdomain:</code> on <code>context</code>, carried by every glossary term. The label changes no rule the compiler checks.</td><td><a href="#c-sweettalk-subdomains">Mark the core domain</a></td></tr>'+
    '<tr><td>Event sourcing</td><td><span data-planned="none">Not planned.</span> State lives in rows, and there is no event log.</td><td><a href="#c-sweettalk-limits">Not covered yet</a></td></tr>'+
    '</tbody></table>'+
    '<p>Some differences from the patterns as usually described are deliberate:</p><ul>'+
    '<li><strong>The repository lives on the aggregate.</strong> The aggregate already meets the repository’s rules: it reaches roots only, offers a collection’s interface (<code>create</code>, <code>find</code>, <code>find?</code>, <code>all</code>), and names its queries in domain terms with <code>finds</code>, whose keys are attributes and states the compiler checks, never SQL or SugarORM’s query syntax; a separate repository word would add a second name for the same thing (ADR 0030 decision 2, ADR 0031 decision 3).</li>'+
    '<li><strong>One aggregate per transaction, services included.</strong> A command, a service, a policy and a process step each change at most one aggregate, so each lock and each invariant stays its aggregate’s own; work across aggregates is a process, or a policy that reacts to an event (ADR 0030 decision 5, ADR 0031 decision 5).</li>'+
    '<li><strong>Events belong to their aggregate.</strong> An aggregate emits only its own events and an entity emits none, because the aggregate guards the invariants its entities share; an entity changes through its aggregate’s commands (ADR 0030 decision 2).</li>'+
    '<li><strong>Contexts are modules of one binary.</strong> Contexts call each other in the same process and react to each other’s events through Cold Brew jobs, so there is no RPC or HTTP transport between them (ADR 0030, Reasons).</li>'+
    '<li><strong><code>central: true</code> is tenancy.</strong> It shares a context’s rows between the tenants of a multi-tenant application; it shares no types between contexts, so it is not a shared kernel (ADR 0033 decision 2).</li>'+
    '<li><strong>State lives in rows.</strong> An event drives its policies, projections and processes and is not kept, because SweetTalk expands into SugarORM tables and keeps state in PostgreSQL; there is no event store, and none is planned; <a href="#c-sweettalk-limits">Not covered yet</a> says what that leaves out (ADR 0030 decisions 4 and 6).</li>'+
    '</ul><p>Specs run the domain against real PostgreSQL. Each Corretto example rolls back, and <code>drain_queue!</code> runs the jobs a command enqueued at once, so a spec of a policy, a projection or a process waits for no worker; <code>drain_queue!(db, include_scheduled: true)</code> runs a deadline whose time has not come.</p>'+
    '<h2 id="c-sweettalk-meaning">Give every noun a meaning</h2><p>Every context, value, aggregate, entity, event, projection, specification, service and process carries <code>means:</code>. A noun without one does not compile, and <code>SweetTalk.glossary</code> lists every entry with its kind, its context and that context’s subdomain, so the ubiquitous language is part of the program.</p><p>The same word may mean different things in two contexts:</p>'+
    lookup(['Noun','Means'],[['<code>Catalogue::Tins</code>','“a count of tins on the shelf”'],['<code>Fulfilment::Tins</code>','“tins of one tea packed in a parcel”']])+
    kicker('Stage 2 · Draw boundaries')+'<h2 id="c-sweettalk-contexts">Draw the contexts</h2><p>A <code>context</code> is a bounded context: a module with its own vocabulary. <code>follows:</code> adopts another context’s types as they are. A <code>border</code> is the one place where a context may name a context it does not follow, and it translates that context’s values and ids into its own. Here each context reacts to the other’s event:</p>'+
    snippet('app/domain/tea_shop.cr · two contexts',`context Ordering, follows: Catalogue, means: "choosing teas and checking out" do
  # Ordering may name Catalogue::Tea anywhere.

  border Fulfilment do
    whenever Fulfilment::Parcel::Dispatched do |dispatched|
      Order.find(Order::Id.new(dispatched.order)).ship
    end
    # …
  end
end

context Fulfilment, means: "packing and dispatching parcels" do
  value Tins, Int32, at_least: 1, means: "tins of one tea packed in a parcel"
  # …

  border Ordering do
    whenever Ordering::Order::Placed do |placed|
      packings = placed.lines.map do |line|
        Parcel::Packing.new(line.tea.raw, Tins.new(line.quantity))
      end
      address = placed.deliver_to
      label = Label.new(street: address.street, city: address.city,
        postcode: address.postcode.raw)

    '<p>The context map is checked when the program compiles:</p>'+
    rules([['<code>follows: B</code>','draws a dependency edge to B','ok'],['Anything in <code>border B</code> other than the event a <code>whenever</code> names','draws a dependency edge to B','ok'],['A <code>whenever</code> that reacts to one of B’s events','draws an event edge','ok'],['Naming <code>B::</code>, or calling <code>B.price_of</code>, in a context that follows B','allowed anywhere, unless B publishes and leaves the name out','ok'],['Naming <code>B::</code>, or calling <code>B.price_of</code>, inside <code>border B</code>','allowed; a call draws a dependency edge too','ok'],['A foreign name or call anywhere else','fails compilation'],['An edge to an unknown context','fails compilation'],['A cycle of dependency edges, such as Ordering and Fulfilment following each other','fails compilation'],['Ordering and Fulfilment reacting to each other’s events','allowed','ok']])+

    '<h2 id="c-sweettalk-subdomains">Mark the core domain</h2><p><code>subdomain:</code> on a context says which part of the business it serves:</p>'+
    lookup(['Value','Use for'],[['<code>:core</code>','what sets the business apart'],['<code>:supporting</code>','what the core needs but could be built by anyone'],['<code>:generic</code>','a problem many businesses share']])+
    '<p>It is optional and changes no rule, because no check can measure how carefully a core is modelled. Every glossary term carries its context’s subdomain, so <code>SweetTalk.glossary.select { |term| term.subdomain == "core" }</code> lists the core domain’s language. Any other value does not compile.</p>'+
    snippet('app/domain/tea_house.cr · subdomains',`context Pricing, subdomain: :supporting, means: "what each tea costs" do
  # …
end

context Billing, follows: Pricing, subdomain: :core,
  means: "charging members for their teas" do
  # …
end`)+
    '<h2 id="c-sweettalk-published">Publish a language</h2><p>An upstream context can promise less than all of its model. <code>publishes</code> lists the types and services other contexts may name: its published language, and, in one binary, its open-host service. Naming a type publishes what it contains, so publishing <code>Tea</code> would publish <code>Tea::Id</code> and its commands too. <code>publishes</code> comes after the names it lists.</p>'+
    snippet('app/domain/tea_house.cr · a published language',`context Pricing, subdomain: :supporting, means: "what each tea costs" do
  value Cents, Int64, at_least: 0, means: "an amount of money"

  aggregate Tea, means: "one tea and its price" do
    # …
  end

  service price_of(tea : Tea::Id), returns: Cents, means: "what one tea costs today" do
    Tea.find(tea).price
  end

  publishes Cents, Tea::Id, price_of
end

context Billing, follows: Pricing, subdomain: :core,
  means: "charging members for their teas" do
  service bill(tea : Pricing::Tea::Id), returns: Bill::Id,
    means: "bill a member for one tea at today's price" do
    Bill.open(Pricing.price_of(tea)).id
  end
end`)+
    rules([['A context names a type or service the publisher does not list, whether it follows the publisher or reads it in a border','fails compilation at the line that names it'],['<code>publishes</code> lists a name the context does not declare','fails compilation'],['The publisher is declared after the context that names it','fails compilation; the program’s checks find the name, without a line'],['A context reacts to an event of a publishing context','allowed: events stay open to every context that may name them, because a follower reacts to them and a reaction depends on an event’s fields','ok'],['A context does not publish','keeps the rules above','ok']])+
    '<p>For example, “Shop::Ordering names Catalogue::Tea, which Catalogue does not publish; it publishes Cents, Tea::Id, price_of: use one of those, or publish Tea in Catalogue”.</p>'+
    '<h2 id="c-sweettalk-outside">Translate outside systems at a border</h2><p>A payment gateway or a carrier has a model of its own. <code>border Cards, outside: "…"</code> declares a module <code>Cards</code> in the context: the only code in it that may name <code>Caramel::Outbound</code> or <code>HTTP::Client</code>, and the place that turns the system’s answers into the context’s values and refusals.</p>'+
    '<p>The check reads the code as written, as the <code>Rows::</code> and <code>Other::</code> checks do, so an alias or a method defined outside the context escapes it. <code>outside:</code> is the line its glossary entry shows, and the context map gains an <code>outside</code> edge.</p>'+
    '<p>An outside system emits no events; a webhook arrives through an action, which runs a command.</p>'+
    '<p>Call the system from a <code>whenever</code>, after the command that needs it commits, so that a slow answer never holds an aggregate’s row lock.</p>'+
    '<p>Specs fake it at the wire with <code>Corretto.stub_wire</code>, as the Corretto reference’s “Third parties are faked at the wire” states. <button class="c-secondary cursor-interaction" data-page="corretto">Read the Corretto reference →</button></p>'+
    rules([['<code>Caramel::Outbound</code> or <code>HTTP::Client</code> named outside a <code>border …, outside:</code>','fails compilation'],['An <code>outside:</code> border named like a context','fails compilation'],['An <code>outside:</code> border holding a <code>whenever</code>','fails compilation']])+
    snippet('app/domain/tea_house.cr · an outside system',`whenever Bill::Opened do |opened|
  reference = Cards.charge(opened.bill_id.raw, opened.amount)
  Bill.find(opened.bill_id).settle reference
end

compensate Bill::Opened do |opened, refusal|
  Bill.find(opened.bill_id).decline
end

border Cards, outside: "the card gateway we charge through" do
  CHARGES = "https://cards.example/v1/charges"

  def self.charge(bill : Int64, amount : Pricing::Cents) : Reference
    headers = HTTP::Headers{"Content-Type" => "application/json"}
    body = {bill: bill, amount: amount.raw}.to_json
    response = Caramel::Outbound.post(CHARGES, headers, body)
    case response.status_code
    when 200 then Reference.new(JSON.parse(response.body)["id"].as_s)
    when 402 then raise SweetTalk::Refusal.new("The card was declined.")
    else          raise "Cards answered #{response.status_code}: #{response.body}"
    end
  end
end`)+
    kicker('Stage 3 · Model')+'<h2 id="c-sweettalk-values">Name the values</h2>'+
    snippet('app/domain/tea_shop.cr · values',`value Tins, Int32, at_least: 0, means: "a count of tins on the shelf"
value Cents, Int64, at_least: 0, means: "an amount of money"
value Quantity, Int32, within: 1..10, means: "tins of one tea in one order"`)+
    '<p>A value wraps an <code>Int32</code>, an <code>Int64</code> or a <code>String</code>, or has parts. An integer value takes <code>at_least:</code>, <code>at_most:</code>, <code>within:</code> and <code>times:</code>. It is validated when it is built and by every arithmetic result. <code>+</code> and <code>-</code> take the same value or an integer, and <code>*</code> takes an integer. <code>times: Quantity</code> on <code>Cents</code> would let <code>*</code> take a quantity. A value is stored as a column of its raw type and rebuilt, and so validated again, when it is loaded.</p><p>PostgreSQL checks the bounds too. Every column that stores <code>Tins</code> gets a <code>CHECK</code> constraint, such as <code>check_catalogue_teas_stock</code>, so a write that goes around SweetTalk, through SQL or another service, is refused when it is written. Bounds are therefore integer literals. <code>database_check: false</code> keeps a value’s bounds in Crystal only, where they may name a constant.</p>'+
    rules([['A build or arithmetic result outside the bounds, such as <code>@stock -= tins</code> below zero','refuses with “Tins must be at least 0”'],['<code>+</code> or <code>-</code> of tins and cents','fails compilation'],['<code>*</code> of <code>Cents</code> by a <code>Quantity</code> without <code>times: Quantity</code>','fails compilation']])+
    '<h2 id="c-sweettalk-richer-values">Name strings and values with parts</h2>'+
    snippet('app/domain/tea_shop.cr · string and composite values',`value Email, String, matches: /\\A[^@\\s]+@[^@\\s]+\\z/, length: 3..254,
  means: "an address we can write to"
value Postcode, String, matches: /\\A[A-Z0-9][A-Z0-9 ]{1,8}[A-Z0-9]\\z/,
  means: "a postal code, in capitals"

value Address, means: "where a parcel goes" do
  part street : String
  part city : String
  part postcode : Postcode
  never "An address needs a street and a city." { street.blank? || city.blank? }
end`)+
    '<p>A string value takes <code>matches:</code> and <code>length:</code>, and has no arithmetic. It is stored as a text column. Its pattern is checked in Crystal only, because PostgreSQL reads regular expressions differently.</p>'+
    rules([['<code>Email.new("ada")</code>, a string that does not match the pattern','refuses with “Email must match /\\A[^@\\s]+@[^@\\s]+\\z/” before anything is written'],['A write around SweetTalk with a length outside 3..254','refuses, by the CHECK <code>check_ordering_orders_receipt_to_length_3_254</code>']])+
    '<p>A value with parts is built with one keyword per part, as in <code>Address.new(street: "1 Leaf Lane", city: "Camellia", postcode: Postcode.new("CA1 1TE"))</code>. It checks its <code>never</code> and <code>always</code> when it is built, and equals another address with the same parts. A part is a column type or a value that wraps one. <code>has deliver_to : Address</code> stores one column per part: <code>deliver_to_street</code>, <code>deliver_to_city</code> and <code>deliver_to_postcode</code>. A part’s value brings its constraints to its column.</p>'+
    '<h2 id="c-sweettalk-aggregates">Declare aggregates and entities</h2><p>An aggregate is a root with an id, such as <code>Order::Id</code>, and a repository: <code>find</code>, <code>find?</code>, <code>all</code>, and <code>create</code> unless it has a factory. An entity lives inside one aggregate and is saved with it. Given to another aggregate’s <code>create</code> or factory, it is stored again as that aggregate’s own row, and the first aggregate keeps its own.</p>'+
    snippet('app/domain/tea_shop.cr · an aggregate',`aggregate Order, means: "what a member buys at one checkout" do
  has member : Account
  has receipt_to : Email
  has deliver_to : Address
  has lines : Array(Line)
  has late_parcel : Bool = false
  moves open >> placed >> shipped, open >> cancelled, placed >> cancelled
  never "An order needs at least one tea." { placed? && lines.empty? }

  entity Line, means: "one tea in an order, its price when added, and how many tins" do
    has tea : Catalogue::Tea
    has price : Catalogue::Cents
    has quantity : Quantity
    the cost : Catalogue::Cents = price * quantity.to_i
  end

  the total : Catalogue::Cents = lines.sum(&.cost)

  event Placed, lines : Array(Line), deliver_to : Address, means: "a member checked out"
  # …

  to add(tea : Catalogue::Tea, quantity : Quantity) do
    refuse "Teas can be added only while the order is open." unless open?
    refuse "#{tea.name} is already in this order." if lines.any? { |line| line.tea == tea.id }
    @lines << Line.new(tea, tea.price, quantity)
  end

  to place do
    placed!
    emit Placed, lines: lines, deliver_to: deliver_to
  end
end`)+
    '<p>Each aggregate, entity, projection and process is a SugarORM schema with its own changeset, and every write goes through that changeset. <code>has</code> chooses the storage from the type:</p>'+
    lookup(['<code>has</code> type','Stored as'],[['<code>String</code>, <code>Int32</code>, <code>Int64</code>, <code>Bool</code>, <code>Float64</code> or <code>Time</code>','A column'],['A value that wraps a number or a string','A column of its raw type'],['A value with parts','One column per part'],['Another aggregate','A foreign key; its getter returns that aggregate’s id: <code>line.tea</code> is a <code>Catalogue::Tea::Id</code>. Load the tea with <code>Catalogue::Tea.find</code> when you need it.'],['One of the application’s own SugarORM schemas, as in <code>has member : Account</code>','A foreign key; its getter returns a <code>SweetTalk::RecordId(Account)</code>, and <code>order.member.load</code> reads the account'],['An <code>Array</code> of the aggregate’s own entity','A child table, loaded with <code>preload</code>']])+
    '<p><code>has name : Type = expression</code> gives an attribute a default, as in <code>has held : Tins = Tins.zero</code>. The column gets a SQL default when the expression is a literal, as in <code>has late_parcel : Bool = false</code>.</p>'+
    rules([['A <code>has</code> with any other type','fails compilation'],['A <code>has</code> of a <code>Hash</code>','fails compilation, with a pointer to the entity form'],['A context that names <code>Rows</code>','fails compilation']])+
    '<p>The schemas live in each context’s <code>Rows</code> module, so every change goes through a command. Table names take English plurals. The tea shop’s tables are <code>catalogue_teas</code>, <code>ordering_orders</code>, <code>ordering_order_lines</code>, <code>ordering_sales</code>, <code>ordering_holds</code>, <code>fulfilment_parcels</code> and <code>fulfilment_parcel_packings</code>. They are ordinary schemas, so <code>frappe db diff</code> derives their migrations.</p>'+
    '<h2 id="c-sweettalk-lifecycle">Guard the lifecycle and the invariants</h2><p><code>moves</code> lists one or more chains of states, and the first state is the initial one. <code>moves open &gt;&gt; placed &gt;&gt; shipped, open &gt;&gt; cancelled, placed &gt;&gt; cancelled</code> stores the state and adds <code>open?</code>, <code>placed?</code>, <code>shipped?</code> and <code>cancelled?</code>, and the private movers <code>placed!</code>, <code>shipped!</code> and <code>cancelled!</code>. <code>the</code> is a derived value, computed on every read and never stored.</p>'+
    rules([['A mover such as <code>shipped!</code> is called when the current state does not come just before it in a chain','refuses with “Order cannot become shipped while cancelled”'],['A command leaves a <code>never</code> condition true','refuses'],['A command leaves an <code>always</code> condition false','refuses']])+
    '<p>PostgreSQL holds the lifecycle too. The <code>state</code> column stores each state as <code>moves</code> spells it, such as <code>out_for_delivery</code>, and a <code>CHECK</code> constraint such as <code>check_ordering_orders_state_ef9524ce</code> refuses any other text, so a write around SweetTalk cannot leave a row no state names. The eight hex digits change with the list of states, so <code>frappe db diff</code> replaces the constraint when you add or remove one, and <code>frappe migrate</code> stops, naming the constraint, while a row still holds a state you removed.</p>'+
    '<h2 id="c-sweettalk-commands">Change state with commands</h2><p><code>to verb(arg : Type) do … end</code> is a command, and it runs as one transaction:</p><ol><li>load the aggregate with its row locked through SugarORM’s <code>lock</code>, so commands on one aggregate run one after another and the body sees the last committed state;</li><li>run the body;</li><li>check every <code>never</code> and <code>always</code>;</li><li>save the root through its changeset, then its entities;</li><li>dispatch the queued events.</li></ol>'+
    rules([['<code>refuse "message"</code>','raises <code>SweetTalk::Refusal</code>; the transaction rolls back and the aggregate reloads what is stored, so neither the table nor the object keeps half a change'],['Another aggregate’s command, a <code>create</code> or a factory runs while a command runs','raises <code>SweetTalk::Boundary</code> and rolls the command back']])+
    '<p><code>create</code> and a factory check the invariants before they insert. Each command, factory and service is a <code>domain</code> span in its trace, named like <code>Ordering::Order#place</code>; a refused one is marked failed.</p>'+
    '<p>A command changes one aggregate. A command may read another aggregate it is given: <code>add</code> copies the tea’s price into the line, so repricing the tea later does not change the order.</p>'+
    '<h2 id="c-sweettalk-factories">Make aggregates with factories</h2><p><code>factory verb(args) do … end</code> makes an aggregate. Arguments named like attributes set them, and the body runs as the aggregate’s first change and may <code>emit</code>. The aggregate is checked, saved and its events dispatched in one transaction, and each event names the new aggregate’s id.</p>'+
    snippet('app/domain/tea_shop.cr · a factory',`factory open(member : Account, receipt_to : Email, deliver_to : Address) do
  emit Opened, receipt_to: receipt_to
end`)+
    '<p><code>Ordering::Order.open(account, Email.new("ada@example.com"), address)</code> opens an order.</p>'+
    rules([['A factory leaves an attribute unset and no default covers it','fails compilation'],['A factory named like a repository method, such as <code>factory find</code>','fails compilation'],['An aggregate with a factory','has no <code>create</code>, so every order starts with <code>Opened</code>','ok']])+
    kicker('Stage 4 · Query and decide')+'<h2 id="c-sweettalk-queries">Find, count and retire aggregates</h2>'+
    snippet('app/domain/tea_shop.cr · queries and a removal',`finds placed_for(member : Account), where: {member: member, state: :placed}
finds newest_for(member : Account, count : Int32), where: {member: member},
  order: {id: :desc}, first: count
counts placed_count_for(member : Account), where: {member: member, state: :placed}

to forget do
  refuse "Only a cancelled order can be forgotten." unless cancelled?
  remove
end`)+
    '<p>The aggregate is its own repository: <code>find</code>, <code>find?</code>, <code>all</code>, <code>create</code> or its factory, and the queries it declares. <code>finds</code> defines a query that returns aggregates.</p>'+
    lookup(['Option','Meaning'],[['<code>where:</code>','Keeps the aggregates whose columns equal the expressions: a list matches any of its members and a range its span.'],['<code>state:</code>','Takes a state or a list of states.'],['<code>satisfying:</code>','Adds a specification.'],['<code>order:</code>','<code>order: {id: :desc}</code> sorts by <code>id</code> or by attributes stored in one column, and id breaks ties.'],['<code>first:</code>','Returns at most that many.'],['<code>counts</code>','Takes <code>where:</code> and <code>satisfying:</code> and returns how many, in one statement, without loading them.']])+
    '<p>Each part is optional, but a <code>finds</code> gives at least one.</p><p>A context checks every query when it closes, whether or not anything calls it.</p>'+
    '<p>When a query needs more than that, give <code>finds</code> a block instead. It gets the aggregate’s live rows, with removed ones and other tenants’ already left out, and narrows them with SugarORM’s <code>where</code>, <code>where_null</code>, <code>order_by</code>, <code>limit</code> and <code>offset</code>; the aggregates are built from what it returns, so a caller cannot tell the two kinds apart. It is the one place a column name or a SQL fragment appears in a domain, so keep it for what <code>where:</code> cannot say.</p>'+
    snippet('app/domain/tea_shop.cr · a query with a block',`finds holding(tea : Catalogue::Tea::Id) do |orders|
  orders.where("id IN (SELECT order_id FROM ordering_order_lines WHERE tea_id = ?)", tea.raw)
end`)+
    '<p><code>find</code>, <code>find?</code>, <code>all</code> and every <code>finds</code> read one statement per table: the roots, then each list of entities through <code>preload</code>. So <code>placed_for</code> runs two queries however many orders it returns. Code outside the domain, such as an action, reads through these queries too, and does not name <code>Rows</code>.</p><p><code>remove</code> in a command retires the aggregate. Its row stays with <code>removed_at</code> set, so the lines and projection rows that name it stay valid. <code>find</code>, <code>find?</code>, <code>all</code>, every query and the command’s row lock skip it.</p>'+
    rules([['A query names a key, state or order the aggregate lacks','fails compilation'],['A query filters on a list of entities','fails compilation'],['A query passes a value of the wrong type','fails compilation'],['A query passes an argument <code>finds</code> does not take','fails compilation'],['A <code>finds</code> block does more than narrow its rows: it counts, locks, deletes or names <code>Rows</code> or SugarORM','fails compilation'],['<code>find</code> of a removed or missing aggregate','raises “There is no Order 7.”']])+
    '<h2 id="c-sweettalk-specifications">Name rules with specifications</h2><p>A specification is a rule an aggregate satisfies or not, stated once and read twice: by Crystal on an aggregate in memory, and by PostgreSQL in a query. It lives in the context, after its aggregate, and joins the glossary.</p>'+
    snippet('app/domain/tea_shop.cr · a specification',`specification Astray, on: Order, where: {state: :cancelled, late_parcel: true},
  means: "a cancelled order whose parcel left anyway"

to forget do
  refuse "Only a cancelled order can be forgotten." unless cancelled?
  refuse "An order whose parcel left cannot be forgotten." if astray?
  remove
end`)+
    '<p><code>Astray</code> is read in four ways:</p>'+
    lookup(['Call','Reads the rule'],[['<code>order.astray?</code>','In Crystal, for <code>never</code>, <code>always</code>, guards and methods'],['<code>Ordering::Astray.satisfied_by?(order)</code>','In Crystal, on an aggregate in memory'],['<code>Order.all(satisfying: Astray)</code>','The same rule in one query'],['<code>satisfying: Astray</code> on a <code>finds</code> or a <code>counts</code>','The same rule in one query']])+
    '<p><code>where:</code> takes what <code>finds</code> takes, or earlier specifications on the same aggregate joined by <code>&amp;</code>, <code>|</code> and <code>!</code>, as in <code>where: !Astray</code>. In PostgreSQL <code>!</code> reads as <code>IS NOT TRUE</code>, so an order whose column is NULL fails a rule and passes its negation in Crystal and in PostgreSQL alike.</p><p>A rule PostgreSQL cannot read stays a <code>never</code>, an <code>always</code> or a method: one over a list of entities, such as <code>lines.empty?</code>, or over a derived value made with <code>the</code>. A specification takes no arguments; a <code>finds</code> takes them, and adds a specification with <code>satisfying:</code>.</p>'+
    '<h2 id="c-sweettalk-services">Name operations with services</h2><p>A service is an operation that belongs to no one aggregate. It lives in a context, carries <code>means:</code> and joins the glossary.</p>'+
    snippet('app/domain/tea_shop.cr · a service',`service requote(order : Order::Id), returns: Catalogue::Cents,
  means: "what an order would cost at today's prices" do
  Order.find(order).lines.sum do |line|
    Catalogue::Tea.find(line.tea).price * line.quantity.to_i
  end
end`)+
    '<p>Call it on its context: <code>Ordering.requote(order.id)</code>. To change two aggregates, emit an event and react to it in a <code>whenever</code>.</p>'+
    rules([['A service changes a second aggregate','raises <code>SweetTalk::Boundary</code> and rolls both back'],['A <code>service</code> anywhere but a context','fails compilation'],['<code>returns:</code> omitted','defaults to <code>Nil</code>','ok']])+
    kicker('Stage 5 · React')+'<h2 id="c-sweettalk-events">Follow events with policies</h2><p><code>event</code> declares one of the aggregate’s events, and <code>emit</code> queues one from a command with its facts; an aggregate emits only its own. An event holds its subject’s id (<code>placed.order_id</code>) and its fields as they were when it was emitted: column types, values, ids and an <code>Array</code> of the aggregate’s entity. No getter on an event loads an aggregate, so a handler reads what happened, not what is true now.</p>'+
    '<p><code>whenever</code> in a context or a border is a policy, run as a Cold Brew job. The command enqueues one job per policy in its own transaction, so a job is never lost and never sent for a rolled-back change. A handler changes one aggregate too. With <code>each:</code> it runs once per element of a list in the event, each in its own job: the <code>Sales</code> projection below counts one order line per job.</p>'+
    '<ul><li>A job carries the event as JSON.</li><li>A job is named after its owner (a context and its border, a projection or a process) and the event, never after a line, because <code>caramel_jobs</code> stores the name.</li><li>The command also publishes <code>{"subject": id}</code> on <code>sweettalk.CONTEXT.AGGREGATE.EVENT</code> for live pages, delivered on commit and at most once.</li></ul>'+
    rules([['One line’s job fails','the other lines’ jobs still run','ok'],['Two <code>whenever</code> blocks for one event in one owner','fails compilation'],['A rename whose old job name another job has or claims','fails compilation'],['A refusal, or a handler that changes a second aggregate','fails its job at the first attempt, unless a <code>compensate</code> answers the refusal; the command that emitted the event stays committed'],['Any other handler error','follows Cold Brew’s retry rules','ok']])+
    '<h2 id="c-sweettalk-metadata">Record who acted</h2><p>Every event records <code>event_id</code>, a UUID, <code>occurred_at</code>, <code>actor</code>, a <code>String?</code>, <code>cause_id</code>, the event whose handler emitted it, and <code>flow_id</code>, shared by every event one command leads to: the request’s trace id when it ran in one. Its jobs carry all five. No command takes an actor: wrap the call in <code>SweetTalk.acting</code> instead.</p>'+
    snippet('Inside an action · order is a loaded Ordering::Order',`SweetTalk.acting("member:7") { order.place }`)+
    '<p>Each policy, compensation and process step runs as its event’s actor, so the <code>Cancelled</code> event a refused hold leads to still names <code>member:7</code>. A deadline acts as <code>deadline Hold.lapse</code>.</p><p>A field may be nilable. <code>cancel</code> without a reason sends <code>reason</code> as JSON null:</p>'+
    snippet('app/domain/tea_shop.cr · a nilable fact',`event Cancelled, lines : Array(Line), reason : String?,
  means: "the order was given up, and why"

to cancel(reason : String? = nil) do
  unless cancelled?
    cancelled!
    emit Cancelled, lines: lines, reason: reason
  end
end`)+
    rules([['An event field named <code>event_id</code>, <code>occurred_at</code>, <code>actor</code>, <code>cause_id</code>, <code>flow_id</code> or like the subject’s id','fails compilation'],['An event field typed as a union of other types, such as <code>String | Int32</code>','fails compilation']])+
    '<p>A retried job carries the same <code>event_id</code>. A handler that sends mail or calls an API can key that side effect on it, so a retry can tell the side effect already happened.</p>'+
    '<h2 id="c-sweettalk-projections">Keep read models</h2><p>A projection is a table with one row per key. Inside a <code>whenever</code> block, <code>Sales[tea]</code> reads the row locked and saves it when the handler returns. When the row is missing, an upsert on the key’s unique index inserts it with its defaults, so two handlers that insert one key at once keep one row.</p>'+
    snippet('app/domain/tea_shop.cr · a projection',`projection Sales, means: "tins sold of one tea" do
  key tea : Catalogue::Tea
  has sold : Int32 = 0

  whenever Order::Placed, each: :lines do |placed, line|
    Sales[line.tea].sold += line.quantity.to_i
  end
end`)+
    '<p>A projection declares queries as an aggregate does. <code>finds</code> takes <code>where:</code>, <code>order:</code> and <code>first:</code>, or a block that narrows its rows, and <code>counts</code> takes <code>where:</code>. The keys are the projection’s attributes, its key included: <code>where: {tea: tea}</code> compares the tea’s id. A projection has no lifecycle and no specifications, so it takes neither <code>state:</code> nor <code>satisfying:</code>, and every row counts, since a projection removes none.</p>'+
    snippet('app/domain/tea_shop.cr · projection queries',`finds best_sellers(count : Int32), order: {sold: :desc}, first: count
counts sold_any, where: {sold: 1..}`)+
    '<p><code>Sales.best_sellers(10)</code> reads the ten best-selling teas in one statement, and <code>Sales.sold_any</code> counts the teas that sold at least one tin without loading them.</p>'+
    '<h2 id="c-sweettalk-processes">Run processes with deadlines and compensation</h2><p>A process is a workflow across aggregates. It keeps one row per <code>key</code>, with attributes, a lifecycle and deadlines, in a table such as <code>ordering_holds</code>. <code>Hold</code> holds the tins of one tea for one placed order until the parcel leaves, and gives them back when the order is cancelled or the parcel is late.</p>'+
    snippet('app/domain/tea_shop.cr · a process',`process Hold, means: "tins of one tea held on the shelf for one placed order" do
  key slot : Slot
  has tins : Int32 = 0
  moves waiting >> holding >> taken, waiting >> refused, waiting >> released,
    holding >> released

  whenever Order::Placed, each: :lines,
    key: Slot.new(order: placed.order_id.raw, tea: line.tea.raw) do |placed, line|
    if waiting?
      Catalogue::Tea.find(line.tea).hold Catalogue::Tins.new(line.quantity.to_i)
      @tins = line.quantity.to_i
      holding!
      arm lapse
    end
  end

  compensate Order::Placed do |placed, line, refusal|
    refused!
    Order.find(placed.order_id).cancel refusal.message
  end

  # whenever Order::Cancelled releases the tins; Fulfilment::Parcel::Dispatched takes them

  deadline lapse, after: 7.days do
    Order.find(Order::Id.new(slot.order)).cancel "not dispatched within 7 days" if holding?
  end
end`)+
    lookup(['Word','What it does'],[['<code>whenever Event, key: expression</code>','A step. Its job inserts the row when it is missing, locks it and runs the block on it. A step changes at most one aggregate; its own row does not count. Attributes other than the key are nilable or have a literal default, because a row starts from its key alone.'],['<code>compensate</code>','Runs when its <code>whenever</code> is refused. The handler’s work has already rolled back; the compensation gets the same arguments and the refusal, and runs in its own transaction. Here a tea that cannot be held cancels its order with “Only 1 tins of Gyokuro free.”. A refusal in the compensation fails the job. A context or a border may compensate its own <code>whenever</code> too: Ordering’s border notes a parcel that left after its order was cancelled.'],['<code>arm lapse</code>, <code>disarm lapse</code>','<code>arm lapse</code> sets <code>lapse_due</code> and enqueues a job for that time, and <code>disarm lapse</code> clears it. Cold Brew cannot cancel a job, so every arm and disarm counts up an arming counter: a stale deadline job finds a newer arming and does nothing.'],['<code>arm lapse, after: 2.days</code>','Arms the deadline for another span than its own.']])+
    '<p>A process may react to another context’s events outside a border. <code>Hold</code> follows <code>Fulfilment::Parcel::Dispatched</code>, which draws an event edge from Ordering to Fulfilment.</p>'+
    kicker('Stage 6 · Operate')+'<h2 id="c-sweettalk-renames">Rename without moving data</h2><p>A name SweetTalk stores, such as a table, a channel or a job name, comes from a domain name. When the model finds a better word, <code>renamed_from:</code> keeps the table and the channel the old name used, so no data moves.</p>'+

  # still stored in catalogue_teas, still announced on sweettalk.catalogue.tea.*
end`)+
    '<p>A job’s name follows its owner and the event’s path as written. When a rename changes it, SweetTalk declares Cold Brew’s <code>renamed_from</code> on the job with the old name, so jobs queued before the rename keep running.</p>'+

    '<p><code>renamed_from:</code> keeps a table, a channel and queued jobs across a rename. While SweetTalk is experimental, a minor release may still change any of these names.</p>'+
    '<h2 id="c-sweettalk-tenancy">Share a domain between tenants</h2><p>In a multi-tenant application, name the tenant model before the first context. It is the model the routes’ <code>tenant</code> block names, and SugarORM refuses another.</p>'+
    snippet('app/domain/tenant_shop.cr · a domain shared by tenants',`module TenantShop
  include SweetTalk

  tenant Account

  context Catalogue, central: true, means: "the teas every tenant sells" do
    aggregate Tea, means: "one tea on every tenant's shelf" do
      has name : String
    end
  end

  context Ordering, follows: Catalogue, means: "choosing teas and checking out" do
    # aggregates, projections and processes that belong to one tenant

end`)+
    '<p>Every context belongs to the tenant unless it says <code>central: true</code>. Its aggregates, entities, projections and processes get a column named after the model, <code>account_id</code> here, and SugarORM scopes their reads, locks, keys and upserts by the bound tenant, so a projection or a process keeps one row per tenant per key. A policy, projection or process step runs in the tenant its event was emitted in, a deadline in the tenant that armed it, and a notification goes out on the tenant’s channel. A central context’s rows are shared by every tenant.</p>'+
    '<p>A tenanted aggregate may reference a central one, as an order line names a shared tea.</p>'+
    rules([['A tenanted aggregate references a central one','allowed','ok'],['A domain without <code>tenant</code> in a program that requires <code>caramel/tenancy</code>, or <code>tenant</code> without that require, after a context, twice, or naming anything but a SugarORM schema','fails compilation'],['<code>central:</code> with anything but <code>true</code>, or without <code>caramel/tenancy</code>','fails compilation'],['A <code>has</code> in a central context that points at a tenanted aggregate or a tenanted schema of the application, whose rows every tenant would then see','fails compilation'],['A <code>whenever</code> in a tenanted context for a central context’s event, which carries no tenant (a central context may follow a tenanted one’s events, and its handler runs in the event’s tenant)','fails compilation'],['An event channel over 42 characters, which leaves 21 for a tenant’s <code>t&lt;id&gt;:</code> prefix, or a tenant index name over PostgreSQL’s 63 bytes','fails compilation'],['A <code>has</code> that would store <code>account_id</code>, or an entity of an aggregate named like the tenant model','fails compilation']])+
    '<p>A domain that already holds data follows Add tenancy to existing data in the multi-tenancy guide; <code>frappe db diff</code> names every SweetTalk table it halts on. <button class="c-secondary cursor-interaction" data-page="tenancy">Read the multi-tenancy guide</button></p>'+
    '<h2 id="c-sweettalk-actions">Call the domain from actions</h2><p>An action’s contract may declare a value or an aggregate’s id as a field. The field binds from the type the value wraps, with that type’s grammar and JSON type, and the value’s refusal becomes the field’s error, so a form shows it beside its input. The example is the Box Office path’s: <code>Seats</code> is a value within 1..8, <code>Email</code> a string value, and The Tempest a show. <button class="c-secondary cursor-interaction" data-page="boxoffice">Build a box office →</button></p>'+
    snippet('app/actions/holds/create.cr',`module App::Holds
  struct Create < App::ApplicationAction
    contract do
      field show : BoxOffice::Seating::Show::Id
      field guest : BoxOffice::Seating::Email
      field seats : BoxOffice::Seating::Seats
    end

    def handle(contract : Contract)

    end
  end
end`)+

    rules([['The route <code>post "/shows/:show/holds", App::Holds::Create</code> with <code>seats=9</code> from a JSON client','answers 422 with <code>{"errors":{"seats":["Seats must be between 1 and 8"]}}</code>, before <code>handle</code> runs'],['<code>/shows/abc/holds</code>, since an id binds from an <code>Int64</code>','answers 404'],['A refusal that <code>handle</code> does not rescue','answers 422 the way a failed contract does, with its message under <code>_base</code>'],['<code>SweetTalk::Missing</code>, which <code>find</code> raises for an id that names no aggregate','answers 404'],['<code>SweetTalk::Boundary</code>, a mistake in the code','answers 500']])+

    kicker('Stage 7 · Limits')+'<h2 id="c-sweettalk-refusals">What does not compile</h2><p>Each mistake below stops the build. Most fail with a message that names the sentence and its fix; a row that says so fails with Crystal’s own message, such as an undefined method. <code>scripts/check sweet-talk-compilation</code> runs one fixture per mistake, and the website check holds this table to that list.</p>'+
    rules([['A noun without <code>means:</code>','fails compilation'],['A <code>subdomain:</code> other than <code>:core</code>, <code>:supporting</code> or <code>:generic</code>','fails compilation'],['A foreign name or call outside a border, a border or <code>follows:</code> to an unknown context, or a cycle of dependency edges','fails compilation'],['A name or call another context does not publish, a <code>publishes</code> of a name the context does not declare, or of an expression','fails compilation'],['<code>Caramel::Outbound</code> or <code>HTTP::Client</code> outside a border with an outside system, or such a border named like a context, holding a <code>whenever</code>, or without its <code>outside:</code> text','fails compilation'],['<code>emit</code> of another aggregate’s event','fails compilation'],['A mover the lifecycle does not declare','fails compilation, with Crystal’s own message'],['A lifecycle whose check name would pass PostgreSQL’s 63 bytes','fails compilation'],['<code>the</code> without a type','fails compilation'],['A value that wraps anything but <code>Int32</code>, <code>Int64</code> or <code>String</code>, or has no parts','fails compilation'],['A value that takes an option its raw type does not, such as <code>matches:</code> on an integer or <code>at_least:</code> on a string, <code>database_check: true</code>, or <code>database_check: false</code> on a value with parts','fails compilation'],['A bound that is not an integer literal, unless the value takes <code>database_check: false</code>','fails compilation'],['Two different values mixed in arithmetic, or multiplied without <code>times:</code>','fails compilation, with Crystal’s own message'],['A word out of its place: <code>whenever</code> or <code>service</code> in an aggregate, <code>key</code> outside a projection or a process, <code>deadline</code> outside a process, <code>specification</code> inside an aggregate, or <code>compensate</code> in a projection','fails compilation'],['<code>has</code> or <code>part</code> with a type that cannot be stored, a <code>has</code> of a <code>Hash</code>, or an attribute or key whose constraint or index name would pass PostgreSQL’s 63 bytes','fails compilation'],['An event whose channel would pass PostgreSQL’s 63 characters','fails compilation'],['Two declarations whose names give one table','fails compilation'],['A context that names <code>Rows</code>, or code outside the domain that reads an aggregate’s rows','fails compilation'],['A projection or a process without <code>key</code>, a process step without <code>key:</code>, or a process attribute without a literal default','fails compilation'],['Two <code>whenever</code> blocks for one event in one place, or <code>each:</code> naming a field that is not a list','fails compilation'],['A handler that reads an aggregate from an event, as in <code>placed.order</code>','fails compilation, with Crystal’s own message'],['A factory that leaves an attribute unset, or named like a repository method','fails compilation'],['<code>create</code> on an aggregate that has a factory','fails compilation, with Crystal’s own message'],['A query on an unknown attribute, state or order, on a list of entities, with a value of the wrong type, with an argument it does not take, with nothing, with <code>where:</code> or <code>order:</code> that is not a tuple, or with a direction other than <code>:asc</code> or <code>:desc</code>','fails compilation'],['A <code>finds</code> with a block and an option, a block of more than one expression, or a block that does more than narrow its rows','fails compilation'],['A <code>counts</code> with <code>order:</code> or a block','fails compilation'],['A query named <code>all</code> or like another query','fails compilation'],['A specification on an unknown attribute or state, on a list of entities or a derived value, with a block, without <code>on:</code>, outside a context, whose predicate the aggregate already has, or whose <code>where:</code> is neither a tuple nor specifications joined by <code>&amp;</code>, <code>|</code> and <code>!</code>','fails compilation'],['<code>satisfying:</code> with anything but a specification on that aggregate, or <code>satisfying:</code> and <code>state:</code> on a projection','fails compilation'],['A <code>compensate</code> without its <code>whenever</code>','fails compilation'],['<code>arm</code> of a deadline the process lacks','fails compilation'],['An event field named like its metadata, or typed as a union of other types','fails compilation'],['<code>renamed_from:</code> naming its own name, or a rename whose old job name another job has','fails compilation'],['A value with parts as a contract field','fails compilation, with Crystal’s own message'],['With <code>caramel/tenancy</code>, the mistakes listed under <a href="#c-sweettalk-tenancy">Share a domain between tenants</a>','fails compilation']])+
    '<h2 id="c-sweettalk-limits">Not covered yet</h2><p>SweetTalk covers the domain.</p><ul><li>Resources, representations and authorisation are the application’s: an action calls the domain, and SweetTalk answers only its refusals.</li><li>String patterns and the <code>never</code> rules of values and aggregates are checked in Crystal only.</li><li>Refusal messages are the domain’s English, even with <code>caramel/i18n</code>.</li><li>There is no event log: a projection keeps its rows, not the events that built them, so a projection added later starts empty and cannot be rebuilt from past events.</li><li>A process’s rows are never removed, so its table grows with every key it has seen.</li><li>A central context’s event reaches no tenanted handler, and the tenant column is always named after the tenant model (ADR 0033, deferred).</li></ul>'+

    guideMap('practices', [['Start', [['c-practices-home', 'Give every change its home'], ['c-practices-inputs', 'Declare every input']]], ['Data', [['c-practices-writes', 'Write through changesets'], ['c-practices-data', 'Preload, and migrate in reviewed steps']]], ['Browser', [['c-practices-html', 'Keep HTML escaped'], ['c-practices-trust', 'Keep the browser protections on']]], ['Work', [['c-practices-jobs', 'Make background work safe to repeat'], ['c-practices-tests', 'Test what users observe']]], ['Style', [['c-practices-text', 'Keep user-facing text in catalogs'], ['c-practices-style', 'Write code that reads like short sentences']]], ['Limits', [['c-practices-compile', 'What does not compile'], ['c-practices-gaps', 'Not covered yet']]]])+
    '<p>The code on this page extends the bookshelf of <button class="c-secondary cursor-interaction" data-page="learn">Your first application</button>: a Book with <code>title</code> and <code>author</code>, to which this page adds a <code>rating</code> and a receipt job.</p>'+
    kicker('Stage 1 · Start')+
    '<h2 id="c-practices-home">Give every change its home</h2><p>Each kind of change has one place, and <button class="c-secondary cursor-interaction" data-page="map">Project structure</button> lists them. Your application’s files are the extension point. When the public API cannot do what a task needs, name the gap, in an issue or in <code>AGENTS.md</code>, instead of patching <code>lib/caramel</code>: the next <code>shards install</code> would undo the patch.</p>'+
    '<h2 id="c-practices-inputs">Declare every input</h2><p>Read request data only through the action’s contract. Give each field its type, and bounds or a default where they apply. The outcomes of an undeclared field and of a route parameter without a field are in the <button class="c-secondary cursor-interaction" data-page="routing">contract reference</button>; <code>frappe check</code> prints the line that adds a missing field.</p>'+
    snippet('app/actions/books/create.cr · contract, with the rating this page adds','contract do\n  field title : String, min: 1, max: 200\n  field author : String, min: 1, max: 200\n  field rating : Int32?, min: 1, max: 5\nend','crystal')+
    kicker('Stage 2 · Data')+
    '<h2 id="c-practices-writes">Write through changesets</h2><p>Every insert and update goes through a changeset, so its rules run for every caller. Put validations in <code>validate(cs)</code>. Declare <code>unique_constraint</code> for each unique index. Show the errors with the form, or with <code>render_errors</code>.</p>'+
    rules([['Duplicate on a unique index, with <code>unique_constraint</code> declared', 'adds an error on the field'], ['The same duplicate without it', 'raises a database exception']])+
    snippet('app/changesets/book.cr · for a Book generated with title:string:unique','class Book::Changeset < SugarORM::Changeset(App::Book)\n  param title : String\n  param author : String\n  param rating : Int32?\n\n  def validate(cs)\n    cs.validate_presence(:title)\n    cs.validate_length(:title, max: 200)\n    cs.unique_constraint(:title)\n  end\nend','crystal')+
    '<h2 id="c-practices-data">Preload, and migrate in reviewed steps</h2><p>Preload every association a page reads. To change stored data, edit the schema first, derive the migration, read its SQL, then apply it. Rehearse a change you cannot undo, such as dropping a column, on a database branch.</p>'+

    '<h2 id="c-practices-html">Keep HTML escaped</h2><p>Views escape every text value and attribute. Mark a value as <code>Caramel::HTML::Safe</code> only when your own code built it, such as the result of <code>markup { … }</code>; never wrap user input. Update part of a page with an htmx fragment, <code>morph</code>, or <code>partials</code> instead of client-side state, and use an island only where a widget needs state of its own.</p>'+
    '<h2 id="c-practices-trust">Keep the browser protections on</h2><p>Every write a browser sends carries the CSRF token: forms include the hidden <code>_csrf</code> field, and the generated layout sends <code>X-CSRF-Token</code> with htmx requests. Turn CSRF off only for a route whose <code>ingress</code> names an authenticator for a credential a browser never attaches on its own, such as a signature or a bearer token. Verify a webhook’s signature over its <code>raw_body</code> with a constant-time comparison before reading it.</p>'+
    rules([['<code>ingress</code> sets <code>csrf: false</code> and names no authenticator', 'fails compilation'], ['<code>redirect_to</code> given a destination that is not a path on your site', 'refuses']])+

    '<button class="c-secondary cursor-interaction" data-page="security">Review the security defaults →</button>'+
    kicker('Stage 4 · Work')+
    '<h2 id="c-practices-jobs">Make background work safe to repeat</h2><p>Enqueue a job in the same transaction as the write it follows, so both commit or neither does. Pass identifiers, not records, and load fresh data in <code>perform</code>. A job runs at least once: give each external call a stable identifier the receiving service can deduplicate. A retry or failure hook only records or enqueues; it does no work of its own. A recurring schedule runs once per period however many processes run it, so its block should only enqueue the real work.</p>'+
    snippet('app/jobs/send_receipt.cr · the job this page adds','struct App::SendReceipt < Caramel::ColdBrew::Job\n  param book_id : Int64\n\n  def perform\n    # Load the book by book_id and send its receipt.\n  end\nend','crystal')+
    snippet('app/actions/books/create.cr · handle, rewritten to enqueue the job beside the write','def handle(contract : Contract)\n  changes = App::Book::Changeset.new(title: contract.title, author: contract.author)\n  SugarORM::Repo.transaction do\n    SugarORM::Repo.insert(changes)\n    App::SendReceipt.enqueue(book_id: changes.record.id) if changes.saved?\n  end\n  return render_errors(changes.errors) unless changes.saved?\n  {record: changes.record}\nend','crystal')+
    '<h2 id="c-practices-tests">Test what users observe</h2><p>Write request specs that drive the application through Corretto against real PostgreSQL. Assert the rendered HTML with <code>have_html</code>, stored rows with <code>have_row</code>, and statuses and headers, with at least one failure case for each rule. Fake a third-party service at the wire with <code>Corretto.stub_wire</code>. Drain queues with <code>Caramel::ColdBrew.drain_queue!</code>, then assert what the job changed. Corretto refuses a mocking library; the <button class="c-secondary cursor-interaction" data-page="corretto">Corretto reference</button> says how.</p>'+
    kicker('Stage 5 · Style')+
    '<h2 id="c-practices-text">Keep user-facing text in catalogs</h2><p>Once an application has locales, write user-facing text as <code>t.</code> messages. Use <code>%{name}</code> placeholders instead of Crystal interpolation, so every locale has to keep them. Run <code>frappe translations</code> in CI to see what each locale still takes from the default, and pass <code>Caramel.language</code> to jobs that produce text.</p>'+
    '<h2 id="c-practices-style">Write code that reads like short sentences</h2><p><code>frappe lint</code> holds the application to Caramel’s rule set: descriptive names, no service nouns such as <code>InvitationService</code>, positive conditions, a cyclomatic complexity of at most 10 per method, and no <code>dump</code> left behind. Every other rule is Ameba 1.7.0’s default. Put the verb on its subject instead of a service: a method on the model, a changeset, or a job. <code>frappe format</code> applies the pinned formatter.</p>'+

    '<h2 id="c-sugarorm-schemas">A model declares its table once</h2><p>A model is a struct that extends <code>SugarORM::Schema</code> and declares its table once. The schema block defines the record type, its queries and its migrations. <code>frappe make resource</code> writes one for you.</p><button class="c-secondary cursor-interaction" data-page="crud">Create a resource →</button>'+
    snippet('app/models/book.cr · assumes an App::Author schema with has_many books : Book','module App\n  struct Book < SugarORM::Schema\n    schema "books" do\n      field id : Int64, primary: true\n      field title : String\n      field isbn : String?, renamed_from: :code\n      field copies : Int32 = 1\n      field archived : Bool = false\n      timestamps\n      belongs_to author : Author\n      index :isbn, unique: true\n      check copies: 0..\n      drop_column :shelf\n    end\n\n    scope available { where(archived: false) }\n    scope with_copies(count : Int32) { where("copies >= ?", count) }\n  end\nend')+
    '<p>Fields take <code>String</code>, <code>Int32</code>, <code>Int64</code>, <code>Bool</code>, <code>Float64</code> or <code>Time</code>, or any type through <code>codec:</code>; add <code>?</code> for a nullable column.</p>'+
    rules([['An unsupported field type','fails compilation'],['A default that is not a literal (it becomes the column’s SQL default), or any default on a <code>Time</code> field','fails compilation'],['A schema with no <code>primary: true</code> field','fails compilation'],['A <code>primary: true</code> field that is nilable, not <code>Int64</code>, or has a default','fails compilation'],['The one <code>primary: true</code> field','is a non-nilable <code>Int64</code> without a default, stored as an identity column','ok'],['<code>timestamps</code>','adds <code>created_at</code> and <code>updated_at</code>','ok'],['<code>timestamps</code> declared twice, or a second <code>version: true</code> field','fails compilation'],['An update that changes a field','also sets <code>updated_at</code>','ok'],['A <code>has_many</code> or <code>has_one</code> whose foreign key the target lacks','fails compilation'],['<code>belongs_to</code> with an <code>on_delete:</code> other than <code>:cascade</code>, <code>:restrict</code> or <code>:set_null</code>, or with any other option','fails compilation'],['<code>on_delete: :set_null</code> on a reference that is not nilable, or on a key from a tenanted schema to a tenanted schema','fails compilation'],['A duplicate column','fails compilation'],['Two schemas that name one table','fails compilation'],['A reserved name such as <code>query</code> or <code>update</code>','fails compilation'],['A range check that is not an inclusive range of integer literals, an empty range such as <code>10..1</code>, a check declared twice, or a check name over 63 bytes','fails compilation'],['A record','is immutable: <code>book.with(title: "Dune Messiah")</code> returns a changed copy and never persists it','ok'],['An insert or update that breaks a unique index or a CHECK the changeset did not map','raises <code>SugarORM::UniqueViolation</code> or <code>SugarORM::CheckViolation</code>']])+

    '<h2 id="c-sugarorm-codecs">Codecs map other types to text</h2><p>A field of any other type names a codec: <code>field name : Type, codec: Codec</code>. The codec maps the type to text. Rows read a codec column as text and writes bind the encoded text, so no value passes through a float.</p>'+
    lookup(['Codec method','Returns'],[['<code>Codec.sql_type</code>','The column type, one of <code>numeric</code>, <code>numeric(P,S)</code>, <code>jsonb</code> or <code>text</code>'],['<code>Codec.encode(value)</code>','The text to store'],['<code>Codec.decode(text)</code>','Builds the value back']])+
    '<p><code>SugarORM::JSONB(T)</code> is a codec for any <code>JSON::Serializable</code> type, <code>JSON::Any</code>, or an Array or Hash of those. It stores the value in a <code>jsonb</code> column.</p>'+
    snippet('app/models/invoice.cr','module App\n  struct Snapshot\n    include JSON::Serializable\n    getter lines : Array(Hash(String, String))\n\n    def initialize(@lines)\n    end\n  end\n\n  struct Invoice < SugarORM::Schema\n    schema "invoices" do\n      field id : Int64, primary: true\n      field snapshot : Snapshot, codec: SugarORM::JSONB(Snapshot)\n      field notes : Snapshot?, codec: SugarORM::JSONB(Snapshot)\n    end\n  end\nend')+
    '<p>A numeric column keeps exact decimals. This codec holds the digits as text, so the application picks its own decimal type and checks the text in <code>decode</code>.</p>'+
    snippet('app/models/rate.cr','module App\n  record Rate, text : String\n\n  module RateCodec\n    def self.sql_type : String\n      "numeric(20,8)"\n    end\n\n    def self.encode(rate : Rate) : String\n      rate.text\n    end\n\n    def self.decode(text : String) : Rate\n      raise ArgumentError.new("not a decimal: #{text}") unless text.matches?(/\\A-?\\d+(\\.\\d+)?\\z/)\n      Rate.new(text)\n    end\n  end\n\n  struct Price < SugarORM::Schema\n    schema "prices" do\n      field id : Int64, primary: true\n      field rate : Rate, codec: RateCodec\n      field fee : Rate?, codec: RateCodec\n    end\n  end\nend')+
    rules([['A codec field with a default','fails compilation'],['A <code>sql_type</code> other than <code>numeric</code>, <code>numeric(P,S)</code> with S ≤ P ≤ 1000, <code>jsonb</code> or <code>text</code>','raises ArgumentError'],['A changeset <code>param</code> on a codec field','uses the field’s type, such as <code>Rate</code>','ok'],['The number validators on a codec field','do not apply, because the stored value is text','ok'],['<code>validate_inclusion</code> on a codec field','takes values of the field’s type','ok'],['Raw SQL reading a codec column','selects it as text, as in <code>SELECT rate::text AS rate FROM prices</code>','ok'],['<code>frappe db diff</code> on a codec field','derives the column from <code>sql_type</code>','ok'],['Adding a required codec field to an existing table','halts the diff, because it has no default: add it nilable, backfill, then make it required']])+

    '<h2 id="c-coldbrew-rename">A renamed job keeps its queued rows</h2><p>A row stores the job’s fully qualified class name, and a worker runs the compiled job of that name. <code>enqueue</code> always stores the current name, so after you rename or move a class, rows queued before the deploy still carry the old one. List the old names on the class that replaced it.</p>'+

    '<h2 id="c-corretto-setup">Specs run only under frappe corretto</h2><p>A generated application has a spec helper that requires <code>caramel/corretto</code> and calls <code>Corretto.configure(App)</code> once. The application is built on the spec database, with the origin and secret that <code>frappe corretto</code> supplies. <code>Corretto.configure(App) { |config| … }</code> takes a block for settings.</p>'+snippet('spec/spec_helper.cr','require "spec"\nrequire "caramel/corretto"\nrequire "../config/application"\n\n# `frappe corretto` runs each worker against its own Latte clone of the\n# migrated spec database; Corretto refuses any other database, wraps every\n# example in a rolled-back savepoint and answers outbound HTTP from wire stubs.\nCorretto.configure(App)')+

    '<h2 id="c-corretto-run">Each worker gets its own database</h2><p>A directory contributes its spec files. <code>frappe corretto</code> migrates the spec database once, and Latte then clones one database per worker from it.</p>'+snippet('Terminal','frappe corretto\nfrappe corretto spec/requests/books_spec.cr\nfrappe corretto spec/requests --concurrency=4','bash')+

    '<h2 id="c-corretto-client">A request sends one body</h2><p><code>Corretto.session</code> yields a client and the example’s database connection. The client calls the application’s handler in-process, in the example’s fiber, so requests share the example’s transaction. It has <code>get</code>, <code>post</code>, <code>put</code>, <code>patch</code> and <code>delete</code>, and each returns a <code>Caramel::Response</code> with streamed bodies read to the end.</p>'+snippet('Corretto · request bodies','client.get("/books", params: {"page" => "2"})\nclient.post("/books", params: {"title" => "Dune"})\ncover = Corretto.upload("spec/fixtures/cover.png", "image/png")\nclient.post("/books/1/cover",\n  params: {"caption" => "First edition"},\n  files: {"cover" => cover})\nclient.post("/api/books", json: {title: "Dune"})\nclient.post("/hooks/inbox",\n  body: %({"event_id":"evt_1"}),\n  headers: {"Content-Type" => "application/json"})')+

    '<h2 id="c-corretto-wire">Third parties are faked at the wire</h2><p>Corretto starts a local proxy for the suite and points <code>Caramel::Outbound</code>, the framework’s outbound HTTP client, at it. The proxy reads the real request bytes, records them, and answers from the latest matching stub. A stub matches the absolute URL, and the method when you give one.</p>'+snippet('Corretto · wire stubs','Corretto.stub_wire("https://api.stripe.com/v1/customers", method: "POST")\n  .to_return(status: 200, fixture: "stripe/customer.json")\nCorretto.stub_wire("https://api.stripe.com/v1/charges")\n  .to_return(status: 402, body: %({"error":"card_declined"}),\n    headers: {"Content-Type" => "application/json"})')+
    '<p><code>to_return</code> takes a status, headers, and either <code>body:</code> or <code>fixture:</code>. <code>Corretto.wire_requests</code> lists the requests the proxy received in order.</p>'+
    rules([['A request matching no stub','answers 502 <code>Unstubbed outbound request: METHOD URL</code>, so specs never reach the network'],['Several matching stubs','the latest answers','ok'],['<code>stub_wire</code> with a URL that is not absolute <code>http</code> or <code>https</code>','raises ArgumentError'],['<code>to_return</code> with both <code>body:</code> and <code>fixture:</code>','raises <code>to_return takes fixture: or body:, not both</code>'],['A fixture path','is relative to <code>spec/fixtures/wire/</code>, and its extension sets the default <code>Content-Type</code>','ok'],['A fixture path that starts with <code>/</code> or has an empty, <code>.</code> or <code>..</code> segment','raises ArgumentError'],['A fixture file that does not exist','raises <code>Corretto::Error</code> naming the path'],['A request not sent through <code>Caramel::Outbound</code>','does not pass through the proxy','ok'],['Stubs and recorded requests','reset after each example','ok']])+
    '<h2 id="c-corretto-mocks">Mocking libraries fail compilation</h2><p>Corretto forbids mocks. Assert on requests, rows and rendered HTML instead.</p>'+
    rules([['A mocking library that defines <code>Mocks</code>, <code>Mock</code> or <code>Double</code>, or Spectator’s mocks','fails compilation'],['A <code>.cr</code> file under <code>spec/</code> with a line, outside a <code>#</code> comment, that calls <code>allow(</code>, <code>receive(</code>, <code>double(</code>, <code>instance_double(</code>, <code>mock(</code> or <code>.stub(</code>, the first five not preceded by a word character, <code>.</code>, <code>:</code>, <code>@</code> or <code>$</code>','refuses to run before building: <code>frappe corretto</code> prints <code>PATH:LINE: `allow(` is a mocking API; Corretto forbids mocks</code>, then <code>Specs refused: N mocking call(s) under spec/</code>']])+
    '<h2 id="c-corretto-jobs">Specs start no workers</h2><p>Specs start no Cold Brew workers. A job enqueued during an example waits in the example’s transaction until you drain its queue on the example’s connection. The Cold Brew reference lists the drain rules and the 1,000-job limit.</p>'+snippet('Corretto · after a request enqueues a job','Caramel::ColdBrew.drain_queue!(db, "default").should eq(1)\ndb.should have_row(App::Book, title: "Drained probe", author: "Cold Brew")')+
    rules([['A job enqueued by a request in an example','waits, unrun, until <code>drain_queue!</code> runs it on the example’s <code>db</code>','ok'],['<code>work</code> under <code>CARAMEL_ENV=test</code>','stops with <code>Specs run no workers; drain queues with Caramel::ColdBrew.drain_queue!</code>']])+
    '<button class="c-secondary cursor-interaction" data-page="coldbrew">Drain queues in specs →</button>'+
    prove('c-corretto-example','Run a generated request spec','<p><code>frappe make resource Book title:string</code> writes a request spec that exercises the whole resource. This excerpt keeps its first steps.</p>'+snippet('spec/requests/books_spec.cr · excerpt','require "../spec_helper"\n\ndescribe "Books" do\n  it "creates, reads, updates and deletes through CSRF-protected browser forms" do\n    Corretto.session do |client, db|\n      client.get("/books/new").should render_page("New book")\n      created = client.post("/books", params: {"title" => "Example <title>"})\n      record = App::Book.query.order_by(:id, :desc).first!(db)\n      path = "/books/#{record.id}"\n      created.should have_status(303)\n      created.should redirect_to(path)\n      db.should have_row(App::Book, id: record.id, title: "Example <title>")\n      shown = client.follow_redirect\n      shown.should render_page("Book")\n      shown.should have_html { dl { dd { "Example <title>" } } }\n    end\n  end\nend')+snippet('Terminal · inside the application','frappe corretto spec/requests/books_spec.cr','bash')+passing('Every example passes and the last line is <code>Corretto: 1 of 1 workers passed</code>. The spec proves <code>render_page</code>, <code>have_row</code>, <code>have_html</code> and the 403 for forged requests; the sample title contains <code>&lt;title&gt;</code>, so it also proves that the page escapes user text. The full spec goes on to check JSON, updates, unknown fields and deletion. Caramel’s own <code>scripts/check frappe-project</code> proves the catalog reset, wire isolation, drains and the mock refusal.'))+
