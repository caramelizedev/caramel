  end
end`)+
    '<p>The context map is checked when the program compiles:</p>'+
    rules([['<code>follows: B</code>','draws a dependency edge to B','ok'],['Anything in <code>border B</code> other than the event a <code>whenever</code> names','draws a dependency edge to B','ok'],['A <code>whenever</code> that reacts to one of B’s events','draws an event edge','ok'],['Naming <code>B::</code>, or calling <code>B.price_of</code>, in a context that follows B','allowed anywhere','ok'],['Naming <code>B::</code>, or calling <code>B.price_of</code>, inside <code>border B</code>','allowed; a call draws a dependency edge too','ok'],['A foreign name or call anywhere else','fails compilation'],['An edge to an unknown context','fails compilation'],['A cycle of dependency edges, such as Ordering and Fulfilment following each other','fails compilation'],['Ordering and Fulfilment reacting to each other’s events','allowed','ok']])+
    '<p>For example, a foreign name outside a border stops the build with “Shop::Ordering names Catalogue:: outside a border: move that code into border Catalogue do … end, or declare follows: Catalogue”.</p>'+
    '<p><code>SweetTalk.context_map</code> returns the edges.</p>'+
    '<h2 id="c-sweettalk-subdomains">Mark the core domain</h2><p><code>subdomain:</code> on a context says which part of the business it serves:</p>'+
    lookup(['Value','Use for'],[['<code>:core</code>','what sets the business apart'],['<code>:supporting</code>','what the core needs but could be built by anyone'],['<code>:generic</code>','a problem many businesses share']])+
    '<p>It is optional and changes no rule, because no check can measure how carefully a core is modelled. Every glossary term carries its context’s subdomain, so <code>SweetTalk.glossary.select { |term| term.subdomain == "core" }</code> lists the core domain’s language. Any other value does not compile.</p>'+
    snippet('tea_house.cr · subdomains',`context Pricing, subdomain: :supporting, means: "what each tea costs" do
  # …
end

context Billing, follows: Pricing, subdomain: :core,
  means: "charging members for their teas" do
  # …
end`)+
    '<h2 id="c-sweettalk-published">Publish a language</h2><p>An upstream context can promise less than all of its model. <code>publishes</code> lists the types and services other contexts may name: its published language, and, in one binary, its open-host service. Naming a type publishes what it contains, so publishing <code>Tea</code> would publish <code>Tea::Id</code> and its commands too. <code>publishes</code> comes after the names it lists.</p>'+
    snippet('tea_house.cr · a published language',`context Pricing, subdomain: :supporting, means: "what each tea costs" do
  value Cents, Int64, at_least: 0, means: "an amount of money"

  aggregate Tea, means: "one tea and its price" do
    # …
  end

  service price_of(tea : Tea::Id), returns: Cents, means: "what one tea costs today" do
    Tea.find(tea).price
  end

  publishes Cents, Tea::Id, price_of
end

context Billing, follows: Pricing, subdomain: :core,
  means: "charging members for their teas" do
  service bill(tea : Pricing::Tea::Id), returns: Bill::Id,
    means: "bill a member for one tea at today's price" do
    Bill.open(Pricing.price_of(tea)).id
  end
end`)+
    rules([['A context names a type or service the publisher does not list, whether it follows the publisher or reads it in a border','fails compilation at the line that names it'],['<code>publishes</code> lists a name the context does not declare','fails compilation'],['The publisher is declared after the context that names it','fails compilation; the program’s checks find the name, without a line'],['A context reacts to an event of a publishing context','allowed: events stay open to every context that may name them, because a follower reacts to them and a reaction depends on an event’s fields','ok'],['A context does not publish','keeps the rules above','ok']])+
    '<p>For example, “TeaHouse::Insurance names Pricing::Tea, which Pricing does not publish; it publishes Cents, Tea::Id, price_of: use one of those, or publish Tea in Pricing”.</p>'+
    '<h2 id="c-sweettalk-outside">Translate outside systems at a border</h2><p>A payment gateway or a carrier has a model of its own. <code>border Cards, outside: "…"</code> declares a module <code>Cards</code> in the context: the only code in it that may name <code>Caramel::Outbound</code> or <code>HTTP::Client</code>, and the place that turns the system’s answers into the context’s values and refusals.</p>'+
    '<p>The check reads the code as written, as the <code>Rows::</code> and <code>Other::</code> checks do, so an alias or a method defined outside the context escapes it. <code>outside:</code> is the line its glossary entry shows, and the context map gains an <code>outside</code> edge.</p>'+
    '<p>An outside system emits no events; a webhook arrives through an action, which runs a command.</p>'+
    '<p>Call the system from a <code>whenever</code>, after the command that needs it commits, so that a slow answer never holds an aggregate’s row lock.</p>'+
    '<p>Specs fake it at the wire with <code>Corretto.stub_wire</code>, as the Corretto guide’s “Fake third parties at the wire” shows.</p>'+
    rules([['<code>Caramel::Outbound</code> or <code>HTTP::Client</code> named outside a <code>border …, outside:</code>','fails compilation'],['An <code>outside:</code> border named like a context','fails compilation'],['An <code>outside:</code> border holding a <code>whenever</code>','fails compilation']])+
    snippet('tea_house.cr · an outside system',`whenever Bill::Opened do |opened|
  reference = Cards.charge(opened.bill_id.raw, opened.amount)
  Bill.find(opened.bill_id).settle reference
end

compensate Bill::Opened do |opened, refusal|
  Bill.find(opened.bill_id).decline
end

border Cards, outside: "the card gateway we charge through" do
  CHARGES = "https://cards.example/v1/charges"

  def self.charge(bill : Int64, amount : Pricing::Cents) : Reference
    headers = HTTP::Headers{"Content-Type" => "application/json"}
    body = {bill: bill, amount: amount.raw}.to_json
    response = Caramel::Outbound.post(CHARGES, headers, body)
    case response.status_code
    when 200 then Reference.new(JSON.parse(response.body)["id"].as_s)
    when 402 then raise SweetTalk::Refusal.new("The card was declined.")
    else          raise "Cards answered #{response.status_code}: #{response.body}"
    end
  end
end`)+
    kicker('Stage 3 · Model')+'<h2 id="c-sweettalk-values">Name the values</h2>'+
    snippet('tea_shop.cr · values',`value Tins, Int32, at_least: 0, means: "a count of tins on the shelf"
value Cents, Int64, at_least: 0, means: "an amount of money"
value Quantity, Int32, within: 1..10, means: "tins of one tea in one order"`)+
    '<p>A value wraps an <code>Int32</code>, an <code>Int64</code> or a <code>String</code>, or has parts. An integer value takes <code>at_least:</code>, <code>at_most:</code>, <code>within:</code> and <code>times:</code>. It is validated when it is built and by every arithmetic result. <code>+</code> and <code>-</code> take the same value or an integer, and <code>*</code> takes an integer. <code>times: Quantity</code> on <code>Cents</code> would let <code>*</code> take a quantity. A value is stored as a column of its raw type and rebuilt, and so validated again, when it is loaded.</p><p>PostgreSQL checks the bounds too. Every column that stores <code>Tins</code> gets a <code>CHECK</code> constraint, such as <code>check_catalogue_teas_stock</code>, so a write that goes around SweetTalk, through SQL or another service, is refused when it is written. Bounds are therefore integer literals. <code>database_check: false</code> keeps a value’s bounds in Crystal only, where they may name a constant.</p>'+
    rules([['A build or arithmetic result outside the bounds, such as <code>@stock -= tins</code> below zero','refuses with “Tins must be at least 0”'],['<code>+</code> or <code>-</code> of tins and cents','fails compilation'],['<code>*</code> of <code>Cents</code> by a <code>Quantity</code> without <code>times: Quantity</code>','fails compilation']])+
    '<h2 id="c-sweettalk-richer-values">Name strings and values with parts</h2>'+
    snippet('tea_shop.cr · string and composite values',`value Email, String, matches: /\\A[^@\\s]+@[^@\\s]+\\z/, length: 3..254,
  means: "an address we can write to"
value Postcode, String, matches: /\\A[A-Z0-9][A-Z0-9 ]{1,8}[A-Z0-9]\\z/,
  means: "a postal code, in capitals"

value Address, means: "where a parcel goes" do
  part street : String
  part city : String
  part postcode : Postcode
  never "An address needs a street and a city." { street.blank? || city.blank? }
end`)+
    '<p>A string value takes <code>matches:</code> and <code>length:</code>, and has no arithmetic. It is stored as a text column. Its pattern is checked in Crystal only, because PostgreSQL reads regular expressions differently.</p>'+
    rules([['<code>Email.new("ada")</code>, a string that does not match the pattern','refuses with “Email must match /\\A[^@\\s]+@[^@\\s]+\\z/” before anything is written'],['A write around SweetTalk with a length outside 3..254','refuses, by the CHECK <code>check_ordering_orders_receipt_to_length_3_254</code>']])+
    '<p>A value with parts is built with one keyword per part, as in <code>Address.new(street: "1 Leaf Lane", city: "Camellia", postcode: Postcode.new("CA1 1TE"))</code>. It checks its <code>never</code> and <code>always</code> when it is built, and equals another address with the same parts. A part is a column type or a value that wraps one. <code>has deliver_to : Address</code> stores one column per part: <code>deliver_to_street</code>, <code>deliver_to_city</code> and <code>deliver_to_postcode</code>. A part’s value brings its constraints to its column.</p>'+
    '<h2 id="c-sweettalk-aggregates">Declare aggregates and entities</h2><p>An aggregate is a root with an id, such as <code>Order::Id</code>, and a repository: <code>find</code>, <code>find?</code>, <code>all</code>, and <code>create</code> unless it has a factory. An entity lives inside one aggregate and is saved with it. Given to another aggregate’s <code>create</code> or factory, it is stored again as that aggregate’s own row, and the first aggregate keeps its own.</p>'+
    snippet('tea_shop.cr · an aggregate',`aggregate Order, means: "what a member buys at one checkout" do
  has member : Account
  has receipt_to : Email
  has deliver_to : Address
  has lines : Array(Line)
  has late_parcel : Bool = false
  moves open >> placed >> shipped, open >> cancelled, placed >> cancelled
  never "An order needs at least one tea." { placed? && lines.empty? }

  entity Line, means: "one tea in an order, its price when added, and how many tins" do
    has tea : Catalogue::Tea
    has price : Catalogue::Cents
    has quantity : Quantity
    the cost : Catalogue::Cents = price * quantity.to_i
  end

  the total : Catalogue::Cents = lines.sum(&.cost)

  event Placed, lines : Array(Line), deliver_to : Address, means: "a member checked out"
  # …

  to add(tea : Catalogue::Tea, quantity : Quantity) do
    refuse "Teas can be added only while the order is open." unless open?
    refuse "#{tea.name} is already in this order." if lines.any? { |line| line.tea == tea.id }
    @lines << Line.new(tea, tea.price, quantity)
  end

  to place do
    placed!
    emit Placed, lines: lines, deliver_to: deliver_to
  end
end`)+
    '<p>Each aggregate, entity, projection and process is a SugarORM schema with its own changeset, and every write goes through that changeset. <code>has</code> chooses the storage from the type:</p>'+
    lookup(['<code>has</code> type','Stored as'],[['<code>String</code>, <code>Int32</code>, <code>Int64</code>, <code>Bool</code>, <code>Float64</code> or <code>Time</code>','A column'],['A value that wraps a number or a string','A column of its raw type'],['A value with parts','One column per part'],['Another aggregate','A foreign key; its getter returns that aggregate’s id: <code>line.tea</code> is a <code>Catalogue::Tea::Id</code>. Load the tea with <code>Catalogue::Tea.find</code> when you need it.'],['One of the application’s own SugarORM schemas, as in <code>has member : Account</code>','A foreign key; its getter returns a <code>SweetTalk::RecordId(Account)</code>, and <code>order.member.load</code> reads the account'],['An <code>Array</code> of the aggregate’s own entity','A child table, loaded with <code>preload</code>']])+
    '<p><code>has name : Type = expression</code> gives an attribute a default, as in <code>has held : Tins = Tins.zero</code>. The column gets a SQL default when the expression is a literal, as in <code>has late_parcel : Bool = false</code>.</p>'+
    rules([['A <code>has</code> with any other type','fails compilation'],['A <code>has</code> of a <code>Hash</code>','fails compilation, with a pointer to the entity form'],['A context that names <code>Rows</code>','fails compilation']])+
    '<p>The schemas live in each context’s <code>Rows</code> module, so every change goes through a command. Table names take English plurals. The tea shop’s tables are <code>catalogue_teas</code>, <code>ordering_orders</code>, <code>ordering_order_lines</code>, <code>ordering_sales</code>, <code>ordering_holds</code>, <code>fulfilment_parcels</code> and <code>fulfilment_parcel_packings</code>. They are ordinary schemas, so <code>frappe db diff</code> derives their migrations.</p>'+
    '<h2 id="c-sweettalk-lifecycle">Guard the lifecycle and the invariants</h2><p><code>moves</code> lists one or more chains of states, and the first state is the initial one. <code>moves open &gt;&gt; placed &gt;&gt; shipped, open &gt;&gt; cancelled, placed &gt;&gt; cancelled</code> stores the state and adds <code>open?</code>, <code>placed?</code>, <code>shipped?</code> and <code>cancelled?</code>, and the private movers <code>placed!</code>, <code>shipped!</code> and <code>cancelled!</code>. <code>the</code> is a derived value, computed on every read and never stored.</p>'+
    rules([['A mover such as <code>shipped!</code> is called when the current state does not come just before it in a chain','refuses with “Order cannot become shipped while cancelled”'],['A command leaves a <code>never</code> condition true','refuses'],['A command leaves an <code>always</code> condition false','refuses']])+
    '<p>PostgreSQL holds the lifecycle too. The <code>state</code> column stores each state as <code>moves</code> spells it, such as <code>out_for_delivery</code>, and a <code>CHECK</code> constraint such as <code>check_ordering_orders_state_ef9524ce</code> refuses any other text, so a write around SweetTalk cannot leave a row no state names. The eight hex digits change with the list of states, so <code>frappe db diff</code> replaces the constraint when you add or remove one, and <code>frappe migrate</code> stops, naming the constraint, while a row still holds a state you removed.</p>'+
    '<h2 id="c-sweettalk-commands">Change state with commands</h2><p><code>to verb(arg : Type) do … end</code> is a command, and it runs as one transaction:</p><ol><li>load the aggregate with its row locked through SugarORM’s <code>lock</code>, so commands on one aggregate run one after another and the body sees the last committed state;</li><li>run the body;</li><li>check every <code>never</code> and <code>always</code>;</li><li>save the root through its changeset, then its entities;</li><li>dispatch the queued events.</li></ol>'+
    rules([['<code>refuse "message"</code>','raises <code>SweetTalk::Refusal</code>; the transaction rolls back and the aggregate reloads what is stored, so neither the table nor the object keeps half a change'],['Another aggregate’s command, a <code>create</code> or a factory runs while a command runs','raises <code>SweetTalk::Boundary</code> and rolls the command back']])+
    '<p><code>create</code> and a factory check the invariants before they insert. Each command, factory and service is a <code>domain</code> span in its trace, named like <code>Ordering::Order#place</code>; a refused one is marked failed.</p>'+
    '<p>A command changes one aggregate. A command may read another aggregate it is given: <code>add</code> copies the tea’s price into the line, so repricing the tea later does not change the order.</p>'+
    '<h2 id="c-sweettalk-factories">Make aggregates with factories</h2><p><code>factory verb(args) do … end</code> makes an aggregate. Arguments named like attributes set them, and the body runs as the aggregate’s first change and may <code>emit</code>. The aggregate is checked, saved and its events dispatched in one transaction, and each event names the new aggregate’s id.</p>'+
    snippet('tea_shop.cr · a factory',`factory open(member : Account, receipt_to : Email, deliver_to : Address) do
  emit Opened, receipt_to: receipt_to
end`)+
    '<p><code>Ordering::Order.open(account, Email.new("ada@example.com"), address)</code> opens an order.</p>'+
    rules([['A factory leaves an attribute unset and no default covers it','fails compilation'],['A factory named like a repository method, such as <code>factory find</code>','fails compilation'],['An aggregate with a factory','has no <code>create</code>, so every order starts with <code>Opened</code>','ok']])+
    kicker('Stage 4 · Query and decide')+'<h2 id="c-sweettalk-queries">Find, count and retire aggregates</h2>'+
    snippet('tea_shop.cr · queries and a removal',`finds placed_for(member : Account), where: {member: member, state: :placed}
finds newest_for(member : Account, count : Int32), where: {member: member},
  order: {id: :desc}, first: count
counts placed_count_for(member : Account), where: {member: member, state: :placed}

to forget do
  refuse "Only a cancelled order can be forgotten." unless cancelled?
  remove
end`)+
    '<p>The aggregate is its own repository: <code>find</code>, <code>find?</code>, <code>all</code>, <code>create</code> or its factory, and the queries it declares. <code>finds</code> defines a query that returns aggregates.</p>'+
    lookup(['Option','Meaning'],[['<code>where:</code>','Keeps the aggregates whose columns equal the expressions: a list matches any of its members and a range its span.'],['<code>state:</code>','Takes a state or a list of states.'],['<code>satisfying:</code>','Adds a specification.'],['<code>order:</code>','<code>order: {placed_on: :desc}</code> sorts by <code>id</code> or by attributes stored in one column, and id breaks ties.'],['<code>first:</code>','Returns at most that many.'],['<code>counts</code>','Takes <code>where:</code> and <code>satisfying:</code> and returns how many, in one statement, without loading them.']])+
    '<p>Each part is optional, but a <code>finds</code> gives at least one.</p><p>A context checks every query when it closes, whether or not anything calls it.</p>'+
    '<p>When a query needs more than that, give <code>finds</code> a block instead. It gets the aggregate’s live rows, with removed ones and other tenants’ already left out, and narrows them with SugarORM’s <code>where</code>, <code>where_null</code>, <code>order_by</code>, <code>limit</code> and <code>offset</code>; the aggregates are built from what it returns, so a caller cannot tell the two kinds apart. It is the one place a column name or a SQL fragment appears in a domain, so keep it for what <code>where:</code> cannot say.</p>'+
    snippet('tea_shop.cr · a query with a block',`finds holding(tea : Catalogue::Tea::Id) do |orders|
  orders.where("id IN (SELECT order_id FROM ordering_order_lines WHERE tea_id = ?)", tea.raw)
end`)+
    '<p><code>find</code>, <code>find?</code>, <code>all</code> and every <code>finds</code> read one statement per table: the roots, then each list of entities through <code>preload</code>. So <code>placed_for</code> runs two queries however many orders it returns. Code outside the domain, such as an action, reads through these queries too, and does not name <code>Rows</code>.</p><p><code>remove</code> in a command retires the aggregate. Its row stays with <code>removed_at</code> set, so the lines and projection rows that name it stay valid. <code>find</code>, <code>find?</code>, <code>all</code>, every query and the command’s row lock skip it.</p>'+
    rules([['A query names a key, state or order the aggregate lacks','fails compilation'],['A query filters on a list of entities','fails compilation'],['A query passes a value of the wrong type','fails compilation'],['A query passes an argument <code>finds</code> does not take','fails compilation'],['A <code>finds</code> block does more than narrow its rows: it counts, locks, deletes or names <code>Rows</code> or SugarORM','fails compilation'],['<code>find</code> of a removed or missing aggregate','raises “There is no Order 7.”']])+
    '<h2 id="c-sweettalk-specifications">Name rules with specifications</h2><p>A specification is a rule an aggregate satisfies or not, stated once and read twice: by Crystal on an aggregate in memory, and by PostgreSQL in a query. It lives in the context, after its aggregate, and joins the glossary.</p>'+
    snippet('tea_shop.cr · a specification',`specification Astray, on: Order, where: {state: :cancelled, late_parcel: true},
  means: "a cancelled order whose parcel left anyway"

to forget do
  refuse "Only a cancelled order can be forgotten." unless cancelled?
  refuse "An order whose parcel left cannot be forgotten." if astray?
  remove
end`)+
    '<p><code>Astray</code> is read in four ways:</p>'+
    lookup(['Call','Reads the rule'],[['<code>order.astray?</code>','In Crystal, for <code>never</code>, <code>always</code>, guards and methods'],['<code>Ordering::Astray.satisfied_by?(order)</code>','In Crystal, on an aggregate in memory'],['<code>Order.all(satisfying: Astray)</code>','The same rule in one query'],['<code>satisfying: Astray</code> on a <code>finds</code> or a <code>counts</code>','The same rule in one query']])+
    '<p><code>where:</code> takes what <code>finds</code> takes, or earlier specifications on the same aggregate joined by <code>&amp;</code>, <code>|</code> and <code>!</code>, as in <code>where: Dispatchable &amp; !Astray</code>. In PostgreSQL <code>!</code> reads as <code>IS NOT TRUE</code>, so an order whose column is NULL fails a rule and passes its negation in both.</p><p>A rule PostgreSQL cannot read stays a <code>never</code>, an <code>always</code> or a method: one over a list of entities, such as <code>lines.empty?</code>, or over a derived value made with <code>the</code>. A specification takes no arguments; a <code>finds</code> takes them, and adds a specification with <code>satisfying:</code>.</p>'+
    '<h2 id="c-sweettalk-services">Name operations with services</h2><p>A service is an operation that belongs to no one aggregate. It lives in a context, carries <code>means:</code> and joins the glossary.</p>'+
    snippet('tea_shop.cr · a service',`service requote(order : Order::Id), returns: Catalogue::Cents,
  means: "what an order would cost at today's prices" do
  Order.find(order).lines.sum do |line|
    Catalogue::Tea.find(line.tea).price * line.quantity.to_i
  end
end`)+
    '<p>Call it on its context: <code>Ordering.requote(order.id)</code>. To change two aggregates, emit an event and react to it in a <code>whenever</code>.</p>'+
    rules([['A service changes a second aggregate','raises <code>SweetTalk::Boundary</code> and rolls both back'],['A <code>service</code> anywhere but a context','fails compilation'],['<code>returns:</code> omitted','defaults to <code>Nil</code>','ok']])+
    kicker('Stage 5 · React')+'<h2 id="c-sweettalk-events">Follow events with policies</h2><p><code>event</code> declares one of the aggregate’s events, and <code>emit</code> queues one from a command with its facts; an aggregate emits only its own. An event holds its subject’s id (<code>placed.order_id</code>) and its fields as they were when it was emitted: column types, values, ids and an <code>Array</code> of the aggregate’s entity. No getter on an event loads an aggregate, so a handler reads what happened, not what is true now.</p>'+
    '<p><code>whenever</code> in a context or a border is a policy, run as a Cold Brew job. The command enqueues one job per policy in its own transaction, so a job is never lost and never sent for a rolled-back change. A handler changes one aggregate too. With <code>each:</code> it runs once per element of a list in the event, each in its own job: the <code>Sales</code> projection below counts one order line per job.</p>'+
    '<ul><li>A job carries the event as JSON.</li><li>A job is named after its owner (a context and its border, a projection or a process) and the event, never after a line, because <code>caramel_jobs</code> stores the name.</li><li>The command also publishes <code>{"subject": id}</code> on <code>sweettalk.CONTEXT.AGGREGATE.EVENT</code> for live pages, delivered on commit and at most once.</li></ul>'+
    rules([['One line’s job fails','the other lines’ jobs still run','ok'],['Two <code>whenever</code> blocks for one event in one owner','fails compilation'],['A rename whose old job name another job has or claims','fails compilation'],['A refusal, or a handler that changes a second aggregate','fails its job at the first attempt, unless a <code>compensate</code> answers the refusal; the command that emitted the event stays committed'],['Any other handler error','follows Cold Brew’s retry rules','ok']])+
    '<h2 id="c-sweettalk-metadata">Record who acted</h2><p>Every event records <code>event_id</code>, a UUID, <code>occurred_at</code>, <code>actor</code>, a <code>String?</code>, <code>cause_id</code>, the event whose handler emitted it, and <code>flow_id</code>, shared by every event one command leads to: the request’s trace id when it ran in one. Its jobs carry all five. No command takes an actor: wrap the call in <code>SweetTalk.acting</code> instead.</p>'+
    snippet('Inside an action · order is a loaded Ordering::Order',`SweetTalk.acting("member:7") { order.place }`)+
    '<p>Each policy, compensation and process step runs as its event’s actor, so the <code>Cancelled</code> event a refused hold leads to still names <code>member:7</code>. A deadline acts as <code>deadline Hold.lapse</code>.</p><p>A field may be nilable. <code>cancel</code> without a reason sends <code>reason</code> as JSON null:</p>'+
    snippet('tea_shop.cr · a nilable fact',`event Cancelled, lines : Array(Line), reason : String?,
  means: "the order was given up, and why"

to cancel(reason : String? = nil) do
  unless cancelled?
    cancelled!
    emit Cancelled, lines: lines, reason: reason
  end
end`)+
    rules([['An event field named <code>event_id</code>, <code>occurred_at</code>, <code>actor</code>, <code>cause_id</code>, <code>flow_id</code> or like the subject’s id','fails compilation'],['An event field typed as a union of other types, such as <code>String | Int32</code>','fails compilation']])+
    '<p>A retried job carries the same <code>event_id</code>. A handler that sends mail or calls an API can key that side effect on it, so a retry can tell the side effect already happened.</p>'+
    '<h2 id="c-sweettalk-projections">Keep read models</h2><p>A projection is a table with one row per key. Inside a <code>whenever</code> block, <code>Sales[tea]</code> reads the row locked and saves it when the handler returns. When the row is missing, an upsert on the key’s unique index inserts it with its defaults, so two handlers that insert one key at once keep one row.</p>'+
    snippet('tea_shop.cr · a projection',`projection Sales, means: "tins sold of one tea" do
  key tea : Catalogue::Tea
  has sold : Int32 = 0

  whenever Order::Placed, each: :lines do |placed, line|
    Sales[line.tea].sold += line.quantity.to_i
  end
end`)+
    '<p>A projection declares queries as an aggregate does. <code>finds</code> takes <code>where:</code>, <code>order:</code> and <code>first:</code>, or a block that narrows its rows, and <code>counts</code> takes <code>where:</code>. The keys are the projection’s attributes, its key included: <code>where: {tea: tea}</code> compares the tea’s id. A projection has no lifecycle and no specifications, so it takes neither <code>state:</code> nor <code>satisfying:</code>, and every row counts, since a projection removes none.</p>'+
    snippet('tea_shop.cr · projection queries',`finds best_sellers(count : Int32), order: {sold: :desc}, first: count
counts sold_any, where: {sold: 1..}`)+
    '<p><code>Sales.best_sellers(10)</code> reads the ten best-selling teas in one statement, and <code>Sales.sold_any</code> counts the teas that sold at least one tin without loading them.</p>'+
    '<h2 id="c-sweettalk-processes">Run processes with deadlines and compensation</h2><p>A process is a workflow across aggregates. It keeps one row per <code>key</code>, with attributes, a lifecycle and deadlines, in a table such as <code>ordering_holds</code>. <code>Hold</code> holds the tins of one tea for one placed order until the parcel leaves, and gives them back when the order is cancelled or the parcel is late.</p>'+
    snippet('tea_shop.cr · a process',`process Hold, means: "tins of one tea held on the shelf for one placed order" do
  key slot : Slot
  has tins : Int32 = 0
  moves waiting >> holding >> taken, waiting >> refused, waiting >> released,
    holding >> released

  whenever Order::Placed, each: :lines,
    key: Slot.new(order: placed.order_id.raw, tea: line.tea.raw) do |placed, line|
    if waiting?
      Catalogue::Tea.find(line.tea).hold Catalogue::Tins.new(line.quantity.to_i)
      @tins = line.quantity.to_i
      holding!
      arm lapse
    end
  end

  compensate Order::Placed do |placed, line, refusal|
    refused!
    Order.find(placed.order_id).cancel refusal.message
  end

  # whenever Order::Cancelled releases the tins; Fulfilment::Parcel::Dispatched takes them

  deadline lapse, after: 7.days do
    Order.find(Order::Id.new(slot.order)).cancel "not dispatched within 7 days" if holding?
  end
end`)+
    lookup(['Word','What it does'],[['<code>whenever Event, key: expression</code>','A step. Its job inserts the row when it is missing, locks it and runs the block on it. A step changes at most one aggregate; its own row does not count. Attributes other than the key are nilable or have a literal default, because a row starts from its key alone.'],['<code>compensate</code>','Runs when its <code>whenever</code> is refused. The handler’s work has already rolled back; the compensation gets the same arguments and the refusal, and runs in its own transaction. Here a tea that cannot be held cancels its order with “Only 1 tins of Gyokuro free.”. A refusal in the compensation fails the job. A context or a border may compensate its own <code>whenever</code> too: Ordering’s border notes a parcel that left after its order was cancelled.'],['<code>arm lapse</code>, <code>disarm lapse</code>','<code>arm lapse</code> sets <code>lapse_due</code> and enqueues a job for that time, and <code>disarm lapse</code> clears it. Cold Brew cannot cancel a job, so every arm and disarm counts up an arming counter: a stale deadline job finds a newer arming and does nothing.'],['<code>arm lapse, after: 2.days</code>','Arms the deadline for another span than its own.']])+
    '<p>A process may react to another context’s events outside a border. <code>Hold</code> follows <code>Fulfilment::Parcel::Dispatched</code>, which draws an event edge from Ordering to Fulfilment.</p>'+
    kicker('Stage 6 · Operate')+'<h2 id="c-sweettalk-renames">Rename without moving data</h2><p>A name SweetTalk stores, such as a table, a channel or a job name, comes from a domain name. When the model finds a better word, <code>renamed_from:</code> keeps the table and the channel the old name used, so no data moves.</p>'+
    snippet('tea_shop.cr · Tea renamed to Blend',`aggregate Blend, renamed_from: Tea, means: "one tea we sell" do
  # still stored in catalogue_teas, still announced on sweettalk.catalogue.tea.*
end`)+
    '<p>A job’s name follows its owner and the event’s path as written. When a rename changes it, SweetTalk declares Cold Brew’s <code>renamed_from</code> on the job with the old name, so jobs queued before the rename keep running.</p>'+
    '<p>These are the names SweetTalk stores, which a deployed application depends on:</p>'+
    lookup(['Stored name','Form'],[['Tables','<code>ordering_orders</code> and <code>ordering_order_lines</code>, with their <code>check_…</code>, <code>index_…</code> and <code>fk_…</code> names'],['Job class names','<code>TeaShop::Ordering::Sales::WhenOrderPlaced</code> and <code>TeaShop::Ordering::Hold::LapseDeadline</code>'],['Channels','<code>sweettalk.&lt;context&gt;.&lt;aggregate&gt;.&lt;event&gt;</code>, behind a tenant’s <code>t&lt;id&gt;:</code> prefix'],['Event metadata keys','<code>id</code>, <code>at</code>, <code>by</code>, <code>cause</code> and <code>flow</code>']])+
    '<p><code>renamed_from:</code> keeps a table, a channel and queued jobs across a rename. While SweetTalk is experimental, a minor release may still change any of these names.</p>'+
    '<h2 id="c-sweettalk-tenancy">Share a domain between tenants</h2><p>In a multi-tenant application, name the tenant model before the first context. It is the model the routes’ <code>tenant</code> block names, and SugarORM refuses another.</p>'+
    snippet('tenant_shop.cr · a domain shared by tenants',`module TenantShop
  include SweetTalk

  tenant Account

  context Catalogue, central: true, means: "the teas every tenant sells" do
    aggregate Tea, means: "one tea on every tenant's shelf" do
      has name : String
    end
  end

  context Ordering, follows: Catalogue, means: "choosing teas and checking out" do
    # aggregates, projections and processes that belong to one tenant
  end
end`)+
    '<p>Every context belongs to the tenant unless it says <code>central: true</code>. Its aggregates, entities, projections and processes get a column named after the model, <code>account_id</code> here, and SugarORM scopes their reads, locks, keys and upserts by the bound tenant, so a projection or a process keeps one row per tenant per key. A policy, projection or process step runs in the tenant its event was emitted in, a deadline in the tenant that armed it, and a notification goes out on the tenant’s channel. A central context’s rows are shared by every tenant.</p>'+
    '<p>A tenanted aggregate may reference a central one, as an order line names a shared tea.</p>'+
    rules([['A tenanted aggregate references a central one','allowed','ok'],['A domain without <code>tenant</code> in a program that requires <code>caramel/tenancy</code>, or <code>tenant</code> without that require, after a context, twice, or naming anything but a SugarORM schema','fails compilation'],['<code>central:</code> with anything but <code>true</code>, or without <code>caramel/tenancy</code>','fails compilation'],['A <code>has</code> in a central context that points at a tenanted aggregate or a tenanted schema of the application, whose rows every tenant would then see','fails compilation'],['A <code>whenever</code> in a tenanted context for a central context’s event, which carries no tenant (a central context may follow a tenanted one’s events, and its handler runs in the event’s tenant)','fails compilation'],['An event channel over 42 characters, which leaves 21 for a tenant’s <code>t&lt;id&gt;:</code> prefix, or a tenant index name over PostgreSQL’s 63 bytes','fails compilation'],['A <code>has</code> that would store <code>account_id</code>, or an entity of an aggregate named like the tenant model','fails compilation']])+
    '<p>A domain that already holds data follows Add tenancy to existing data in the multi-tenancy guide; <code>frappe db diff</code> names every SweetTalk table it halts on. <button class="c-secondary cursor-interaction" data-page="tenancy">Read the multi-tenancy guide</button></p>'+

mpilation'],['A query on an unknown attribute, state or order, with an argument <code>finds</code> does not take, or whose block does more than narrow its rows','fails compilation'],['A specification on an unknown attribute or state, on a list of entities or a derived value, with a block, outside a context, or whose predicate the aggregate already has','fails compilation'],['A <code>compensate</code> without its <code>whenever</code>','fails compilation'],['A <code>deadline</code> outside a process','fails compilation'],['An event field named like its metadata','fails compilation'],['With <code>caramel/tenancy</code>, the mistakes listed under <a href="#c-sweettalk-tenancy">Share a domain between tenants</a>','fails compilation']])+

    '<h2 id="c-practices-home">Give every change its home</h2><p>Each kind of change has one place. Routes live in <code>config/routes.cr</code>, actions and their contracts in <code>app/actions/</code>, stored shapes in <code>app/models/</code>, write rules in <code>app/changesets/</code>, and a SweetTalk domain in <code>app/domain/</code>. HTML lives in <code>app/views/</code>, background work in <code>app/jobs/</code>, translations in <code>app/locales/</code>, and request specs in <code>spec/requests/</code>.</p><p>Your application’s files are the extension point. When the public API cannot do what a task needs, name the gap instead of patching framework code.</p><button class="c-secondary cursor-interaction" data-page="map">Find the file for a change →</button>'+

    contract([['Release','0.15.0'],['Needs','A generated application and Latte’s PostgreSQL'],['Covers','Spec helper, request client, matchers, wire stubs, job drains'],['Proved by','<code>frappe corretto</code>']])+

    '<h2 id="c-corretto-setup">Specs run only under frappe corretto</h2><p>A generated application has a spec helper that requires <code>caramel/corretto</code> and calls <code>Corretto.configure(App)</code> once. The application is built on the spec database, with the origin and secret that <code>frappe corretto</code> supplies.</p>'+snippet('spec/spec_helper.cr','require "spec"\nrequire "caramel/corretto"\nrequire "../config/application"\n\nCorretto.configure(App)')+

    rules([['Plain <code>crystal spec</code>','stops with <code>Run these specs with frappe corretto</code>'],['A database that is not this worker’s own spec database','stops, so development data is never touched'],['Your development <code>.env</code>','never reaches a worker','ok'],['<code>.env.test</code> that is not a regular file, or is over 64 KiB','refuses'],['<code>.env.test</code> that sets <code>APP_ORIGIN</code>, <code>APP_SECRET</code>, <code>DATABASE_URL</code>, or a key starting <code>SPEC_</code>, <code>CARAMEL_</code> or <code>CORRETTO_</code>','refuses']])+
    '<h2 id="c-corretto-run">Each worker gets its own database</h2><p>A directory contributes its spec files. <code>frappe corretto</code> migrates the spec database once, and Latte then clones one database per worker from it.</p>'+snippet('Terminal','frappe corretto\nfrappe corretto spec/requests/books_spec.cr\nfrappe corretto spec/requests --concurrency=4','bash')+
    expect('Spec files are dealt round-robin to the workers. Each worker runs its own compiled spec binary and prefixes its output lines, such as <code>[w1]</code>. The spec database is migrated once, and the worker databases are dropped afterwards.')+
    '<p>Every example runs on one connection inside a transaction and a savepoint. Both are rolled back when the example ends, including the writes its requests and drained jobs made.</p>'+
    rules([['No paths','runs every <code>*_spec.cr</code> file under <code>spec</code>','ok'],['A path outside the project','refuses'],['<code>--concurrency</code> outside 1 to 8','refuses'],['<code>--concurrency</code> omitted','uses 1 worker','ok'],['An example that changes the schema outside its transaction','warns and recreates the worker’s database from the migrated template'],['An example tagged <code>catalog</code>','runs unwrapped on a migration-role connection, and the database is always reset afterwards','ok'],['File writes','are not rolled back; point your application’s storage at <code>Corretto.tmpdir</code>, a private directory removed after each example','ok']])+
    '<h2 id="c-corretto-client">A request sends one body</h2><p><code>Corretto.session</code> yields a client and the example’s database connection. The client calls the application’s handler in-process, in the example’s fiber, so requests share the example’s transaction. It has <code>get</code>, <code>post</code>, <code>put</code>, <code>patch</code> and <code>delete</code>, and each returns a <code>Caramel::Response</code> with streamed bodies read to the end.</p>'+snippet('Corretto · request bodies','client.get("/books", params: {"page" => "2"})\nclient.post("/books", params: {"title" => "Dune"})\ncover = Corretto.upload("spec/fixtures/cover.png", "image/png")\nclient.post("/books/1/cover",\n  params: {"caption" => "First edition"},\n  files: {"cover" => cover})\nclient.post("/api/books", json: {title: "Dune"})\nclient.post("/hooks/inbox",\n  body: %({"event_id":"evt_1"}),\n  headers: {"Content-Type" => "application/json"})')+
    '<p>A request sends one body: URL-encoded <code>params:</code>, <code>params:</code> with <code>files:</code> as multipart, <code>json:</code> with any value, or raw <code>body:</code> text or bytes typed by your <code>Content-Type</code> header.</p>'+
    rules([['Any other mix of <code>params:</code>, <code>json:</code>, <code>body:</code> and <code>files:</code>','raises <code>Send one body: params: (with files: for multipart), json: or body:</code>'],['Any body besides <code>params:</code> on GET','raises'],['<code>params:</code> on GET','becomes the query','ok'],['An Array value in <code>params:</code>','sends one key per item','ok'],['A path that is not local, such as <code>/books</code>','raises']])+
    '<h2 id="c-corretto-browser">The client behaves like a browser</h2><p>The client acts as a browser on your application’s origin. It sends <code>Host</code> on every request and keeps a cookie jar from <code>Set-Cookie</code>.</p>'+
    rules([['post, put, patch, delete','adds the exact <code>Origin</code> and an <code>X-CSRF-Token</code> a page would submit','ok'],['Headers you pass','override the automatic ones, which is how you test a forged request','ok'],['A forged <code>X-CSRF-Token</code> or a foreign <code>Origin</code>','answers 403'],['<code>client.follow_redirect</code> after a response with no <code>HX-Location</code> and no 3xx <code>Location</code>','raises']])+
    snippet('Corretto · forged requests','sample = {"title" => "Dune"}\nforged = {"X-CSRF-Token" => "forged"}\nforeign = {"Origin" => "https://attacker.example"}\nclient.post("/books", headers: forged, params: sample).should have_status(403)\nclient.post("/books", headers: foreign, params: sample).should have_status(403)')+
    '<p><code>client.follow_redirect</code> sends a GET to the last response’s <code>HX-Location</code>, or to its <code>Location</code> when the status is 3xx. <code>client.sign_in(user)</code> writes <code>user.id</code> as <code>user_id</code> into the signed session cookie, for an application whose sign-in stores <code>user_id</code>; an application with revocable sessions signs in through its login route instead.</p><p><button class="c-secondary cursor-interaction" data-page="sessions">Revocable sessions →</button></p>'+
    '<h2 id="c-corretto-matchers">Matchers assert on responses and rows</h2><p>Corretto’s matchers work with <code>should</code> and <code>should_not</code>.</p>'+lookup(['Matcher','Passes when'],[['<code>have_status(status)</code>','The response status equals status.'],['<code>have_header(name, value = nil)</code>','The header is present; with a value, one of its values equals it.'],['<code>redirect_to(path)</code>','A 3xx Location, or an HX-Location, equal to path.'],['<code>render_page(title)</code>','A full document with a doctype whose title contains title.'],['<code>render_partial(target, swap = nil)</code>','An hx-partial with that hx-target, and that hx-swap when given. A block also checks its content.'],['<code>have_html(within:, count:, strict:) { … }</code>','Blueprint-shaped requirements on the returned HTML.'],['<code>have_row(Schema, **conditions)</code>','On the db handle: a row matching typed where conditions.']])+

    '<h2 id="c-corretto-wire">Third parties are faked at the wire</h2><p>Corretto starts a local proxy for the suite and points <code>Caramel::Outbound</code>, the framework’s outbound HTTP client, at it. The proxy reads the real request bytes, records them, and answers from the latest matching stub. A stub matches the absolute URL, and the method when you give one.</p>'+snippet('Corretto · wire stubs','Corretto.stub_wire("https://api.stripe.com/v1/customers", method: "POST")\n  .to_return(status: 200, fixture: "stripe/customer.json")\nCorretto.stub_wire("https://api.stripe.com/v1/charges")\n  .to_return(status: 402, body: %({"error":"card_declined"}),\n    headers: {"Content-Type" => "application/json"})')+

    prove('c-corretto-example','Run a generated request spec','<p><code>frappe make resource Book title:string</code> writes a request spec that exercises the whole resource. This excerpt keeps its first steps.</p>'+snippet('spec/requests/books_spec.cr · excerpt','require "../spec_helper"\n\ndescribe "Books" do\n  it "creates, reads, updates and deletes through CSRF-protected browser forms" do\n    Corretto.session do |client, db|\n      client.get("/books/new").should render_page("New book")\n      created = client.post("/books", params: {"title" => "Example <title>"})\n      record = App::Book.query.order_by(:id, :desc).first!(db)\n      path = "/books/#{record.id}"\n      created.should have_status(303)\n      created.should redirect_to(path)\n      db.should have_row(App::Book, id: record.id, title: "Example <title>")\n      shown = client.follow_redirect\n      shown.should render_page("Book")\n      shown.should have_html { dl { dd { "Example <title>" } } }\n    end\n  end\nend')+snippet('Terminal · inside the application','frappe corretto spec/requests/books_spec.cr','bash')+passing('Every example passes. The sample title contains <code>&lt;title&gt;</code>, so the HTML expectation also proves that the page escapes user text. The full spec goes on to check JSON, updates, forged requests, unknown fields and deletion.'))+

'2,000 traces, 200 spans each, 32 attributes per span']])+
    '<h2 id="c-cremaref-where">Crema runs in every application</h2><p>Crema is part of every application. What it does depends on how the process runs and which parts you opt into.</p>'+

    lookup(['Setting','Meaning'],[['<code>Caramel::Crema.slow_request</code>','<code>Time::Span</code>, default 1 second. A request at least this slow is kept in the trace ring as slow and flagged in the toolbar.'],['<code>Caramel::Crema.slow_job</code>','Default 5 seconds. Applies to jobs and schedule runs.'],['<code>Caramel::Crema.slow_query</code>','Default 100 milliseconds. Each statement at least this slow counts in the log line’s <code>slow_queries</code>.'],['<code>Caramel::Crema.on_error { |report| … }</code>','Called for every error report, handled or not, with the redacted message and backtrace.'],['<code>Caramel::Crema.report(error, handled: true, source: nil)</code>','Reports an error you rescued. It never raises. A handled report writes a WARN line and leaves the trace’s outcome <code>ok</code>; <code>handled: false</code> marks the trace failed.'],['<code>Caramel::Crema.measure(kind, name, detail = nil) { … }</code>','Times a block as a span of the current trace. Kinds: <code>sql</code>, <code>http</code>, <code>view</code>, <code>enqueue</code>, <code>log</code>, <code>dump</code> and <code>domain</code>.'],['<code>Caramel::Crema.command(name, syntax) { |arguments| … }</code>','Adds a command to the application binary and returns its exit code. The first word of the syntax is the name; registering a name again replaces the earlier command. The binary’s usage text lists the syntax.'],['<code>Caramel::Crema.console_page(segment) { |request| … }</code>','Adds a page at <code>/segment</code> to the ops console. The block returns HTML.'],['<code>Caramel::Crema.subscribe(sink)</code>','Adds a sink that receives finished traces and error reports. Remove it with <code>unsubscribe</code>.'],['<code>Caramel.dump(value)</code>','Development only. See below.']])+
    '<h2 id="c-cremaref-env">Environment variables choose mode, format and socket</h2>'+
    lookup(['Variable','Meaning'],[['<code>CARAMEL_ENV</code>','<code>development</code> adds request paths and error messages to log lines. In a development build it also turns on the error page, <code>dump</code>, <code>Server-Timing</code>, query binds and the literals behind <strong>Copy with values</strong>. <code>test</code> and <code>development</code> default the log format to text. Unset counts as <code>production</code>.'],['<code>CARAMEL_LOG_FORMAT</code>','<code>json</code> or <code>text</code>. Any other value falls back to text in development and test, JSON elsewhere.'],['<code>LOG_LEVEL</code>','Default <code>Info</code>. Applies to every log source, not only <code>crema</code>.'],['<code>CARAMEL_OPS_SOCKET</code>','A path for the ops socket, or <code>off</code>. Unset, a <code>serve</code> process uses its <code>CARAMEL_SOCKET</code> path with <code>.sock</code> replaced by <code>.ops.sock</code>. A <code>work</code> process opens a socket only when this names a path. The <code>ops</code> client reads the same variables.'],['<code>CARAMEL_EDITOR</code>','An editor preset or a link template. See the development section.'],['<code>CARAMEL_PROJECT_ROOT</code>','The project root, default the current directory. Error locations are shown relative to it, and its <code>app</code>, <code>config</code>, <code>src</code> and <code>db</code> folders count as your code.'],['<code>APP_SECRET</code>','The application secret. Debug tokens are signed with a key derived from it, so rotating it ends every token.'],['<code>CARAMEL_DEV_EVENTS</code>','Set by <code>frappe dev</code> for development builds: the socket the application sends its events to. Do not set it yourself.'],['<code>CARAMEL_STATEMENT_TIMEOUT</code>, <code>CARAMEL_LOCK_TIMEOUT</code>','Seconds, 0 to 86400, default 30 and 5, for the database connections of every command but <code>migrate</code>. <code>migrate</code> reads <code>CARAMEL_MIGRATION_STATEMENT_TIMEOUT</code> and <code>CARAMEL_MIGRATION_LOCK_TIMEOUT</code>, default 0 and 5. 0 means none.'],['<code>CARAMEL_POOL_SIZE</code>, <code>CARAMEL_POOL_TIMEOUT</code>','Connections a command’s pool holds, 1 to 32, default 4, and seconds a checkout waits for a free one, 1 to 300, default 5. An invalid value exits 1 with one line naming it.'],['<code>OTEL_*</code>','Seven variables read by the exporter; see below.']])+
    '<h2 id="c-cremaref-ids">Every traced response carries a request id</h2>'+
    rules([['Inbound <code>X-Request-ID</code> of 8 to 128 characters from <code>A-Z a-z 0-9 . _ : -</code>','kept'],['Any other inbound <code>X-Request-ID</code>','replaced by a UUID'],['Static files, and the 400 and 421 refusals','not traced, and carry no id','ok'],['<code>traceparent</code> with version <code>00</code>, lowercase hex, a 32-digit trace id, a 16-digit parent id and flags','continues the caller’s trace and supplies the log line’s <code>trace_id</code> and <code>parent_id</code>; the first flag bit says whether the caller sampled it'],['A <code>traceparent</code> with all-zero ids','ignored'],['<code>enqueue</code>','stores the traceparent, the request id and the debug flag in <code>caramel_jobs.context</code>, never a message; the job continues that trace'],['A schedule run, or a missing or malformed job context','starts a new trace'],['Each <code>Caramel::Outbound</code> call','is an <code>http</code> span named <code>METHOD host</code>, and sends a <code>traceparent</code> unless you set one'],['A debug trace','sends <code>X-Caramel-Trace</code> with the trace id']])+
    '<h2 id="c-cremaref-log">Every finished trace writes one log line</h2><p>The <code>crema</code> log source writes one INFO line for each finished trace, named <code>request</code>, <code>job</code> or <code>schedule</code>.</p>'+
    lookup(['Field','Present when'],[['<code>name</code>','Always. <code>GET /books/:id</code>, the job class or the schedule name. An unrouted request is <code>GET (none)</code>; a method outside GET, HEAD, POST, PUT, PATCH, DELETE and OPTIONS is <code>OTHER</code>.'],['<code>request_id</code>, <code>trace_id</code>, <code>parent_id</code>','The ids above. <code>parent_id</code> only with a valid inbound or stored traceparent.'],['<code>duration_ms</code>, <code>outcome</code>','Always. <code>outcome</code> is <code>error</code> after an unhandled error or a 500, or when a job’s <code>perform</code> raised, even if it will retry.'],['<code>method</code>, <code>route</code>, <code>action</code>, <code>status</code>, <code>bytes</code>, <code>streamed</code>','Requests. <code>route</code> and <code>action</code> only when a route matched; <code>bytes</code> is left out for a streamed response.'],['<code>path</code>','Requests, only when <code>CARAMEL_ENV=development</code>.'],['<code>job_id</code>, <code>queue</code>, <code>attempt</code>, <code>queue_lag_ms</code>','Jobs. The lag is the time past <code>run_at</code>, never negative.'],['<code>db_count</code>, <code>db_ms</code>, <code>db_wait_ms</code>','Statements, their time, and the wait for a pooled connection.'],['<code>view_ms</code>, <code>outbound_count</code>, <code>outbound_ms</code>','The outermost view’s time and the <code>Caramel::Outbound</code> calls.'],['<code>cache_hits</code>, <code>cache_misses</code>, <code>enqueued</code>','<code>Caramel::Cache</code> reads and jobs enqueued.'],['<code>slow_queries</code>, <code>repeated_queries</code>','Statements past <code>slow_query</code>, and distinct statements that ran five or more times. Repeats are counted only when the trace records spans: the ops socket, the recorder or the exporter is on, or the build is for development. A trace keeps at most 200 spans (more are counted as dropped) and tracks at most 500 distinct statements for repeats.'],['<code>debug</code>','<code>true</code> for a debug trace.'],['<code>error_class</code>, <code>fingerprint</code>','Only when the trace ended in an unhandled error.']])+
    rules([['A field with no value','left out'],['Any log entry written inside a trace','also carries <code>trace_id</code> and <code>request_id</code>','ok'],['A slow request or job','shows in the trace ring, the toolbar and the inspector; there is no <code>slow</code> field. A slow statement counts in <code>slow_queries</code>','ok']])+
    lookup(['Form','Shape'],[['error line','One <code>error</code> entry for each report: WARN when handled, ERROR when not. Fields: <code>error_class</code>, <code>fingerprint</code>, <code>location</code> (relative <code>file:line</code>), <code>source</code> (the trace name, or <code>stream</code> or <code>cold_brew.worker</code>, <code>.maintenance</code>, <code>.scheduler</code>, <code>.hooks NAME</code>), <code>handled</code>, <code>request_id</code> and <code>trace_id</code>. The <code>message</code> is added only when <code>CARAMEL_ENV=development</code>.'],['JSON','One object per line: <code>ts</code> (UTC, milliseconds), lowercase <code>level</code>, <code>source</code>, <code>msg</code>, then the fields. A field named like one of those four is written as <code>data_NAME</code>, so an error’s <code>source</code> becomes <code>data_source</code>.'],['text','<code>HH:MM:SS.mmm LEVEL</code> and a one-line summary, such as <code>request GET /books/:id 200 12ms db=3/4ms view=2ms</code>. Values with spaces are quoted.']])+
    '<h2 id="c-cremaref-errors">Error reports are redacted and stay in memory</h2>'+
    lookup(['Part','Content'],[['Fields','<code>error_class</code>, <code>message</code>, <code>backtrace</code> (at most 50 frames of 2,048 bytes), <code>fingerprint</code>, <code>location</code>, <code>handled</code>, <code>source</code>, <code>request_id</code>, <code>trace_id</code>, <code>occurred_at</code> and the classes of up to five causes. A message is cut to 8,192 bytes.'],['Fingerprint','The first 12 hex digits of a SHA-256 over the error class, the path of the first frame in your own code and its method name. With no such frame, the first parseable frame; with none, the class alone. Lines, columns and messages are never hashed.'],['Redaction','Applied to every message and backtrace frame: values of environment variables whose names contain <code>SECRET</code>, <code>PASSWORD</code>, <code>TOKEN</code>, <code>API_KEY</code> or <code>DATABASE_URL</code> become <code>[redacted]</code>; PostgreSQL URLs become <code>[database URL redacted]</code>; <code>name=value</code>, <code>name: value</code> and JSON pairs whose name holds password, secret, token, api key, access key, private key, credential or authorization, and bare <code>Bearer</code> tokens, become <code>[credential redacted]</code>. If redaction fails the report keeps its class and the message <code>[unavailable]</code>.'],['Where it lives','A report’s message and backtrace exist in memory: the ring behind <code>ops errors</code>, and development surfaces. They are never in logs, tail events, metric labels, exports or database tables. The ring holds 500 fingerprints; the least recently seen is evicted.']])+
    note('Nothing here is stored for you','Logs, tail events, metric labels, exports and database tables carry no exception message, bind value or request body. Messages and backtraces stay in memory and in development surfaces, so forward <code>Crema.on_error</code> reports to an error tracker if you need history.','Not stored')+
    '<h2 id="c-cremaref-sql">Every statement in a trace starts with a tag</h2><p>Every statement run inside a trace starts with a comment: <code>/*action=\'App%3A%3ABooks%3A%3AShow\'*/</code> for a request, <code>/*job=\'…\'*/</code> for a job and <code>/*schedule=\'…\'*/</code> for a schedule. The value is the action or job class or the schedule name, percent-encoded. Pools name themselves in <code>application_name</code>: <code>caramel-web</code> for <code>serve</code>, <code>caramel-cold-brew</code> for workers and <code>caramel-listen</code> for PubSub.</p>'+
    '<h2 id="c-cremaref-ops">The ops socket answers its owner only</h2><p>An HTTP/1.1 server on a Unix socket, for the application’s owner.</p>'+
    rules([['A directory that is not a real directory you own with no group or other permissions','the socket stays off, the application keeps serving, and the log says why'],['The socket file','is mode 0600','ok'],['A live socket','is never replaced; a dead one is'],['Each connection','has a 10-second read and write timeout','ok'],['A request whose <code>Host</code> is not <code>ops</code>, <code>localhost</code>, <code>127.0.0.1</code> or <code>[::1]</code>','answers 421'],['A write with an <code>Origin</code> header','answers 403'],['A wrong method','answers 404'],['A ninth concurrent tail','answers 429'],['<code>POST /v1/debug-tokens</code> without an application secret, which a <code>work</code> process lacks','answers 404'],['Every answer','is JSON with a <code>version</code> and carries <code>Cache-Control: no-store</code>','ok']])+
    lookup(['Endpoint','Answers'],[['<code>GET /v1/status</code>','App, role, uptime, environment, in-flight work, request counts and p95, memory, database pools, workers, scheduler, sinks and dropped events.'],['<code>GET /v1/requests</code>, <code>/v1/fibers</code>','In-flight requests and jobs; fibers grouped by name.'],['<code>GET /v1/metrics</code>','Prometheus text.'],['<code>GET /v1/tail</code>','Server-sent events of finished traces and errors. Query: <code>errors=1</code>, <code>slow=MS</code>, <code>logs=1</code>. At most 8 at once, 1,000 events buffered for each. A debug trace always passes the filters. With <code>logs=1</code> the events include log lines exactly as written to stdout.'],['<code>GET /v1/errors</code>, <code>/v1/errors/FINGERPRINT</code>','Errors since the process started, grouped, newest first. The second route is the only one that returns a message and backtrace.'],['<code>GET /v1/traces?limit=N&amp;reason=error|slow|debug</code>','The trace ring, 50 by default, at most 200. A trace is kept when it failed, was slow or carried a debug token. The ring holds 200 traces.'],['<code>GET /v1/traces/REF</code>','One trace with its spans. REF is a prefix of at least 6 characters of a trace id or request id.'],['<code>POST /v1/debug-tokens</code>','JSON <code>{"minutes": N}</code>, 1 to 120, default 15, in a body of at most 1 KiB.']])+

    lookup(['Command','Does'],[['<code>APP ops status [--json]</code>','A summary of the process. <code>--json</code> prints the status document.'],['<code>APP ops requests|fibers [--json]</code>','In-flight work; fibers by name.'],['<code>APP ops metrics</code>','Prometheus text, as served.'],['<code>APP ops tail [--errors] [--logs] [--slow=MS] [--json]</code>','Streams until you stop it. <code>--slow</code> takes a value here, and <code>MS</code> must be an integer.'],['<code>APP ops errors [--json]</code>','Fingerprint, count, last seen, class, location and source.'],['<code>APP ops error FINGERPRINT</code>','One error with its redacted message and backtrace. A miss says that restarts clear the rings.'],['<code>APP ops traces [--errors|--slow|--debug] [--limit=N] [--json]</code>','One reason flag; errors win over slow, slow over debug. The reason flags take no value.'],['<code>APP ops trace REF [--md]</code>','One trace as text or Markdown.'],['<code>APP ops debug-token [--minutes=N]</code>','Prints the token, its expiry, a <code>curl</code> line with the header and a browser line that sets the cookie.'],['<code>APP ops console</code>','Prints <code>ssh -N -L 8765:SOCKET HOST</code> and <code>http://localhost:8765/</code>. It does not connect.'],['<code>APP jobs [stats]</code>','Each queue’s running, retrying, queued, scheduled and failed jobs, the finished in the last hour and the age of the oldest due job.'],['<code>APP jobs failed [--limit=N]</code>','Failures grouped by job class and error class, newest first; default 20.'],['<code>APP jobs show ID</code>','Every column of one job, including <code>last_error</code> and <code>context</code>. It prints to your terminal only.'],['<code>APP jobs retry ID|--class=NAME</code>','Writes to the database: clears the failure and runs the job once more. It keeps <code>attempts</code>.'],['<code>APP jobs unknown</code>','The queued job classes this binary does not compile, one per line, for a deploy to check before the binary takes over.'],['<code>APP db diagnose</code>','Sections <code>connections</code>, <code>long_running</code> (over 1 second), <code>blocking</code>, <code>cache_hit</code>, <code>seq_scans</code>, <code>unused_indexes</code>, <code>vacuum</code>, <code>table_sizes</code> and <code>outliers</code> (the slowest statements of your role, from <code>pg_stat_statements</code>).'],['<code>APP db roles DATABASE MIGRATION_ROLE RUNTIME_ROLE</code>','Prints a psql script that creates the two login roles, the database the migration role owns and the grants Latte gives a site: the runtime role reads and writes rows through default privileges. It sets no passwords, grants both roles to the role that runs it, and needs no database. Names match <code>[a-z_][a-z0-9_]*</code>, up to 63 characters.'],['<code>APP insights [--since=DURATION] [--kind=KIND]</code>','The recorder’s tables. Defaults <code>1h</code> and <code>request</code>.']])+

    lookup(['Tool','Behaviour'],[['Error page','An unhandled error answers 500 with the class, the redacted message, up to 80 frames with Open in editor links, four lines of source either side of your first frame (files under <code>app</code>, <code>config</code>, <code>src</code> or <code>db</code> up to 1 MiB), the request, the queries before the error and the causes. A client that asks for JSON first gets an <code>error</code> object with the class, message, location, request and trace ids and backtrace instead.'],['<code>dump(value)</code>','Prints <code>dump file:line: value</code> to standard error and returns the value; inside a trace it adds a <code>dump</code> span of up to 8,192 bytes. In actions, views and jobs, and as <code>Caramel.dump</code>. In other builds it returns the value untouched.'],['<code>Server-Timing</code>','<code>db;dur=…;desc="N queries", view;dur=…, total;dur=…</code>.'],['Toolbar','<code>frappe dev</code> adds it to full HTML responses that carry an <code>X-Request-ID</code>, not to htmx partials, the build-error page or the inspector. It shows the route, status, time and query count, flags for errors, slow requests and repeated queries, and the last ten requests. Each part links to <code>#timeline</code>, <code>#queries</code> or <code>#error</code> on the request’s page (the Timeline and Queries sections are on the page even when empty and say so; the Error section is there for a failed request). The minimise button shrinks it to a dot, and the dot restores it. <code>`</code> opens and closes the list, <code>j</code> and <code>k</code> move in it, <code>Esc</code> closes it; shortcuts are ignored in fields and with a modifier key. <strong>Copy for an agent</strong> fetches <code>/__caramel/dev/trace.md?id=ID</code> (a hexadecimal id of 6 to 32 characters, development session only). <strong>Theme</strong> cycles auto, light and dark. It polls every 400 ms and reloads when the build changes.'],['Inspector','<code>/__caramel/dev/inspector</code> lists up to 500 traces, filtered by <code>?only=errors</code>, <code>slow</code> or <code>jobs</code>. Beside it: <code>/inspector/traces/ID</code> (a prefix of at least 6 characters), <code>/inspector/errors</code> and <code>/inspector/builds</code>. Each query on a trace page has <strong>Copy SQL</strong> and <strong>Copy with values</strong>; the values come from literals built when the query ran (numbers and booleans bare, text, times and bytes quoted, <code>nil</code> as <code>NULL</code>, arrays as <code>ARRAY[…]</code>) and never leave development. Placeholders without a value stay as <code>$n</code>. The page follows the system’s light or dark appearance; the Theme button sets it for the toolbar and the inspector together (<code>localStorage</code> key <code>caramel.dev.theme</code>). Its endpoints answer GET only and check the host.'],['<code>CARAMEL_EDITOR</code>','A preset or a template with <code>{path}</code>, <code>{line}</code> and <code>{column}</code>. Presets: <code>zed</code> (the default), <code>vscode</code>, <code>cursor</code>, <code>sublime</code>, <code>textmate</code> and <code>idea</code>. <code>frappe dev</code> also reads it from the project’s <code>.env</code>.'],['<code>Caramel/Dump</code>','<code>frappe lint</code> reports any call to <code>dump</code> without a receiver or on <code>Caramel</code>, including your own method of that name. The rule is on in new applications’ <code>.ameba.yml</code>.']])+

    `<h2 id="c-security-csrf">Browser writes need a token and an origin</h2><p>The submitted token must match the <code>__Host-caramel_csrf</code> cookie, compared in constant time.</p>`+

      ['A token that does not match the <code>__Host-caramel_csrf</code> cookie','answers 403'],

    `<p>Forms send the token in a hidden <code>_csrf</code> field. htmx and <code>fetch</code> send it as <code>X-CSRF-Token</code>. The generated layout puts the header on every htmx request, and generated forms carry the field.</p>`+
    snippet('app/views/layouts/application.cr · generated layout excerpt','body "hx-boost:inherited": "true", "hx-target:inherited": "#content", "hx-swap:inherited": "innerMorph",\n  "hx-headers:inherited": {"X-CSRF-Token" => @csrf_token}.to_json do')+

    `<p>A token is a timestamp, a random nonce and an HMAC-SHA256 signature. Every HTML response sets the cookie with <code>Secure</code>, <code>HttpOnly</code>, <code>SameSite=Lax</code> and <code>Path=/</code>.</p>`+
    `<h2 id="c-security-sessions">Sessions are signed and held by the browser</h2><p><code>session</code> is a <code>Hash(String, String)</code> stored in the <code>__Host-caramel_session</code> cookie. The cookie holds base64url JSON and an HMAC-SHA256 signature. Its key is derived from <code>APP_SECRET</code> for this one purpose.</p>`+
    snippet('Inside an action · signing in','def handle(contract : Contract) : Caramel::Response\n  session["user_id"] = contract.user_id\n  redirect_to "/books"\nend')+
    rules([
      ['A cookie that is malformed or wrongly signed','reads as an empty session'],
      ['A CSRF signature offered as a session signature','does not verify, because the key is derived for one purpose'],
      ['A response when the session did not change','sets no cookie','ok'],
      ['<code>sign_out</code>','clears the session; the response deletes the cookie','ok'],
      ['A session over 4096 bytes','raises <code>Caramel::Session::Overflow</code>'],
      ['A route whose ingress sets <code>csrf: false</code>','reads an empty session and never saves it']

    `<p>The cookie has the same <code>Secure</code>, <code>HttpOnly</code>, <code>SameSite=Lax</code> and <code>Path=/</code> attributes. It has no <code>Max-Age</code>, so it ends with the browser session. There is no server-side expiry or revocation list. <button class="c-secondary cursor-interaction" data-page="sessions">Revocable sessions →</button> Keep ids in the session and records in the database.</p>`+
    `<p>The session is readable, though not editable, by anyone holding the cookie. Store no secrets in it.</p>`+

    `<h2 id="c-security-escaping">Views escape text and attributes</h2><p>Blueprint views escape text and attribute values. The escape covers <code>&amp;</code>, <code>&lt;</code>, <code>&gt;</code>, <code>"</code> and <code>&#39;</code>. <code>markup { … }</code> builds a small fragment with the same escaping.</p>`+

    `<h2 id="c-security-ingress">Ingress loosens one route at a time</h2><p>An action’s <code>ingress</code> declaration changes how its route reads the request. Turning CSRF off needs an authenticator.</p>`+

    `<h2 id="c-security-redirects">Redirects and outbound calls name their destination</h2><p><code>redirect_to</code> accepts only a local absolute path. <code>redirect_external</code> is the explicit way to another site: it accepts an absolute http or https URL with a host and no credentials, whitespace, control characters or backslashes.</p>`+
