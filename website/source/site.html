  tenancy: () => heading('Guides / Multi-tenancy','Serve many accounts from one app.','Give each account its own <code>/SLUG</code> path and its own rows, with queries that refuse to run outside a tenant.')+
    contract([['Needs','An application that has run <code>frappe migrate</code>, and a singular model name to own the data, such as <code>Account</code>'],['You will have','Each account under its own <code>/SLUG</code> path with its own rows, and queries that refuse to run outside a tenant'],['Proved by','<code>frappe routes</code> · <code>frappe corretto</code>']])+
    guideMap('tenancy',[['Start',[['c-tenancy-enable','Enable tenancy']]],['Model',[['c-tenancy-routes','Route inside the tenant'],['c-tenancy-resources','Generate tenant resources'],['c-tenancy-schema','Declare tenanted data']]],['Use',[['c-tenancy-views','Use the tenant in actions and views'],['c-tenancy-background','Carry the tenant into background work']]],['Operate',[['c-tenancy-slugs','Validate slugs and check membership'],['c-tenancy-existing','Add tenancy to existing data']]],['Limits',[['c-tenancy-refusals','What does not compile'],['c-tenancy-gaps','Not covered yet']]]])+
    kicker('Stage 1 · Start')+
    "<h2 id=\"c-tenancy-enable\">Enable tenancy</h2><p>Multi-tenancy is opt-in, and a plain application does not compile it. Name the model that owns the data; any singular model name works.</p>"+
    snippet("Terminal · inside your application","frappe make tenancy Account\nfrappe migrate","bash")+
    expect('<code>frappe make tenancy</code> prints a <code>Generated</code> line for each file it writes and ends with a <code>Next:</code> line that names <code>frappe migrate</code> and the sign-up page at <code>/accounts/new</code>. With a SweetTalk domain present, the <code>Next:</code> line adds that each domain in <code>app/domain/</code> now names <code>App::Account</code>. <code>frappe migrate</code> applies <code>create_accounts</code>.')+
    "<p>The command writes the <code>Account</code> model (name, slug, timestamps, a unique slug index), its changeset, the <code>create_accounts</code> migration, a sign-up page at <code>/accounts/new</code>, a home page at <code>/SLUG</code> and a request spec. It requires <code>caramel/tenancy</code> after <code>caramel</code> in <code>config/application.cr</code>, adds the tenant block to <code>config/routes.cr</code> and <code>Caramel.resource_paths :accounts, :account</code> to <code>config/paths.cr</code>, and adds the <code>account</code> and <code>tenant_session</code> spec helpers. In every <code>app/domain/*.cr</code> it adds <code>tenant App::Account</code> after <code>include SweetTalk</code>, because a program that requires <code>caramel/tenancy</code> refuses a domain that does not name its tenant. Sign up at <code>/accounts/new</code>; a new account redirects to its home.</p><button class=\"c-secondary cursor-interaction\" data-page=\"sweettalk\">Share a domain between tenants →</button>"+
    kicker('Stage 2 · Model')+
    "<h2 id=\"c-tenancy-routes\">Route inside the tenant</h2><p>The tenant block names the tenant model and the String field whose value is the first path segment. Routes inside it live under the slug, so <code>/notes</code> answers at <code>/acme/notes</code>. This is the block <code>frappe make tenancy Account</code> writes, with the Note resource of the next section inside it:</p>"+
    snippet("config/routes.cr · after make tenancy and make resource Note","Caramel::Router.draw do\n  get \"/\", App::Home::Show\n  get \"/health\", App::Health::Show\n  get \"/accounts/new\", App::Accounts::New\n  post \"/accounts\", App::Accounts::Create\n  # Frappé resource routes\n\n  tenant App::Account, by: :slug do\n    get \"/\", App::Accounts::Home\n    get \"/notes\", App::Notes::Index\n    # Frappé tenant routes\n  end\nend","crystal")+
    "<p><code>frappe routes</code> lists tenant routes as <code>/:tenant/notes</code>. A tenant is chosen by its path prefix only: <code>acme.example.com</code> selects nothing.</p>"+
    "<h2 id=\"c-tenancy-resources\">Generate tenant resources</h2><p>After tenancy is enabled, <code>frappe make resource</code> writes resources that belong to the tenant: routes inside the block, <code>tenant account : Account</code> in the model, and a request spec. Pass <code>--central</code> for a resource every tenant shares; it is identical to a plain application’s.</p>"+
    snippet("Terminal · inside your application","frappe make resource Note body:string\nfrappe make resource Tag label:string --central","bash")+
    expect('<code>Note</code>’s routes sit inside the tenant block, so <code>frappe routes</code> lists them as <code>/:tenant/notes</code>; <code>Tag</code>’s stay central at <code>/tags</code>.')+
    "<h2 id=\"c-tenancy-schema\">Declare tenanted data</h2><p>The <code>tenant</code> statement adds the <code>account_id</code> column and scopes the schema to the bound tenant. The column is never a changeset param. This is the schema <code>frappe make resource Note body:string</code> wrote:</p>"+
    snippet("app/models/note.cr · schema excerpt","schema \"notes\" do\n  field id : Int64, primary: true\n  tenant account : Account\n  field body : String\n  timestamps\nend","crystal")+
    rules([['A tenanted query with no tenant bound','raises <code>SugarORM::Tenancy::Missing</code>: “App::Note is tenanted, but no tenant is bound.”'],['Another tenant’s id','answers 404, like an unknown one'],['A <code>belongs_to</code> to a row of another tenant, even from raw SQL','is refused by PostgreSQL’s composite foreign key'],['Creating a tenanted row inside <code>Caramel::Tenancy.without</code>','raises']])+
    "<ul><li>Queries, <code>find</code>, <code>count</code>, <code>exists?</code>, <code>delete_all</code>, preloads, updates and deletes see only the bound tenant’s rows, and inserts are stamped with it.</li><li>A unique index on a tenanted schema is unique per tenant, so two accounts may hold the same value.</li><li>A <code>belongs_to</code> to another tenanted schema becomes a composite foreign key.</li><li><code>Caramel::Tenancy.without { … }</code> reaches every tenant’s rows on purpose.</li><li>Raw <code>SugarORM.sql</code> is not scoped.</li></ul>"+
    kicker('Stage 3 · Use')+
    "<h2 id=\"c-tenancy-views\">Use the tenant in actions and views</h2><p>Actions and views expose <code>tenant</code>, the request’s tenant record, and <code>tenant_path</code>, a path under its prefix. Generated resource path helpers already add the prefix.</p>"+
    snippet("Inside a view’s blueprint · in acme","h1 { tenant.name }\na(href: tenant_path(\"/\")) { \"Home\" }  # /acme\na(href: notes_path) { \"Notes\" }       # /acme/notes","crystal")+
    "<p>With locale prefixes, the tenant comes first: <code>/acme/fr/notes</code>. The language switcher keeps the tenant prefix.</p>"+
    "<h2 id=\"c-tenancy-background\">Carry the tenant into background work</h2><p>Outside a request, bind a tenant explicitly. <code>Caramel::Tenancy.current</code> and <code>current?</code> read the bound one.</p>"+
    snippet("A task or job · account is a loaded App::Account","Caramel::Tenancy.with(account) do\n  App::Note.query.count\nend\n\nCaramel::Tenancy.each do |account|\n  # Runs once per tenant, bound.\nend","crystal")+
    "<p>A Cold Brew job enqueued in a tenant runs in it. A <code>spawn</code>ed fiber starts with no tenant, so wrap its work in <code>with</code>. Cache keys and PubSub channels are prefixed per tenant with <code>t&lt;id&gt;:</code>.</p>"+
    rules([['A Cold Brew job whose tenant was deleted before it ran','fails with <code>Caramel::Tenancy::Gone</code>'],['A prefixed PubSub channel name over 63 characters','raises ArgumentError']])+
    kicker('Stage 4 · Operate')+
    "<h2 id=\"c-tenancy-slugs\">Validate slugs and check membership</h2><p><code>validate_tenant_slug</code>, which the generated <code>Account</code> changeset calls, checks the address a tenant gets:</p>"+
    rules([['A slug that is not a lowercase DNS label (letters, digits and hyphens, 1 to 63 characters, no leading or trailing hyphen)','adds <code>has invalid format</code> to the field'],['A slug equal to a central route’s first segment, such as <code>health</code> or <code>accounts</code>','adds <code>has already been taken</code> to the field'],['A slug equal to a locale prefix code','adds <code>has already been taken</code> to the field']])+
    "<p>Tenancy decides which rows a request sees, not who may act in a tenant. Check membership in the application: <code>ingress authenticate: :member?</code> on an action names an instance method returning <code>Bool</code>, and <code>false</code> answers 401 before the contract binds.</p><button class=\"c-secondary cursor-interaction\" data-page=\"security\">Read the ingress rules →</button>"+
    "<h2 id=\"c-tenancy-existing\">Add tenancy to existing data</h2><p>Adding <code>tenant</code> to a populated table needs five steps, because the new column is NOT NULL and its index must exist before another tenanted table can reference it.</p>"+
    "<ol><li>Add <code>tenant account : Account</code> to the schema and run <code>frappe db diff</code>.</li></ol>"+snippet('Terminal · inside your application','frappe db diff --name tenant_notes','bash')+
    expect('Halts with <code>NOT NULL column without a default cannot be added to the existing notes table: existing rows have no value for it.</code> and writes no migration.')+
    "<ol start=\"2\"><li>Write a migration by hand that adds the column as nullable, backfills it and sets it NOT NULL.</li><li>In a second migration, build the index: <code>CREATE UNIQUE INDEX CONCURRENTLY IF NOT EXISTS \"index_notes_on_account_id_and_id\" ON \"notes\" (\"account_id\", \"id\")</code>. When another tenanted table’s key references the table, the differ halts until the index exists and prints this SQL.</li><li>Run <code>frappe migrate</code>, then <code>frappe db diff</code> again for the foreign keys.</li><li>Drain every queue before deploying: a job enqueued without a tenant runs with none.</li></ol>"+
    snippet('Terminal · before the first deploy with tenancy · APP is the application binary','APP jobs stats','bash')+
    expect('Prints one row per queue with its <code>running</code>, <code>retrying</code>, <code>queued</code>, <code>scheduled</code> and <code>failed</code> counts. Deploy once every row’s <code>queued</code>, <code>scheduled</code> and <code>running</code> are 0.')+
    rules([['<code>frappe db diff</code> on a populated table that gains a NOT NULL column','halts and writes no migration'],['A job enqueued without a tenant, run on tenanted rows','fails with <code>SugarORM::Tenancy::Missing</code>']])+
    "<p><a href=\"https://github.com/caramelizedev/caramel/blob/v0.15.0/docs/decisions/0025-multi-tenancy.md\" target=\"_blank\" rel=\"noopener noreferrer\">Read the multi-tenancy design ↗</a></p>"+
    kicker('Stage 5 · Limits')+
    "<h2 id=\"c-tenancy-refusals\">What does not compile</h2><p>A router has one tenant block. Each mistake below stops the build.</p>"+
    rules([['A central route other than <code>/</code> that starts with a parameter','fails compilation'],['A tenant route that starts with a central route’s first segment','fails compilation'],['A router with a second tenant block','fails compilation'],['A SweetTalk domain that does not name the tenant, in a program that requires <code>caramel/tenancy</code>','fails compilation']])+
    "<h2 id=\"c-tenancy-gaps\">Not covered yet</h2><ul><li>A tenant is selected by its <code>/SLUG</code> path prefix only. There is no host or subdomain tenancy.</li><li>Membership and authorization are the application’s: tenancy answers 404 for another tenant’s rows, and nothing else.</li><li><code>Caramel::Tenancy.without</code> and raw <code>SugarORM.sql</code> are unscoped; the application adds the tenant predicate itself.</li><li>Removing tenancy follows the design’s “Plugging out” steps by hand; no command does it.</li></ul>"+
    prove('c-tenancy-testing','Test isolation',
      "<p><code>tenant_session(\"acme\")</code> opens a Corretto session in a new account, and the example’s queries see only its rows. <code>account(db, \"globex\")</code> creates a second account to prove isolation. <code>frappe make resource Note</code> already wrote these lines into its spec; nothing to add.</p>"+
      snippet("spec/requests/notes_spec.cr · the lines make resource wrote","tenant_session(\"acme\") do |client, db|\n  created = client.post(\"/acme/notes\", params: {\"body\" => \"Example <body>\"})\n  record = App::Note.query.order_by(:id, :desc).first!(db)\n  # …\n  account(db, \"globex\")\n  client.get(\"/globex/notes/#{record.id}\").should have_status(404)\n  # …\nend","crystal")+
      snippet('Terminal · inside your application','frappe routes\nfrappe corretto spec/requests/notes_spec.cr','bash')+
      passing('<code>frappe routes</code> lists <code>/:tenant/notes</code> beside the central <code>/tags</code>. <code>frappe corretto</code> ends with <code>Corretto: 1 of 1 workers passed</code>: a request from <code>acme</code> for <code>globex</code>’s note answers 404.'))+
    next('testing','Test the HTML your app returns'),
  crema: () => heading('Guides / Observability','Know what your application did.','Every request and job gets a stable id, one log line and, when something fails, a report that stays out of your logs.')+
    contract([['Needs','A running application. <code>frappe dev</code> for the development tools; a database for the queue commands'],['You will have','A request id and one log line for every request and job, and error reports that stay out of your logs'],['Covers','Logs, error reports, the development inspector, the ops socket, the recorder and OTLP export'],['Proved by','<code>frappe errors --agent</code> · <code>ops errors</code> · <code>ops metrics</code>']])+
    '<p>This guide teaches each task once and names one example. Every field, variable and limit has its home in the reference.</p><button class="c-secondary cursor-interaction" data-page="cremaref">Look up every field, variable and limit →</button>'+
    '<p>The examples use the Bookshelf application of the Learn path. <code>./bookshelf</code> is its binary, <code>APP</code> on the commands page, run on the machine where it serves.</p>'+
    guideMap('crema',[
      ['Follow requests',[['c-crema-ids','Follow one request'],['c-crema-logs','Read the log line'],['c-crema-errors','Report errors'],['c-crema-slow','Set what counts as slow'],['c-crema-work','See where a query came from']]],
      ['Develop',[['c-crema-dump','Dump a value while developing'],['c-crema-errors-dev','Read an error page'],['c-crema-inspector','Inspect requests and jobs'],['c-crema-menu','Watch from the menu bar'],['c-crema-access','Read the proxy’s view of a request'],['c-crema-collector','Follow a trace across sites'],['c-crema-agents','Ask from the terminal']]],
      ['Operate',[['c-crema-ops','Look inside a running application'],['c-crema-debug','Trace one person’s requests'],['c-crema-console','Open the console'],['c-crema-jobs','Inspect queues and the database']]],
      ['Keep history',[['c-crema-recorder','Keep latency history'],['c-crema-otlp','Send traces to a tracing backend']]],
      ['Limits',[['c-crema-refusals','What does not compile'],['c-crema-gaps','Not covered yet']]]
    ])+
    kicker('Stage 1 · Follow requests')+
    '<h2 id="c-crema-ids">Follow one request</h2><p>Every routed request carries <code>X-Request-ID</code>: a well-formed inbound one is kept, any other is replaced by a UUID, and a W3C <code>traceparent</code> continues the caller’s trace. The response, the log line and the error report all name the same ids, and a job enqueued by the request carries them on.</p><button class="c-secondary cursor-interaction" data-page="cremaref">Look up the id rules →</button>'+
    '<h2 id="c-crema-logs">Read the log line</h2><p>Each request, job and schedule run writes one wide line from the <code>crema</code> log source: its name, its ids, its duration and outcome, and counts of queries, their time, view time, outbound calls, cache reads and jobs enqueued. JSON is the default outside development and test; <code>CARAMEL_LOG_FORMAT</code> chooses the format and <code>LOG_LEVEL</code> the level. Outside development, no line carries the request path or an exception’s message, and no line ever carries a query’s bind values.</p><button class="c-secondary cursor-interaction" data-page="cremaref">Look up every field and when it is present →</button>'+
    '<h2 id="c-crema-errors">Report errors</h2><p>An unhandled error in a request is reported once, with its class, a fingerprint and the first frame of your own code. The fingerprint ignores lines and messages, so one defect stays one group across deploys. Call <code>Caramel::Crema.report(error)</code> for an error you handle, and register a hook to forward reports, redacted of secrets, to an error tracker.</p>'+
    snippet('config/application.cr · Tracker stands for your error tracker’s client','Caramel::Crema.on_error do |report|\n  Tracker.capture(report.error_class, report.fingerprint, report.message)\nend','crystal')+
    '<p>The message and backtrace reach the hook, the ops socket and the development tools, and nothing else.</p><button class="c-secondary cursor-interaction" data-page="cremaref">Look up the report’s fields and redaction →</button>'+
    '<h2 id="c-crema-slow">Set what counts as slow</h2><p>A slow request or job is kept for <code>ops traces --slow</code> and flagged in the development toolbar; a slow query adds to the log line’s <code>slow_queries</code>. Change the three thresholds in your application’s configuration. A statement that runs past PostgreSQL’s <code>statement_timeout</code>, which <code>CARAMEL_STATEMENT_TIMEOUT</code> sets, is cancelled and reported as an error instead.</p>'+
    snippet('config/application.cr','Caramel::Crema.slow_request = 500.milliseconds\nCaramel::Crema.slow_job = 30.seconds\nCaramel::Crema.slow_query = 50.milliseconds','crystal')+
    '<button class="c-secondary cursor-interaction" data-page="cremaref">Look up the defaults and the timeout variables →</button>'+
    '<h2 id="c-crema-work">See where a query came from</h2><p>Every statement a request runs starts with a comment that names the action, so <code>pg_stat_activity</code> and PostgreSQL’s slow-query log say which code ran it; jobs and schedules are tagged the same way, and each pool names itself in <code>application_name</code>. A job continues the trace that enqueued it, <code>Caramel::Outbound</code> calls send <code>traceparent</code> on, and SweetTalk commands, factories and services are timed as <code>domain</code> spans. When the trace records spans, a statement that repeats five or more times in one request is reported as a repeated query.</p><button class="c-secondary cursor-interaction" data-page="cremaref">Look up the tag and pool names →</button>'+
    kicker('Stage 2 · Develop')+
    '<h2 id="c-crema-dump">Dump a value while developing</h2><p><code>dump</code> prints a value with its file and line to standard error and returns the value, so it fits inside an expression. It works in actions, views and jobs while <code>frappe dev</code> runs, and does nothing in a production build. <code>frappe lint</code> reports a <code>dump</code> left in the code.</p>'+
    snippet('app/actions/books/show.cr','book = dump(App::Book.find!(contract.id))','crystal')+
    '<h2 id="c-crema-errors-dev">Read an error page</h2><p>In development an unhandled error shows its class and message, every frame of your own code with an Open in editor link, the source around the failing line, the request, the queries that ran before it and its causes. <strong>Copy as Markdown</strong> copies all of it for a bug report or an agent. A client that asks for JSON gets the same as JSON. Compile errors link to the file in the same way; <code>CARAMEL_EDITOR</code> names the editor.</p><button class="c-secondary cursor-interaction" data-page="cremaref">Look up the editor presets →</button>'+
    '<h2 id="c-crema-inspector">Inspect requests and jobs</h2><p>Every full HTML page <code>frappe dev</code> serves carries a toolbar with the request’s route, status, time and query count, flags for errors, slow requests and repeated queries, and the recent requests. Each part links to its place in the inspector at <code>/__caramel/dev/inspector</code>, which lists recent requests, jobs and schedule runs with their timeline, queries and logs, groups errors by fingerprint and lists the builds. <strong>Copy for an agent</strong> puts a request on the clipboard as Markdown, and each query has <strong>Copy SQL</strong> and <strong>Copy with values</strong> for <code>psql</code>. The browser’s developer tools show database and view time through <code>Server-Timing</code>.</p><button class="c-secondary cursor-interaction" data-page="cremaref">Look up the toolbar’s keys and the copy limits →</button>'+
    '<h2 id="c-crema-menu">Watch from the menu bar</h2><p>Latte’s menu bar app shows each site’s error count beside its state, the newest error in its submenu, and an <strong>Open inspector</strong> item. A failed build or a new error fingerprint counts beside the cup and posts a macOS notification that opens the inspector; allow notifications for Latte when macOS asks. A notification carries the error’s class and location, never its message.</p>'+
    '<h2 id="c-crema-access">Read the proxy’s view of a request</h2><p>Latte’s HTTPS proxy writes one JSON line per request to the site’s own <code>access.log</code>, with the application’s <code>X-Request-Id</code>, beside <code>app.log</code> and <code>compiler.log</code>. Caddy redacts <code>Cookie</code> and <code>Authorization</code>.</p>'+
    snippet('Terminal · inside your application','frappe logs access\nfrappe logs access --follow','bash')+
    expect('Prints the last 200 lines of the site’s <code>access.log</code>, one JSON line per request with status, duration, size, host, URI and response headers; <code>--follow</code> keeps printing. Before the site has served a request it exits 1 with <code>No access log for NAME yet. Run frappe dev.</code>')+
    '<h2 id="c-crema-collector">Follow a trace across sites</h2><p>Latte runs a local OTLP collector on <code>127.0.0.1:4318</code>, and <code>frappe dev</code> sends its application’s traces there. A site that calls another through <code>Caramel::Outbound</code> sends a <code>traceparent</code>, so both sites’ spans share one trace, and the inspector’s trace page and <code>frappe trace REF --md</code> add an <strong>Across services</strong> section. Any other service joins by exporting OTLP/HTTP JSON to the same address; a Caramel service outside <code>frappe dev</code> needs <code>require "caramel/crema/otlp"</code> for that.</p>'+
    snippet('Terminal · a second Caramel service, billing','OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318 \\\nOTEL_EXPORTER_OTLP_PROTOCOL=http/json \\\nOTEL_SERVICE_NAME=billing ./billing serve','bash')+
    expect('<code>billing</code> serves as usual and prints nothing about the exporter. After the bookshelf calls it, <code>frappe trace last --md</code> in the bookshelf ends with an <code>## Across services</code> section that lists <code>billing</code>’s spans.')+
    '<h2 id="c-crema-agents">Ask from the terminal</h2><p>These commands read the events <code>frappe dev</code> kept, whether or not it still runs: <code>frappe traces</code> lists recent requests and jobs, <code>frappe trace REF</code> shows one, and <code>frappe errors</code> groups runtime errors and repeated queries since the newest successful build, so a rebuild clears the errors it fixed. With <code>--agent</code>, or when stdout is not a terminal, they print MRDP.</p>'+
    snippet('Terminal · inside your application','frappe errors --agent\nfrappe trace last-error --md\nfrappe traces --errors --limit=5','bash')+
    expect('<code>frappe errors --agent</code> prints <code>OK errors 0</code> and exits 0 when nothing failed since the newest successful build; otherwise one <code>ERR RUNTIME:500</code> or <code>ERR REPEATED_QUERY</code> block per group, and exits 1. <code>frappe trace last-error --md</code> prints the failed trace as Markdown with a <code>## Backtrace</code> section, and exits 1 when no trace failed. <code>frappe traces --errors --limit=5</code> lists the newest five failed traces.')+
    '<button class="c-secondary cursor-interaction" data-page="cremaref">Look up REF and each flag →</button>'+
    kicker('Stage 3 · Operate')+
    '<h2 id="c-crema-ops">Look inside a running application</h2><p>A <code>serve</code> process opens a private ops socket next to its application socket; only its owner can use it, and nothing is added to the public listener. <code>CARAMEL_OPS_SOCKET</code> moves it, turns it off, or gives a <code>work</code> process one. The application binary is its own client.</p>'+
    snippet('Terminal · on the server','./bookshelf ops status\n./bookshelf ops tail --errors --slow=500\n./bookshelf ops errors\n./bookshelf ops error 9f2c4e1a7b3d\n./bookshelf ops traces --slow\n./bookshelf ops trace 8b1f6c2a --md\n./bookshelf ops metrics','bash')+
    expect('<code>ops status</code> prints seven lines, <code>App</code>, <code>Requests</code>, <code>Jobs</code>, <code>Database</code>, <code>Memory</code>, <code>Fibers</code> and <code>Crema</code>; the first names the application, its Caramel version, role, pid and uptime. <code>ops tail</code> streams finished traces and errors until you stop it. <code>ops errors</code> prints a table with <code>FINGERPRINT COUNT LAST_SEEN CLASS LOCATION SOURCE</code>, the errors seen since the process started; <code>ops error FINGERPRINT</code> prints one with its redacted message and backtrace. <code>ops traces --slow</code> lists the kept slow traces and <code>ops trace REF --md</code> prints one as Markdown. <code>ops metrics</code> prints Prometheus text. Without a running process each exits 1 with <code>No ops socket at PATH. Is the application running with CARAMEL_OPS_SOCKET?</code>')+

    '<h2 id="c-crema-debug">Trace one person’s requests</h2><p><code>ops debug-token --minutes=15</code> prints a signed token. A request that sends it as <code>X-Caramel-Debug</code>, or in the <code>__Host-caramel_debug</code> cookie, is traced in full, answered with <code>X-Caramel-Trace</code>, kept for <code>ops traces --debug</code> and passed to the jobs it enqueues.</p>'+

    '<h2 id="c-crema-console">Open the console</h2><p>The console is the same data as HTML, read-only: in-flight work, a live tail, queues, database health, errors, traces and insights. Its trace pages carry no bind values.</p>'+

    '<h2 id="c-crema-jobs">Inspect queues and the database</h2><p>The <code>jobs</code> and <code>db diagnose</code> commands need the database, not a running application: queue counts, failures grouped by class and error, one job with its stored error, a retry, and PostgreSQL’s own view of connections, locks, cache hits, indexes, vacuum and slow statements. <code>frappe db diagnose</code> runs the last one against the development database.</p>'+

    '<button class="c-secondary cursor-interaction" data-page="cremaref">Look up each command’s columns and exit codes →</button>'+

    '<h2 id="c-crema-recorder">Keep latency history</h2><p>Logs say what happened; <code>insights</code> says how it has been going. The recorder keeps one row per minute for each route, job class, schedule, SQL statement and outbound host in <code>caramel_metrics</code>, aggregates only: never a path, a bind value or a message. New applications already require it; add it to an older one and run <code>frappe migrate</code> once, because its table comes with Cold Brew’s framework tables.</p>'+
    snippet('config/application.cr','require "caramel"\nrequire "caramel/crema/recorder"','crystal')+

    '<button class="c-secondary cursor-interaction" data-page="cremaref">Look up the table, retention and flush rules →</button>'+
    '<h2 id="c-crema-otlp">Send traces to a tracing backend</h2><p>Add <code>require "caramel/crema/otlp"</code> and set the standard OpenTelemetry variables; the application then exports each sampled request, job and schedule run, with a child span for every query and outbound call, as OTLP over HTTP with JSON bodies. Spans name routes and parameterized SQL, never paths, bind values, log text or error messages.</p>'+
    snippet('Environment · where ./bookshelf serve runs','OTEL_EXPORTER_OTLP_ENDPOINT=https://otel.example.com\nOTEL_EXPORTER_OTLP_HEADERS=x-api-key=SECRET\nOTEL_SERVICE_NAME=bookshelf\nOTEL_TRACES_SAMPLER=parentbased_traceidratio\nOTEL_TRACES_SAMPLER_ARG=0.1','bash')+

    '<p><a href="https://github.com/caramelizedev/caramel/blob/v0.15.0/docs/decisions/0027-crema-tracing.md" target="_blank" rel="noopener noreferrer">Read the tracing design ↗</a> · <a href="https://github.com/caramelizedev/caramel/blob/v0.15.0/docs/decisions/0028-crema-production-access.md" target="_blank" rel="noopener noreferrer">Read the production access design ↗</a></p>'+

    prove('c-crema-prove','Check what your application reports','<p>Add a route that raises, start <code>frappe dev</code>, then watch the failure reach each surface and no log line. This is the sequence Caramel’s own <code>scripts/check crema</code> runs against a fixture application in production mode.</p>'+
    snippet('app/actions/probes/show.cr','module App::Probes\n  struct Show < App::ApplicationAction\n    contract do\n    end\n\n    def handle(contract : Contract)\n      raise "probe: do-not-log"\n    end\n  end\nend','crystal')+

    contract([['Needs','A generated application that has run <code>frappe migrate</code>; it declares the <code>lexbor</code> shard 3.6.4 as a development dependency'],['You will have','Request specs that assert rendered elements against isolated database state'],['Covers','<code>have_html</code>, <code>render_page</code>, <code>render_partial</code>, <code>strict: true</code> and scoped matching'],['Proved by','<code>frappe check</code> · <code>frappe corretto</code> · <code>frappe lint</code>']])+
    '<h2 id="c-testing-start">Start with a real response</h2><p>The generated <code>spec/spec_helper.cr</code> already configures Corretto; the reference lists what it does. This guide works on a Book resource and the request spec its generator writes.</p><button class="c-secondary cursor-interaction" data-page="corretto">Read the Corretto reference →</button>'+snippet('Terminal · inside your application','frappe make resource Book title:string\nfrappe migrate','bash')+
    expect('<code>frappe make resource</code> prints <code>Generated</code> for the model, changeset, actions, views, <code>spec/requests/books_spec.cr</code>, a migration, <code>config/routes.cr</code> and <code>config/paths.cr</code>, then <code>Run frappe migrate to apply the new schema.</code> <code>frappe migrate</code> ends with <code>The database matches the declared schema.</code>')+
    '<p>Inside an example, a session requests the page and the expectation describes what the response must contain. Add this example to the generated spec:</p>'+snippet('spec/requests/books_spec.cr · a second example','it "shows a book with its title escaped" do\n  Corretto.session do |client, db|\n    created = client.post("/books", params: {"title" => "<Dune>"})\n    path = "/books/#{App::Book.query.order_by(:id, :desc).first!(db).id}"\n    created.should redirect_to(path)\n    shown = client.get(path)\n    shown.should have_status(200)\n    shown.should render_page("Book")\n    shown.should have_html {\n      section(class: "form-page") {\n        h1 { "Book" }\n        dl { dd { "<Dune>" } }\n        a(href: "#{path}/edit") { "Edit book" }\n      }\n    }\n  end\nend')+
    '<p>The block records requirements independently of the view renderer. Expected strings are decoded literal text: <code>"&lt;Dune&gt;"</code> checks escaped user text. Build expectations from values and elements, rather than rendering an application view as the expected result.</p>'+
    '<h2 id="c-testing-requirements">Select the requirements that matter</h2>'+
    lookup(['Rule','What matches'],[
      ['Roots','each block has one root'],
      ['Wrappers and attributes','extra wrappers, markup and attributes are allowed by default; a nested requirement may sit below extra wrappers'],
      ['Order','sibling order does not matter; nested requirements belong to the same matched ancestor; sibling requirements consume distinct nodes'],
      ['Text','exact after HTML whitespace normalization: space, tab, line feed, form feed and carriage return collapse to one space, with surrounding spaces removed; nonbreaking spaces stay distinct, and <code>pre</code> and <code>textarea</code> preserve whitespace'],
      ['Classes','match a token subset'],
      ['Boolean attributes','check presence or absence'],
      ['Arrays','flatten, omit <code>nil</code> and join with spaces'],
      ['Nested keywords','become hyphenated names: <code>data: {book_id: 7}</code> checks <code>data-book-id="7"</code>'],
      ['ARIA and data values','use strings, such as <code>aria_expanded: "false"</code>']
    ])+snippet('Corretto · scopes and counts','shown.should have_html(within: "#books", count: 2) { li(class: "book") }\nshown.should have_html(count: 0) { script(src: "/unexpected.js") }\nshown.should_not have_html { p { "Access denied" } }')+

    '<h2 id="c-testing-strict">Check structure and partial responses</h2><p><code>strict: true</code> compares complete attributes and ordered direct children, ignoring comments and insignificant formatting whitespace. Classes stay an unordered set. Use it when the complete subtree is the contract; for mixed content, put <code>plain</code> between element calls.</p>'+snippet('Corretto · a complete subtree','shown.should have_html(strict: true) {\n  ul(class: "books") {\n    li { "Dune" }\n    li { "Solaris" }\n  }\n}')+
    '<p>The block overload of <code>render_partial</code> checks the fragment’s content inside the same hx-partial envelope as its target and swap. HTML5 table and select contexts are supported, including rows or cells inside partial envelopes.</p>'+snippet('Corretto · fragment response','created.should render_partial("#note-list", swap: "beforeend") {\n  li { "<b>Milk</b> ×2" }\n}')+
    '<p>Attribute order, quoting and entity spelling do not affect these assertions. Both plain response matchers and block expectations are available; the reference lists each matcher and what it requires.</p><p>These raise even for negative assertions:</p>'+
    rules([['A negative <code>count:</code>','raises ArgumentError'],['<code>within:</code> matches no element','raises ArgumentError'],['A block with no root, or more than one','raises ArgumentError'],['HTML Lexbor cannot parse','raises ArgumentError'],['An invalid selector','raises']])+
    '<h2 id="c-testing-install">Install the test dependencies</h2><p>Generated applications declare the <code>lexbor</code> shard 3.6.4 as a development dependency; it builds liblexbor 3.0.0 from a SHA-256-verified source download with <code>cc</code> and <code>ar</code>, which needs network access and the C toolchain your <button class="c-secondary cursor-interaction" data-page="local">local environment</button> installs. Keep this pin and the matching lockfile entry; <code>frappe setup</code> uses a frozen install. Production installs (<code>shards install --production</code>) neither restore nor build the parser, and only Corretto links it.</p>'+snippet('shard.yml · development dependencies','development_dependencies:\n  lexbor:\n    github: kostya/lexbor\n    version: 3.6.4','yaml')+
    '<p>An application made before 0.6.0 adds the same dependency, then refreshes <code>shard.lock</code> with the framework’s Shards launcher, because <code>frappe setup</code> does not create missing lock entries:</p>'+snippet('Terminal · inside your application','lib/caramel/scripts/shards install\nfrappe setup','bash')+
    expect('<code>shard.lock</code> gains a <code>lexbor</code> entry at <code>3.6.4</code> and <code>lib/lexbor</code> appears. <code>frappe setup</code> ends with <code>NAME is configured. Run frappe dev.</code>')+

    '<p>Each upgrade section is written from the release’s entry in <a href="https://github.com/caramelizedev/caramel/blob/v0.15.0/CHANGELOG.md" target="_blank" rel="noopener noreferrer">CHANGELOG.md ↗</a>: what to run, what to edit, and what changes without an edit. Upgrade one release at a time and run the proof at the end after each.</p>'+
    kicker('Upgrade notes')+
    '<h2 id="c-releases-upgrade-0150">Upgrading to 0.15.0</h2><p>Upgrade Caramel and Frappé together. Run <code>frappe migrate</code> once for a framework migration; these changes can need an edit.</p><ul><li>Every database connection sets <code>statement_timeout</code> and <code>lock_timeout</code> when it opens, and the client’s read timeout follows the statement timeout, 5 seconds behind it. <code>serve</code>, <code>work</code>, <code>seed</code>, <code>lint</code> and <code>drift</code> default to 30 s and 5 s; <code>migrate</code> defaults to no statement timeout and 5 s. A statement that ran longer than 30 s now fails with <code>canceling statement due to statement timeout</code>. Raise <code>CARAMEL_STATEMENT_TIMEOUT</code> or <code>CARAMEL_LOCK_TIMEOUT</code> for a process that needs longer, and <code>CARAMEL_MIGRATION_STATEMENT_TIMEOUT</code> or <code>CARAMEL_MIGRATION_LOCK_TIMEOUT</code> for <code>migrate</code>: whole seconds, 0 to 86400, 0 for none. <button class="c-secondary cursor-interaction" data-page="cremaref">The Crema reference lists the variables →</button></li><li>A job whose process dies or loses its connection is failed on its third release instead of being redelivered forever: maintenance records <code>Caramel::ColdBrew::AbandonedJob</code>, calls the <code>on_failed</code> hooks, and <code>jobs retry</code> runs it again. Released runs no longer count against <code>retry_on</code> attempts.</li><li>The framework migration <code>20260927000006</code> adds <code>caramel_jobs.releases</code> and takes a lock on every <code>caramel_jobs</code> partition. Run <code>frappe migrate</code> while no job is running, or <code>migrate</code>’s 5 s lock timeout may refuse it; <code>CARAMEL_MIGRATION_LOCK_TIMEOUT</code> raises it.</li></ul>'+
    '<h2 id="c-releases-upgrade-0140">Upgrading to 0.14.0</h2><p>Upgrade Caramel and Frappé together. There are no framework migrations; an application with a SweetTalk domain adds one of its own, and these changes can need an edit.</p><ul><li>With <code>caramel/sweet_talk</code>, a <code>SweetTalk::Refusal</code> that an action’s <code>handle</code> does not rescue answers 422 with its message under <code>_base</code>, shaped like a failed contract: <code>{"errors": {"_base": [message]}}</code> for JSON clients, the contract failure page for browsers and htmx, and text starting <code>ERR INVALID:422</code> for other clients. A <code>SweetTalk::Missing</code> answers 404. Neither is reported to Crema as an error. An action that rescues them itself is unchanged, and <code>SweetTalk::Boundary</code> still answers 500. Asking an aggregate for its id before <code>create</code>, or an event for its subject before it is emitted, raises <code>NilAssertionError</code> instead of <code>SweetTalk::Missing</code>.</li><li>A contract field may take a SweetTalk value or an aggregate’s id: <code>field quantity : Ordering::Quantity</code> binds as an <code>Int32</code>, and the value’s refusal is the field’s error. <code>CARAMEL_FIELD_&lt;NAME&gt;</code> constants gain a sixth element, the declared type, so a macro of your own that destructures exactly five must take six.</li><li>A lifecycle’s <code>state</code> column has a <code>CHECK</code> constraint named <code>check_&lt;table&gt;_state_&lt;8 hex digits&gt;</code>, and a state of two or more words is stored as <code>moves</code> spells it. 0.13.0 stored <code>awaiting_payment</code> as <code>awaitingpayment</code>: first add a migration that respells such rows, such as <code>UPDATE ordering_payments SET state = \'awaiting_payment\' WHERE state = \'awaitingpayment\'</code>, and migrate, then run <code>frappe db diff</code>, which adds each constraint as <code>NOT VALID</code> and validates it in the <code>_concurrently</code> migration. <code>frappe migrate</code> stops, naming the constraint, while a row holds any other text; the constraint stays <code>NOT VALID</code> until you fix those rows and migrate again. A lifecycle whose constraint name would pass PostgreSQL’s 63 bytes no longer compiles; give the context or the aggregate a shorter name, since <code>renamed_from:</code> keeps the old table and its long name.</li><li>A <code>finds</code> that names an unknown attribute or state, or a list of entities, fails to compile even when nothing calls it. Code outside an aggregate can no longer call <code>__sweettalk_rows</code>; give the aggregate a <code>finds</code> with a block instead.</li><li>Calling another context’s service, as in <code>Catalogue.price_of(tea)</code>, counts as naming <code>Catalogue::</code>: outside <code>border Catalogue</code> it compiles only where the context follows Catalogue. Move the call into the border, or declare <code>follows: Catalogue</code>. In a border the call draws a dependency edge, so two contexts whose borders call each other no longer compile: let one of them react to the other’s events instead. A context names <code>Caramel::Outbound</code> or <code>HTTP::Client</code> only inside a border with an outside system, <code>border Cards, outside: "…" do … end</code>.</li><li>Additive, nothing to edit: <code>specification</code> names a rule once, <code>finds</code> and <code>counts</code> sort, limit and count, a context names its <code>subdomain:</code> and what it <code>publishes</code>. <button class="c-secondary cursor-interaction" data-page="sweettalk">The SweetTalk guide lists them →</button></li><li><code>frappe agent-manifest</code> prints a <code>GUIDES:</code> line after <code>DOCS:</code>, so a tool that reads the manifest by line number finds the commands one line later.</li><li>For applications made earlier: to give agents the guides in Markdown, add <code>Every page of it in Markdown: https://caramelize.dev/docs/VERSION/llms.txt</code> after the documentation link in <code>AGENTS.md</code>. An application with a domain gets the SweetTalk skill with its next <code>frappe make domain</code>, or now with <code>mkdir -p .claude/skills/sweettalk &amp;&amp; cp lib/caramel/templates/skills/sweettalk/SKILL.md .claude/skills/sweettalk/</code>, which also refreshes it after a later upgrade; add <code>Domain rules: .claude/skills/sweettalk/SKILL.md, which frappe make domain writes</code> after <code>Domain:</code> in <code>AGENTS.md</code>.</li></ul>'+
    '<h2 id="c-releases-upgrade-0130">Upgrading to 0.13.0</h2><p>Upgrade Caramel and Frappé together. There are no framework migrations and nothing is removed; one call stops compiling, and these changes can need an edit.</p><ul><li>Keyword <code>where</code> no longer takes a value that may be nil, such as a <code>String?</code> variable, because nil matched the rows whose column IS NULL. The call fails to compile with <code>…MayBeNil</code> in the error. Narrow the value first (<code>if token = contract.token</code>), or use the new <code>where_null(:column)</code>; the literal <code>where(column: nil)</code> still works.</li><li>A request may send at most 4,096 values and 128 files, and a multipart body’s boundaries and part headers count toward its size; more answers 413. Multipart files are stored only for a route whose contract has an <code>UploadedFile</code> field.</li><li>A Crema sink or exporter that matches <code>Caramel::Crema::SpanKind</code> exhaustively must handle the new <code>domain</code> kind.</li><li><code>sudo scripts/install-local-integration apply</code> installs only a bundle that the user who ran <code>sudo</code> prepared, and refuses to run as root without <code>sudo</code>. A <code>CARAMEL_LATTE_SWIFT_CACHE</code> directory must be yours alone.</li><li>SweetTalk arrives, experimental, and nothing changes until an application requires <code>caramel/sweet_talk</code>. <code>frappe make domain NAME CONTEXT --means=TEXT</code> starts a domain; a multi-tenant application names its tenant with <code>tenant App::Account</code> before its first context. Applications generated before this release add the <code>Lint/UnusedArgument</code> exclusion for <code>app/domain/**</code> to their <code>.ameba.yml</code> by hand, as <code>lib/caramel/templates/application/.ameba.yml</code> has it.</li></ul>'+
    '<h2 id="c-releases-upgrade-0120">Upgrading to 0.12.0</h2><p>Upgrade Caramel and Frappé together. There are no framework migrations and nothing is removed; one change can need an edit.</p><ul><li>On SIGTERM, <code>serve</code> now finishes in-flight requests for up to 25 s before it exits, and an open server-sent events stream holds it for the whole 25 s. Give a supervisor that stops <code>serve</code> at least 30 s.</li><li>Applications can run in production on Linux: <code>frappe build</code> writes a static linux/amd64 artifact, <code>serve</code> reads public files from <code>CARAMEL_ROOT</code> and runs without workers with <code>--no-workers</code>, <code>APP jobs unknown</code> lists queued jobs a binary cannot run and <code>APP db roles</code> prints the role script. Nothing to edit. <button class="c-secondary cursor-interaction" data-page="deploy">The Production guide puts them in order →</button></li></ul>'+
    '<h2 id="c-releases-upgrade-0110">Upgrading to 0.11.0</h2><p>Upgrade Caramel and Frappé together. There are no framework migrations and nothing is removed; these changes can need an edit.</p><ul><li>The schema document <code>frappe db diff</code> reads is now version 3, because it carries CHECK constraints.</li><li>SugarORM owns the CHECK constraints named <code>check_…</code>. <code>frappe db diff</code> drops a <code>check_…</code> constraint that no schema declares; any other CHECK constraint stays and is noted. Declare a hand-written <code>check_…</code> constraint, or rename it, before you diff.</li><li>Two schemas that name one table no longer compile. Remove the duplicate or give one a different table.</li><li>Run <code>shards update</code> so your application takes crystal-db 0.15.0 and crystal-pg 0.31.0.</li><li>After a job is renamed or moved, name its old class with <code>renamed_from "Old::Name"</code> in the job. <code>work</code> and <code>migrate</code> now log a warning naming queued class names that no job claims.</li></ul>'+
    '<h2 id="c-releases-upgrade-0100">Upgrading to 0.10.0</h2><p>Upgrade Caramel and Frappé together. There are no migrations and no breaking changes; the change is in the development tools.</p><ul><li>The inspector’s request page shows each query as a card instead of a table row: the statement with one clause per line and coloured, and each bind listed beside its <code>$n</code>. Pointing at a placeholder or a bind lights up both. <strong>Copy SQL</strong> and <strong>Copy with values</strong> still write the statement as it ran.</li></ul>'+
    '<h2 id="c-releases-upgrade-090">Upgrading to 0.9.0</h2><p>Upgrade Caramel and Frappé together. There are no migrations and no breaking changes; the changes are in the development tools.</p><ul><li>The development toolbar is redesigned: its route, status, time, query count and flags link to their place on the request’s page in the inspector, <code>`</code>, <code>j</code> and <code>k</code> work from the keyboard, and <strong>Copy for an agent</strong> copies the request as Markdown.</li><li>Each query on the inspector’s request page has <strong>Copy SQL</strong> and <strong>Copy with values</strong>. A query keeps its first 20 binds, and a literal over 2,000 bytes is not kept for copying: those placeholders stay as <code>$n</code> and the copy starts with a comment saying so. A <code>nil</code> bind is now recorded as <code>NULL</code> and shown bare in the Binds column; the text <code>NULL</code> stays quoted.</li><li>The toolbar, the inspector and the production console follow the system’s light or dark appearance, with a Theme button to choose. The console keeps its own choice.</li><li>The application binary’s <code>ops</code> commands now refuse a flag they would have ignored instead of dropping it silently.</li></ul>'+
    '<h2 id="c-releases-upgrade-080">Upgrading to 0.8.0</h2><p>Upgrade Caramel and Frappé together. The schema document <code>frappe db diff</code> reads is now version 2, and <code>SugarORM::Catalog::ForeignKey</code> holds <code>columns</code> and <code>references_columns</code> so a key can span several columns. Two framework migrations and these edits apply.</p><ul><li>Run <code>frappe migrate</code>. Two framework migrations add <code>caramel_jobs.context</code> and <code>caramel_metrics</code>.</li><li>Run <code>latte stop</code> once if Latte is running, so the next command starts the new one. Frappé, Corretto and Latte.app now use Latte’s control API 2. The managed PostgreSQL restarts once to preload <code>pg_stat_statements</code> and <code>auto_explain</code>.</li><li>To keep per-minute aggregates, add <code>require "caramel/crema/recorder"</code> after <code>require "caramel"</code> in <code>config/application.cr</code>. New applications already have it.</li><li>Add <code>Caramel/Dump</code> to an existing application’s <code>.ameba.yml</code>, as new applications have it, so <code>frappe lint</code> reports a leftover <code>dump</code>.</li><li>Logging now sets itself up: JSON in production, text in development and test. The old <code>error_type</code> log line is gone; the <code>error</code> line carries <code>error_class</code> and <code>fingerprint</code>. <code>Caramel::DevelopmentError.response</code> now takes a <code>Caramel::Crema::ErrorReport</code>; <code>Caramel::Database::Config</code> gains <code>application_name</code>, and <code>SugarORM::Repo</code> the private hooks <code>observe</code> and <code>observe_checkout</code>, which <code>caramel/crema/sql</code> redefines.</li><li>To adopt the agent files, copy <code>AGENTS.md</code> and <code>CLAUDE.md</code> from <code>lib/caramel/templates/application</code>; existing applications keep their own.</li><li>Opt in as you need: <code>require "caramel/crema/otlp"</code> exports traces to the endpoint <code>OTEL_EXPORTER_OTLP_ENDPOINT</code> names; the ops socket opens beside <code>serve</code>, and for <code>work</code> when <code>CARAMEL_OPS_SOCKET</code> names a path; <code>frappe logs access</code> prints the site’s access log; <code>frappe make tenancy MODEL</code> makes the application multi-tenant.</li></ul><p><button class="c-secondary cursor-interaction" data-page="crema">What Crema adds →</button></p>'+
    '<h2 id="c-releases-earlier">Earlier releases</h2><p>The notes start at 0.8.0, the release that first put its upgrade steps on this page. Each release’s guides stay published at <code>/docs/VERSION/</code> from 0.4.0 on, and CHANGELOG.md holds every release’s notes. The ones before 0.8.0 that still need an edit: 0.7.0 changes <code>html lang: "en"</code> in <code>app/views/layouts/application.cr</code> to <code>html lang: Caramel.language</code> and replaces <code>Caramel::Application::EXPIRED_FORM</code> with <code>Caramel::Wording.expired_form</code>; 0.6.0 adds Lexbor 3.6.4 under <code>development_dependencies</code>; 0.5.0 binds JSON bodies through the contract and gives specs a committed <code>.env.test</code>; 0.4.2 pins Crystal 1.21.1.</p>'+
    kicker('Supported today')+
    '<h2 id="c-releases-tools">Runtime and local tools</h2><p>Caramel is a source-built Crystal framework with a managed toolchain; the versions it pins and the machine it develops on are stated once, in <button class="c-secondary cursor-interaction" data-page="learn">Your first application</button>. Frappé creates projects, generates resources and supervises builds; Latte supplies managed services and named HTTPS. An application’s <code>shard.lock</code> selects its framework release, and Frappé dispatches to the matching installation; <code>frappe installations install VERSION</code> installs another release beside this one.</p><p><a href="https://github.com/caramelizedev/caramel/releases/tag/v0.15.0" target="_blank" rel="noopener noreferrer">Caramel 0.15.0 source release ↗</a></p>'+
    '<h2 id="c-releases-requests">Requests and responses</h2><p>Typed action contracts bind route and query values, URL-encoded forms, multipart uploads, and JSON objects. The default policy checks CSRF for writes and limits ordinary request input to 2 MiB; multipart uploads have a separate 64 MiB budget. Use per-action <code>ingress</code> for a custom limit, authenticated APIs, or exact raw webhook bytes.</p><p>Actions return HTML or JSON according to the request. <code>render_errors</code> handles errors found after contract binding. Blueprint views write typed HTML with escaped text and attributes; htmx partial responses update selected page regions.</p>'+
    '<h2 id="c-releases-data">Data and resource generation</h2><p>SugarORM provides typed schemas, codecs for any field type, changesets, queries, explicit preloads, row locks, upserts, version columns and CHECK constraints. Derive a migration with <code>frappe db diff</code>, review it, and apply it with <code>frappe migrate</code>; <code>frappe seed</code> runs <code>db/seeds.cr</code>. <code>frappe make resource</code> generates application-owned models, changesets, actions, views, routes, migrations, and request specs.</p><p>Use <code>:server</code> for fields populated by the action, <code>:unique</code> for unique indexes and constraint checks, and <code>:url</code> for URL validation and inputs. <code>--only=create,show</code> generates a smaller action set; create and show are required, and edit needs new and update.</p><p><button class="c-secondary cursor-interaction" data-page="sugarorm">Read the SugarORM reference →</button></p>'+
    '<h2 id="c-releases-work">Background work</h2><p>Cold Brew stores jobs in PostgreSQL and supports transactional enqueueing, retry policies, durable status, retry and failure hooks, renamed jobs, recurring schedules, PubSub, and cache. A job whose process died on three of its runs fails as <code>Caramel::ColdBrew::AbandonedJob</code> and can be retried. The application binary runs queues through <code>serve</code> or a worker-only <code>work</code> process with queue and concurrency options. External calls can repeat, so use a stable identifier for deduplication.</p><p><button class="c-secondary cursor-interaction" data-page="coldbrew">Read the Cold Brew reference →</button></p>'+
    '<h2 id="c-releases-checks">Development and testing</h2><p>Corretto drives in-process application requests against isolated test databases. Its client sends forms, multipart uploads, JSON, or exact raw bodies. Blueprint-shaped <code>have_html</code> expectations inspect decoded rendered HTML; <code>render_partial</code> can check an envelope’s target, swap, and content together.</p><p>Generated applications pin Lexbor 3.6.4 under development dependencies. Development installs need cc, ar, and network access for the verified native parser source. Production installs omit the parser. Put application-owned test settings in committed <code>.env.test</code>; development <code>.env</code> does not reach specs.</p><p>Every page of these guides has a Markdown edition at its address followed by <code>index.md</code>, listed in <code>https://caramelize.dev/docs/0.15.0/llms.txt</code>, and <code>frappe agent-manifest</code> prints that address on its <code>GUIDES:</code> line.</p>'+
    '<h2 id="c-releases-i18n">Internationalization</h2><p>Caramel has opt-in, typed translations. Run <code>frappe make locale CODE</code> to add Crystal catalogs and enable translated resource generation. Views and actions use <code>t</code> for messages and <code>l</code> for number and time formatting. Language selection supports a switch, optional URL prefixes, cookies, and browser preferences.</p><p>Contract and changeset errors, JSON error messages, and framework pages use the request’s locale. Missing translations fall back, and <code>frappe translations</code> reports what remains. Background jobs carry their language explicitly.</p><p><button class="c-secondary cursor-interaction" data-page="i18n">Translate your application →</button></p>'+
    '<h2 id="c-releases-tenancy">Multi-tenancy</h2><p>An application can be multi-tenant. <code>frappe make tenancy MODEL</code> adds the tenant schema, sign-up and home pages, and a <code>tenant</code> block in the routes; resources generated afterwards belong to the tenant, and <code>--central</code> makes one every tenant shares.</p><p><button class="c-secondary cursor-interaction" data-page="tenancy">Add tenants →</button></p>'+
    '<h2 id="c-releases-sweettalk">Domain-Driven Design</h2><p>An application can model its domain in SweetTalk, an opt-in language whose contexts, values, aggregates, events, policies, projections and processes expand into SugarORM and Cold Brew. <code>frappe make domain NAME CONTEXT --means=TEXT</code> starts one in <code>app/domain/</code> and writes a skill that gives agents its rules. Since 0.14.0 a refusal answers 422 from an action, values and ids bind as contract fields, and a lifecycle’s states are held in a PostgreSQL check. The guide maps each Domain-Driven Design pattern to its word and states its experimental status; the Box Office path builds one domain end to end.</p><p><button class="c-secondary cursor-interaction" data-page="sweettalk">Speak the domain’s language →</button> <button class="c-secondary cursor-interaction" data-page="boxoffice">Build a box office →</button></p>'+
    '<h2 id="c-releases-observability">Observability</h2><p>Every routed request, job and schedule run gets a request id, a trace and one canonical log line. In development, <code>frappe dev</code> adds an inspector, a toolbar, richer error pages and the <code>frappe traces</code>, <code>trace</code> and <code>errors</code> commands. In production, an owner-only ops socket serves status, Prometheus text, recent errors and a console; the recorder and the OTLP exporter are opt-in. Latte adds statement statistics, menu-bar error counts and notifications, per-site access logs and a local trace collector on <code>127.0.0.1:4318</code>.</p><p><button class="c-secondary cursor-interaction" data-page="crema">Read the observability guide →</button></p>'+
    '<h2 id="c-releases-production">Production</h2><p>An application runs in production on Linux: <code>frappe build</code> writes a static linux/amd64 artifact, <code>serve --no-workers</code> and <code>work</code> are the process roles, <code>GET /health</code> answers readiness, SIGTERM drains for up to 25 s, <code>APP db roles</code> prints the role script and <code>APP jobs unknown</code> checks the queue before cutover. Every connection carries the statement and lock timeouts of 0.15.0.</p><p><button class="c-secondary cursor-interaction" data-page="deploy">Read the Production guide →</button></p>'+
    kicker('Limits')+
    '<h2 id="c-releases-limits">Current limits</h2><ul><li>Caramel ships no command that provisions servers or deploys; <code>frappe build</code> ends at the artifact.</li><li>No generator for authentication: the sessions recipe shows the tables and actions to write by hand.</li><li>Multipart files are parsed and bounded, but no recipe yet stores a file and removes it; <code>storage/</code> is generated empty.</li><li>Frappé has no extension point for commands of its own; an application adds commands to its binary with <code>Caramel::Crema.command</code>.</li><li>Installing a release still starts from a Git checkout of the framework: <code>frappe installations install VERSION</code> exists once one release is registered, and there is no installer for a machine without one.</li><li>Recipes labelled Draft are written against 0.15.0 and not run end to end; the cookbook marks each.</li><li>SweetTalk is experimental until an application has run it in production.</li></ul>'+
    prove('c-releases-prove','Check an upgraded application',snippet('Terminal · inside the application, after each release','frappe migrate\nfrappe check\nfrappe corretto\nfrappe lint','bash')+passing('<code>frappe migrate</code> ends with <code>The database matches the declared schema.</code>, <code>frappe check</code> exits 0, <code>frappe corretto</code> ends with <code>Corretto: N of N workers passed</code> and <code>frappe lint</code> exits 0.'))+
    next('deploy','Take the application to production'),
  deploy: () => heading('Guides / Production','From local to live.','Build the release artifact, set the variables a compiled application needs, and run its process roles under the contract any deploy tool can rely on.')+
    contract([['Release','0.15.0'],['Needs','A committed application tree, a container engine such as Docker Desktop for the build, and a Linux host with PostgreSQL for the run'],['You will have','A <code>linux/amd64</code> artifact that holds <code>bin/SHARD</code> and <code>public/</code>, migrated, serving on a Unix socket and answering <code>GET /health</code>'],['Status','The build, the role script, <code>migrate</code>, <code>serve --no-workers</code>, <code>GET /health</code> and SIGTERM run in <code>scripts/check frappe-project</code> when a container engine runs; <code>jobs unknown</code> and the proxy are not run by a check'],['Proved by','<code>frappe build</code> · <code>APP migrate</code> · <code>curl --unix-socket</code>']])+
    '<p>A compiled application promises any deploy tool the behaviour below, as <a href="https://github.com/caramelizedev/caramel/blob/v0.15.0/docs/decisions/0032-application-production-contract.md" target="_blank" rel="noopener noreferrer">ADR 0032 ↗</a> records. <code>SHARD</code> is the application’s name in <code>shard.yml</code>, such as <code>bookshelf</code>; <code>APP</code> below stands for the unpacked <code>bin/SHARD</code>, such as <code>/srv/bookshelf/bin/bookshelf</code>.</p>'+
    guideMap('deploy',[['Build',[['c-deploy-contract','Build the artifact'],['c-deploy-public','Serve public files']]],['Run',[['c-deploy-env','Set the environment'],['c-deploy-now','Run the process roles'],['c-deploy-ready','Check readiness'],['c-deploy-shutdown','Shut down gracefully']]],['Cut over',[['c-deploy-unknown','Check for unknown jobs'],['c-deploy-database','Set up the database'],['c-deploy-order','Cut over in order']]],['Limits',[['c-deploy-refusals','What does not compile'],['c-deploy-gaps','Not covered yet']]]])+
    kicker('Stage 1 · Build')+
    '<h2 id="c-deploy-contract">Build the artifact</h2>'+snippet('Terminal · inside the application','frappe build','bash')+
    expect('Prints the path of <code>.caramel/build/SHARD-YYYYmmddTHHMMSSZ-SHA7-linux-amd64.tar.gz</code> as its only line of output. The archive holds <code>bin/SHARD</code> and <code>public/</code>.')+
    '<p><code>frappe build</code> publishes <code>app/assets</code> into <code>public/</code>, then compiles the committed tree with <code>crystal build --release --static</code> in the pinned <code>crystallang/crystal:1.21.1-alpine</code> image for <code>linux/amd64</code>, keeping debug info. Alpine’s <code>gmp-static</code> is installed first, so an application that uses <code>BigDecimal</code> links GMP into the binary. It needs a container engine, such as Docker Desktop, for this build only.</p>'+
    rules([['<code>frappe build</code> with uncommitted changes in the working tree','refuses to build'],['<code>frappe build</code> when publishing <code>app/assets</code> into <code>public/</code> leaves changes','refuses to build']])+
    '<h2 id="c-deploy-public">Serve public files</h2><p><code>serve</code> reads <code>public/</code> from <code>CARAMEL_ROOT</code> when it is set, so the binary runs from wherever the artifact is unpacked.</p>'+
    rules([['<code>CARAMEL_ROOT</code> that is not an absolute path','exits 1 with <code>CARAMEL_ROOT must be an absolute path</code>'],['<code>CARAMEL_ROOT</code> with no <code>public/</code> inside it','exits 1 with <code>CARAMEL_ROOT has no public directory</code>']])+
    kicker('Stage 2 · Run')+
    '<h2 id="c-deploy-env">Set the environment</h2><p>With <code>CARAMEL_ENV</code> unset the binary runs as production. These variables are read when a process starts:</p>'+

  boxoffice: () => heading('Learn / The Box Office path','Sell every seat once.','Build a box office in SweetTalk: seats held for ten minutes, sold once, and offered to a waitlist when a hold runs out, with specs that prove the refusal, the timer and the waitlist.')+
    contract([['Needs','A Caramel installation set up as in <button class="c-secondary cursor-interaction" data-page="learn">Your first application</button>'],['You will have','A <code>boxoffice</code> application whose SweetTalk domain holds, sells and releases seats and keeps a waitlist, with two pages and passing specs'],['Status','Run end to end by <code>scripts/check page-boxoffice</code>; SweetTalk itself is experimental'],['Proved by','<code>frappe check</code> · <code>frappe corretto</code> · <code>frappe lint</code>']])+
    '<p>Two guests see the last two seats of a show at the same moment. Code that reads the free seats, checks them and writes a hold lets both through, and the show is oversold. A SweetTalk command locks its aggregate’s row and reads it again before it runs, so the second guest is refused; Caramel’s own specs prove that lock. This path builds a box office on that rule.</p><button class="c-secondary cursor-interaction" data-page="sweettalk">Read how a command runs →</button>'+
    '<h2 id="c-boxoffice-create">01 · Create the application and its domain</h2><p>Create the application, then start its SweetTalk domain with one context, Seating.</p>'+
    snippet('Terminal · after machine setup','frappe new boxoffice\ncd boxoffice','bash')+
    expect('Prints <code>Created boxoffice.</code>, then <code>boxoffice is configured at https://boxoffice.caramel</code>.')+
    snippet('Terminal · inside boxoffice','frappe make domain BoxOffice Seating --means="selling the seats of each show"','bash')+
    expect('Prints <code>Generated</code> for each of the four files it writes, <code>app/domain/box_office.cr</code> first, then a <code>Next:</code> line that names <code>frappe db diff --name create_box_office</code>.')+
    '<h2 id="c-boxoffice-show">02 · Give each show its seats</h2><p>Replace <code>app/domain/box_office.cr</code> with the five parts in steps 02 to 05, pasted in page order with a blank line between them. Each caption says where its part goes. A snippet drops the indentation of its place; <code>frappe format</code> puts it back. A show owns its capacity, the holds still waiting for payment and the tickets already paid for, so one aggregate sees every seat.</p>'+
    snippet('app/domain/box_office.cr · part 1 of 5 · opens the module, context Seating and aggregate Show',`# The BoxOffice domain, in SweetTalk (ADRs 0030 and 0031). Its words, such as
# context, value, aggregate, event and whenever, exist only inside this module.
module App::BoxOffice
  include SweetTalk

  context Seating, subdomain: :core, means: "selling the seats of each show" do
    HOLD_FOR = 10.minutes

    value Capacity, Int32, within: 1..5000, means: "the seats a show can sell"
    value Seats, Int32, within: 1..8, means: "the seats one guest takes at one checkout"
    value Email, String, matches: /\\A[^@\\s]+@[^@\\s]+\\z/, length: 3..254,
      means: "where we send a guest's tickets"

    aggregate Show, means: "one performance and the seats it sells" do
      has title : String
      has starts_at : Time
      has capacity : Capacity
      has issued : Int32 = 0
      has holds : Array(Hold)
      has tickets : Array(Ticket)
      moves on_sale >> closed
      never "A show cannot sell more seats than it has." { sold + held > capacity.to_i }

      entity Hold, means: "seats kept for one guest while they pay" do
        has number : Int32
        has guest : Email
        has seats : Seats
        has expires_at : Time
      end

      entity Ticket, means: "seats one guest paid for" do
        has number : Int32
        has guest : Email
        has seats : Seats
      end

      the held : Int32 = holds.sum(&.seats.to_i)
      the sold : Int32 = tickets.sum(&.seats.to_i)
      the left : Int32 = capacity.to_i - sold - held`)+
    '<p>Values name the capacity, the seats and the email, with their bounds. <code>the</code> derives what is held, sold and left from what the show stores. <code>moves</code> gives the show two states, on sale and closed, and <code>never</code> is the rule every command keeps; a command’s own <code>refuse</code> tells the guest why first. The guide states each word’s rules.</p><button class="c-secondary cursor-interaction" data-page="sweettalk">Read the SweetTalk guide →</button>'+
    '<h2 id="c-boxoffice-hold">03 · Hold, sell and release seats</h2>'+
    snippet('app/domain/box_office.cr · part 2 of 5 · inside aggregate Show, after the left; its last end closes the aggregate',`  event Scheduled, means: "a show went on sale"
  event Held, number : Int32, guest : Email, seats : Seats, expires_at : Time,
    means: "seats were kept for a guest until a time"
  event Sold, number : Int32, guest : Email, seats : Seats,
    means: "a guest paid for the seats held for them"
  event Released, number : Int32, seats : Seats, reason : String,
    means: "held seats went back on sale, and why"

  factory schedule(title : String, starts_at : Time, capacity : Capacity) do
    emit Scheduled
  end

  to hold(guest : Email, seats : Seats) do
    refuse "Sales for #{title} have closed." if closed?
    refuse "#{title} is sold out." if left.zero?
    refuse "Only #{left} of #{capacity.to_i} seats left for #{title}." if seats.to_i > left
    @issued += 1
    expires_at = Time.utc + HOLD_FOR
    @holds << Hold.new(@issued, guest, seats, expires_at)
    emit Held, number: @issued, guest: guest, seats: seats, expires_at: expires_at
  end

  to sell(number : Int32) do
    hold = holds.find { |kept| kept.number == number }
    refuse "Hold #{number} is no longer held." unless hold
    @holds.reject! { |kept| kept.number == number }
    @tickets << Ticket.new(number, hold.guest, hold.seats)
    emit Sold, number: number, guest: hold.guest, seats: hold.seats
  end

  to release(number : Int32, reason : String) do
    if hold = holds.find { |kept| kept.number == number }
      @holds.reject! { |kept| kept.number == number }
      emit Released, number: number, seats: hold.seats, reason: reason
    end
  end

  to close do
    closed!
  end
end`)+
    '<p>Each command changes the one show it runs on. <code>hold</code> refuses with a reason the guest can act on, then keeps the seats for <code>HOLD_FOR</code>, the ten minutes at the top of the context. <code>sell</code> turns a hold into a ticket; the button that calls it stands in for a payment, which belongs in a border with the card gateway. <code>release</code> gives the seats back and does nothing when the hold has already ended, so a timer that fires late cannot undo a sale. <code>close</code> ends sales; no page calls it here, and the specs in step 10 do. Each event records the facts the next steps need.</p>'+
    '<h2 id="c-boxoffice-timer">04 · Release unpaid seats after ten minutes</h2>'+
    snippet('app/domain/box_office.cr · part 3 of 5 · inside context Seating, after aggregate Show',`value Claim, means: "one hold on one show" do
  part show : Int64
  part number : Int32
end

process Checkout, means: "the time one guest has to pay for the seats held for them" do
  key claim : Claim

  whenever Show::Held,
    key: Claim.new(show: held.show_id.raw, number: held.number) do |held|
    arm lapse, after: held.expires_at - Time.utc
  end

  whenever Show::Sold,
    key: Claim.new(show: sold.show_id.raw, number: sold.number) do |sold|
    disarm lapse
  end

  whenever Show::Released,
    key: Claim.new(show: released.show_id.raw, number: released.number) do |released|
    disarm lapse
  end

  deadline lapse, after: HOLD_FOR do
    Show.find(Show::Id.new(claim.show)).release(claim.number, "not paid in time")
  end
end`)+
    '<p>The process keeps one row per hold, picked by its claim; its steps are the jobs the guide’s Run processes section describes. A hold arms the deadline for its expiry time, and a sale or a release disarms it. When the ten minutes pass first, the deadline releases the seats.</p>'+
    '<h2 id="c-boxoffice-waitlist">05 · Offer released seats to the waitlist</h2><p>Seating answers an offer from the waitlist inside <code>border Waitlist</code>, reading only the event’s facts. Naming <code>Waitlist::Line</code> there would draw a dependency edge back to Waitlist, a cycle the guide’s context rules refuse. When someone else took the seats first, the hold is refused and the compensation leaves the guest in the line.</p>'+
    snippet('app/domain/box_office.cr · part 4 of 5 · inside context Seating, after process Checkout; its last end closes the context',`  border Waitlist do
    whenever Waitlist::Line::Offered do |offered|
      Show.find(offered.show).hold(offered.email, offered.seats)
    end

    compensate Waitlist::Line::Offered do |offered, refusal|
      # The seats went to someone else first: the guest stays in the line.
    end
  end
end`)+
    '<p>The waitlist is a second context that follows Seating. Its policies react to Seating’s events: a scheduled show gets an empty line, a new hold seats its guest if they were waiting, and released seats are offered to the first guest they fit. An offer sends the guest nothing yet: it holds the seats for them at once, and the hold page of step 07 shows them.</p>'+
    snippet('app/domain/box_office.cr · part 5 of 5 · after context Seating; its last end closes the module',`  context Waitlist, follows: Seating, subdomain: :supporting,
    means: "guests waiting for the seats a show gives back" do
    aggregate Line, means: "the guests waiting for one show, first come, first served" do
      has show : Seating::Show
      has guests : Array(Guest)

      entity Guest, means: "one guest in the line, and the seats they want" do
        has email : Seating::Email
        has seats : Seating::Seats
      end

      event Offered, show : Seating::Show::Id, email : Seating::Email, seats : Seating::Seats,
        means: "seats came free for the first guest in the line they fit"

      finds for_show(show : Seating::Show::Id), where: {show: show}

      to join(email : Seating::Email, seats : Seating::Seats) do
        waiting = guests.any? { |guest| guest.email.raw == email.raw }
        refuse "#{email.raw} is already waiting." if waiting
        @guests << Guest.new(email, seats)
      end

      to offer(free : Int32) do
        if first = guests.find { |guest| guest.seats.to_i <= free }
          emit Offered, show: show, email: first.email, seats: first.seats
        end
      end

      to seat(email : Seating::Email) do
        @guests.reject! { |guest| guest.email.raw == email.raw }
      end
    end

    whenever Seating::Show::Scheduled do |scheduled|
      Line.create(show: scheduled.show_id)
    end

    whenever Seating::Show::Held do |held|
      Line.for_show(held.show_id).first?.try(&.seat(held.guest))
    end

    whenever Seating::Show::Released do |released|
      free = Seating::Show.find(released.show_id).left
      Line.for_show(released.show_id).first?.try(&.offer(free))
    end
  end
end`)+

    '<h2 id="c-boxoffice-views">07 · Let the show choose the buttons</h2><p>The pages read the show. A closed show offers nothing, a show with seats left offers Hold seats, and a sold-out show offers Join the waitlist. The hold page offers payment while the hold lasts; afterwards it shows the tickets, or says that the seats went back on sale.</p>'+

describe App::BoxOffice do
  it "refuses a hold for more seats than are left" do
    Corretto.session do |_client, _db|

      end
      BoxOfficeSpec.reload(show).left.should eq(1)

  end

    Corretto.session do |_client, _db|

      end
    end
  end

      show.hold(BoxOfficeSpec.email("ada@example.com"), BoxOfficeSpec.seats(2))
