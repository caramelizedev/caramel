    "<h2 id=\"c-tenancy-schema\">Declare tenanted data</h2><p>The <code>tenant</code> statement adds the <code>account_id</code> column and scopes the schema to the bound tenant. The column is never a changeset param.</p>"+
    snippet("app/models/book.cr · schema excerpt","schema \"books\" do\n  field id : Int64, primary: true\n  tenant account : Account\n  field isbn : String\n  belongs_to author : Author\n  timestamps\n  index :isbn, unique: true\nend","crystal")+
    rules([['A tenanted query with no tenant bound, such as “App::Book is tenanted, but no tenant is bound.”','raises <code>SugarORM::Tenancy::Missing</code>'],['Another tenant’s id','answers 404, like an unknown one'],['A <code>belongs_to</code> to a row of another tenant, even from raw SQL','PostgreSQL refuses it'],['Creating a tenanted row inside <code>Caramel::Tenancy.without</code>','raises']])+
    "<ul><li>Queries, <code>find</code>, <code>count</code>, <code>exists?</code>, <code>delete_all</code>, preloads, updates and deletes see only the bound tenant’s rows, and inserts are stamped with it.</li><li>A unique index is unique per tenant, so two accounts may share an ISBN.</li><li>A <code>belongs_to</code> to another tenanted schema becomes a composite foreign key.</li><li><code>Caramel::Tenancy.without { … }</code> reaches every tenant’s rows on purpose.</li><li>Raw <code>SugarORM.sql</code> is not scoped.</li></ul>"+
    kicker('Stage 3 · Use')+
    "<h2 id=\"c-tenancy-views\">Use the tenant in actions and views</h2><p>Actions and views expose <code>tenant</code>, the request’s tenant record, and <code>tenant_path</code>, a path under its prefix. Generated resource path helpers already add the prefix.</p>"+
    snippet("Inside a view’s blueprint · in acme","h1 { tenant.name }\na(href: tenant_path(\"/\")) { \"Home\" }  # /acme\na(href: books_path) { \"Books\" }       # /acme/books","crystal")+
    "<p>With locale prefixes, the tenant comes first: <code>/acme/fr/books</code>. The language switcher keeps the tenant prefix.</p>"+
    "<h2 id=\"c-tenancy-background\">Carry the tenant into background work</h2><p>Outside a request, bind a tenant explicitly. <code>Caramel::Tenancy.current</code> and <code>current?</code> read the bound one.</p>"+
    snippet("A task or job · account is a loaded App::Account","Caramel::Tenancy.with(account) do\n  App::Book.query.count\nend\n\nCaramel::Tenancy.each do |account|\n  # Runs once per tenant, bound.\nend","crystal")+
    "<p>A Cold Brew job enqueued in a tenant runs in it. A <code>spawn</code>ed fiber starts with no tenant, so wrap its work in <code>with</code>. Cache keys and PubSub channels are prefixed per tenant with <code>t&lt;id&gt;:</code>.</p>"+
    rules([['A Cold Brew job whose tenant was deleted before it ran','fails with <code>Caramel::Tenancy::Gone</code>'],['A prefixed PubSub channel name over 63 characters','raises ArgumentError']])+
    kicker('Stage 4 · Operate')+
    "<h2 id=\"c-tenancy-slugs\">Validate slugs and check membership</h2><p><code>validate_tenant_slug</code> checks the address a tenant gets:</p>"+
    rules([['A slug that is not a lowercase DNS label (letters, digits and hyphens, 1 to 63 characters, no leading or trailing hyphen)','<code>validate_tenant_slug</code> refuses it'],['A slug equal to a central route’s first segment, such as <code>health</code> or <code>accounts</code>','<code>validate_tenant_slug</code> refuses it'],['A slug equal to a locale prefix code','<code>validate_tenant_slug</code> refuses it']])+
    "<p>Tenancy decides which rows a request sees, not who may act in a tenant. Check membership in the application, for example with <code>ingress authenticate: :member?</code>.</p>"+
    "<h2 id=\"c-tenancy-existing\">Add tenancy to existing data</h2><p>On a populated table, add and backfill the new NOT NULL column by hand, build its index in a migration of its own, then let <code>frappe db diff</code> write the keys. Drain every queue before the first deploy with tenancy.</p>"+
    rules([['<code>frappe db diff</code> on a populated table that gains a NOT NULL column','halts'],['A job enqueued without a tenant, run on tenanted rows','fails with <code>SugarORM::Tenancy::Missing</code>']])+
    "<p><a href=\"https://github.com/caramelizedev/caramel/blob/main/docs/decisions/0025-multi-tenancy.md\" target=\"_blank\" rel=\"noopener noreferrer\">Read the multi-tenancy design and the exact steps ↗</a></p>"+
    kicker('Stage 5 · Limits')+
    "<h2 id=\"c-tenancy-refusals\">What does not compile</h2><p>A router has one tenant block. Each mistake below stops the build.</p>"+
    rules([['A central route other than <code>/</code> that starts with a parameter','fails compilation'],['A tenant route that starts with a central route’s first segment','fails compilation'],['A router with a second tenant block','fails compilation']])+
    prove('c-tenancy-testing','Test isolation',
      "<p><code>tenant_session(\"acme\")</code> opens a Corretto session in a new account, and the example’s queries see only its rows. <code>account(db, \"globex\")</code> creates a second account to prove isolation.</p>"+
      snippet("spec/requests/notes_spec.cr · inside an example","tenant_session(\"acme\") do |client, db|\n  record = App::Note.create!(db, body: \"Plan\")\n  account(db, \"globex\")\n  client.get(\"/globex/notes/#{record.id}\").should have_status(404)\nend","crystal")+
      snippet('Terminal · inside your application','frappe routes\nfrappe corretto spec/requests/notes_spec.cr','bash')+
      passing('<code>frappe routes</code> lists <code>/:tenant/notes</code> beside the central <code>/tags</code>. The example passes: a request from <code>acme</code> for <code>globex</code>’s note answers 404.'))+
    next('testing','Test the HTML your app returns'),
  crema: () => heading('Guides / Observability','Know what your application did.','Every request and job gets a stable id, one log line and, when something fails, a report that stays out of your logs.')+
    contract([['Needs','A running application. <code>frappe dev</code> for the development tools; a database for the queue commands'],['You will have','A request id and one log line for every request and job, and error reports that stay out of your logs'],['Covers','Logs, error reports, the development inspector, the ops socket, the recorder and OTLP export'],['Proved by','<code>ops status</code> · <code>ops errors</code> · <code>ops metrics</code>']])+
    '<p>Every field, variable and limit has a home in the reference.</p><button class="c-secondary cursor-interaction" data-page="cremaref">Look up every field, variable and limit →</button>'+
    guideMap('crema',[
      ['Follow requests',[['c-crema-ids','Follow one request'],['c-crema-logs','Read the log line'],['c-crema-errors','Report errors'],['c-crema-slow','Set what counts as slow'],['c-crema-work','See where a query came from']]],
      ['Develop',[['c-crema-dump','Dump a value while developing'],['c-crema-errors-dev','Read an error page'],['c-crema-inspector','Inspect requests and jobs'],['c-crema-menu','Watch from the menu bar'],['c-crema-access','Read the proxy’s view of a request'],['c-crema-collector','Follow a trace across sites'],['c-crema-agents','Ask from the terminal']]],
      ['Operate',[['c-crema-ops','Look inside a running application'],['c-crema-debug','Keep one person’s requests'],['c-crema-console','Open the console'],['c-crema-jobs','Inspect queues and the database']]],
      ['Keep history',[['c-crema-recorder','Keep latency history'],['c-crema-otlp','Send traces to a tracing backend']]],
      ['Limits',[['c-crema-gaps','Not covered yet']]]
    ])+
    kicker('Stage 1 · Follow requests')+
    '<h2 id="c-crema-ids">Follow one request</h2><p>Every routed request carries <code>X-Request-ID</code>.</p>'+
    rules([['An inbound <code>X-Request-ID</code> of 8 to 128 letters, digits and <code>._:-</code>','kept','ok'],['Any other inbound <code>X-Request-ID</code>','replaced by a UUID','ok'],['An inbound W3C <code>traceparent</code> header','continues the caller’s trace','ok']])+
    '<p>The response, the log line and the error report all name the same ids.</p>'+
    '<h2 id="c-crema-logs">Read the log line</h2><p>Each request, job and schedule run writes one wide line from the <code>crema</code> log source: the route template, status, duration, query count and time, view time and, for jobs, the queue and how long the job waited. JSON is the default outside development and test. Set <code>CARAMEL_LOG_FORMAT=text</code> or <code>json</code> to choose, and <code>LOG_LEVEL</code> for the level.</p>'+
    snippet('Production · stdout','{"ts":"2026-10-03T12:00:00.123Z","level":"info","source":"crema","msg":"request","name":"GET /books/:id","route":"/books/:id","status":200,"duration_ms":12.4,"db_count":3}','bash')+
    rules([['<code>CARAMEL_ENV</code> other than <code>development</code>','log lines omit the request path and the exception’s message','ok']])+
    '<p>No line carries a query’s bind values: dependency errors can include connection URLs and form values.</p>'+
    '<h2 id="c-crema-errors">Report errors</h2><p>An unhandled error in a request is reported once, with its class, a 12-character fingerprint and the first frame of your own code. The fingerprint ignores lines and messages, so one defect stays one group across deploys. Call <code>Caramel::Crema.report(error)</code> for an error you handle, and register a hook to forward reports to an error tracker.</p>'+
    snippet('config/application.cr','Caramel::Crema.on_error do |report|\n  Tracker.capture(report.error_class, report.fingerprint, report.message)\nend','crystal')+
    '<p>A report’s message and backtrace are redacted of secret-looking environment values, database URLs and <code>password=…</code> assignments.</p>'+
    '<h2 id="c-crema-slow">Set what counts as slow</h2><p>A request of one second or more, a job or schedule run of five seconds or more, and a query of 100 milliseconds or more count as slow. Change them in your application’s configuration. A slow request or job is kept for <code>ops traces --slow</code> and flagged in the development toolbar; a slow query adds to the log line’s <code>slow_queries</code>.</p>'+
    snippet('config/application.cr','Caramel::Crema.slow_request = 500.milliseconds\nCaramel::Crema.slow_job = 30.seconds\nCaramel::Crema.slow_query = 50.milliseconds','crystal')+
    '<h2 id="c-crema-work">See where a query came from</h2><p>Every statement your request runs starts with a comment that names the action, such as <code>/*action=\'App%3A%3ABooks%3A%3AShow\'*/</code>. <code>pg_stat_activity</code> and PostgreSQL’s slow-query log then say which code ran it. Jobs and schedules are tagged <code>job</code> and <code>schedule</code>, and each pool names itself in <code>application_name</code>: <code>caramel-web</code>, <code>caramel-cold-brew</code> and <code>caramel-listen</code>.</p>'+
    '<p>A job continues the trace that enqueued it, so its log line carries the same request id and trace id. <code>Caramel::Outbound</code> calls send <code>traceparent</code> to the service they call. Each log line counts queries, their time, the wait for a pooled connection, view time, outbound calls and cache hits. When the trace records spans (the ops socket, the recorder or the exporter is on, or in development), a statement that repeats five or more times in one request is reported as a repeated query.</p>'+
    kicker('Stage 2 · Develop')+
    '<h2 id="c-crema-dump">Dump a value while developing</h2><p><code>dump</code> prints a value and its file and line to standard error, and returns the value, so it fits inside an expression. It works in actions, views and jobs while <code>frappe dev</code> runs, and does nothing in a production build. <code>frappe lint</code> reports a <code>dump</code> left in the code.</p>'+
    snippet('app/actions/books/show.cr','book = dump(App::Book.find!(contract.id))','crystal')+
    '<h2 id="c-crema-errors-dev">Read an error page</h2><p>In development an unhandled error shows its class and message, every frame of your own code with an Open in editor link, the source around the failing line, the request, the queries that ran before it and its causes. <strong>Copy as Markdown</strong> copies all of it for a bug report or an agent. A client that asks for JSON first gets the error as JSON: its class, message, location, ids and backtrace. Compiler errors link to the file in the same way. Set <code>CARAMEL_EDITOR</code> to <code>zed</code> (the default), <code>vscode</code>, <code>cursor</code>, <code>sublime</code>, <code>textmate</code>, <code>idea</code>, or a template such as <code>myeditor://open?file={path}&amp;line={line}&amp;column={column}</code>.</p>'+
    '<h2 id="c-crema-inspector">Inspect requests and jobs</h2><p>Every full HTML page <code>frappe dev</code> serves shows a small toolbar with its route, status, time and query count; it flags errors, slow requests and queries repeated five or more times. The inspector at <code>/__caramel/dev/inspector</code> lists recent requests, jobs and schedule runs, shows each one’s timeline, queries and logs, groups errors by fingerprint, and lists the builds. Latte’s menu bar app opens it from the site’s menu. The browser’s developer tools also show database and view time through <code>Server-Timing</code>.</p>'+
    '<p>The toolbar shows a request as parts: route, status, time, queries and flags written as words. Each part links to its place on the request’s page: the query count to the Queries section, the time to the timeline, an error to the error section. Click the arrow, or press <code>`</code>, for the recent requests; <code>j</code> and <code>k</code> move through them, <code>Esc</code> closes the list, and the dash shrinks the toolbar to a dot (the choice is kept in <code>localStorage</code>). <strong>Copy for an agent</strong> puts the request on the clipboard as Markdown.</p><p>On the request’s page each query has <strong>Copy SQL</strong> and <strong>Copy with values</strong>, which writes the bind values into the statement as PostgreSQL literals so you can paste it into <code>psql</code>: numbers and booleans bare, text and times quoted, <code>nil</code> as <code>NULL</code>. A query keeps its first 20 binds, and a literal longer than 2,000 bytes (the value with its quotes) is not kept for copying; each such placeholder stays as <code>$n</code>, and the copy starts with a comment saying so. Each query is a card: its statement with one clause per line, and below it each bind beside its <code>$n</code>, shown as the copy writes it and cut to 200 bytes; the copy holds the whole value, and the copy keeps the statement as it ran. Pointing at a placeholder or at a bind lights up both. A repeated <code>SELECT</code> is highlighted with its source and a likely preload. The toolbar and the inspector follow your system’s light or dark appearance and share one <strong>Theme: auto / light / dark</strong> choice, remembered in the browser; the production console follows the system too, with a button of its own.</p>'+
    '<h2 id="c-crema-menu">Watch from the menu bar</h2><p>Latte’s menu bar app shows each site’s error count beside its state, the newest error in its submenu, and an <strong>Open inspector</strong> item. When a build fails, or the application reports an error it has not reported before in this run, the app counts it beside the cup and posts a macOS notification that opens the inspector. Allow notifications for Latte when macOS asks; without permission only the count appears, and opening the menu clears it. Notifications carry the error’s class and location, never its message.</p>'+
    '<h2 id="c-crema-access">Read the proxy’s view of a request</h2><p>Latte’s HTTPS proxy writes one JSON line per request to the site’s own <code>access.log</code>, beside <code>app.log</code> and <code>compiler.log</code>. Caddy redacts <code>Cookie</code> and <code>Authorization</code> and keeps the file to a megabyte and one previous file. It is private to you (mode 0600).</p>'+
    snippet('Terminal','frappe logs access\nfrappe logs access --follow','bash')+
    expect('Prints the site’s <code>access.log</code>: one JSON line per request with status, duration, size, host, URI and response headers, including your application’s <code>X-Request-Id</code>.')+
    '<h2 id="c-crema-collector">Follow a trace across sites</h2><p>Latte listens on <code>127.0.0.1:4318</code>, the OTLP/HTTP port, and keeps the newest 2,000 traces in memory. <code>frappe dev</code> sends its application’s traces there under the project’s name. A Caramel site that calls another through <code>Caramel::Outbound</code> sends a <code>traceparent</code>, so both sites’ spans share one trace id, and the inspector’s trace page and <code>frappe trace REF --md</code> add an <strong>Across services</strong> section. Any other service joins by exporting OTLP/HTTP JSON to the same address (a Caramel service needs <code>require "caramel/crema/otlp"</code> for that). Any local process can write to it, and only you can read it. If another program holds the port, <code>frappe services</code> shows the collector as unavailable and everything else works.</p>'+
    snippet('Terminal','OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318 \\\nOTEL_EXPORTER_OTLP_PROTOCOL=http/json \\\nOTEL_SERVICE_NAME=billing ./billing serve','bash')+
    '<h2 id="c-crema-agents">Ask from the terminal</h2><p>These commands read the events <code>frappe dev</code> kept, whether or not it still runs. <code>frappe traces</code> lists recent requests and jobs, newest first; <code>frappe trace REF</code> shows one, or with <code>--md</code> its Markdown; <code>frappe errors</code> groups runtime errors and repeated queries. <code>REF</code> is <code>last</code>, <code>last-error</code>, or a prefix of six or more characters of a trace id, a request id or the fingerprint of the error a trace ended with. <code>frappe errors</code> lists only what happened after the newest successful build, so a rebuild clears the errors it fixed.</p>'+
    snippet('Terminal','frappe errors --agent\nfrappe trace last-error --md\nfrappe traces --errors --limit=5','bash')+
    expect('<code>frappe errors --agent</code> prints compact MRDP lines for what happened after the newest successful build. <code>frappe trace last-error --md</code> prints the failed trace as Markdown, with a Backtrace section. <code>frappe traces</code> lists recent requests and jobs, newest first.')+
    kicker('Stage 3 · Operate')+
    '<h2 id="c-crema-ops">Look inside a running application</h2><p>Only the owner of the ops socket can use it, and nothing is added to the public listener. The application binary is its own client.</p>'+
    rules([['A <code>serve</code> process','opens a private socket next to its application socket','ok'],['<code>CARAMEL_OPS_SOCKET=PATH</code>','uses that path','ok'],['<code>CARAMEL_OPS_SOCKET=off</code>','opens none','ok'],['A <code>work</code> process without a path','opens none','ok']])+
    snippet('Terminal · on the server','./bookshelf ops status\n./bookshelf ops tail --errors --slow=500\n./bookshelf ops errors\n./bookshelf ops error 9f2c4e1a7b3d\n./bookshelf ops traces --slow\n./bookshelf ops trace 8b1f6c2a --md\n./bookshelf ops metrics','bash')+
    expect('<code>ops errors</code> lists the errors seen since the process started, grouped by fingerprint. <code>ops error FINGERPRINT</code> prints one with its redacted message and backtrace. <code>ops metrics</code> prints Prometheus text.')+
    '<p>Errors live in memory on the socket and nowhere else, so forward <code>Caramel::Crema.on_error</code> reports to an error tracker for history. A scraper that can reach the socket can read <code>ops metrics</code>.</p>'+
    '<h2 id="c-crema-debug">Keep one person’s requests</h2><p><code>ops debug-token --minutes=15</code> prints a signed token that lasts at most two hours. A request that sends it as <code>X-Caramel-Debug</code>, or in the <code>__Host-caramel_debug</code> cookie, is traced in full, answered with <code>X-Caramel-Trace</code>, kept for <code>ops traces --debug</code> and passed to the jobs it enqueues.</p>'+
    '<h2 id="c-crema-console">Open the console</h2><p><code>ops console</code> prints the <code>ssh -N -L</code> line that forwards the socket to your laptop; open <code>http://localhost:8765/</code> there. The console is read-only: in-flight work, a live tail, queues, database health, errors and traces. It follows your system’s light or dark appearance; its <strong>Theme</strong> button overrides that and is remembered separately, because the console is another origin. Its trace pages carry no bind values and no <strong>Copy with values</strong> buttons.</p>'+
    '<h2 id="c-crema-jobs">Inspect queues and the database</h2><p>These need a database, not a running application.</p>'+
    lookup(['Command','What it does'],[
      ['<code>jobs</code>','counts each queue’s running, retrying, queued, scheduled and failed jobs'],
      ['<code>jobs failed</code>','groups failures by class and error'],
      ['<code>jobs show ID</code>','prints one job and its stored error to your terminal'],
      ['<code>jobs retry ID</code> or <code>jobs retry --class=NAME</code>','gives failed jobs one more run'],
      ['<code>db diagnose</code> (and <code>frappe db diagnose</code> in development)','reports connections, long queries, locks, cache hit ratios, unused indexes, vacuum health and, when <code>pg_stat_statements</code> is installed, the slowest statements']
    ])+
    kicker('Stage 4 · Keep history')+
    '<h2 id="c-crema-recorder">Keep latency history</h2><p>Logs say what happened; <code>insights</code> says how it has been going. Add the recorder to <code>config/application.cr</code> (new applications already have it). It keeps one row per minute for each route, job class, schedule, SQL statement and outbound host in <code>caramel_metrics</code>: counts, errors, total and slowest time, and a latency histogram. It stores route templates and parameterized SQL only, never a path, a bind value or an error message. Rows older than seven days are deleted, and a failed write loses that batch without touching your requests.</p>'+
    snippet('config/application.cr','require "caramel"\nrequire "caramel/crema/recorder"','crystal')+
    snippet('Terminal','./bookshelf insights --since=24h\n./bookshelf insights --kind=sql --since=1h','bash')+
    '<p>Run <code>frappe migrate</code> once after upgrading: <code>caramel_metrics</code> comes with Cold Brew’s framework tables. The console’s Insights page shows the same tables.</p>'+
    '<h2 id="c-crema-otlp">Send traces to a tracing backend</h2><p>Add <code>require "caramel/crema/otlp"</code> and set the standard OpenTelemetry variables; the application then exports each sampled request, job and schedule run, with a child span for every query and outbound call, as OTLP over HTTP with JSON bodies. Leave <code>OTEL_EXPORTER_OTLP_PROTOCOL</code> unset or <code>http/json</code>.</p>'+
    snippet('Environment','OTEL_EXPORTER_OTLP_ENDPOINT=https://otel.example.com\nOTEL_EXPORTER_OTLP_HEADERS=x-api-key=SECRET\nOTEL_SERVICE_NAME=bookshelf\nOTEL_TRACES_SAMPLER=parentbased_traceidratio\nOTEL_TRACES_SAMPLER_ARG=0.1','bash')+
    '<p>Spans name routes and parameterized SQL, never paths, bind values, log text or error messages.</p>'+
    rules([['Without <code>OTEL_EXPORTER_OTLP_ENDPOINT</code>','nothing is sent','ok'],['A trace that fails','is exported even when sampling would skip it, as its root span'],['A slow or unreachable collector','costs a dropped batch and at most one log line a minute']])+
    '<p><a href="https://github.com/caramelizedev/caramel/blob/main/docs/decisions/0027-crema-tracing.md" target="_blank" rel="noopener noreferrer">Read the tracing design ↗</a> · <a href="https://github.com/caramelizedev/caramel/blob/main/docs/decisions/0028-crema-production-access.md" target="_blank" rel="noopener noreferrer">Read the production access design ↗</a></p>'+
    kicker('Stage 5 · Limits')+
    '<h2 id="c-crema-gaps">Not covered yet</h2><ul><li>The collector and the exporter take OTLP over HTTP with JSON bodies only; protobuf is not supported.</li><li>Errors on the ops socket live in memory only; a restart clears them.</li></ul>'+
    prove('c-crema-prove','Check what your application reports',snippet('Terminal · on the server','./bookshelf ops status\n./bookshelf ops errors\n./bookshelf ops metrics','bash')+passing('<code>ops status</code> answers on the private socket. <code>ops errors</code> lists the failure by its fingerprint, and <code>ops metrics</code> prints Prometheus text. The exception message is on the socket and in no stdout log line.'))+
    next('testing','Test the HTML your app returns'),
  testing: () => heading('Guides / Corretto','Test the HTML your app returns.','Describe rendered elements with Blueprint-shaped expectations while Corretto drives real requests and isolated database state.')+
    contract([['Needs','A generated application with Lexbor 3.6.4 as a development dependency'],['You will have','Request specs that assert rendered elements against isolated database state'],['Covers','<code>have_html</code>, <code>render_page</code>, <code>render_partial</code>, <code>strict: true</code> and scoped matching'],['Proved by','<code>frappe check</code> · <code>frappe corretto</code> · <code>frappe lint</code>']])+
    '<h2 id="c-test-start">Start with a real response</h2><p>Generated spec helpers require <code>caramel/corretto</code> and call <code>Corretto.configure(App)</code>. Inside an example, use a session to request the page and assert its observable output.</p>'+snippet('spec/requests/books_spec.cr · after creating a Book titled <Dune>','shown = client.get(path)\nshown.should have_status(200)\nshown.should render_page("Book")\nshown.should have_html {\n  section(class: "form-page") {\n    h1 { "Book" }\n    dl { dd { "<Dune>" } }\n    a(href: "#{path}/edit") { "Edit book" }\n  }\n}')+
    '<p>The block records requirements independently of the view renderer. Expected strings are decoded literal text: <code>"&lt;Dune&gt;"</code> checks escaped user text. Build expectations from values and elements, rather than rendering an application view as the expected result.</p>'+
    '<h2 id="c-test-requirements">Select the requirements that matter</h2>'+
    lookup(['Rule','What matches'],[
      ['Roots','each block has one root'],
      ['Wrappers and attributes','extra wrappers, markup and attributes are allowed by default; a nested requirement may sit below extra wrappers'],
      ['Order','sibling order does not matter; nested requirements belong to the same matched ancestor; sibling requirements consume distinct nodes'],
      ['Text','exact after HTML whitespace normalization: space, tab, line feed, form feed and carriage return collapse to one space, with surrounding spaces removed; nonbreaking spaces stay distinct, and <code>pre</code> and <code>textarea</code> preserve whitespace'],
      ['Classes','match a token subset'],
      ['Boolean attributes','check presence or absence'],
      ['Arrays','flatten, omit <code>nil</code> and join with spaces'],
      ['Nested keywords','become hyphenated names: <code>data: {book_id: 7}</code> checks <code>data-book-id="7"</code>'],
      ['ARIA and data values','use strings, such as <code>aria_expanded: "false"</code>']
    ])+snippet('Corretto · scopes and counts','shown.should have_html(within: "#books", count: 2) { li(class: "book") }\nshown.should have_html(count: 0) { script(src: "/unexpected.js") }\nshown.should_not have_html { p { "Access denied" } }')+
    '<p>Numeric, Boolean, and character leaf values check their literal text. Numeric loop return values are ignored when the block has recorded child requirements. Convert other values with <code>.to_s</code>: an unsupported value raises instead of silently skipping the text check, while empty collection loops and <code>nil</code> add no text requirement. Use <code>plain</code> for direct text beside child elements; comments do not split adjacent text, but an actual intervening element does. Loops and captured local values work; use <code>element("book-card")</code> for custom tags. Blueprint’s standard element names apply, including <code>select_tag</code> for <code>select</code>.</p>'+
    '<p>Distinctness applies at each requirement level, so distinct matched ancestors can share a deeper descendant. Describe repeated records with identity attributes, such as <code>li(data: {order_id: id})</code>, or use <code>strict: true</code> for direct sibling structure. Without <code>count:</code>, at least one root must match; with it, exactly that many roots must match the complete pattern. <code>within:</code> takes a CSS selector, and matching roots must be descendants of that scope. Negation inverts the complete expectation, including its count.</p>'+
    '<h2 id="c-test-strict">Check structure and partial responses</h2><p><code>strict: true</code> compares complete attributes and ordered direct children, ignoring comments and insignificant formatting whitespace. Classes stay an unordered set. Use it when the complete subtree is the contract; for mixed content, put <code>plain</code> between element calls.</p>'+snippet('Corretto · a complete subtree','shown.should have_html(strict: true) {\n  ul(class: "books") {\n    li { "Dune" }\n    li { "Solaris" }\n  }\n}')+
    '<p>The block overload of <code>render_partial</code> checks target, swap, and content in the same hx-partial envelope. HTML5 table and select contexts are supported, including rows or cells inside partial envelopes.</p>'+snippet('Corretto · fragment response','created.should render_partial("#note-list", swap: "beforeend") {\n  li { "<b>Milk</b> ×2" }\n}')+
    '<p><code>render_page("Books")</code> requires an actual source doctype and a parsed title containing Books; a title-bearing fragment is not a page. Attribute order, quoting and entity spelling do not affect these assertions. Both plain response matchers and block expectations are available.</p><p>These raise even for negative assertions:</p>'+
    rules([['A negative <code>count:</code>','raises ArgumentError'],['<code>within:</code> matches no element','raises ArgumentError'],['A block with no root, or more than one','raises ArgumentError'],['HTML Lexbor cannot parse','raises ArgumentError'],['An invalid selector','raises']])+
    '<h2 id="c-test-install">Install the test dependencies</h2><p>Generated applications declare Lexbor 3.6.4 as a development dependency. Keep this pin and the matching lockfile entry when configuring a project; <code>frappe setup</code> uses a frozen install. Development installs download a SHA-256-verified Lexbor 3.0.0 C source, which needs network access, and build a static library with cc and ar. macOS needs Apple’s Command Line Tools; Linux needs a C toolchain, such as <code>build-essential</code> on Debian and Ubuntu. Production installs (<code>shards install --production</code>) neither restore nor build the parser.</p>'+snippet('shard.yml · development dependencies','development_dependencies:\n  lexbor:\n    github: kostya/lexbor\n    version: 3.6.4','yaml')+
    '<p>Existing applications add the same dependency, refresh <code>shard.lock</code> with <code>shards install</code> in their managed compiler environment, and run <code>frappe setup</code>, which uses a frozen install and does not create missing lock entries. Only Corretto links the parser; ordinary application builds do not.</p>'+
    '<h2 id="c-test-refusals">What does not compile</h2><p>Each mistake below stops the build.</p>'+
    rules([['A misspelled standard element, such as <code>h11</code>','fails compilation'],['A Lexbor version other than 3.6.4','fails compilation']])+
    '<h2 id="c-test-gaps">Not covered yet</h2><ul><li>HTML5 parsing repairs malformed HTML as a browser does; it is not a conformance validator.</li><li>Exact-byte tests for serialization and browser tests for JavaScript and htmx morphing stay separate.</li><li>Upstream Ameba editor integrations alone do not load Caramel’s custom rules.</li></ul>'+
    prove('c-test-prove','Run the expectations','<p>Use <code>frappe lint</code> for the scoped paragraph and nested-block rules in expectations. Debug calls elsewhere, and <code>pp</code> or <code>p!</code> inside expectations, are still linted, and the line-length limit still applies.</p>'+snippet('Terminal','frappe check\nfrappe corretto spec/requests/books_spec.cr\nfrappe lint','bash')+passing('<code>frappe check</code> prints ✓ Type check passed. <code>frappe corretto</code> reports every example passing. <code>frappe lint</code> finds no debug call outside an expectation, no <code>pp</code> or <code>p!</code> inside one, and no line over the length limit.'))+next('releases','Read the current release guide'),
  releases: () => heading('Guides / Current release','Caramel today.','The supported APIs, development requirements, and current limits of Caramel 0.15.0.')+
    contract([['Release', '0.15.0'], ['Covers', 'Upgrade notes from 0.8.0 to 0.15.0, supported APIs, development requirements and current limits'], ['Needs', 'Apple Silicon macOS with Apple Command Line Tools'], ['Proved by', '<code>frappe check</code> · <code>frappe corretto</code> · <code>frappe lint</code>']])+
    guideMap('releases', [['Upgrade notes', [['c-release-upgrade-0150', 'Upgrading to 0.15.0'], ['c-release-upgrade-0140', 'Upgrading to 0.14.0'], ['c-release-upgrade-0130', 'Upgrading to 0.13.0'], ['c-release-upgrade-0120', 'Upgrading to 0.12.0'], ['c-release-upgrade-0110', 'Upgrading to 0.11.0'], ['c-release-upgrade-0100', 'Upgrading to 0.10.0'], ['c-release-upgrade-090', 'Upgrading to 0.9.0'], ['c-release-upgrade', 'Upgrading to 0.8.0']]], ['Supported today', [['c-release-i18n', 'Internationalization'], ['c-release-tools', 'Runtime and local tools'], ['c-release-requests', 'Requests and responses'], ['c-release-data', 'Data and resource generation'], ['c-release-work', 'Background work'], ['c-release-checks', 'Development and testing'], ['c-release-tenancy', 'Multi-tenancy'], ['c-release-sweettalk', 'Domain-Driven Design'], ['c-release-observability', 'Observability']]], ['Limits', [['c-release-limits', 'Current limits']]]])+
    kicker('Upgrade notes')+
    '<h2 id="c-release-upgrade-0150">Upgrading to 0.15.0</h2><p>Upgrade Caramel and Frappé together. Run <code>frappe migrate</code> once for a framework migration; these changes can need an edit.</p><ul><li>Every database connection sets <code>statement_timeout</code> and <code>lock_timeout</code> when it opens, so a statement that ran longer than 30 seconds now fails with <code>canceling statement due to statement timeout</code>. Raise <code>CARAMEL_STATEMENT_TIMEOUT</code> for a process that needs longer. <code>migrate</code> has no statement timeout by default and a 5 second lock timeout; <code>CARAMEL_MIGRATION_STATEMENT_TIMEOUT</code> and <code>CARAMEL_MIGRATION_LOCK_TIMEOUT</code> change them. The variables are listed under Production.</li><li>A job whose process died or lost its connection during three of its runs is failed with <code>Caramel::ColdBrew::AbandonedJob</code> instead of being redelivered forever, and the <code>on_failed</code> hooks run. Runs that maintenance released no longer count against <code>retry_on</code> <code>attempts</code>.</li><li>The framework migration <code>20260927000006</code> adds <code>caramel_jobs.releases</code> and takes a lock on every <code>caramel_jobs</code> partition. Run <code>frappe migrate</code> while no job is running, or raise <code>CARAMEL_MIGRATION_LOCK_TIMEOUT</code> so the 5 second lock timeout does not refuse it.</li></ul>'+
    '<h2 id="c-release-upgrade-0140">Upgrading to 0.14.0</h2><p>Upgrade Caramel and Frappé together. There are no framework migrations; these changes can need an edit.</p><ul><li>With <code>caramel/sweet_talk</code>, a <code>SweetTalk::Refusal</code> that an action’s <code>handle</code> does not rescue answers 422 with its message under <code>_base</code>, as a failed contract does, and a <code>SweetTalk::Missing</code> answers 404; neither is reported to Crema as an error. <code>SweetTalk::Boundary</code> still answers 500. Asking an aggregate for its id before <code>create</code>, or an event for its subject before it is emitted, raises <code>NilAssertionError</code> instead of <code>SweetTalk::Missing</code>.</li><li><code>CARAMEL_FIELD_&lt;NAME&gt;</code> constants gain a sixth element, the declared type, so a macro of your own that destructures exactly five must take six.</li><li>A lifecycle’s <code>state</code> column now has a <code>CHECK</code> constraint, and a state of two or more words is stored as <code>moves</code> spells it. 0.13.0 stored <code>awaiting_payment</code> as <code>awaitingpayment</code>: first add a migration that respells such rows, such as <code>UPDATE ordering_payments SET state = \'awaiting_payment\' WHERE state = \'awaitingpayment\'</code>, and migrate, then run <code>frappe db diff</code>, which adds each constraint as <code>NOT VALID</code> and validates it in the <code>_concurrently</code> migration. <code>frappe migrate</code> stops, naming the constraint, while a row holds any other text. A lifecycle whose constraint name would pass PostgreSQL’s 63 bytes no longer compiles; shorten the context or the aggregate name.</li><li>A <code>finds</code> that names an unknown attribute or state, or a list of entities, fails to compile even when nothing calls it. Code outside an aggregate can no longer call <code>__sweettalk_rows</code>; give the aggregate a <code>finds</code> with a block instead.</li><li>Calling another context’s service, as in <code>Catalogue.price_of(tea)</code>, counts as naming <code>Catalogue::</code>: outside <code>border Catalogue</code> it compiles only where the context follows Catalogue, and two contexts whose borders call each other form a cycle. A context names <code>Caramel::Outbound</code> or <code>HTTP::Client</code> only inside a border with an outside system, <code>border Cards, outside: "…" do … end</code>.</li><li><code>frappe agent-manifest</code> prints a <code>GUIDES:</code> line after <code>DOCS:</code>, so a tool that reads the manifest by line number finds the commands one line later.</li><li>For applications made earlier: to give agents the guides in Markdown, add <code>Every page of it in Markdown: https://caramelize.dev/docs/VERSION/llms.txt</code> after the documentation link in <code>AGENTS.md</code>. An application with a domain gets the SweetTalk skill with its next <code>frappe make domain</code>, or now with <code>mkdir -p .claude/skills/sweettalk &amp;&amp; cp lib/caramel/templates/skills/sweettalk/SKILL.md .claude/skills/sweettalk/</code>, which also refreshes it after a later upgrade; add <code>Domain rules: .claude/skills/sweettalk/SKILL.md, which frappe make domain writes</code> after <code>Domain:</code> in <code>AGENTS.md</code>.</li></ul>'+
    '<h2 id="c-release-upgrade-0130">Upgrading to 0.13.0</h2><p>Upgrade Caramel and Frappé together. There are no framework migrations and nothing is removed; these changes can need an edit.</p><ul><li>Keyword <code>where</code> no longer takes a value that may be nil, such as a <code>String?</code> variable, because nil matched the rows whose column IS NULL. Narrow the value first, or use the new <code>where_null(:column)</code>; the literal <code>where(column: nil)</code> still works.</li><li>A request may send at most 4,096 values and 128 files, and a multipart body’s boundaries and part headers count toward its size; more answers 413.</li><li>A Crema sink or exporter that matches <code>Caramel::Crema::SpanKind</code> exhaustively must handle the new <code>domain</code> kind.</li><li><code>sudo scripts/install-local-integration apply</code> installs only a bundle that the user who ran <code>sudo</code> prepared.</li></ul>'+
    '<h2 id="c-release-upgrade-0120">Upgrading to 0.12.0</h2><p>Upgrade Caramel and Frappé together. There are no framework migrations and nothing is removed; one change can need an edit.</p><ul><li>On SIGTERM, <code>serve</code> now finishes in-flight requests for up to 25 s before it exits, and an open server-sent events stream holds it for the whole 25 s. Give a supervisor that stops <code>serve</code> at least 30 s.</li></ul>'+
    '<h2 id="c-release-upgrade-0110">Upgrading to 0.11.0</h2><p>Upgrade Caramel and Frappé together. There are no framework migrations and nothing is removed; these changes can need an edit.</p><ul><li>The schema document <code>frappe db diff</code> reads is now version 3, because it carries CHECK constraints.</li><li>SugarORM owns the CHECK constraints named <code>check_…</code>. <code>frappe db diff</code> drops a <code>check_…</code> constraint that no schema declares; any other CHECK constraint stays and is noted. Declare a hand-written <code>check_…</code> constraint, or rename it, before you diff.</li><li>Two schemas that name one table no longer compile. Remove the duplicate or give one a different table.</li><li>Run <code>shards update</code> so your application takes crystal-db 0.15.0 and crystal-pg 0.31.0.</li><li>After a job is renamed or moved, name its old class with <code>renamed_from "Old::Name"</code> in the job. <code>work</code> and <code>migrate</code> now log a warning naming queued class names that no job claims.</li></ul>'+
    '<h2 id="c-release-upgrade-0100">Upgrading to 0.10.0</h2><p>Upgrade Caramel and Frappé together. There are no migrations and no breaking changes; the change is in the development tools.</p><ul><li>The inspector’s request page shows each query as a card instead of a table row: the statement with one clause per line and coloured, and each bind listed beside its <code>$n</code>. Pointing at a placeholder or a bind lights up both. <strong>Copy SQL</strong> and <strong>Copy with values</strong> still write the statement as it ran.</li></ul>'+
    '<h2 id="c-release-upgrade-090">Upgrading to 0.9.0</h2><p>Upgrade Caramel and Frappé together. There are no migrations and no breaking changes; the changes are in the development tools.</p><ul><li>The development toolbar is redesigned: its route, status, time, query count and flags link to their place on the request’s page in the inspector, <code>`</code>, <code>j</code> and <code>k</code> work from the keyboard, and <strong>Copy for an agent</strong> copies the request as Markdown.</li><li>Each query on the inspector’s request page has <strong>Copy SQL</strong> and <strong>Copy with values</strong>. A <code>nil</code> bind is now recorded as <code>NULL</code> and shown bare in the Binds column; the text <code>NULL</code> stays quoted.</li><li>The toolbar, the inspector and the production console follow the system’s light or dark appearance, with a Theme button to choose. The console keeps its own choice.</li><li>The application binary’s <code>ops</code> commands now refuse a flag they would have ignored instead of dropping it silently.</li></ul>'+
    '<h2 id="c-release-upgrade">Upgrading to 0.8.0</h2><p>Upgrade Caramel and Frappé together. The schema document <code>frappe db diff</code> reads is now version 2, and <code>SugarORM::Catalog::ForeignKey</code> holds <code>columns</code> and <code>references_columns</code> so a key can span several columns.</p><ul><li>Run <code>frappe migrate</code>. Two framework migrations add <code>caramel_jobs.context</code> and <code>caramel_metrics</code>.</li><li>Run <code>latte stop</code> once if Latte is running, so the next command starts the new one. Frappé, Corretto and Latte.app now use Latte’s control API 2. The managed PostgreSQL restarts once to preload its statistics modules.</li><li>To keep per-minute aggregates, add <code>require "caramel/crema/recorder"</code> after <code>require "caramel"</code> in <code>config/application.cr</code>. New applications already have it.</li><li>Logging now sets itself up: JSON in production, text in development and test. The old <code>error_type</code> log line is gone; the <code>error</code> line carries <code>error_class</code> and <code>fingerprint</code>.</li></ul><p><button class="c-secondary cursor-interaction" data-page="crema">What Crema adds →</button></p>'+
    kicker('Supported today')+
    '<h2 id="c-release-i18n">Internationalization</h2><p>Caramel has opt-in, typed translations. Run <code>frappe make locale CODE</code> to add Crystal catalogs and enable translated resource generation. Views and actions use <code>t</code> for messages and <code>l</code> for number and time formatting. Language selection supports a switch, optional URL prefixes, cookies, and browser preferences.</p><p>Contract and changeset errors, JSON error messages, and framework pages use the request’s locale. Missing translations fall back, and <code>frappe translations</code> reports what remains. Background jobs carry their language explicitly.</p><p><button class="c-secondary cursor-interaction" data-page="i18n">Translate your application →</button></p><h2 id="c-release-tools">Runtime and local tools</h2><p>Caramel is a source-built Crystal framework. Its managed toolchain pins Crystal 1.21.1 and PostgreSQL 18. The local development workflow targets Apple Silicon macOS with Apple Command Line Tools. Frappé creates projects, generates resources, and supervises builds; Latte supplies managed services and named HTTPS.</p><p>Install from <code>v0.15.0</code> with the getting-started guide. An application’s <code>shard.lock</code> selects its framework release, and Frappé dispatches to the matching installation.</p><p><a href="https://github.com/caramelizedev/caramel/releases/tag/v0.15.0" target="_blank" rel="noopener noreferrer">Caramel 0.15.0 source release ↗</a></p>'+
    '<h2 id="c-release-requests">Requests and responses</h2><p>Typed action contracts bind route and query values, URL-encoded forms, multipart uploads, and JSON objects. The default policy checks CSRF for writes and limits ordinary request input to 2 MiB; multipart uploads have a separate 64 MiB budget. Use per-action <code>ingress</code> for a custom limit, authenticated APIs, or exact raw webhook bytes.</p><p>Actions return HTML or JSON according to the request. <code>render_errors</code> handles errors found after contract binding. Blueprint views write typed HTML with escaped text and attributes; htmx partial responses update selected page regions.</p>'+
    '<h2 id="c-release-data">Data and resource generation</h2><p>SugarORM provides typed schemas, changesets, queries, and explicit preloads. Derive a migration with <code>frappe db diff</code>, review it, and apply it with <code>frappe migrate</code>. <code>frappe make resource</code> generates application-owned models, changesets, actions, views, routes, migrations, and request specs.</p><p>Use <code>:server</code> for fields populated by the action, <code>:unique</code> for unique indexes and constraint checks, and <code>:url</code> for URL validation and inputs. <code>--only=create,show</code> generates a smaller action set; create and show are required, and edit needs new and update.</p>'+
    '<h2 id="c-release-work">Background work</h2><p>Cold Brew stores jobs in PostgreSQL and supports transactional enqueueing, retry policies, durable status, retry/failure hooks, recurring schedules, PubSub, and cache. The application binary runs queues through <code>serve</code> or a worker-only <code>work</code> process with queue and concurrency options. External calls can repeat, so use a stable identifier for deduplication.</p>'+
    '<h2 id="c-release-checks">Development and testing</h2><p>Corretto drives in-process application requests against isolated test databases. Its client sends forms, multipart uploads, JSON, or exact raw bodies. Blueprint-shaped <code>have_html</code> expectations inspect decoded rendered HTML; <code>render_partial</code> can check an envelope’s target, swap, and content together.</p><p>Generated applications pin Lexbor 3.6.4 under development dependencies. Development installs need cc, ar, and network access for the verified native parser source. Production installs omit the parser. Put application-owned test settings in committed <code>.env.test</code>; development <code>.env</code> does not reach specs.</p>'+
    '<h2 id="c-release-tenancy">Multi-tenancy</h2><p>An application can be multi-tenant. <code>frappe make tenancy MODEL</code> adds the tenant schema, sign-up and home pages, and a <code>tenant</code> block in the routes; resources generated afterwards belong to the tenant, and <code>--central</code> makes one every tenant shares.</p><p><button class="c-secondary cursor-interaction" data-page="tenancy">Add tenants →</button></p>'+
    '<h2 id="c-release-sweettalk">Domain-Driven Design</h2><p>An application can model its domain in SweetTalk, an opt-in language whose contexts, values, aggregates, events, policies, projections and processes expand into SugarORM and Cold Brew. <code>frappe make domain NAME CONTEXT --means=TEXT</code> starts one in <code>app/domain/</code>, and writes a skill that gives agents its rules. 0.15.0 answers a refusal from an action with 422 and binds values and ids as contract fields, names a rule once with <code>specification</code>, sorts, limits and counts queries, holds each lifecycle’s states in a PostgreSQL check, and adds a context’s <code>subdomain:</code>, its published language and borders with systems outside the program. The guide maps each Domain-Driven Design pattern to its word. SweetTalk is experimental: until an application has run it in production, a minor release may change the names it stores, and its upgrade notes will say how to move them.</p><p><button class="c-secondary cursor-interaction" data-page="sweettalk">Speak the domain’s language →</button></p>'+
    '<h2 id="c-release-observability">Observability</h2><p>Every routed request, job and schedule run gets a request id, a trace and one canonical log line. In development, <code>frappe dev</code> adds an inspector, a toolbar, richer error pages and the <code>frappe traces</code>, <code>trace</code> and <code>errors</code> commands. In production, an owner-only ops socket serves status, Prometheus text, recent errors and a console; the recorder and the OTLP exporter are opt-in. Latte adds statement statistics, menu-bar error counts and notifications, per-site access logs and a local trace collector on <code>127.0.0.1:4318</code>.</p><p><button class="c-secondary cursor-interaction" data-page="crema">Read the observability guide →</button></p>'+
    kicker('Limits')+
    '<h2 id="c-release-limits">Current limits</h2><ul><li>File upload parsing is available, but the cookbook still needs a complete storage and cleanup example.</li><li>A complete production deployment recipe remains unfinished.</li><li>An optional authentication generator remains unfinished.</li><li>Smaller individual generators remain unfinished.</li><li>A Frappé extension point for custom commands remains unfinished.</li><li>A consumer installer remains unfinished.</li><li>An application can add commands to its own binary with <code>Caramel::Crema.command</code>.</li><li>Draft recipes identify application examples that still need end-to-end validation.</li></ul>'+
    prove('c-release-prove','Check an upgraded application',snippet('Terminal · application checks','frappe check\nfrappe corretto\nfrappe lint','bash')+passing('<code>frappe check</code> prints <code>✓ Type check passed</code>, <code>frappe corretto</code> ends with <code>Corretto: N of N workers passed</code> and <code>frappe lint</code> exits 0.'))+
    next('learn','Build your first application'),
  deploy: () => heading('Guides / Production','From local to live.','What a compiled application promises any deploy tool: the release artifact, its process roles, readiness, shutdown and database setup.')+
    contract([['Release','0.15.0 baseline'],['Needs','A committed application tree, and a container engine such as Docker Desktop for the build'],['You will have','A <code>linux/amd64</code> artifact that holds <code>bin/SHARD</code> and <code>public/</code>'],['Proved by','<code>frappe build</code> · <code>APP jobs unknown</code>']])+
    '<p>A compiled application promises any deploy tool the behaviour below, as <a href="https://github.com/caramelizedev/caramel/blob/v0.15.0/docs/decisions/0032-application-production-contract.md" target="_blank" rel="noopener noreferrer">ADR 0032 ↗</a> records.</p>'+
    guideMap('deploy',[['Build',[['c-deploy-contract','Build the artifact'],['c-deploy-public','Serve public files']]],['Run',[['c-deploy-now','Run the process roles'],['c-deploy-ready','Check readiness'],['c-deploy-shutdown','Shut down gracefully']]],['Cut over',[['c-deploy-unknown','Check for unknown jobs'],['c-deploy-database','Set up the database'],['c-deploy-order','Cut over in order']]],['Limits',[['c-deploy-gaps','Not covered yet']]]])+
    kicker('Stage 1 · Build')+
    '<h2 id="c-deploy-contract">Build the artifact</h2>'+snippet('Terminal · inside the application','frappe build','bash')+
    expect('Prints the path of <code>.caramel/build/SHARD-YYYYmmddTHHMMSSZ-SHA7-linux-amd64.tar.gz</code> as its only line of output. The archive holds <code>bin/SHARD</code> and <code>public/</code>.')+
    '<p><code>frappe build</code> publishes <code>app/assets</code> into <code>public/</code>, then compiles the committed tree with <code>crystal build --release --static</code> in the pinned <code>crystallang/crystal:1.21.1-alpine</code> image for <code>linux/amd64</code>, keeping debug info. It needs a container engine, such as Docker Desktop, for this build only.</p>'+
    rules([['The working tree has uncommitted changes','<code>frappe build</code> refuses'],['Publishing <code>app/assets</code> into <code>public/</code> leaves changes','<code>frappe build</code> refuses']])+
    '<h2 id="c-deploy-public">Serve public files</h2><p><code>serve</code> reads <code>public/</code> from <code>CARAMEL_ROOT</code> when it is set, so the binary runs from wherever the artifact is unpacked.</p>'+
    kicker('Stage 2 · Run')+
    '<h2 id="c-deploy-now">Run the process roles</h2><p>A compiled application can serve HTTP or run Cold Brew with <code>work</code>, including queue selection, concurrency, and graceful completion of in-flight jobs. Run each web process as <code>serve --no-workers</code>, which keeps the PubSub broker and maintenance but runs no jobs or schedules, and run one <code>work</code> process.</p><p><button class="c-secondary cursor-interaction" data-page="local">Set up the local environment →</button></p>'+
    '<h2 id="c-deploy-ready">Check readiness</h2><p>Each process binds a socket path of its own, and the proxy moves to it once it is ready.</p>'+
    rules([['<code>GET /health</code> on the new process’s own socket, with <code>Host</code> set to the authority of <code>APP_ORIGIN</code>','answers 200 and <code>ok</code>','ok']])+
    '<h2 id="c-deploy-shutdown">Shut down gracefully</h2>'+
    rules([['SIGTERM','<code>serve</code> stops accepting connections, answers in-flight requests with <code>Connection: close</code> and exits when they finish or after 25 s','ok'],['An open server-sent events stream','counts as in flight','ok']])+
    kicker('Stage 3 · Cut over')+
    '<h2 id="c-deploy-unknown">Check for unknown jobs</h2><p>Before cutover, check the new binary against the queue.</p>'+
    snippet('Terminal · on the server','APP jobs unknown','bash')+
    expect('Prints nothing and exits 0 when every queued class is known; otherwise it prints each class the binary lacks, one per line, and exits 1.')+

    contract([['Needs','A Caramel installation set up as in <button class="c-secondary cursor-interaction" data-page="learn">Your first application</button>'],['You will have','A <code>boxoffice</code> application whose SweetTalk domain holds, sells and releases seats and keeps a waitlist, with two pages and passing specs'],['Status','Run end to end by Caramel’s checks; SweetTalk itself is experimental'],['Proved by','<code>frappe check</code> · <code>frappe corretto</code> · <code>frappe lint</code>']])+

    '<h2 id="c-boxoffice-create">01 · Create the application and its domain</h2><p>Create the application, then start its SweetTalk domain with one context, Seating.</p>'+
    snippet('Terminal · after machine setup','frappe new boxoffice\ncd boxoffice','bash')+

    '<h2 id="c-boxoffice-show">02 · Give each show its seats</h2><p>Replace <code>app/domain/box_office.cr</code> with the parts in steps 02 to 05, in order. A show owns its capacity, the holds still waiting for payment and the tickets already paid for, so one aggregate sees every seat.</p>'+
    snippet('app/domain/box_office.cr · the show and its seats',`# The BoxOffice domain, in SweetTalk (ADRs 0030 and 0031). Its words, such as
# context, value, aggregate, event and whenever, exist only inside this module.
module App::BoxOffice
  include SweetTalk

  context Seating, subdomain: :core, means: "selling the seats of each show" do
    HOLD_FOR = 10.minutes

    value Capacity, Int32, within: 1..5000, means: "the seats a show can sell"
    value Seats, Int32, within: 1..8, means: "the seats one guest takes at one checkout"
    value Email, String, matches: /\\A[^@\\s]+@[^@\\s]+\\z/, length: 3..254,
      means: "where we send a guest's tickets"

    aggregate Show, means: "one performance and the seats it sells" do
      has title : String
      has starts_at : Time
      has capacity : Capacity
      has issued : Int32 = 0
      has holds : Array(Hold)
      has tickets : Array(Ticket)
      moves on_sale >> closed
      never "A show cannot sell more seats than it has." { sold + held > capacity.to_i }

      entity Hold, means: "seats kept for one guest while they pay" do
        has number : Int32
        has guest : Email
        has seats : Seats
        has expires_at : Time
      end

      entity Ticket, means: "seats one guest paid for" do
        has number : Int32
        has guest : Email
        has seats : Seats
      end

      the held : Int32 = holds.sum(&.seats.to_i)
      the sold : Int32 = tickets.sum(&.seats.to_i)
      the left : Int32 = capacity.to_i - sold - held`)+
    '<p>Values name the capacity, the seats and the email, with their bounds. <code>the</code> derives what is held, sold and left from what the show stores. <code>never</code> states the rule every command keeps; a command’s own <code>refuse</code> tells the guest why first.</p>'+
    '<h2 id="c-boxoffice-hold">03 · Hold, sell and release seats</h2>'+
    snippet('app/domain/box_office.cr · holding, selling and releasing',`  event Scheduled, means: "a show went on sale"
  event Held, number : Int32, guest : Email, seats : Seats, expires_at : Time,
    means: "seats were kept for a guest until a time"
  event Sold, number : Int32, guest : Email, seats : Seats,
    means: "a guest paid for the seats held for them"
  event Released, number : Int32, seats : Seats, reason : String,
    means: "held seats went back on sale, and why"

  factory schedule(title : String, starts_at : Time, capacity : Capacity) do
    emit Scheduled
  end

  to hold(guest : Email, seats : Seats) do
    refuse "Sales for #{title} have closed." if closed?
    refuse "#{title} is sold out." if left.zero?
    refuse "Only #{left} seats left for #{title}." if seats.to_i > left
    @issued += 1
    expires_at = Time.utc + HOLD_FOR
    @holds << Hold.new(@issued, guest, seats, expires_at)
    emit Held, number: @issued, guest: guest, seats: seats, expires_at: expires_at
  end

  to sell(number : Int32) do
    hold = holds.find { |kept| kept.number == number }
    refuse "Hold #{number} is no longer held." unless hold
    @holds.reject! { |kept| kept.number == number }
    @tickets << Ticket.new(number, hold.guest, hold.seats)
    emit Sold, number: number, guest: hold.guest, seats: hold.seats
  end

  to release(number : Int32, reason : String) do
    if hold = holds.find { |kept| kept.number == number }
      @holds.reject! { |kept| kept.number == number }
      emit Released, number: number, seats: hold.seats, reason: reason
    end
  end

  to close do
    closed!
  end
end`)+
    '<p>Each command changes the one show it runs on. <code>hold</code> refuses with a reason the guest can act on, then keeps the seats for <code>HOLD_FOR</code>, the ten minutes at the top of the context. <code>sell</code> turns a hold into a ticket. <code>release</code> gives the seats back and does nothing when the hold has already ended, so a timer that fires late cannot undo a sale. Each event records the facts the next steps need.</p>'+
    '<h2 id="c-boxoffice-timer">04 · Release unpaid seats after ten minutes</h2>'+
    snippet('app/domain/box_office.cr · the checkout timer',`value Claim, means: "one hold on one show" do
  part show : Int64
  part number : Int32
end

process Checkout, means: "the time one guest has to pay for the seats held for them" do
  key claim : Claim

  whenever Show::Held,
    key: Claim.new(show: held.show_id.raw, number: held.number) do |held|
    arm lapse, after: held.expires_at - Time.utc
  end

  whenever Show::Sold,
    key: Claim.new(show: sold.show_id.raw, number: sold.number) do |sold|
    disarm lapse
  end

  whenever Show::Released,
    key: Claim.new(show: released.show_id.raw, number: released.number) do |released|
    disarm lapse
  end

  deadline lapse, after: HOLD_FOR do
    Show.find(Show::Id.new(claim.show)).release(claim.number, "not paid in time")
  end
end`)+
    '<p>The process keeps one row per hold, picked by its claim. Its steps run as Cold Brew jobs after the show’s command commits. A hold arms the deadline for its expiry time, and a sale or a release disarms it. When the ten minutes pass first, the deadline releases the seats.</p>'+
    '<h2 id="c-boxoffice-waitlist">05 · Offer released seats to the waitlist</h2><p>The waitlist is a second context. It follows Seating, so it may name Seating’s values and read its shows. Its policies react to Seating’s events: a scheduled show gets an empty line, a new hold seats its guest if they were waiting, and released seats are offered to the first guest they fit. Each policy changes one aggregate.</p>'+
    snippet('app/domain/box_office.cr · the waitlist',`  context Waitlist, follows: Seating, subdomain: :supporting,
    means: "guests waiting for the seats a show gives back" do
    aggregate Line, means: "the guests waiting for one show, first come, first served" do
      has show : Seating::Show
      has guests : Array(Guest)

      entity Guest, means: "one guest in the line, and the seats they want" do
        has email : Seating::Email
        has seats : Seating::Seats
      end

      event Offered, show : Seating::Show::Id, email : Seating::Email, seats : Seating::Seats,
        means: "seats came free for the first guest in the line they fit"

      finds for_show(show : Seating::Show::Id), where: {show: show}

      to join(email : Seating::Email, seats : Seating::Seats) do
        waiting = guests.any? { |guest| guest.email.raw == email.raw }
        refuse "#{email.raw} is already waiting." if waiting
        @guests << Guest.new(email, seats)
      end

      to offer(free : Int32) do
        if first = guests.find { |guest| guest.seats.to_i <= free }
          emit Offered, show: show, email: first.email, seats: first.seats
        end
      end

      to seat(email : Seating::Email) do
        @guests.reject! { |guest| guest.email.raw == email.raw }
      end
    end

    whenever Seating::Show::Scheduled do |scheduled|
      Line.create(show: scheduled.show_id)
    end

    whenever Seating::Show::Held do |held|
      Line.for_show(held.show_id).first?.try(&.seat(held.guest))
    end

    whenever Seating::Show::Released do |released|
      free = Seating::Show.find(released.show_id).left
      Line.for_show(released.show_id).first?.try(&.offer(free))
    end
  end
end`)+

    end
  end
end`)+

describe App::BoxOffice do

    '<h2 id="c-sweettalk-enable">Opt in</h2><p>Let Frappé start a domain. It adds <code>require "caramel/sweet_talk"</code> after <code>require "caramel"</code> and <code>require "../app/domain/*"</code> to <code>config/application.cr</code>, writes <code>app/domain/shop.cr</code> with that context, and a spec in <code>spec/domain/</code>. A plain application compiles none of SweetTalk.</p>'+

    '<h2 id="c-sweettalk-ddd">Find the Domain-Driven Design patterns</h2><p>Most patterns of Domain-Driven Design have a SweetTalk word. The table names the word and the section that states its rules. A pattern SweetTalk lacks says so.</p>'+
    '<table class="c-map"><thead><tr><th>Pattern</th><th>In SweetTalk</th><th>Rules</th></tr></thead><tbody>'+
    '<tr><td>Bounded context</td><td><code>context</code>, a module with its own vocabulary.</td><td><a href="#c-sweettalk-contexts">Draw the contexts</a></td></tr>'+
    '<tr><td>Ubiquitous language</td><td><code>means:</code> on every noun, and <code>SweetTalk.glossary</code>, which lists each with its kind and context.</td><td><a href="#c-sweettalk-meaning">Give every noun a meaning</a></td></tr>'+
    '<tr><td>Entity</td><td><code>entity</code>, which lives inside one aggregate and is saved with it.</td><td><a href="#c-sweettalk-aggregates">Declare aggregates and entities</a></td></tr>'+
    '<tr><td>Value object</td><td><code>value</code>: a number or a string with its bounds, or a value with parts, stored one column per part (<code>&lt;attribute&gt;_&lt;part&gt;</code>).</td><td><a href="#c-sweettalk-values">Name the values</a>, <a href="#c-sweettalk-richer-values">values with parts</a></td></tr>'+
    '<tr><td>Aggregate</td><td><code>aggregate</code>, a root with an id that only its commands change. Its entities reach the database only through it: a context that names <code>Rows</code> does not compile.</td><td><a href="#c-sweettalk-aggregates">Declare aggregates and entities</a>, <a href="#c-sweettalk-commands">commands</a></td></tr>'+
    '<tr><td>Repository</td><td>The aggregate’s own <code>create</code>, <code>find</code>, <code>find?</code> and <code>all</code>, and the queries <code>finds</code> and <code>counts</code> declare: filtered by attributes, states and specifications, sorted with <code>order:</code>, limited with <code>first:</code>, or narrowed by a block that never names <code>Rows</code> and always returns aggregates.</td><td><a href="#c-sweettalk-queries">Find, count and retire aggregates</a></td></tr>'+
    '<tr><td>Factory</td><td><code>factory</code>.</td><td><a href="#c-sweettalk-factories">Make aggregates with factories</a></td></tr>'+
    '<tr><td>Domain service</td><td><code>service</code>, which changes at most one aggregate.</td><td><a href="#c-sweettalk-services">Name operations with services</a></td></tr>'+
    '<tr><td>Domain event</td><td><code>event</code> and <code>emit</code>. Each event records who acted and what caused it.</td><td><a href="#c-sweettalk-events">Follow events with policies</a>, <a href="#c-sweettalk-metadata">Record who acted</a></td></tr>'+
    '<tr><td>Event handler (policy)</td><td><code>whenever</code>, run as a Cold Brew job.</td><td><a href="#c-sweettalk-events">Follow events with policies</a></td></tr>'+
    '<tr><td>Side-effect-free function</td><td><code>the</code>, a derived value computed on every read, and plain Crystal methods in an aggregate’s or an entity’s body.</td><td><a href="#c-sweettalk-lifecycle">Guard the lifecycle and the invariants</a></td></tr>'+
    '<tr><td>Specification</td><td><code>specification</code>, a rule stated once in <code>where:</code> and read both in Crystal, as a predicate such as <code>order.astray?</code>, and in PostgreSQL, by <code>satisfying:</code>.</td><td><a href="#c-sweettalk-specifications">Name rules with specifications</a></td></tr>'+
    '<tr><td>Lifecycle (state machine)</td><td><code>moves</code>, checked in Crystal and held in PostgreSQL by a <code>CHECK</code> constraint on the state column. A PostgreSQL enum type is not used, because <code>ALTER TYPE</code> cannot drop a value.</td><td><a href="#c-sweettalk-lifecycle">Guard the lifecycle and the invariants</a></td></tr>'+
    '<tr><td>Process manager or saga</td><td><code>process</code>, with <code>deadline</code> and <code>compensate</code>.</td><td><a href="#c-sweettalk-processes">Run processes</a></td></tr>'+
    '<tr><td>Read model</td><td><code>projection</code>, queried with <code>finds</code> and <code>counts</code>.</td><td><a href="#c-sweettalk-projections">Keep read models</a></td></tr>'+
    '<tr><td>Transactional outbox</td><td>Built in: a command enqueues its policies’, projections’ and processes’ jobs in its own transaction, and publishes its notification with <code>pg_notify</code>, which PostgreSQL delivers when that transaction commits.</td><td><a href="#c-sweettalk-events">Follow events with policies</a></td></tr>'+
    '<tr><td>Conformist</td><td><code>follows:</code>, which adopts another context’s types as they are.</td><td><a href="#c-sweettalk-contexts">Draw the contexts</a></td></tr>'+
    '<tr><td>Anticorruption layer</td><td><code>border Other</code>, which translates another context’s events, values and ids into this one’s. Code in it may also read <code>Other::</code> directly, or call <code>Other.price_of</code>, which draws a dependency edge. <code>border Cards, outside: "…"</code> is the border with a system outside the program, the only code that may name <code>Caramel::Outbound</code> or <code>HTTP::Client</code>, a check on the code as written.</td><td><a href="#c-sweettalk-contexts">Draw the contexts</a>, <a href="#c-sweettalk-outside">Translate outside systems at a border</a></td></tr>'+
    '<tr><td>Open-host service</td><td>The services a context lists in <code>publishes</code>: in one binary, a set of calls other contexts may make.</td><td><a href="#c-sweettalk-published">Publish a language</a></td></tr>'+
    '<tr><td>Published language</td><td><code>publishes</code>, the types and services other contexts may name; any other name of the context does not compile outside it.</td><td><a href="#c-sweettalk-published">Publish a language</a></td></tr>'+
    '<tr><td>Shared kernel</td><td><span data-planned="none">Not planned.</span> <code>central: true</code> is tenancy, not a shared kernel.</td><td><a href="#c-sweettalk-tenancy">Share a domain between tenants</a></td></tr>'+
    '<tr><td>Partnership</td><td><span data-planned="none">Not planned.</span> Two contexts may react to each other’s events, but their dependency edges may not form a cycle.</td><td><a href="#c-sweettalk-contexts">Draw the contexts</a></td></tr>'+
    '<tr><td>Customer/supplier</td><td><span data-planned="none">Not planned.</span> A supplier’s promise to its customers is what it <code>publishes</code>.</td><td><a href="#c-sweettalk-published">Publish a language</a></td></tr>'+
    '<tr><td>Distillation (core, supporting and generic subdomains)</td><td><code>subdomain:</code> on <code>context</code>, carried by every glossary term. The label changes no rule the compiler checks.</td><td><a href="#c-sweettalk-subdomains">Mark the core domain</a></td></tr>'+
    '<tr><td>Event sourcing</td><td><span data-planned="none">Not planned.</span> State lives in rows, and there is no event log.</td><td><a href="#c-sweettalk-limits">Not covered yet</a></td></tr>'+
    '</tbody></table>'+
    '<p>Some differences from the patterns as usually described are deliberate:</p><ul>'+
    '<li><strong>The repository lives on the aggregate.</strong> The aggregate already meets the repository’s rules: it reaches roots only, offers a collection’s interface (<code>create</code>, <code>find</code>, <code>find?</code>, <code>all</code>), and names its queries in domain terms with <code>finds</code>, whose keys are attributes and states the compiler checks, never SQL or SugarORM’s query syntax; a separate repository word would add a second name for the same thing (ADR 0030 decision 2, ADR 0031 decision 3).</li>'+
    '<li><strong>One aggregate per transaction, services included.</strong> A command, a service, a policy and a process step each change at most one aggregate, so each lock and each invariant stays its aggregate’s own; work across aggregates is a process, or a policy that reacts to an event (ADR 0030 decision 5, ADR 0031 decision 5).</li>'+
    '<li><strong>Events belong to their aggregate.</strong> An aggregate emits only its own events and an entity emits none, because the aggregate guards the invariants its entities share; an entity changes through its aggregate’s commands (ADR 0030 decision 2).</li>'+
    '<li><strong>Contexts are modules of one binary.</strong> Contexts call each other in the same process and react to each other’s events through Cold Brew jobs, so one machine stays enough and there is no RPC or HTTP transport between them (ADR 0030, Reasons).</li>'+
    '<li><strong><code>central: true</code> is tenancy.</strong> It shares a context’s rows between the tenants of a multi-tenant application; it shares no types between contexts, so it is not a shared kernel (ADR 0033 decision 2).</li>'+
    '<li><strong>State lives in rows.</strong> An event drives its policies, projections and processes and is not kept, because SweetTalk expands into SugarORM tables and keeps state in PostgreSQL; there is no event store, and none is planned; <a href="#c-sweettalk-limits">Not covered yet</a> says what that leaves out (ADR 0030 decisions 4 and 6).</li>'+
    '</ul><p>Specs run the domain against real PostgreSQL. Each Corretto example rolls back, and <code>drain_queue!</code> runs the jobs a command enqueued at once, so a spec of a policy, a projection or a process waits for no worker.</p>'+
    '<h2 id="c-sweettalk-meaning">Give every noun a meaning</h2><p>Every context, value, aggregate, entity, event, projection, specification, service and process carries <code>means:</code>. A noun without one does not compile, and <code>SweetTalk.glossary</code> lists every entry with its kind, its context and that context’s subdomain, so the ubiquitous language is part of the program.</p><p>The same word may mean different things in two contexts:</p>'+
    lookup(['Noun','Means'],[['<code>Catalogue::Tins</code>','“a count of tins on the shelf”'],['<code>Fulfilment::Tins</code>','“tins of one tea packed in a parcel”']])+
    kicker('Stage 2 · Draw boundaries')+'<h2 id="c-sweettalk-contexts">Draw the contexts</h2><p>A <code>context</code> is a bounded context: a module with its own vocabulary. <code>follows:</code> adopts another context’s types as they are. A <code>border</code> is the one place where a context may name a context it does not follow, and it translates that context’s values and ids into its own. Here each context reacts to the other’s event:</p>'+
    snippet('tea_shop.cr · two contexts',`context Ordering, follows: Catalogue, means: "choosing teas and checking out" do
  # Ordering may name Catalogue::Tea anywhere.

  border Fulfilment do
    whenever Fulfilment::Parcel::Dispatched do |dispatched|
      Order.find(Order::Id.new(dispatched.order)).ship
    end
    # …
  end
end

context Fulfilment, means: "packing and dispatching parcels" do
  value Tins, Int32, at_least: 1, means: "tins of one tea packed in a parcel"
  # …

  border Ordering do
    whenever Ordering::Order::Placed do |placed|
      packings = placed.lines.map do |line|
        Parcel::Packing.new(line.tea.raw, Tins.new(line.quantity))
      end
      address = placed.deliver_to
      label = Label.new(street: address.street, city: address.city,
