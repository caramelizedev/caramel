<!-- Caramel's pages. build.mjs reads the two templates and the script; site.css and site.js hold the look and the behaviour. -->
<template id="c-home">
<div class="c-home">
  <section class="c-hero">
    <div class="c-hero-copy">
      <p class="c-kicker">A web framework for Crystal</p>
      <h1>A little structure.<br><span>A lot of possibility.</span></h1>
      <p class="c-hero-lede">PostgreSQL, typed HTML, and a clear place for every change. Six rules do most of the work — the compiler and the test suite keep you to them.</p>
      <div class="c-actions"><button class="c-primary cursor-interaction" data-page="learn">Start building</button><a class="c-ghost" href="#c-home-rules">Read the six rules</a></div>
    </div>
    <aside class="c-way" aria-labelledby="c-way-title">
      <header><h2 id="c-way-title">The Caramel way</h2><span>house rules</span></header>
      <ol><li><span>01</span>Every change has one place.</li><li><span>02</span>Every input is declared.</li><li><span>03</span>Every write goes through a changeset.</li><li><span>04</span>Everything is escaped unless your code built it.</li><li><span>05</span>Every job is safe to run twice.</li><li><span>06</span>Every change is proven.</li></ol>
    </aside>
  </section>
  <section class="c-band" id="c-home-rules">
    <div class="c-band-inner">
      <div class="c-band-head"><p class="c-kicker">Six rules</p><h2>Short enough to remember.<br>Strict enough to rely on.</h2></div>
      <div class="c-rules-grid">
        <article><span class="c-kicker">01 · Structure</span><h3>Every change has one place.</h3><p>Routes in <code>config/routes.cr</code>, actions in <code>app/actions/</code>, views in <code>app/views/</code>. Your application’s files are the extension point.</p></article>
        <article><span class="c-kicker">02 · Contracts</span><h3>Every input is declared.</h3><p>Each field is typed and bounded in the action’s contract, and a route parameter without a contract field stops the build, not the request.</p></article>
        <article><span class="c-kicker">03 · SugarORM</span><h3>Every write goes through a changeset.</h3><p>Validations and unique constraints live on the changeset, so the rules hold for every caller. Schema first, then a migration you derive and review.</p></article>
        <article><span class="c-kicker">04 · Blueprint</span><h3>Everything is escaped unless your code built it.</h3><p>Views are typed Crystal classes that escape text and attributes by default. Reach for htmx fragments before client state, and islands only for widgets that need their own.</p></article>
        <article><span class="c-kicker">05 · Cold Brew</span><h3>Every job is safe to run twice.</h3><p>Jobs run at least once: enqueue in the same transaction as the write, and pass ids rather than records.</p></article>
        <article><span class="c-kicker">06 · Corretto</span><h3>Every change is proven.</h3><p>Request specs run against real PostgreSQL and assert what users observe: HTML, rows, statuses, headers.</p></article>
      </div>
      <div class="c-actions"><button class="c-ghost cursor-interaction" data-page="practices">Each rule, with its outcomes, in Best practices</button></div>
    </div>
  </section>
  <section class="c-practice">
    <div class="c-practice-copy">
      <p class="c-kicker">In practice</p>
      <h2>One action.<br>Four rules at work.</h2>
      <p>Creating a book reads like a short sentence: take the declared input, write it through a changeset, queue the follow-up in the same transaction, answer with the record or its errors.</p>
      <p class="c-aside">And then <code>frappe corretto</code> proves it — rule 06.</p>
    </div>
    <figure class="c-rulecode">
      <div class="c-rulecode-head"><span>app/actions/books/create.cr · an illustration: handle, with a SendReceipt job you define</span><span>Crystal</span></div>
      <div class="c-rulecode-body"><div class="c-margin" aria-hidden="true">02
03


05


04
</div><pre><code class="language-crystal">def handle(contract : Contract)
  changes = App::Book::Changeset.new(title: contract.title, author: contract.author)
  SugarORM::Repo.transaction do
    SugarORM::Repo.insert(changes)
    App::SendReceipt.enqueue(book_id: changes.record.id) if changes.saved?
  end
  return render_errors(changes.errors) unless changes.saved?
  {record: changes.record}
end</code></pre></div>
      <figcaption>Margin numbers mark the rule each line keeps. The record renders through an escaping Blueprint view.</figcaption>
    </figure>
  </section>
  <section class="c-band">
    <div class="c-band-inner">
      <div class="c-band-head"><p class="c-kicker">Project map</p><h2>Start with your intention.</h2><p>Say what you want to change. Caramel already knows where it goes, and how to check it.</p></div>
      <table class="c-intent">
        <thead><tr><th>I want to…</th><th>It goes in</th><th>Check it with</th></tr></thead>
        <tbody>
          <tr><td>Add an endpoint</td><td><code>config/routes.cr</code> and an action in <code>app/actions/</code> with its contract</td><td><code>frappe routes</code></td></tr>
          <tr><td>Render a page</td><td>A Blueprint view in <code>app/views/</code> — typed inputs, escaped output</td><td><code>frappe check</code></td></tr>
          <tr><td>Store new data</td><td>The SugarORM schema first, then a migration you derive and review</td><td><code>frappe db diff</code></td></tr>
          <tr><td>Do work later</td><td>A Cold Brew job, enqueued beside the write it follows</td><td><code>frappe corretto</code></td></tr>
          <tr><td>Speak another language</td><td>Translation catalogs — <code>t.</code> messages with named placeholders</td><td><code>frappe translations</code></td></tr>
          <tr><td>Keep the code honest</td><td>Descriptive names, short blocks, small actions — the verb on the model, not a service</td><td><code>frappe lint</code></td></tr>
        </tbody>
      </table>
    </div>
  </section>
  <section class="c-layers">
    <div class="c-layers-copy">
      <p class="c-kicker">Layer by layer</p>
      <h2>Seven layers.<br>One job each.</h2>
      <p>From the HTML your users see down to the services on your machine, every part of Caramel does one thing — and all of it stands on PostgreSQL. SweetTalk, an opt-in language for the domain model, sits on top: <button class="c-inline cursor-interaction" data-page="boxoffice">build a box office with it</button>.</p>
    </div>
    <ol class="c-layer-stack" aria-label="Caramel layers, top to bottom">
      <li><strong>Blueprint</strong><span>HTML written in typed Crystal</span></li>
      <li><strong>SugarORM</strong><span>Schemas, changesets and queries</span></li>
      <li><strong>Cold Brew</strong><span>Background work, backed by PostgreSQL</span></li>
      <li><strong>Corretto</strong><span>Application tests with real data</span></li>
      <li><strong>Crema</strong><span>Logs, metrics and traces</span></li>
      <li><strong>Frappé</strong><span>Your developer command line</span></li>
      <li><strong>Latte</strong><span>Local services and named HTTPS</span></li>
    </ol>
  </section>
  <section class="c-band c-closing">
    <div class="c-band-inner c-closing-grid">
      <div class="c-closing-copy">
        <p class="c-kicker">Status</p>
        <h2>What to expect.</h2>
        <ul>
          <li>Caramel 0.15.0 is released. During 0.x a minor release can break compatibility; the <button class="c-inline cursor-interaction" data-page="releases">current release guide</button> says what each one changes. SweetTalk is experimental and Draft recipes are labelled.</li>
          <li>Development runs on Apple Silicon macOS today — <button class="c-inline cursor-interaction" data-page="learn">what the machine needs</button>.</li>
          <li>Caramel builds a linux/amd64 artifact and states what it promises a deploy tool; it ships no command that provisions servers or deploys — <button class="c-inline cursor-interaction" data-page="deploy">read the production contract</button>.</li>
        </ul>
      </div>
      <div class="c-closing-copy">
        <p class="c-kicker">Your first application</p>
        <h2>Start with something real.</h2>
        <div class="c-snippet"><header>Terminal · after installing the 0.15.0 release</header><pre><code class="language-bash">frappe new bookshelf && cd bookshelf
frappe make resource Book title:string author:string
frappe migrate
frappe check && frappe lint && frappe corretto
frappe dev</code></pre></div>
        <p>The Learn page says what each command prints; <code>frappe dev</code> holds the terminal until Ctrl-C.</p>
        <div class="c-actions"><button class="c-primary cursor-interaction" data-page="learn">Your first application</button><button class="c-ghost cursor-interaction" data-page="practices">Best practices</button></div>
      </div>
    </div>
  </section>
  <footer class="c-footer"><span>Caramel — a little structure, a lot of possibility.</span><span><button class="cursor-interaction" data-page="cookbook">Cookbook</button><button class="cursor-interaction" data-page="security">Security defaults</button><a href="https://github.com/caramelizedev/caramel">GitHub</a></span></footer>
</div>

<template id="c-cookbook">
<div class="c-catalog">
  <section class="c-catalog-intro">
    <div><p class="c-eyebrow">Cookbook</p><h1>Solve one problem at a time.</h1><p class="c-lede">Each recipe takes one change from the files it touches to a passing spec. Every recipe says how far it has been tested.</p></div>
    <aside class="c-gives"><p class="c-kicker">Every recipe gives you</p><ol><li>Where the change goes</li><li>Steps, each with what to expect</li><li>A Prove it block that passes</li></ol></aside>
  </section>
  <section class="c-finder" aria-label="Recipes">
    <div class="c-finder-bar"><label class="c-field"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="c-recipe-search" type="search" autocomplete="off" aria-label="Find a recipe" placeholder="Find a recipe: login, queue, json, upload…"></label><span class="c-count" id="c-recipe-count"><!-- recipe-count --></span></div>
    <div class="c-recipe-grid" id="c-recipes"><!-- recipes --></div>
    <p class="c-empty" id="c-empty" hidden>No matching recipes. Try “JSON”, “file”, or “job”.</p>
  </section>
  <section class="c-legend" aria-label="Status labels">
    <div><span class="c-tag c-proved">Proved</span><p>Built from a new application and run end to end by one of Caramel’s checks, which names it.</p></div>
    <div><span class="c-tag c-draft">Draft recipe</span><p>Written against 0.15.0 with the release’s own commands, not yet run end to end.</p></div>
    <div><span class="c-tag c-gap">Needs validation</span><p>Part of the path is missing from Caramel today. The recipe says which part.</p></div>
    <div><span class="c-tag">How recipes are written</span><p>The shape every recipe follows is in the <a href="https://github.com/caramelizedev/caramel/blob/main/.claude/skills/caramel-docs/SKILL.md">documentation standards</a>.</p></div>
  </section>
</div>
</template>
<script>
const escapeText = text => String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const note = (title, body, label) => `<div class="c-note">${label ? `<small>${label}</small> ` : ''}${title ? `<strong>${title}</strong>` : ''}<p>${body}</p></div>`;
const next = (page, label) => `<div class="c-next"><button class="cursor-interaction" data-page="${page}">${label} →</button></div>`;
const CONTRACT = ['Release', 'Needs', 'You will have', 'Covers', 'Status', 'Proved by'];
const contract = rows => {
  for (const [label] of rows) if (!CONTRACT.includes(label)) throw new Error(`Contract label ${label} is not one of ${CONTRACT.join(', ')}`);
  return `<table class="c-contract"><thead><tr><th>Contract</th><th>Value</th></tr></thead><tbody>${rows.map(([label, value]) => `<tr><th scope="row">${label}</th><td>${value}</td></tr>`).join('')}</tbody></table>`;
};
const limits = (page, rows) => `<h2 id="c-${page}-limits">Limits at a glance</h2><table class="c-limits"><thead><tr><th>Limit</th><th>Value</th></tr></thead><tbody>${rows.map(([limit, value]) => `<tr><td>${limit}</td><td>${value}</td></tr>`).join('')}</tbody></table>`;
const rules = rows => `<table class="c-rules"><thead><tr><th>Condition</th><th>Outcome</th></tr></thead><tbody>${rows.map(([condition, outcome, tone]) => `<tr><td>${condition}</td><td${tone === 'ok' ? ' class="c-ok"' : ''}>${outcome}</td></tr>`).join('')}</tbody></table>`;
const lookup = (columns, rows) => `<table class="c-map"><thead><tr>${columns.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
const expect = html => `<p class="c-expect"><strong>Expect:</strong> ${html}</p>`;
const passing = html => `<p class="c-passing"><strong>Passing:</strong> ${html}</p>`;
const steps = items => `<ol class="c-steps">${items.map(([title, html]) => `<li><strong>${title}</strong>${html}</li>`).join('')}</ol>`;
const choices = items => `<ul class="c-choices">${items.map(([title, html]) => `<li><strong>${title}</strong> ${html}</li>`).join('')}</ul>`;
const kicker = text => `<p class="c-kicker">${text}</p>`;
const prove = (id, title, html) => `<div class="c-prove">${kicker('Prove it')}<h2 id="${id}">${title}</h2>${html}</div>`;
const STAGES = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];
const guideMap = (page, stages) => {
  const sections = stages.reduce((count, [, links]) => count + links.length, 0);
  return `<div class="c-guidemap"><h2 id="c-${page}-map">The guide in ${STAGES[stages.length]} stages</h2>${kicker(`${sections} sections · read in order the first time`)}<ul>${stages.map(([stage, links], i) => `<li><strong>${i + 1} · ${stage}</strong><ul>${links.map(([id, label]) => `<li><a href="#${id}">${label}</a></li>`).join('')}</ul></li>`).join('')}</ul></div>`;
};
const snippet = (name,code,language='crystal') => `<div class="c-snippet"><header>${escapeText(name)}</header><pre><code class="language-${language}">${escapeText(code)}</code></pre></div>`;
const heading = (section,title,lede) => `<div class="c-eyebrow">${section}</div><h1>${title}</h1><p class="c-lede">${lede}</p>`;
// A recipe's status row. 'Draft recipe' (the default) and 'Recipe needs validation' say the
// recipe has not run end to end; 'Proved by scripts/check page-KEY' names the check that ran it.
const tags = (status = 'Draft recipe') => {
  const proved = status.startsWith('Proved by ');
  return `<div class="c-tagrow"><span class="c-tag ${proved ? 'c-proved' : 'c-draft'}">${status}</span><span class="c-tag">Target: 0.15.0</span>${proved ? '' : '<span class="c-tag">Not yet recipe-tested</span>'}</div>`;
};
const files = rows => `<div class="c-files">${rows.map(([file,why])=>`<div class="c-file"><code>${file}</code><small>${why}</small></div>`).join('')}</div>`;
const pages = {
  learn: () => heading('Learn / The Bookshelf path','Start with something real.','Install Caramel 0.15.0, create a bookshelf, and check the generated feature with real application tests.')+
    contract([['Needs', 'Apple Silicon macOS with Apple Command Line Tools'], ['You will have', 'A <code>bookshelf</code> application with a generated Book resource, checked by request specs'], ['Status', 'Steps 02 and 03 and the proof run end to end in <code>scripts/check frappe-project</code>; the machine setup in step 01 is not run by a check'], ['Proved by', '<code>frappe check</code> · <code>frappe corretto</code> · <code>frappe lint</code>']])+
    note('Caramel develops on Apple Silicon macOS and brings its own toolchain.','Install Apple Command Line Tools first; development dependencies use its C compiler and archiver. <code>scripts/install-toolchain</code> supplies the pinned Crystal 1.21.1, PostgreSQL 18.6, Caddy 2.11.4 and CoreDNS 1.14.7, so nothing else is installed by hand. Every page that needs these facts links here.')+
    '<h2 id="c-learn-setup">01 · Install the release</h2><p>Clone the <code>v0.15.0</code> tag and run the six setup commands, each with what it prints, in the <button class="c-secondary cursor-interaction" data-page="local">Local environment reference</button>: the toolchain, the release build, <code>installations register</code>, the services, the resolver and ports, and the certificate trust. Then confirm the services from any directory.</p>'+snippet('Terminal · anywhere, after the setup sequence','frappe services start','bash')+
    expect('Lists <code>postgres</code>, <code>dns</code> and <code>proxy</code>, each <code>running</code>, then <code>collector running (127.0.0.1:4318)</code>. A second run lists them again.')+
    '<h2 id="c-learn-create">02 · Create your bookshelf</h2><p>Leave the checkout first: an application is a directory of its own.</p>'+snippet('Terminal · after machine setup, outside the caramel checkout','cd ..\nfrappe new bookshelf\ncd bookshelf','bash')+
    expect('Prints <code>Created bookshelf. Installing locked dependencies…</code>, installs dependencies, configures the local site and applies the starter migrations, then prints <code>bookshelf is configured at https://bookshelf.caramel</code>. A second run stops with <code>Project destination must be empty; existing files were preserved</code> and changes nothing.')+
    snippet('Terminal · inside bookshelf','frappe make resource Book title:string author:string\nfrappe migrate','bash')+
    expect('Prints <code>Generated PATH</code> for each file it writes (application-owned models, changesets, actions, Blueprint views and request specs), then <code>Run frappe migrate to apply the new schema. Use frappe routes to see the generated URLs.</code> A second <code>make resource Book</code> stops with <code>A resource route, helper or message group already exists</code> and writes nothing. <code>frappe migrate</code> applies the Book migration and prints <code>Applied N migrations.</code>, then <code>The database matches the declared schema.</code>; run again, it prints <code>Applied 0 migrations.</code> and the same second line.')+
    '<h2 id="c-learn-check">03 · Check the book routes and open the site</h2>'+snippet('Terminal · inside bookshelf','frappe routes books','bash')+
    expect('Lists the book routes with their contracts, such as <code>GET /books/:id App::Books::Show id:Int64(min=1)</code>.')+
    snippet('Terminal · inside bookshelf','frappe dev','bash')+
    expect('Builds the application, serves it at <code>https://bookshelf.caramel</code> and opens the browser when the first build is ready; <code>https://bookshelf.caramel/books</code> is the generated list of books, empty for now. The command holds the terminal until Ctrl-C: run the proof below in a second terminal, or stop it first.')+
    prove('c-learn-prove','Prove the bookshelf works',snippet('Terminal · inside bookshelf, in a second terminal or after Ctrl-C','frappe check\nfrappe corretto\nfrappe lint','bash')+passing('<code>frappe check</code> exits 0 and prints <code>✓ Type check passed</code> on a terminal, <code>frappe corretto</code> passes the generated request specs and ends with <code>Corretto: N of N workers passed</code>, and <code>frappe lint</code> exits 0. Corretto uses isolated test databases, so your development records stay separate.')+'<p>Steps 02 and 03 and this proof are what <code>scripts/check frappe-project</code> runs against a new application on every release; step 01 is run by hand.</p>')+
    '<p>Ready for a domain with rules of its own? <button class="c-secondary cursor-interaction" data-page="boxoffice">Build a box office →</button></p>'+
    next('map','See where everything lives'),
  map: () => heading('Guides / Project structure','A place for every change.','Start with your intention. Caramel’s conventions give it a home, and its tools help you check the result.')+
    contract([['Covers', 'Endpoints, stored data, pages, background jobs, languages, the domain model, seed data, tenants and the production build'], ['You will have', 'The files that own each kind of change, the commands that check it, and the page that states its rules'], ['Proved by', '<code>frappe check</code> · <code>frappe corretto</code>']])+
    '<h2 id="c-map-task">Find the file for a change</h2><p>Each row names the files, the commands that check them, and the page that states the rules.</p>'+lookup(['I want to…', 'It goes in', 'Check it with'], [
      ['<strong>Add or change an endpoint</strong> <button class="c-secondary cursor-interaction" data-page="routing">Routes and contracts →</button>', '<code>config/routes.cr</code> <code>app/actions/</code> <code>spec/requests/</code>', '<code>frappe routes</code> · <code>frappe check</code> · <code>frappe corretto</code>'],
      ['<strong>Change the data the application stores</strong> <button class="c-secondary cursor-interaction" data-page="sugarorm">SugarORM →</button>', '<code>app/models/</code> <code>app/changesets/</code> <code>db/migrations/</code>', '<code>frappe db diff</code> · <code>frappe migrate</code> · <code>frappe corretto</code>'],
      ['<strong>Change what the browser renders</strong> <button class="c-secondary cursor-interaction" data-page="views">Views →</button> <button class="c-secondary cursor-interaction" data-page="testing">Test rendered HTML →</button>', '<code>app/views/</code> <code>app/assets/</code> <code>spec/requests/</code>', '<code>frappe check</code> · <code>frappe corretto</code>'],
      ['<strong>Move work into a background job</strong> <button class="c-secondary cursor-interaction" data-page="coldbrew">Cold Brew →</button>', '<code>app/jobs/</code> <code>spec/requests/</code>', '<code>frappe check</code> · <code>frappe corretto</code>'],
      ['<strong>Translate the application</strong> <button class="c-secondary cursor-interaction" data-page="i18n">Internationalization →</button>', '<code>app/locales/</code> <code>config/application.cr</code>', '<code>frappe translations</code> · <code>frappe check</code> · <code>frappe corretto</code>'],
      ['<strong>Model the domain in SweetTalk</strong> <button class="c-secondary cursor-interaction" data-page="sweettalk">SweetTalk →</button>', '<code>app/domain/</code> <code>spec/domain/</code> <code>.claude/skills/sweettalk/SKILL.md</code>', '<code>frappe check</code> · <code>frappe db diff</code> · <code>frappe corretto</code>'],
      ['<strong>Seed development data</strong> <button class="c-secondary cursor-interaction" data-page="local">Local environment →</button>', '<code>db/seeds.cr</code>', '<code>frappe seed</code>'],
      ['<strong>Serve many accounts from one application</strong> <button class="c-secondary cursor-interaction" data-page="tenancy">Multi-tenancy →</button>', 'The <code>tenant</code> block in <code>config/routes.cr</code> <code>app/models/</code>', '<code>frappe make tenancy</code> · <code>frappe routes</code> · <code>frappe corretto</code>'],
      ['<strong>Build for production</strong> <button class="c-secondary cursor-interaction" data-page="deploy">Production →</button>', 'The committed tree; <code>public/</code> in the artifact', '<code>frappe build</code> · <code>APP jobs unknown</code>'],
    ])+
    '<p>Your application’s files are the extension point. <button class="c-secondary cursor-interaction" data-page="practices">Best practices says what to do when the public API falls short →</button></p>'+
    '<h2 id="c-map-components">Meet the framework</h2><p>Seven components, one job each, all standing on PostgreSQL, and one opt-in language on top of them.</p>'+lookup(['Component', 'What it does'], [['<strong>Blueprint</strong>', 'HTML written in typed Crystal'], ['<strong>SugarORM</strong>', 'Schemas, changesets and queries'], ['<strong>Cold Brew</strong>', 'Background work, backed by PostgreSQL'], ['<strong>Corretto</strong>', 'Application tests with real data'], ['<strong>Crema</strong>', 'Logs, metrics and traces'], ['<strong>Frappé</strong>', 'Your developer command line'], ['<strong>Latte</strong>', 'Local services and named HTTPS'], ['<strong>SweetTalk</strong>', 'An opt-in language for the domain model, experimental']])+
    '<h2 id="c-map-compile">What does not compile</h2><p>A change in the wrong place is caught by <code>frappe check</code>, before any request. Each page linked above states its own rules; these are the ones a newcomer meets first.</p>'+rules([['A route parameter without a field in the action’s contract', 'fails compilation'], ['An association a view reads without a preload', 'fails compilation, reported as <code>N_PLUS_ONE</code>'], ['Two schemas that name one table', 'fails compilation'], ['A mocking library compiled beside Corretto', 'fails compilation']])+
    '<h2 id="c-map-gaps">Not covered yet</h2><ul><li><code>app/commands/</code> is generated empty and <code>config/application.cr</code> does not require it; a command registered with <code>Caramel::Crema.command</code> lives in a file you require yourself.</li><li><code>spec/system/</code> and <code>storage/</code> are generated empty; no page describes browser tests or file storage.</li><li>Caramel ships no command that provisions servers or deploys.</li></ul>'+

    '<h2 id="c-json-response">Ask for a JSON response</h2><p>A generated action returns its result from <code>handle</code> and renders HTML in <code>render</code>. A client that sends <code>Accept: application/json</code> gets the result as JSON instead: the index answers <code>records</code>, the show <code>record</code>, and the create <code>record</code> with status 201. A failed contract or changeset answers 422 with an <code>errors</code> object, and the generated request spec already reads one book this way.</p><button class="c-secondary cursor-interaction" data-page="actions">Read how actions answer JSON →</button>'+

    steps([['Add the version field',snippet('app/models/book.cr','module App\n  struct Book < SugarORM::Schema\n    schema "books" do\n      field id : Int64, primary: true\n      field title : String\n      field author : String\n      field lock_version : Int32, version: true\n      timestamps\n    end\n  end\nend')+'<p><code>version: true</code> starts the column at 0 and adds one on every update. <button class="c-secondary cursor-interaction" data-page="sugarorm">Read the version rules →</button></p>'+snippet('Terminal · inside the application','frappe db diff --name add_book_lock_version','bash')+expect('Prints <code>Wrote</code> and the path of one migration ending in <code>_add_book_lock_version.cr</code>, which adds <code>"lock_version" integer NOT NULL DEFAULT 0</code> to <code>books</code>.')],['Apply the migration',snippet('Terminal · inside the application','frappe migrate','bash')+expect('Prints <code>Applied 1 migrations.</code>, then <code>The database matches the declared schema.</code>')],['Send the version, then check it','<p>Replace the generated show and update actions. <code>self.etag = version</code> adds <code>ETag: "0"</code> to a successful JSON answer, and <code>if_match?(version)</code> is true with no <code>If-Match</code> header or one that names that version. <button class="c-secondary cursor-interaction" data-page="actions">Read the ETag and If-Match rules →</button></p>'+snippet('app/actions/books/show.cr','module App::Books\n  struct Show < App::ApplicationAction\n    contract do\n      field id : Int64, min: 1\n    end\n\n    def handle(contract : Contract)\n      record = App::Book.query.find(contract.id)\n      return not_found("Book not found") unless record\n      self.etag = record.lock_version\n      {record: record}\n    end\n\n    def render(result)\n      page "Book", Views::Books::Show.new(result[:record], csrf_token)\n    end\n  end\nend')+snippet('app/actions/books/update.cr','module App::Books\n  struct Update < App::ApplicationAction\n    include Form\n\n    contract do\n      field id : Int64, min: 1\n      field title : String\n      field author : String\n    end\n\n    def handle(contract : Contract)\n      record = App::Book.query.find(contract.id)\n      return not_found("Book not found") unless record\n      unless if_match?(record.lock_version)\n        return render_errors({"_base" => [SugarORM::Wording.record_stale]}, 412)\n      end\n      changes = record.update(title: contract.title, author: contract.author)\n      return render_form(contract.values, changes.errors, contract.id, 422) unless changes.saved?\n      self.etag = changes.record.lock_version\n      {record: changes.record}\n    end\n\n    def render(result)\n      redirect_to(book_path(result[:record].id))\n    end\n  end\nend')+'<p>The browser form still works: it sends no <code>If-Match</code>, so the update writes, and the generated request spec keeps passing.</p>']])+

    prove('c-json-prove','Prove the JSON behavior','<p>Add the request spec beside the generated one, then run the checks.</p>'+snippet('spec/requests/books_json_spec.cr','require "../spec_helper"\n\ndescribe "Books as JSON" do\n  it "lists and shows books, with the version as an ETag" do\n    Corretto.session do |client, db|\n      App::Book.create(title: "Dune", author: "Frank Herbert")\n      accept = {"Accept" => "application/json"}\n      listed = client.get("/books", headers: accept)\n      listed.should have_status(200)\n      records = JSON.parse(listed.body)["records"].as_a\n      records.map(&.["title"].as_s).should eq(["Dune"])\n      book = App::Book.query.first!(db)\n      shown = client.get("/books/#{book.id}", headers: accept)\n      shown.should have_status(200)\n      shown.should have_header("ETag", %("0"))\n    end\n  end\n\n  it "creates a book from JSON and updates it when If-Match holds" do\n    Corretto.session do |client, _db|\n      accept = {"Accept" => "application/json"}\n      book = {title: "Dune", author: "Frank Herbert"}\n      created = client.post("/books", json: book, headers: accept)\n      created.should have_status(201)\n      path = "/books/#{JSON.parse(created.body)["record"]["id"].as_i64}"\n      edited = {title: "Dune Messiah", author: "Frank Herbert"}\n      stale = accept.merge({"If-Match" => %("7")})\n      refused = client.patch(path, json: edited, headers: stale)\n      refused.should have_status(412)\n      refused.body.should eq(%({"errors":{"_base":["Record changed since you loaded it"]}}))\n      current = accept.merge({"If-Match" => %("0")})\n      updated = client.patch(path, json: edited, headers: current)\n      updated.should have_status(200)\n      updated.should have_header("ETag", %("1"))\n      JSON.parse(updated.body)["record"]["title"].as_s.should eq("Dune Messiah")\n    end\n  end\n\n  it "answers 403, 400, 415 and 422 to writes it cannot take" do\n    Corretto.session do |client, _db|\n      accept = {"Accept" => "application/json"}\n      book = {title: "Dune", author: "Frank Herbert"}\n      forged = accept.merge({"X-CSRF-Token" => "forged"})\n      client.post("/books", json: book, headers: forged).should have_status(403)\n      json = accept.merge({"Content-Type" => "application/json"})\n      client.post("/books", body: "{", headers: json).should have_status(400)\n      text = accept.merge({"Content-Type" => "text/plain"})\n      client.post("/books", body: "Dune", headers: text).should have_status(415)\n      missing = client.post("/books", json: {title: "Dune"}, headers: accept)\n      missing.should have_status(422)\n      missing.body.should eq(%({"errors":{"author":["is required"]}}))\n      array = client.post("/books", json: ["Dune"], headers: accept)\n      array.should have_status(422)\n      JSON.parse(array.body)["errors"]["_base"].as_a.should eq(["Expected a JSON object"])\n    end\n  end\nend')+snippet('Terminal · inside the application','frappe check\nfrappe corretto\nfrappe lint','bash')+passing('<code>frappe check</code> and <code>frappe lint</code> exit 0, and <code>frappe corretto</code> ends with <code>Corretto: 1 of 1 workers passed</code> after the three JSON examples and the generated ones pass.'))+

    snippet('app/views/guide/show.cr','module App::Views::Guide\n  class Show < App::ApplicationView\n    def initialize(@links : Array(NamedTuple(label: String, href: String)))\n    end\n\n    private def blueprint\n      h1 { "Guide" }\n      nav class: "fallback", aria_label: t.nav.title do\n        ul do\n          @links.each { |link| li { a(href: link[:href]) { link[:label] } } }\n        end\n      end\n      island "NavigatorDialog", {\n        title:  t.nav.title,\n        open:   t.nav.open,\n        close:  t.nav.close,\n        links:  @links,\n        region: "activity",\n      }\n      section id: "activity", "hx-get": "/activity", "hx-trigger": "activity",\n        "hx-sync": "this:queue last" do\n        render App::Views::Activity::Show.new(Time.utc)\n      end\n    end\n  end\nend')+

    '<h2 id="c-islands-adapter">Adapt the library to the island lifecycle</h2><p>Append the adapter to the generated <code>app/assets/javascript/app.js</code>, which already holds a focus handler. The adapter builds the dialog’s DOM itself. It never writes a <code>data-a11y-dialog</code> attribute, so the library’s own start-up scan, which instantiates every element that has one, finds nothing to take over; the adapter calls <code>new A11yDialog(container)</code> exactly once. The links are created by script, so it calls <code>htmx.process</code> on them to keep them boosted.</p>'+
    snippet('app/assets/javascript/app.js','CaramelIslands.define(\'NavigatorDialog\', (element, props) => {\n  const container = document.createElement(\'div\');\n  container.id = \'navigator-dialog\';\n  container.className = \'dialog-container\';\n  container.setAttribute(\'aria-labelledby\', \'navigator-dialog-title\');\n  container.setAttribute(\'aria-hidden\', \'true\');\n\n  const overlay = document.createElement(\'div\');\n  overlay.className = \'dialog-overlay\';\n  overlay.setAttribute(\'data-a11y-dialog-hide\', \'\');\n\n  const content = document.createElement(\'div\');\n  content.className = \'dialog-content\';\n  const title = document.createElement(\'h2\');\n  title.id = \'navigator-dialog-title\';\n  const list = document.createElement(\'ul\');\n  const close = document.createElement(\'button\');\n  close.type = \'button\';\n  close.setAttribute(\'data-a11y-dialog-hide\', \'navigator-dialog\');\n  content.append(title, list, close);\n  container.append(overlay, content);\n\n  const opener = document.createElement(\'button\');\n  opener.type = \'button\';\n  opener.setAttribute(\'data-a11y-dialog-show\', \'navigator-dialog\');\n\n  element.replaceChildren(opener, container);\n  const dialog = new A11yDialog(container);\n\n  function render(next) {\n    opener.textContent = next.open;\n    title.textContent = next.title;\n    close.textContent = next.close;\n    list.replaceChildren(...next.links.map((link) => {\n      const item = document.createElement(\'li\');\n      const anchor = document.createElement(\'a\');\n      anchor.href = link.href;\n      anchor.textContent = link.label;\n      item.append(anchor);\n      return item;\n    }));\n    htmx.process(list);\n  }\n  render(props);\n\n  const onShortcut = (event) => {\n    if (event.altKey && event.code === \'KeyM\') dialog.show();\n  };\n  document.addEventListener(\'keydown\', onShortcut);\n\n  // htmx:after:settle fires on the element that received the swap and bubbles.\n  const closeOnSwap = (event) => {\n    if (event.target.contains(element)) dialog.hide();\n  };\n  document.addEventListener(\'htmx:after:settle\', closeOnSwap);\n\n  const region = document.getElementById(props.region);\n  const refresh = () => {\n    if (region) region.dispatchEvent(new CustomEvent(\'activity\'));\n  };\n  const source = new EventSource(\'/activity/stream\');\n  source.addEventListener(\'open\', refresh);\n  source.addEventListener(\'activity\', refresh);\n\n  return {\n    update(next) {\n      render(next);\n    },\n    unmount() {\n      source.close();\n      document.removeEventListener(\'htmx:after:settle\', closeOnSwap);\n      document.removeEventListener(\'keydown\', onShortcut);\n      dialog.destroy();\n      element.replaceChildren();\n    },\n  };\n});','javascript')+

require "crypto/subtle"

module App::Hooks

  struct Inbox < App::ApplicationAction
    ingress body: :raw, limit: 256.kilobytes, csrf: false, authenticate: :signed?

    contract do
    end

    def handle(contract : Contract)
      event = JSON.parse(String.new(raw_body))

    private def signed? : Bool
      signature = request.headers["X-Signature"]? || return false

require "digest/sha256"

module App::Sessions
  struct Login < App::ApplicationAction
    # A valid bcrypt digest that no password matches. An unknown or inactive
    # email is checked against it, so every attempt costs one bcrypt comparison.
    DUMMY_DIGEST = "$2a$11$gAYJo.vJfIwsu1p8HuehU.GEPrMMm4NrGSBZIZiDHdZVg.JHmm5wi"

    contract do
      field email : String
      field password : String
    end

    def handle(contract : Contract)
      user = User.query.where(email: contract.email, active: true).first
      # bcrypt reads at most 71 bytes: verify raises for 72 or more, which would
      # answer 500 only for an existing email. Treat those as a wrong password.
      fits = contract.password.bytesize < 72
      digest = user ? user.password_digest : DUMMY_DIGEST
      matches = Crypto::Bcrypt::Password.new(digest).verify(fits ? contract.password : "")
      unless user && matches && fits
        self.status = 422
        return false
      end
      # A cookie that still holds a session token must not leave its row open.
      current_session.try &.update!(revoked_at: Time.utc)
      session.clear
      token = Random::Secure.urlsafe_base64(32)
      UserSession.create!(
        user_id: user.id,
        token_digest: Digest::SHA256.hexdigest(token),
        expires_at: Time.utc + 14.days)
      session["session_token"] = token
      true
    end

    def render(result)
      return page "Sign in", Views::Sessions::New.new(csrf_token, true) unless result
      redirect_to "/"
    end
  end
end`)+

    snippet('app/actions/application_action.cr',`require "digest/sha256"

module App
  abstract struct ApplicationAction < Caramel::Action
    include App::Paths

    @session_loaded = false
    @current_session : UserSession? = nil
    @user_loaded = false
    @current_user : User? = nil
    @membership_loaded = false
    @current_membership : Membership? = nil

    def layout(page : Caramel::Page) : String
      Views::Layouts::Application.new(page, csrf_token, signed_in: !current_user.nil?).to_s
    end

    def title_for(page : Caramel::Page) : String
      "#{page.title} · #{App::TITLE}"
    end

    def current_session : UserSession?
      unless @session_loaded
        @session_loaded = true
        if token = session["session_token"]?
          @current_session = UserSession.query.where(
            token_digest: Digest::SHA256.hexdigest(token),
            revoked_at: nil,
            expires_at: Time.utc..
          ).first
        end
      end
      @current_session
    end

    def current_user : User?
      unless @user_loaded
        @user_loaded = true
        if user_session = current_session
          @current_user = User.query.where(id: user_session.user_id, active: true).first
        end
      end
      @current_user
    end

    def current_membership : Membership?
      unless @membership_loaded
        @membership_loaded = true
        if user = current_user
          @current_membership = Membership.query
            .where(user_id: user.id, account_id: tenant.id).first
        end
      end
      @current_membership
    end
  end
end`)+

end`)+

  agents: () => heading('Guides / Working with an agent','Give your agent a map.','Give an agent the conventions, release context and proof commands you use, so it changes the right file and shows its work.')+
    contract([['Release', '0.15.0'], ['Needs', 'An application with a <code>shard.lock</code> and the <code>frappe</code> command'], ['You will have', 'The file to change for a task, readable diagnostics and a reviewable result'], ['Proved by', '<code>frappe check</code> · <code>frappe corretto</code> · <code>frappe lint</code>']])+
    '<h2 id="c-agents-orient">Orient before editing</h2><p>Read the application’s <code>shard.lock</code> for its pinned release. Use the matching documentation, then inspect the command manifest and relevant routes.</p><p>Every page of this documentation is also Markdown, at its address followed by <code>index.md</code>, such as <code>https://caramelize.dev/docs/0.15.0/sweettalk/index.md</code>. <code>https://caramelize.dev/docs/0.15.0/llms.txt</code> lists every page with its Markdown address and summary, and <code>frappe agent-manifest</code> prints that address as <code>GUIDES:</code>.</p>'+snippet('Terminal · inside the application','frappe agent-manifest\nfrappe routes health','bash')+

    `<button class="c-secondary cursor-interaction" id="c-agent-plain" aria-expanded="false" aria-controls="c-agent-markdown">View AGENTS.md</button><pre class="c-plain" id="c-agent-markdown" hidden><code class="language-markdown"></code></pre>`+

    '<h2 id="c-agents-map">Choose the application file</h2>'+lookup(['Path','Holds'], [['<code>config/routes.cr</code>','Endpoint declarations, and the <code>tenant</code> block once <code>frappe make tenancy</code> has run'],['<code>app/actions/</code>','Contracts and request behavior'],['<code>app/models/ + app/changesets/</code>','Data and write rules'],['<code>app/domain/ + spec/domain/</code>','A SweetTalk domain and its specs, once <code>frappe make domain</code> has run'],['<code>.claude/skills/sweettalk/SKILL.md</code>','The SweetTalk rules agents most often break, which frappe make domain writes'],['<code>app/views/</code>','Typed HTML views'],['<code>app/jobs/</code>','Background work'],['<code>app/locales/</code>','Translations, once <code>frappe make locale</code> has run'],['<code>spec/requests/</code>','Request behavior tests']])+
    '<p>Each task has a guide: <button class="c-secondary cursor-interaction" data-page="sweettalk">SweetTalk</button>, <button class="c-secondary cursor-interaction" data-page="i18n">Internationalization</button> and <button class="c-secondary cursor-interaction" data-page="tenancy">Multi-tenancy</button> say what their generators add.</p>'+
    '<h2 id="c-agents-diagnose">Read the diagnostics</h2><p><code>frappe check</code>, <code>frappe lint</code>, <code>frappe migrate</code> and <code>frappe db diff</code> print MRDP when stdout is not a terminal, or with <code>--agent</code>: one <code>ERR</code> line per finding, with its code, file, line and column, then one <code>KEY: value</code> line per field. <code>frappe agent-manifest</code> ends with the grammar. The codes:</p>'+
    lookup(['Code','Printed by','Means'],[['<code>CONTRACT_MISMATCH:422</code>','<code>check</code>','A route parameter has no field in its action’s contract. <code>PATCH</code> inserts the field.'],['<code>N_PLUS_ONE</code>','<code>check</code>','An association is read without a preload. <code>PATCH</code> inserts the <code>.preload</code> call.'],['<code>UNDEFINED_METHOD</code>','<code>check</code>','The receiver’s type defines no such method or local variable.'],['<code>UNDEFINED_CONSTANT</code>','<code>check</code>','No type or constant has this name here.'],['<code>NO_OVERLOAD</code>','<code>check</code>','No method signature accepts these arguments.'],['<code>SYNTAX</code>','<code>check</code>','The source does not parse.'],['<code>COMPILE</code>','<code>check</code>','Any other compiler error; <code>MSG</code> carries its text.'],['<code>LINT_&lt;RULE&gt;</code>','<code>lint</code>; <code>db diff</code> and <code>migrate</code> for a migration the migration linter refuses','One finding, named after its rule, such as <code>LINT_CARAMEL_SERVICE_NOUN</code>. <code>Lint/Formatting</code> adds <code>FIX: frappe format</code>.'],['<code>DIFF_HALT</code>','<code>db diff</code>','The differ stopped at a table, column or index and wrote no migration; <code>FIX</code> says what to declare or run.'],['<code>USAGE</code>','any command','An unknown command or option; <code>SYNTAX</code> gives the intended command’s syntax and <code>SUGGEST</code> the nearest token.'],['<code>RUNTIME</code>, <code>REPEATED_QUERY</code>','<code>errors</code>','What ran and failed, or queried too often, since the newest good build. The Crema reference lists their fields.']])+

    expect('After you insert <code>field id : Int64</code> as line 4, <code>frappe check</code> prints <code>OK check N files</code> when stdout is not a terminal.')+
    snippet('frappe check --agent · after that patch, when the action reads an association','ERR N_PLUS_ONE at app/actions/shelves/show.cr:9:52\nMSG: Association \'volumes\' of App::Shelf was not preloaded.\nPATCH: INSERT ".preload(:volumes)" AFTER 9:31','bash')+
    expect('After you insert <code>.preload(:volumes)</code> after column 31 of line 9, <code>frappe check</code> prints <code>OK check N files</code> again.')+
    '<p>When a macro hides the code a diagnostic points into, <code>frappe expand FILE:LINE:COL</code> prints the plain Crystal the macro call there expands to.</p><button class="c-secondary cursor-interaction" data-page="commands">Browse every command →</button>'+
    '<h2 id="c-agents-debug">Debug what ran</h2><p>Diagnostics cover what compiles. For what ran under <code>frappe dev</code>, the same MRDP reaches an agent from <code>frappe errors --agent</code>, with a trace as Markdown from <code>frappe trace last-error --md</code>, and <code>frappe db diagnose</code> reads the database’s own statistics. With locales, <code>frappe translations</code> lists the keys each locale still lacks.</p><button class="c-secondary cursor-interaction" data-page="crema">Ask from the terminal →</button><button class="c-secondary cursor-interaction" data-page="cremaref">Look up RUNTIME and REPEATED_QUERY →</button>'+
    '<h2 id="c-agents-refusals">What does not compile</h2>'+
    rules([['Route parameter missing from its contract', 'fails compilation, reported as <code>CONTRACT_MISMATCH</code>'], ['Association used without a preload', 'fails compilation, reported as <code>N_PLUS_ONE</code>'], ['A method, constant or overload that does not exist', 'fails compilation, reported as <code>UNDEFINED_METHOD</code>, <code>UNDEFINED_CONSTANT</code> or <code>NO_OVERLOAD</code>'], ['A service noun such as <code>InvitationService</code>, under <code>frappe lint</code>', 'fails the lint, reported as <code>LINT_CARAMEL_SERVICE_NOUN</code>']])+
    '<h2 id="c-agents-gaps">Not covered yet</h2><ul><li>No check verifies that an agent read or followed <code>AGENTS.md</code>; review its diff and the checks it ran.</li><li>Applications made before 0.14.0 keep their own <code>AGENTS.md</code>; nothing updates it on upgrade.</li><li><code>frappe expand</code> reaches a macro call; a <code>field</code> inside <code>contract</code> expands no macro itself, so it shows the enclosing <code>contract</code> and says so.</li></ul>'+

  i18n: () => heading('Guides / Internationalization','Speak your users’ language.','Add typed translations, choose a language for each request, and localize numbers, dates, and validation messages in Caramel 0.15.0.')+
    contract([['Release','0.15.0'],['Needs','An application that has run <code>frappe migrate</code>, whose <code>config/application.cr</code> still has one <code>require "caramel"</code> and one <code>require "../app/views/application_view"</code> line'],['You will have','Typed messages, a language for each request, and localized numbers, dates and validation messages'],['Proved by','<code>frappe check</code> · <code>frappe translations</code> · <code>frappe corretto</code>']])+
    guideMap('i18n',[['Start',[['c-i18n-enable','Enable translations']]],['Write',[['c-i18n-catalogs','Write Crystal catalogs'],['c-i18n-messages','Call typed messages']]],['Choose',[['c-i18n-language','Choose the request language'],['c-i18n-switcher','Add a language switcher']]],['Localize',[['c-i18n-formats','Format numbers and dates'],['c-i18n-errors','Translate errors and keep text safe'],['c-i18n-jobs','Carry language into background work']]],['Look up',[['c-i18n-reference','Look up catalog keys']]],['Limits',[['c-i18n-refusals','What does not compile'],['c-i18n-limits','Not covered yet']]]])+
    kicker('Stage 1 · Start')+
    "<h2 id=\"c-i18n-enable\">Enable translations</h2><p>Internationalization is opt-in. Inside your application, add a locale before generating the resources you want translated. A plain application does not compile the i18n implementation.</p>"+
    snippet("Terminal · inside your application","frappe make locale fr","bash")+
    expect('Prints <code>Generated</code> for <code>app/locales/en.cr</code>, <code>app/locales/fr.cr</code> and <code>config/application.cr</code>, then a <code>Next:</code> line that says to write translations in <code>app/locales/fr.cr</code>, set <code>dir: locale.dir</code> in the layout for right-to-left languages, and run <code>frappe translations</code>. It refuses, naming the three lines to add by hand, when <code>config/application.cr</code> lacks exactly one <code>require "caramel"</code> and one <code>require "../app/views/application_view"</code>.')+
    "<p>The configuration now requires <code>caramel/i18n</code> after <code>caramel</code>, loads <code>app/locales/*</code>, then calls <code>Caramel.locales default: \"en\"</code> once, before loading views. A resource generated from now on writes <code>t.</code> calls and adds its messages to <code>app/locales/en.cr</code>. Resource views generated earlier keep their text until you replace it with message calls. The rest of this guide and its spec use a Book resource:</p>"+
    snippet("Terminal · inside your application","frappe make resource Book title:string\nfrappe migrate\nfrappe check","bash")+
    expect('<code>frappe make resource</code> prints <code>Generated</code> for the model, changeset, actions, views, <code>spec/requests/books_spec.cr</code>, a migration, <code>config/routes.cr</code>, <code>config/paths.cr</code> and <code>app/locales/en.cr</code>, which gains a <code>books:</code> group. <code>frappe migrate</code> ends with <code>The database matches the declared schema.</code> <code>frappe check</code> exits 0.')+
    kicker('Stage 2 · Write')+
    "<h2 id=\"c-i18n-catalogs\">Write Crystal catalogs</h2><p>Catalogs are Crystal named tuples. Add the groups below to the generated catalogs, keeping their existing <code>common</code> and resource messages. Each file has one <code>Caramel.locale</code> declaration; these excerpts show only the added groups. Set <code>caramel.language</code> to the language’s own display name.</p>"+
    snippet("app/locales/en.cr · catalog excerpt","Caramel.locale \"en\", {\n  home: {greeting: \"Hello, %{name}!\"},\n  library: {\n    count: {\"=0\": \"No books\", one: \"%{count} book\", other: \"%{count} books\"},\n  },\n}","crystal")+
    snippet("app/locales/fr.cr · catalog excerpt","Caramel.locale \"fr\", {\n  caramel: {\n    language: \"Français\",\n    number: {separator: \",\", delimiter: \" \"},\n    time: {formats: {date: \"%d/%m/%Y\"}},\n    errors: {blank: \"ne peut pas être vide\"},\n    pages: {not_found: \"Page introuvable\"},\n  },\n  home: {greeting: \"Bonjour, %{name} !\"},\n  library: {\n    count: {\n      \"=0\": \"Aucun livre\",\n      one: \"%{count} livre\",\n      many: \"%{count} de livres\",\n      other: \"%{count} livres\",\n    },\n  },\n}","crystal")+
    "<p>The default locale defines application keys and their placeholders. Other locales may omit keys and use the default text. Use lowercase identifiers for keys.</p>"+
    "<h2 id=\"c-i18n-messages\">Call typed messages</h2><p>Views and actions expose <code>t</code>, <code>locale</code>, and <code>l</code>, including inside <code>markup</code>. A message’s placeholders become named arguments. A plural takes its whole-number count first.</p>"+
    snippet("Inside a view’s blueprint","h1 { t.home.greeting(name: \"Ann\") }\np { t.library.count(3) }\np { l(1234.5, 2) }\np { l(Time.utc(2026, 10, 2), :date) }","crystal")+
    "<p>In French, these calls produce <code>Bonjour, Ann !</code>, <code>3 livres</code>, <code>1 234,50</code>, and <code>02/10/2026</code>.</p><p>Plurals follow CLDR cardinal rules for whole numbers. English requires <code>one</code> and <code>other</code>; French also requires <code>many</code>, which French selects for a non-zero multiple of a million, as in <code>2 000 000 de livres</code>. Optional exact forms such as <code>\"=0\"</code> take priority, and <code>%{count}</code> uses its number separators.</p>"+
    kicker('Stage 3 · Choose')+
    "<h2 id=\"c-i18n-language\">Choose the request language</h2><p>A valid <code>?locale=</code> switch on GET or HEAD changes the remembered language. Otherwise, selection follows this order:</p><ol><li>A non-default locale prefix, when enabled.</li><li>The remembered locale cookie.</li><li>The best supported <code>Accept-Language</code> match.</li><li>The application’s default locale.</li></ol><p>Locale codes include <code>fr</code>, <code>pt-BR</code>, and <code>zh-Hant</code>. To enable language prefixes, change the existing configuration call:</p>"+
    snippet("config/application.cr · replace the existing locales call","Caramel.locales default: \"en\", prefix: true","crystal")+
    "<p>With this setting, <code>/fr/books</code> routes to <code>/books</code> in French. The default locale stays unprefixed; <code>/en/books</code> does not select English. Prefixes use lowercase codes, such as <code>/pt-br/books</code>. Generated resource path helpers already include the request locale’s prefix. Use <code>localize_path(\"/account\")</code> for a manually written application path.</p><p>Routed responses identify their language with <code>Content-Language</code>. Responses selected without a prefix also vary by <code>Accept-Language</code> and <code>Cookie</code>. A language-switch request returns a 303 redirect, or a 200 response with <code>HX-Redirect</code> for htmx, with <code>Cache-Control: no-store</code>, and remembers the choice in a cookie. Unknown switch values are ignored.</p>"+
    rules([['An <code>Accept-Language</code> header over 1,024 bytes','is ignored'],['An <code>Accept-Language</code> header with more than 16 ranges','reads the first 16','ok'],['The remembered locale','is the <code>__Host-caramel_locale</code> cookie: Secure, HttpOnly, SameSite Lax, path <code>/</code>, 365 days','ok']])+
    "<h2 id=\"c-i18n-switcher\">Add a language switcher</h2><p>Use each locale’s own name and let <code>switch_locale_path</code> preserve the current page and query. Reload the full page when switching so the layout and all visible text use the selected language.</p>"+
    snippet("Inside a view’s blueprint","nav(aria_label: \"Language\") do\n  Caramel::Locale.each do |language|\n    a(href: switch_locale_path(language), hx_boost: \"false\") { language.name }\n  end\nend","crystal")+
    "<p>Set the layout’s <code>html</code> element to <code>lang: Caramel.language</code>; generated applications already have it. For a right-to-left language, add <code>dir: locale.dir</code> and use <code>margin-inline</code> and <code>padding-inline</code> in your styles, so they mirror with the direction.</p>"+
    kicker('Stage 4 · Localize')+
    "<h2 id=\"c-i18n-formats\">Format numbers and dates</h2><p><code>l(number, decimals)</code> uses <code>caramel.number.separator</code> and <code>delimiter</code>. <code>l(time, :date)</code> chooses a named time pattern; built-in names include <code>:date</code>, <code>:time</code>, <code>:datetime</code>, and <code>:short_date</code>. The default catalog can add more named formats.</p><p>Supply translated month and day names under <code>caramel.time</code> when your patterns use them. Formatting data falls back from the selected locale to the default locale, then to English. A time keeps its own location; formatting does not convert timezones.</p>"+
    "<h2 id=\"c-i18n-errors\">Translate errors and keep text safe</h2><p>The reserved <code>caramel.errors</code> keys translate contract and changeset messages. <code>caramel.pages</code> includes <code>check_request</code>, <code>not_found</code>, and <code>expired_form</code>. The French catalog above translates blank validation errors and the router’s 404 body. Missing framework messages fall back through the default catalog to English.</p><p>Errors are translated when they are created. JSON keeps its <code>errors</code> object with arrays of messages per field, using the request’s locale. Framework wording is available through <code>Caramel::Wording</code> and <code>SugarORM::Wording</code>, including <code>Caramel::Wording.expired_form</code>.</p><p>Keep catalog messages as text. Views escape normal placeholder values. For a message containing a link or other markup, pass a <code>markup { … }</code> result as the placeholder: only that trusted HTML is emitted as markup, while catalog text and other values remain escaped.</p>"+
    "<h2 id=\"c-i18n-jobs\">Carry language into background work</h2><p>A request’s locale belongs to its fiber and is restored afterward. Spawned fibers and Cold Brew jobs start in the default locale. Give a translated job a <code>param locale : String</code>, enqueue it with the request’s <code>Caramel.language</code>, and wrap the work that creates messages or errors in an explicit locale scope.</p>"+
    snippet("Inside a job’s perform method · locale is the payload field","target = Caramel::Locale.parse?(locale) || Caramel::Locale.default\nCaramel::I18n.with(target) do\n  messages = Caramel::Messages.new(target)\n  greeting = messages.home.greeting(name: \"Ann\")\n  # Use greeting in the job’s output.\nend","crystal")+
    kicker('Stage 5 · Look up')+
    "<h2 id=\"c-i18n-reference\">Look up catalog keys</h2><p>The reserved <code>caramel</code> section takes only these keys. A locale that leaves one out uses the default locale’s, then English.</p>"+
    lookup(['Key','Meaning'],[['<code>language</code>','The language’s own name, such as Français'],['<code>number.separator</code>, <code>number.delimiter</code>','One character each; English uses . and ,'],['<code>time.months</code>, <code>time.abbr_months</code>','12 names, January first'],['<code>time.days</code>, <code>time.abbr_days</code>','7 names, Sunday first'],['<code>time.am</code>, <code>time.pm</code>','The text for %p'],['<code>time.formats.NAME</code>','A pattern; date, time, datetime and short_date are built in']])+
    "<p>A pattern uses only <code>%Y %m %-m %d %-d %H %-H %I %-I %M %S %p %B %b %A %a %%</code>. <code>%I</code> is the 12-hour clock, and <code>%-</code> drops the leading zero.</p><p>The <code>errors</code> and <code>pages</code> keys translate Caramel’s own messages:</p>"+
    lookup(['Key','English text'],[['<code>errors.required</code>','is required'],['<code>errors.must_be_file</code>','must be a file'],['<code>errors.json_type</code>','must be a JSON %{type}'],['<code>errors.invalid_value</code>','must be a valid %{type}'],['<code>errors.at_least</code>','must be at least %{min}'],['<code>errors.at_least_characters</code>','must be at least %{min} characters'],['<code>errors.at_most</code>','must be at most %{max}'],['<code>errors.at_most_characters</code>','must be at most %{max} characters'],['<code>errors.at_least_items</code>','must have at least %{min} item(s)'],['<code>errors.at_most_items</code>','must have at most %{max} item(s)'],['<code>errors.duplicate_item</code>','repeats an earlier item'],['<code>errors.duplicate_field</code>','Duplicate field: %{name}'],['<code>errors.unknown_field</code>','Unknown field: %{name}'],['<code>errors.expected_json_object</code>','Expected a JSON object'],['<code>errors.url</code>','must be an absolute http or https URL'],['<code>errors.blank</code>',"can't be blank"],['<code>errors.greater_than</code>','must be greater than %{than}'],['<code>errors.less_than</code>','must be less than %{than}'],['<code>errors.too_short</code>','should be at least %{min} character(s)'],['<code>errors.too_long</code>','should be at most %{max} character(s)'],['<code>errors.invalid_format</code>','has invalid format'],['<code>errors.invalid</code>','is invalid'],['<code>errors.taken</code>','has already been taken'],['<code>errors.record_gone</code>','Record no longer exists'],['<code>errors.record_stale</code>','Record changed since you loaded it'],['<code>pages.check_request</code>','Check your request'],['<code>pages.not_found</code>','Not found'],['<code>pages.expired_form</code>','This form has expired or came from another site. Reload the page and try again.']])+
    "<p>Plural rules are built in for <code>af am ar as ast az be bg bn bs ca cs cy da de el en es et eu fa fi fo fr fy ga gl gu he hi hr hu id is it ja ka kk km kn ko ky lb lo lt lv mk ml mn mr ms my nb ne nl nn no pl pt pt-PT ro ru sk sl so sq sr sv sw ta te th tr uk ur uz vi yue zh zu</code>. A tag with a region or script uses its language’s rules, so <code>pt-BR</code> uses <code>pt</code>’s. For any other language, name one with the same rules: <code>Caramel.locale \"eo\", {…}, plural: \"en\"</code>. <code>locale.dir</code> is <code>rtl</code> for <code>ar he fa ur ps sd ug yi dv ckb</code>.</p>"+

    "<h2 id=\"c-i18n-refusals\">What does not compile</h2><p>Each mistake below stops the build at the line that causes it.</p>"+
    rules([['A misspelled message name or a missing argument in a <code>t.</code> call','fails compilation'],['Crystal string interpolation in catalog text instead of <code>%{name}</code> placeholders','fails compilation'],['A key that is not a lowercase identifier, a reserved word, or a malformed catalog','fails compilation'],['A non-default locale that defines an application key the default locale lacks','fails compilation'],['A non-default locale that changes a message’s placeholders or kind','fails compilation'],['A locale that omits a required plural category','fails compilation'],['A framework <code>errors</code> or <code>pages</code> key that changes the placeholders of its English text','fails compilation'],['A time pattern that uses a directive outside the listed set, or malformed <code>caramel.time</code> or <code>caramel.number</code> data','fails compilation'],['A non-default locale that adds a time format name','fails compilation'],['A language without built-in plural rules and no <code>plural:</code>','fails compilation']])+
    "<h2 id=\"c-i18n-limits\">Not covered yet</h2><p>Caramel supports typed text messages, whole-number plurals, number and time formatting, and request-local language selection. These are not implemented:</p><ul><li>Select and gender messages.</li><li>Currency formatting.</li><li>Relative time formatting.</li><li>Translated URL segments.</li><li>Database-backed catalogs.</li><li>Automatic job locale propagation.</li><li>An unused-key report.</li></ul><p><a href=\"https://github.com/caramelizedev/caramel/blob/v0.15.0/docs/decisions/0024-internationalization.md\" target=\"_blank\" rel=\"noopener noreferrer\">Read the internationalization design and API details ↗</a></p>"+

      "<p>Use a fresh Corretto session to test browser language negotiation without a remembered locale. Add this example to the spec <code>frappe make resource Book</code> wrote; the generated layout already sets <code>lang: Caramel.language</code>:</p>"+
      snippet("spec/requests/books_spec.cr · a second example","it \"answers in the browser’s language\" do\n  Corretto.session do |client, db|\n    response = client.get(\"/books\",\n      headers: {\"Accept-Language\" => \"fr\"})\n    response.should have_header(\"Content-Language\", \"fr\")\n    response.should have_html { html(lang: \"fr\") }\n  end\nend","crystal")+
      "<p>Also assert translated text, fallback behavior, validation messages in HTML and JSON, switch redirects, and form submissions under a locale prefix.</p>"+
