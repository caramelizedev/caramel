  cremaref: () => heading('Reference / Crema','See what your application did.','Crema is Caramel’s observability: request ids, one log line for every request, job and schedule run, error reports, an owner-only ops socket, an opt-in recorder and exporter, and the development tools.')+
    contract([['Release','0.15.0'],['Needs','A Caramel application; the recorder and exporter are opt-in requires'],['Covers','Request ids, the log line, error reports, the ops socket, metrics, the recorder, the OTLP exporter and the development tools'],['Proved by','<code>frappe traces --agent</code> · <code>frappe trace last --md</code> · <code>frappe errors --agent</code>']])+
    '<p>Learning it for the first time? The guide <button class="c-secondary cursor-interaction" data-page="crema">Know what your application did</button> walks through it in order. This page lists every name, field, variable and limit.</p>'+
    limits('cremaref',[['Inbound <code>X-Request-ID</code>','8–128 characters'],['Slow request, default','1 second'],['Slow job or schedule run, default','5 seconds'],['Slow query, default','100 milliseconds'],['Runs that make a repeated statement','5'],['Spans in a trace (more are counted as dropped)','200'],['Distinct statements tracked for repeats in a trace','500'],['Span detail kept in the trace ring','2,048 bytes'],['Log entry kept as a span','1,000 bytes'],['Binds kept per statement, each cut at','20, 200 bytes'],['<strong>Copy with values</strong> literal; longer stays <code>$n</code>','2,000 bytes'],['Error report backtrace','50 frames of 2,048 bytes'],['Error report message','8,192 bytes'],['Causes listed','5'],['Error ring (least recently seen is evicted)','500 fingerprints'],['Trace ring','200 traces'],['<code>/v1/traces</code> and <code>/v2/traces</code> limit','default 50, at most 200'],['Concurrent tails (events buffered for each)','8 (1,000)'],['Tail keep-alive <code>: ping</code>','every 15 seconds'],['Ops connection read and write timeout','10 seconds'],['<code>POST /v1/debug-tokens</code> minutes','1–120, default 15'],['<code>POST /v1/debug-tokens</code> body','1 KiB'],['Debug token lifetime','2 hours'],['Distinct request series (the rest fold into <code>(other)</code>)','1,000'],['Recorder keys of each kind per flush','500'],['Recorder SQL key','500 bytes'],['Recorder flush interval','15 seconds'],['Recorder retention (pruned hourly)','7 days'],['Recorder histogram','12 buckets: 5, 10, 25, 50, 100, 250, 500, 1,000, 2,500, 5,000, 10,000 ms and overflow'],['<code>APP insights</code> rows','20'],['Exporter queue','2,048 traces'],['Exporter batch','every 5 seconds or at 512 spans'],['Exporter timeouts','5 seconds connect, 10 seconds read'],['Error page frames','80'],['Source file shown in the error page','1 MiB'],['<code>dump</code> span','8,192 bytes'],['Inspector traces listed','500'],['Toolbar request list','last 10'],['<code>frappe traces --limit</code> default','20'],['Frappé keeps','500 traces, 200 standalone errors, 50 builds'],['<code>events.jsonl</code> rolls at','8 MiB'],['Trace or request id prefix','at least 6 characters'],['Database statement and lock timeout, default','30 s, 5 s (<code>migrate</code>: none, 5 s)'],['<code>auto_explain</code> threshold','250 ms'],['<code>access.log</code> rolls at','1 MB'],['Collector body rejected over','4 MiB'],['Collector memory','2,000 traces, 200 spans each, 32 attributes per span']])+
    '<h2 id="c-cremaref-where">Crema runs in every application</h2><p>Crema is part of every application. What it does depends on how the process runs and which parts you opt into.</p>'+
    lookup(['Mode','What runs'],[['Always on','A request id and trace for every routed request, job and schedule run; the canonical log line; error reports; the in-memory error and trace rings; the metrics behind <code>ops metrics</code>. A <code>serve</code> process also opens the ops socket.'],['Opt in','<code>require "caramel/crema/recorder"</code> keeps latency history in the database; new applications already have it. <code>require "caramel/crema/otlp"</code> exports traces to a tracing backend.'],['Development only','Code compiled with <code>-D caramel_development</code>, which <code>frappe dev</code>, <code>frappe check</code> and one-shot development builds pass, and run with <code>CARAMEL_ENV=development</code>: the error page, <code>dump</code>, <code>Server-Timing</code>, query binds and source lines, and the event sink behind the inspector.']])+
    '<h2 id="c-cremaref-api">Settings are set before the application starts</h2><p>Set these in <code>config/application.cr</code>, before the application starts.</p>'+
    lookup(['Setting','Meaning'],[['<code>Caramel::Crema.slow_request</code>','<code>Time::Span</code>, default 1 second. A request at least this slow is kept in the trace ring as slow and flagged in the toolbar.'],['<code>Caramel::Crema.slow_job</code>','Default 5 seconds. Applies to jobs and schedule runs.'],['<code>Caramel::Crema.slow_query</code>','Default 100 milliseconds. Each statement at least this slow counts in the log line’s <code>slow_queries</code>.'],['<code>Caramel::Crema.on_error { |report| … }</code>','Called for every error report, handled or not, with the redacted message and backtrace.'],['<code>Caramel::Crema.report(error, handled: true, source: nil)</code>','Reports an error you rescued. It never raises. A handled report writes a WARN line and leaves the trace’s outcome <code>ok</code>; <code>handled: false</code> marks the trace failed.'],['<code>Caramel::Crema.measure(kind, name, detail = nil) { … }</code>','Times a block as a span of the current trace. Kinds: <code>sql</code>, <code>http</code>, <code>view</code>, <code>enqueue</code>, <code>log</code>, <code>dump</code> and <code>domain</code>.'],['<code>Caramel::Crema.command(name, syntax) { |arguments| … }</code>','Adds a command to the application binary and returns its exit code. The first word of the syntax is the name; registering a name again replaces the earlier command. The binary’s usage text lists the syntax.'],['<code>Caramel::Crema.console_page(segment) { |request| … }</code>','Adds a page at <code>/segment</code> to the ops console. The block returns HTML.'],['<code>Caramel::Crema.subscribe(sink)</code>','Adds a sink that receives finished traces and error reports. Remove it with <code>unsubscribe</code>.'],['<code>Caramel.dump(value)</code>','Development only. See below.']])+
    '<h2 id="c-cremaref-env">Environment variables choose mode, format and socket</h2>'+
    lookup(['Variable','Meaning'],[['<code>CARAMEL_ENV</code>','<code>development</code> adds request paths and error messages to log lines. In a development build it also turns on the error page, <code>dump</code>, <code>Server-Timing</code>, query binds and the literals behind <strong>Copy with values</strong>. <code>test</code> and <code>development</code> default the log format to text. Unset counts as <code>production</code>.'],['<code>CARAMEL_LOG_FORMAT</code>','<code>json</code> or <code>text</code>. Any other value falls back to text in development and test, JSON elsewhere.'],['<code>LOG_LEVEL</code>','Default <code>Info</code>. Applies to every log source, not only <code>crema</code>.'],['<code>CARAMEL_OPS_SOCKET</code>','A path for the ops socket, or <code>off</code>. Unset, a <code>serve</code> process uses its <code>CARAMEL_SOCKET</code> path with <code>.sock</code> replaced by <code>.ops.sock</code>. A <code>work</code> process opens a socket only when this names a path. The <code>ops</code> client reads the same variables.'],['<code>CARAMEL_EDITOR</code>','An editor preset or a link template. See the development section.'],['<code>CARAMEL_PROJECT_ROOT</code>','The project root, default the current directory. Error locations are shown relative to it, and its <code>app</code>, <code>config</code>, <code>src</code> and <code>db</code> folders count as your code.'],['<code>APP_SECRET</code>','The application secret. Debug tokens are signed with a key derived from it, so rotating it ends every token.'],['<code>CARAMEL_DEV_EVENTS</code>','Set by <code>frappe dev</code> for development builds: the socket the application sends its events to. Do not set it yourself.'],['<code>CARAMEL_STATEMENT_TIMEOUT</code>, <code>CARAMEL_LOCK_TIMEOUT</code>','PostgreSQL’s <code>statement_timeout</code> and <code>lock_timeout</code> on every pooled connection of every command but <code>migrate</code>: whole seconds, 0 to 86400, default 30 and 5. <code>migrate</code> reads <code>CARAMEL_MIGRATION_STATEMENT_TIMEOUT</code> and <code>CARAMEL_MIGRATION_LOCK_TIMEOUT</code>, default 0 and 5. 0 means none. Cold Brew’s pool reads the runtime pair.'],['<code>CARAMEL_POOL_SIZE</code>, <code>CARAMEL_POOL_TIMEOUT</code>','Connections a command’s pool holds, 1 to 32, default 4, and seconds a checkout waits for a free one, 1 to 300, default 5. An invalid value exits 1 with one line naming it.'],['<code>OTEL_*</code>','Seven variables read by the exporter; see below.']])+
    rules([['<code>CARAMEL_ENV</code> set to anything but <code>development</code>, <code>test</code> or <code>production</code>','stops every database command with <code>CARAMEL_ENV must be development, test or production</code>'],['A timeout variable that is not a whole number of seconds from 0 to 86400','stops the command with <code>KEY must be a whole number of seconds from 0 to 86400</code>'],['A statement past <code>statement_timeout</code>','is cancelled by PostgreSQL, which reports it before the pool’s own read timeout']])+
    '<h2 id="c-cremaref-ids">Every traced response carries a request id</h2>'+
    rules([['Inbound <code>X-Request-ID</code> of 8 to 128 characters from <code>A-Z a-z 0-9 . _ : -</code>','kept'],['Any other inbound <code>X-Request-ID</code>','replaced by a UUID'],['Static files, and the 400 and 421 refusals','not traced, and carry no id','ok'],['<code>traceparent</code> with version <code>00</code>, lowercase hex, a 32-digit trace id, a 16-digit parent id and flags','continues the caller’s trace and supplies the log line’s <code>trace_id</code> and <code>parent_id</code>; the first flag bit says whether the caller sampled it'],['A <code>traceparent</code> with all-zero ids','ignored'],['<code>enqueue</code>','stores the traceparent, the request id and the debug flag in <code>caramel_jobs.context</code>, never a message; the job continues that trace'],['A schedule run, or a missing or malformed job context','starts a new trace'],['Each <code>Caramel::Outbound</code> call','is an <code>http</code> span named <code>METHOD host</code>, and sends a <code>traceparent</code> unless you set one'],['A debug trace','sends <code>X-Caramel-Trace</code> with the trace id']])+
    '<h2 id="c-cremaref-log">Every finished trace writes one log line</h2><p>The <code>crema</code> log source writes one INFO line for each finished trace, named <code>request</code>, <code>job</code> or <code>schedule</code>.</p>'+
    lookup(['Field','Present when'],[['<code>name</code>','Always. <code>GET /books/:id</code>, the job class or the schedule name. An unrouted request is <code>GET (none)</code>; a method outside GET, HEAD, POST, PUT, PATCH, DELETE and OPTIONS is <code>OTHER</code>.'],['<code>request_id</code>, <code>trace_id</code>, <code>parent_id</code>','The ids above. <code>parent_id</code> only with a valid inbound or stored traceparent.'],['<code>duration_ms</code>, <code>outcome</code>','Always. <code>outcome</code> is <code>error</code> after an unhandled error or a 500, or when a job’s <code>perform</code> raised, even if it will retry.'],['<code>method</code>, <code>route</code>, <code>action</code>, <code>status</code>, <code>bytes</code>, <code>streamed</code>','Requests. <code>route</code> and <code>action</code> only when a route matched; <code>bytes</code> is left out for a streamed response.'],['<code>path</code>','Requests, only when <code>CARAMEL_ENV=development</code>.'],['<code>job_id</code>, <code>queue</code>, <code>attempt</code>, <code>queue_lag_ms</code>','Jobs. The lag is the time past <code>run_at</code>, never negative.'],['<code>db_count</code>, <code>db_ms</code>, <code>db_wait_ms</code>','Statements, their time, and the wait for a pooled connection.'],['<code>view_ms</code>, <code>outbound_count</code>, <code>outbound_ms</code>','The outermost view’s time and the <code>Caramel::Outbound</code> calls.'],['<code>cache_hits</code>, <code>cache_misses</code>, <code>enqueued</code>','<code>Caramel::Cache</code> reads and jobs enqueued.'],['<code>slow_queries</code>, <code>repeated_queries</code>','Statements past <code>slow_query</code>, and distinct statements that ran five or more times. Repeats are counted only when the trace records spans: the ops socket, the recorder or the exporter is on, or the build is for development. A trace keeps at most 200 spans (more are counted as dropped) and tracks at most 500 distinct statements for repeats.'],['<code>debug</code>','<code>true</code> for a debug trace.'],['<code>error_class</code>, <code>fingerprint</code>','Only when the trace ended in an unhandled error.']])+
    rules([['A field with no value','is left out'],['Any log entry written inside a trace','also carries <code>trace_id</code> and <code>request_id</code>','ok'],['A log entry written inside a trace that records spans','is kept as a <code>log</code> span of up to 1,000 bytes','ok'],['A slow request or job','shows in the trace ring, the toolbar and the inspector; there is no <code>slow</code> field. A slow statement counts in <code>slow_queries</code>','ok']])+
    lookup(['Form','Shape'],[['error line','One <code>error</code> entry for each report: WARN when handled, ERROR when not. Fields: <code>error_class</code>, <code>fingerprint</code>, <code>location</code> (relative <code>file:line</code>), <code>source</code> (the trace name, or <code>stream</code> or <code>cold_brew.worker</code>, <code>.maintenance</code>, <code>.scheduler</code>, <code>.hooks NAME</code>), <code>handled</code>, <code>request_id</code> and <code>trace_id</code>. The <code>message</code> is added only when <code>CARAMEL_ENV=development</code>.'],['JSON','One object per line: <code>ts</code> (UTC, milliseconds), lowercase <code>level</code>, <code>source</code>, <code>msg</code>, then the fields. A field named like one of those four is written as <code>data_NAME</code>, so an error’s <code>source</code> becomes <code>data_source</code>. The default outside development and test.'],['text','<code>HH:MM:SS.mmm LEVEL</code> and a one-line summary with one decimal per time: <code>12:00:00.123 INFO   request GET /books/1 200 12.4ms db=3/4.1ms view=2.0ms App::Books::Show request_id=8b1f</code>; outside development the route <code>/books/:id</code> stands where the path is. Values with spaces are quoted. The default in development and test.']])+
    '<h2 id="c-cremaref-errors">Error reports are redacted and stay in memory</h2>'+
    lookup(['Part','Content'],[['Fields','<code>error_class</code>, <code>message</code>, <code>backtrace</code> (at most 50 frames of 2,048 bytes), <code>fingerprint</code>, <code>location</code>, <code>handled</code>, <code>source</code>, <code>request_id</code>, <code>trace_id</code>, <code>occurred_at</code> and the classes of up to five causes. A message is cut to 8,192 bytes.'],['Fingerprint','The first 12 hex digits of a SHA-256 over the error class, the path of the first frame in your own code and its method name. With no such frame, the first parseable frame; with none, the class alone. Lines, columns and messages are never hashed.'],['Redaction','Applied to every message and backtrace frame: values of environment variables whose names contain <code>SECRET</code>, <code>PASSWORD</code>, <code>TOKEN</code>, <code>API_KEY</code> or <code>DATABASE_URL</code> become <code>[redacted]</code>; PostgreSQL URLs become <code>[database URL redacted]</code>; <code>name=value</code>, <code>name: value</code> and JSON pairs whose name holds password, secret, token, api key, access key, private key, credential or authorization, and bare <code>Bearer</code> tokens, become <code>[credential redacted]</code>. If redaction fails the report keeps its class and the message <code>[unavailable]</code>.'],['Where it lives','A report’s message and backtrace exist in memory: the ring behind <code>ops errors</code>, and development surfaces. Crema’s logs, tail events, metric labels, exports and <code>caramel_metrics</code> carry the class and fingerprint, never the message. The ring holds 500 fingerprints; the least recently seen is evicted.']])+
    rules([['A job’s failed run','is written unredacted by Cold Brew to <code>caramel_jobs.last_error</code>: the class, the message and the first 12 backtrace lines; <code>APP jobs show ID</code> prints it','ok'],['A process restart','clears the error and trace rings; forward <code>Crema.on_error</code> reports to an error tracker for history']])+
    note('Messages and backtraces never reach logs, exports or the recorder.','They stay in memory and in development surfaces. Only <code>caramel_jobs.last_error</code>, which Cold Brew writes, keeps a job’s message on disk.','Not stored')+
    '<h2 id="c-cremaref-sql">Every statement in a trace starts with a tag</h2><p>Every statement run inside a trace starts with a comment: <code>/*action=\'App%3A%3ABooks%3A%3AShow\'*/</code> for a request, <code>/*job=\'…\'*/</code> for a job and <code>/*schedule=\'…\'*/</code> for a schedule. The value is the action or job class or the schedule name, percent-encoded. Pools name themselves in <code>application_name</code>: <code>caramel-web</code> for <code>serve</code>, <code>caramel-cold-brew</code> for workers and <code>caramel-listen</code> for PubSub.</p>'+
    rules([['A statement run outside a trace','carries no tag','ok'],['A statement’s binds in a development build','are kept for the inspector: at most 20, each cut at 200 bytes, <code>NULL</code> for nil'],['A span’s detail in the trace ring','is cut at 2,048 bytes'],['A statement over <code>slow_query</code>','counts in the log line’s <code>slow_queries</code>','ok']])+
    '<h2 id="c-cremaref-ops">The ops socket answers its owner only</h2><p>An HTTP/1.1 server on a Unix socket, for the application’s owner.</p>'+
    rules([['A directory that is not a real directory you own with no group or other permissions','stays off: the application keeps serving, and the log says why'],['The socket file','is mode 0600','ok'],['A live socket','is never replaced; a dead one is'],['Each connection','has a 10-second read and write timeout','ok'],['A tail with nothing to send for 15 seconds','sends <code>: ping</code> to keep the connection open','ok'],['A request whose <code>Host</code> is not <code>ops</code>, <code>localhost</code>, <code>127.0.0.1</code> or <code>[::1]</code>','answers 421'],['A write with an <code>Origin</code> header','answers 403'],['A wrong method','answers 404'],['A ninth concurrent tail','answers 429'],['<code>POST /v1/debug-tokens</code> without an application secret, which a <code>work</code> process lacks','answers 404'],['Every answer','is JSON with a <code>version</code> and carries <code>Cache-Control: no-store</code>','ok']])+
    lookup(['Endpoint','Answers'],[['<code>GET /v1/status</code>','App, role, uptime, environment, in-flight work, request counts and p95, memory, database pools, workers, scheduler, sinks and dropped events.'],['<code>GET /v1/requests</code>, <code>/v1/fibers</code>','In-flight requests and jobs; fibers grouped by name.'],['<code>GET /v1/metrics</code>','Prometheus text.'],['<code>GET /v1/tail</code>','Server-sent events of finished traces and errors. Query: <code>errors=1</code>, <code>slow=MS</code>, <code>logs=1</code>. At most 8 at once, 1,000 events buffered for each. A debug trace always passes the filters. With <code>logs=1</code> the events include log lines exactly as written to stdout.'],['<code>GET /v1/errors</code>, <code>/v1/errors/FINGERPRINT</code>','Errors since the process started, grouped, newest first. The second route is the only one that returns a message and backtrace.'],['<code>GET /v1/traces?limit=N&amp;reason=error|slow|debug</code>','The trace ring, 50 by default, at most 200. A trace is kept when it failed, was slow or carried a debug token. The ring holds 200 traces.'],['<code>GET /v1/traces/REF</code>','One trace with its spans. REF is a prefix of at least 6 characters of a trace id or request id.'],['<code>POST /v1/debug-tokens</code>','JSON <code>{"minutes": N}</code>, 1 to 120, default 15, in a body of at most 1 KiB.']])+

tor</code> lists up to 500 traces, filtered by <code>?only=errors</code>, <code>slow</code> or <code>jobs</code>. Beside it: <code>/inspector/traces/ID</code> (a prefix of at least 6 characters), <code>/inspector/errors</code> and <code>/inspector/builds</code>. Each query on a trace page has <strong>Copy SQL</strong> and <strong>Copy with values</strong>; the values come from literals built when the query ran (numbers and booleans bare, text, times and bytes quoted, <code>nil</code> as <code>NULL</code>, arrays as <code>ARRAY[…]</code>) and never leave development. Placeholders without a value stay as <code>$n</code>. The page follows the system’s light or dark appearance; the Theme button sets it for the toolbar and the inspector together (<code>localStorage</code> key <code>caramel.dev.theme</code>). Its endpoints answer GET only and check the host.'],['<code>CARAMEL_EDITOR</code>','A preset or a template with <code>{path}</code>, <code>{line}</code> and <code>{column}</code>. Presets: <code>zed</code> (the default), <code>vscode</code>, <code>cursor</code>, <code>sublime</code>, <code>textmate</code> and <code>idea</code>. <code>frappe dev</code> also reads it from the project’s <code>.env</code>.'],['<code>Caramel/Dump</code>','<code>frappe lint</code> reports any call to <code>dump</code> without a receiver or on <code>Caramel</code>, including your own method of that name. The rule is on in new applications’ <code>.ameba.yml</code>.']])+
